[workspace]
members = [
    "crates/contour",
    "crates/contour-macros",
    "crates/contour-model",
    "crates/contour-svg",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
contour-macros = { path = "crates/contour-macros" }
contour-model = { path = "crates/contour-model" }

proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
