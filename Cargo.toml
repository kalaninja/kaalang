[workspace]
members = [
    "crates/kaalang",
    "crates/kaalang-cli",
    "crates/kaalang-compiler",
    "crates/kaalang-macros",
    "crates/kaalang-render",
    "crates/kaalang-svg",
    "crates/kaalang-testing",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kalaninja/kaalang"
rust-version = "1.88"
version = "0.2.0"

[workspace.dependencies]
kaalang-compiler = { version = "0.2.0", path = "crates/kaalang-compiler" }
kaalang-macros = { version = "0.2.0", path = "crates/kaalang-macros" }
kaalang-render = { version = "0.2.0", path = "crates/kaalang-render" }
kaalang-svg = { version = "0.2.0", path = "crates/kaalang-svg" }
kaalang-testing = { path = "crates/kaalang-testing" }

clap = "4.6.7"
# Pin formula layout and SVG output; upgrades may change glyph geometry.
latex-rust = "=2.1.0"
proc-macro2 = "1.0.107"
pulldown-cmark = { version = "0.13.4", default-features = false }
quote = "1.0.47"
same-file = "1.0.6"
syn = { version = "3.0.6", features = ["full"] }
trybuild = "1.0.121"
unicode-segmentation = "1.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
arbitrary_source_item_ordering = "warn"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
trivially_copy_pass_by_ref = "allow"
struct_field_names = "allow"
pub_underscore_fields = "allow"
