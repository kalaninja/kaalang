name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A recipe builds its image with plain `docker build`, which cannot read the
# GitHub Actions layer cache. Each container job builds its image from that
# cache in a build-push-action step and loads it, so the recipes skip the build.
env:
  SKIP_IMAGE_BUILD: '1'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: fmt
          load: true
          tags: kaalang-fmt
          cache-from: type=gha,scope=fmt
          cache-to: type=gha,scope=fmt,mode=max
      - uses: extractions/setup-just@v3
      - run: just fmt-check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          load: true
          tags: kaalang-rust
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cargo
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'mise/config.toml') }}
      - uses: extractions/setup-just@v3
      - run: just rust clippy
      - run: just rust test
      # The behavior diagrams redraw themselves during the tests above.
      - run: git add -A && git diff --cached --exit-code

  # Linux containers do not run on these runners, so they install the same
  # toolchain from mise/ and call cargo directly. Formatting is checked above.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # The same mise as the base image tag in Dockerfile.
          version: 2026.10.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: git add -A && git diff --cached --exit-code

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The compile-fail snapshots record the pinned toolchain's own diagnostics,
      # so the floor is type-checked rather than tested.
      - run: cargo check --workspace --all-targets --locked
