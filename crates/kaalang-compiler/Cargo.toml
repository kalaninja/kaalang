[package]
name = "kaalang-compiler"
description = "Parsing, analysis, and Rust lowering for kaalang"
documentation = "https://docs.rs/kaalang-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cargo-platform = { workspace = true, optional = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["visit"] }

[features]
# Reads a compilation target's cfg set and strips a file for it.
cfg = ["dep:cargo-platform"]
# Reads flows and types from the text of a source file, for the renderers. The
# macro leaves it off: rustc gives it tokens, not text.
source = ["cfg", "proc-macro2/span-locations"]
# Resolve names across module sources supplied by Cargo or an editor.
workspace = ["source", "syn/visit-mut"]

[package.metadata.docs.rs]
features = ["workspace"]

[dev-dependencies]
kaalang-testing = { workspace = true }

[lints]
workspace = true
