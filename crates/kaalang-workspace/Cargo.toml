[package]
name = "kaalang-workspace"
description = "Cargo targets, module trees, and Rust path resolution for kaalang"
documentation = "https://docs.rs/kaalang-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaalang-compiler = { workspace = true, features = ["source"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["visit-mut"] }

[lints]
workspace = true
