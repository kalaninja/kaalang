<svg xmlns="http://www.w3.org/2000/svg" width="571" height="542" viewBox="0 0 571 542" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for order::Line</title>
  <desc id="kaalang-description">Type order::Line with incoming types order::Order.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">order::Order</title>
      <rect class="card-shape" x="32" y="32" width="314" height="252"/>
      <path class="card-rules" d="M 32 102 L 346 102 M 32 154 L 346 154 M 32 210 L 346 210"/>
      <rect class="card-outline" x="32" y="32" width="314" height="252"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> order::Order</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="332" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">An order a customer placed in the shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="122.28" text-anchor="middle">−</text>
        <text x="58" y="123" text-anchor="start" xml:space="preserve"> number</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">OrderNumber</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="143" dy="0">The order&apos;s number, </tspan><tspan x="143" dy="18">unique in the shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="174.28" text-anchor="middle">−</text>
        <text x="58" y="175" text-anchor="start" xml:space="preserve"> customer</text>
      </g>
      <text class="field-type" y="191" xml:space="preserve"><tspan x="46" dy="0">CustomerId</tspan></text>
      <text class="description" y="177" xml:space="preserve"><tspan x="143" dy="0">Who placed the order.</tspan></text>
      <text class="target" text-anchor="end" y="199" xml:space="preserve"><tspan x="332" dy="0">▸ <tspan class="md-code">Customer</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="230.28" text-anchor="middle">−</text>
        <text x="58" y="231" text-anchor="start" xml:space="preserve"> lines</text>
      </g>
      <text class="field-type" y="247" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Line&gt;</tspan></text>
      <text class="description" y="233" xml:space="preserve"><tspan x="143" dy="0">What was ordered, in the </tspan><tspan x="143" dy="18">order it was added.</tspan></text>
      <text class="target" text-anchor="end" y="273" xml:space="preserve"><tspan x="332" dy="0">▸ <tspan class="md-code">Line</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">order::Line</title>
      <rect class="card-shape" x="32" y="332" width="507" height="178"/>
      <path class="card-rules" d="M 32 402 L 539 402 M 208 402 L 208 510 M 351 402 L 351 510"/>
      <rect class="card-outline" x="32" y="332" width="507" height="178"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="362.92" text-anchor="middle">−</text>
        <text x="64" y="364" text-anchor="start" xml:space="preserve"> order::Line</text>
      </g>
      <text class="type-kind" text-anchor="end" y="364" xml:space="preserve"><tspan x="525" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="387" xml:space="preserve"><tspan x="46" dy="0">One product in an order, with its quantity.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="422.28" text-anchor="middle">−</text>
        <text x="58" y="423" text-anchor="start" xml:space="preserve"> product</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="46" dy="0">Sku</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="46" dy="0">The product ordered.</tspan></text>
      <text class="target" text-anchor="end" y="499" xml:space="preserve"><tspan x="194" dy="0">▸ <tspan class="md-code">Product</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="228" y="422.28" text-anchor="middle">−</text>
        <text x="234" y="423" text-anchor="start" xml:space="preserve"> quantity</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="222" dy="0">u32</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="222" dy="0">How many units.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="371" y="422.28" text-anchor="middle">−</text>
        <text x="377" y="423" text-anchor="start" xml:space="preserve"> price</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="365" dy="0">Money</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="365" dy="0">The price of one unit </tspan><tspan x="365" dy="18">when the order was </tspan><tspan x="365" dy="18">placed.</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">order::Order → order::Line</title>
      <path class="relationship" d="M 346 268 L 360 268 L 360 332" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="346" cy="268" r="4"/>
    </g>
  </g>
</svg>
