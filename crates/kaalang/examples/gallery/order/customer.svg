      <text class="description" y="233" xml:space="preserve"><tspan x="143" dy="0">What was ordered, in the </tspan><tspan x="143" dy="18">order it was added.</tspan></text>
      <text class="target" text-anchor="end" y="273" xml:space="preserve"><tspan x="332" dy="0">▸ <tspan class="md-code">Line</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">order::Customer</title>
      <rect class="card-shape" x="32" y="332" width="545" height="200"/>
      <path class="card-rules" d="M 32 402 L 577 402 M 201 402 L 201 532 M 389 402 L 389 532"/>
      <rect class="card-outline" x="32" y="332" width="545" height="200"/>
      <g class="type-name">
