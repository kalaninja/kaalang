  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">order::Order → order::Customer</title>
      <path class="relationship" d="M 346 194 L 360 194 L 360 332" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="346" cy="194" r="4"/>
    </g>
  </g>
</svg>
