      <text class="description" y="387" xml:space="preserve"><tspan x="46" dy="0">A person who buys from the shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="422.28" text-anchor="middle">−</text>
        <text x="58" y="423" text-anchor="start" xml:space="preserve"> id</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="46" dy="0">CustomerId</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="46" dy="0">The customer&apos;s key.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="221" y="422.28" text-anchor="middle">−</text>
        <text x="227" y="423" text-anchor="start" xml:space="preserve"> name</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="215" dy="0">String</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="215" dy="0">The name on the </tspan><tspan x="215" dy="18">parcel.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="409" y="422.28" text-anchor="middle">−</text>
        <text x="415" y="423" text-anchor="start" xml:space="preserve"> latest</text>
      </g>
      <text class="field-type" y="439" xml:space="preserve"><tspan x="403" dy="0">Option&lt;OrderNumber&gt;</tspan></text>
      <text class="description" y="463" xml:space="preserve"><tspan x="403" dy="0">The customer&apos;s </tspan><tspan x="403" dy="18">latest order, once </tspan><tspan x="403" dy="18">they placed one.</tspan></text>
      <text class="target" text-anchor="end" y="521" xml:space="preserve"><tspan x="563" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
    </g>
