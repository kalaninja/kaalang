<svg xmlns="http://www.w3.org/2000/svg" width="1556" height="1218" viewBox="0 0 1556 1218" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description"><title id="kaalang-title">kaalang diagram for digital_root</title><desc id="kaalang-description">The flow starts directly at stage n. Transitions return to the stage entry rail. Nodes: Start: digital_root with parameters n: u32. Stage n. Cycles: Add up the digits. with inputs mut rest, mut sum and outputs n. Nodes: Stage: Reduce the number to one digit.; Question: Does the number have one digit? capturing n handing over single / several described as branch 1: YES / branch 2: NO; Action: Keep the digit. capturing single, n; Action: Start summing the digits. capturing several, n handing over mut rest, mut sum; Question: Are any digits left? capturing rest handing over more / done described as branch 1: YES / branch 2: NO; Action: Move the last digit into the sum. capturing more, &amp;mut rest, &amp;mut sum handing over moved; Action: Reduce the digit sum next. capturing done, sum handing over n; Transition: Reduce the number to one digit.; Transition: Return the digit.. Connections: Stage: Reduce the number to one digit. to Question: Does the number have one digit?; Question: Does the number have one digit? branch 1 to Action: Keep the digit.; Question: Does the number have one digit? branch 2 to Action: Start summing the digits.; Action: Keep the digit. to Transition: Return the digit.; Action: Start summing the digits. to the entry of the cycle; Question: Are any digits left? branch 1 to Action: Move the last digit into the sum.; Question: Are any digits left? branch 2 to Action: Reduce the digit sum next.; Action: Move the last digit into the sum. to the iteration tail of the cycle; Action: Reduce the digit sum next. to Transition: Reduce the number to one digit.; the entry of the cycle to Question: Are any digits left?; Repeat from the iteration tail of the cycle to the entry of the cycle. Transition to stage n. Transition to stage finish. Stage finish. Nodes: Stage: Return the digit.; End: u32 capturing finish. Connections: Stage: Return the digit. to End: u32.</desc><rect width="100%" height="100%" fill="white"/>
