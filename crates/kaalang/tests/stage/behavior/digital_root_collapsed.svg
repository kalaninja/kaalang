<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="930" viewBox="0 0 1168 930" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description"><title id="kaalang-title">kaalang diagram for digital_root</title><desc id="kaalang-description">The flow starts directly at stage n. Transitions return to the stage entry rail. Nodes: Start: digital_root with parameters n: u32. Stage n. Nodes: Stage: Reduce the number to one digit.; Question: Does the number have one digit? capturing n handing over single / several described as branch 1: YES / branch 2: NO; Action: Keep the digit. capturing single, n; Action: Start summing the digits. capturing several, n handing over mut rest, mut sum; Cycle: Add up the digits. capturing mut rest, mut sum; Stage transition: Reduce the number to one digit.; Stage transition: Return the digit.. Connections: Stage: Reduce the number to one digit. to Question: Does the number have one digit?; Question: Does the number have one digit? branch 1 to Action: Keep the digit.; Question: Does the number have one digit? branch 2 to Action: Start summing the digits.; Action: Keep the digit. to Stage transition: Return the digit.; Action: Start summing the digits. to Cycle: Add up the digits.; Cycle: Add up the digits. to Stage transition: Reduce the number to one digit.. Transition to stage n. Transition to stage finish. Stage finish. Nodes: Stage: Return the digit.; End: u32 capturing finish. Connections: Stage: Return the digit. to End: u32.</desc><rect width="100%" height="100%" fill="white"/>
