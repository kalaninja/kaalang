<svg xmlns="http://www.w3.org/2000/svg" width="1604" height="1192" viewBox="0 0 1604 1192" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description"><title id="kaalang-title">kaalang diagram for stage_cycle_alternative_outputs</title><desc id="kaalang-description">The flow starts directly at stage go. Transitions return to the stage entry rail. Nodes: Start: stage_cycle_alternative_outputs with parameters go: u8. Stage go. Cycles: Choose whether to repeat the stage. with inputs current and outputs finish or go. Nodes: Stage: Count down.; Action: Read the current value. capturing go handing over current; Select: What happens to the value? capturing current; Case: Repeat this cycle. handing over retry; Case: Finish the flow. handing over done; Case: Visit this stage again. handing over again; Action: Keep the finished value. capturing done, current handing over finish; Action: Decrease the value. capturing again, current handing over go; Transition: Return the value.; Transition: Count down.. Connections: Stage: Count down. to Action: Read the current value.; Action: Read the current value. to the entry of the cycle; Select: What happens to the value? to Case: Repeat this cycle.; Select: What happens to the value? to Case: Finish the flow.; Select: What happens to the value? to Case: Visit this stage again.; Case: Repeat this cycle. to the iteration tail of the cycle; Case: Finish the flow. to Action: Keep the finished value.; Case: Visit this stage again. to Action: Decrease the value.; Action: Keep the finished value. to the finish result of the cycle; Action: Decrease the value. to the go result of the cycle; the entry of the cycle to Select: What happens to the value?; the finish result of the cycle to Transition: Return the value.; the go result of the cycle to Transition: Count down.; Repeat from the iteration tail of the cycle to the entry of the cycle. Transition to stage finish. Transition to stage go. Stage finish. Nodes: Stage: Return the value.; End: u8 capturing finish. Connections: Stage: Return the value. to End: u8.</desc><rect width="100%" height="100%" fill="white"/>
