<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="1122" viewBox="0 0 1252 1122" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description"><title id="kaalang-title">kaalang diagram for nested_stage_alternative_outputs</title><desc id="kaalang-description">The flow starts directly at stage go. Transitions return to the stage entry rail. Nodes: Start: nested_stage_alternative_outputs with parameters go: u8. Stage go. Cycles: Select an outer result. with inputs current and outputs finish or go; Select an inner result. with inputs current and outputs inner_finish or inner_again. Nodes: Stage: Choose a nested result.; Action: Read the current entry. capturing go handing over current; Question: Is the value zero? capturing current handing over inner_finish / inner_again; Action: Forward the finished value. capturing inner_finish handing over finish; Action: Count down before revisiting. capturing inner_again, current handing over go; Transition: Return the value.; Transition: Choose a nested result.. Connections: Stage: Choose a nested result. to Action: Read the current entry.; Action: Read the current entry. to the cycle entry; Question: Is the value zero? branch 1 to the inner_finish result of the cycle; Question: Is the value zero? branch 2 to the inner_again result of the cycle; Action: Forward the finished value. to the finish result of the cycle; Action: Count down before revisiting. to the go result of the cycle; the cycle entry to Question: Is the value zero?; the finish result of the cycle to Transition: Return the value.; the go result of the cycle to Transition: Choose a nested result.; the inner_finish result of the cycle to Action: Forward the finished value.; the inner_again result of the cycle to Action: Count down before revisiting.. Transition to stage finish. Transition to stage go. Stage finish. Nodes: Stage: Return the value.; End: u8 capturing finish. Connections: Stage: Return the value. to End: u8.</desc><rect width="100%" height="100%" fill="white"/>
