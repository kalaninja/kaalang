  <desc id="kaalang-description">Nodes: Start: state_machine_without_stages with parameters mut state: State handing over mut state; Cycle: Follow state transitions until Finish. capturing mut state handing over done; End: () capturing nothing. Connections: Start: state_machine_without_stages to Cycle: Follow state transitions until Finish.; Cycle: Follow state transitions until Finish. to End: ().</desc>
