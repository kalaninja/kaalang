<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="1206" viewBox="0 0 1224 1206" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description"><title id="kaalang-title">kaalang diagram for for_in_stage</title><desc id="kaalang-description">The leftmost flow selects the initial stage. Transitions return to the stage entry rail without repeating the initial flow. Nodes: Start: for_in_stage with parameters values: &amp;[u32] handing over values; Action: Start with a total of zero. capturing nothing handing over mut total; Action: Enter the stage. capturing nothing; Transition: Add every value, then return the total.. Connections: Start: for_in_stage to Action: Start with a total of zero.; Action: Start with a total of zero. to Action: Enter the stage.; Action: Enter the stage. to Transition: Add every value, then return the total.. Transition to stage go. Stage go. Cycles: Add every value. with inputs values, mut total and outputs added. Nodes: Stage: Add every value, then return the total.; Select: Add every value. capturing nothing; Case: Take the next item. handing over value; Case: No item is left. handing over added; Action: Add the value. capturing value, &amp;mut total; End: u32 capturing total. Connections: Stage: Add every value, then return the total. to the entry of the cycle; Select: Add every value. to Case: Take the next item.; Select: Add every value. to Case: No item is left.; Case: Take the next item. to Action: Add the value.; Case: No item is left. to End: u32; Action: Add the value. to the iteration tail of the cycle; the entry of the cycle to Select: Add every value.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc><rect width="100%" height="100%" fill="white"/>
