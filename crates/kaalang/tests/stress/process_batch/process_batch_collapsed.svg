    <text class="connection-label" x="185" y="730" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="873" xml:space="preserve"><tspan x="185" dy="0">audit_queue</tspan></text>
    <text class="connection-label" x="185" y="184" xml:space="preserve"><tspan x="185" dy="0">&amp;mut self</tspan></text>
    <text class="connection-label" x="185" y="327" xml:space="preserve"><tspan x="185" dy="0">jobs</tspan></text>
    <text class="connection-label" x="185" y="458" xml:space="preserve"><tspan x="185" dy="0">started, &amp;mut pending, &amp;mut </tspan><tspan x="185" dy="14">report, policy, &amp;mut self</tspan></text>
    <text class="connection-label" x="185" y="635" xml:space="preserve"><tspan x="185" dy="0">stop, mut report</tspan></text>
    <text class="connection-label" x="185" y="780" xml:space="preserve"><tspan x="185" dy="0">&amp;mut self</tspan></text>
    <text class="connection-label" x="185" y="923" xml:space="preserve"><tspan x="185" dy="0">mut audit_queue, &amp;mut self</tspan></text>
    <text class="connection-label" x="185" y="1068" xml:space="preserve"><tspan x="185" dy="0">&amp;mut self</tspan></text>
    <text class="connection-label" x="185" y="1211" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
  </g>
