    <text class="connection-label" x="185" y="277" xml:space="preserve"><tspan x="185" dy="0">started</tspan></text>
    <text class="connection-label" x="185" y="422" xml:space="preserve"><tspan x="185" dy="0">mut pending, mut report</tspan></text>
