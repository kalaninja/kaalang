      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Attach the batch&apos;s completion </tspan><tspan x="-124" dy="18">reason.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 823)">
