<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1312" viewBox="0 0 680 1312" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for process_batch</title>
  <desc id="kaalang-description">Nodes: Start: process_batch with parameters &amp;mut self; jobs: Vec&lt;Job&gt;; policy: Policy handing over self, jobs, policy; Action: Open the batch. capturing &amp;mut self handing over started; Action: Prepare the queue and an empty report. capturing jobs handing over mut pending, mut report; Cycle: Process tasks until the queue ends or cancellation is requested. capturing started, &amp;mut pending, &amp;mut report, policy, &amp;mut self handing over stop; Action: Attach the batch&apos;s completion reason. capturing stop, mut report handing over result; Action: Take the pending audit records. capturing &amp;mut self handing over audit_queue; Cycle: Audit every recorded task before returning the report. capturing mut audit_queue, &amp;mut self; Action: Close the batch after all audits. capturing &amp;mut self; End: Report capturing result. Connections: Start: process_batch to Action: Open the batch.; Action: Open the batch. to Action: Prepare the queue and an empty report.; Action: Prepare the queue and an empty report. to Cycle: Process tasks until the queue ends or cancellation is requested.; Cycle: Process tasks until the queue ends or cancellation is requested. to Action: Attach the batch&apos;s completion reason.; Action: Attach the batch&apos;s completion reason. to Action: Take the pending audit records.; Action: Take the pending audit records. to Cycle: Audit every recorded task before returning the report.; Cycle: Audit every recorded task before returning the report. to Action: Close the batch after all audits.; Action: Close the batch after all audits. to End: Report.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
