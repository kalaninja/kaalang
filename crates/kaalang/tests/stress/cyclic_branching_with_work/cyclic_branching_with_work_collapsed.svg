<svg xmlns="http://www.w3.org/2000/svg" width="704" height="666" viewBox="0 0 704 666" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for cyclic_branching_with_work</title>
  <desc id="kaalang-description">Nodes: Start: cyclic_branching_with_work with parameters seed: usize; config: usize; events: &amp;std::cell::Cell&lt;usize&gt;; remaining: &amp;std::cell::Cell&lt;usize&gt; handing over seed, config, events, remaining; Cycle: Repeat before working. capturing remaining, seed, config, events handing over left / right; Action: Use the left result. capturing left handing over result; Action: Use the right result. capturing right handing over result; End: usize capturing result; Merge: result. Connections: Start: cyclic_branching_with_work to Cycle: Repeat before working.; Cycle: Repeat before working. output left to Action: Use the left result.; Cycle: Repeat before working. output right to Action: Use the right result.; Action: Use the left result. to the result merge; Action: Use the right result. to the result merge; the result merge to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 121 L 172 224
      M 172 288 L 172 360
      M 312 256 L 532 256 L 532 360
      M 172 424 L 172 500
      M 532 424 L 532 500 L 172 500
      M 172 500 L 172 576
    "/>
    <text class="connection-label" x="185" y="518" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="213" xml:space="preserve"><tspan x="185" dy="0">seed, config, events, remaining</tspan></text>
    <text class="connection-label" x="185" y="349" xml:space="preserve"><tspan x="185" dy="0">left</tspan></text>
    <text class="connection-label" x="545" y="349" xml:space="preserve"><tspan x="545" dy="0">right</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 92 L 408 92"/>
    <g class="parameter-panel" transform="translate(528 92)">
      <rect class="node-shape" x="-120" y="-60" width="240" height="120"/>
      <text class="label" x="-104" y="-30" xml:space="preserve"><tspan x="-104" dy="0">seed: usize</tspan><tspan x="-104" dy="18">config: usize</tspan><tspan x="-104" dy="18">events: &amp;std::cell::Cell&lt;usize&gt;</tspan><tspan x="-104" dy="18">remaining: </tspan><tspan x="-104" dy="18">&amp;std::cell::Cell&lt;usize&gt;</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 500)">
      <title xml:space="preserve">the result merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 92)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">cyclic_branching_with_work</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 256)">
      <title xml:space="preserve">Repeat before working.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64" rx="8"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Repeat before working.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 392)">
      <title xml:space="preserve">Use the left result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the left result.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 392)">
      <title xml:space="preserve">Use the right result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the right result.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 605)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
