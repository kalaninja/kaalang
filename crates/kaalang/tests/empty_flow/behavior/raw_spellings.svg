<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for raw_spellings</title>
  <desc id="kaalang-description">Nodes: Start: raw_spellings with parameters r#type: u8; value: u8 handing over type, value; Action: Combine the keyword-named input with the plain one. capturing type, value handing over match, _ignored; Action: Preserve the renamed value. capturing match handing over result; End: u8 capturing result. Connections: Start: raw_spellings to Action: Combine the keyword-named input with the plain one.; Action: Combine the keyword-named input with the plain one. to Action: Preserve the renamed value.; Action: Preserve the renamed value. to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 236 L 172 308
      M 172 372 L 172 444
    "/>
    <text class="connection-label" x="185" y="127" xml:space="preserve"><tspan x="185" dy="0">type, value</tspan></text>
    <text class="connection-label" x="185" y="254" xml:space="preserve"><tspan x="185" dy="0">match, _ignored</tspan></text>
    <text class="connection-label" x="185" y="297" xml:space="preserve"><tspan x="185" dy="0">match</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">r#type: u8</tspan><tspan x="-104" dy="18">value: u8</tspan></text>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">raw_spellings</tspan></text>
    </g>
    <g class="node action" transform="translate(172 203)">
      <title xml:space="preserve">Combine the keyword-named input with the plain one.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Combine the keyword-named input </tspan><tspan x="-124" dy="18">with the plain one.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 340)">
      <title xml:space="preserve">Preserve the renamed value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Preserve the renamed value.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 473)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u8</tspan></text>
    </g>
  </g>
</svg>
