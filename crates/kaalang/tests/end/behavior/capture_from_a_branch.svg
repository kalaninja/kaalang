<svg xmlns="http://www.w3.org/2000/svg" width="708" height="748" viewBox="0 0 708 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for capture_from_a_branch</title>
  <desc id="kaalang-description">Nodes: Start: capture_from_a_branch with parameters condition: bool; dropped: Rc&lt;Cell&lt;bool&gt;&gt; handing over condition, dropped; Action: Create a root return guard. capturing &amp;dropped handing over guard; Question: Is the short answer enough? capturing condition handing over end / more; Action: Finish the longer branch. capturing more, guard, dropped handing over result; Action: Finish the short branch. capturing end, guard, dropped handing over result; End: Rc&lt;Cell&lt;bool&gt;&gt; capturing result; Merge: result. Connections: Start: capture_from_a_branch to Action: Create a root return guard.; Action: Create a root return guard. to Question: Is the short answer enough?; Question: Is the short answer enough? branch 1 to Action: Finish the short branch.; Question: Is the short answer enough? branch 2 to Action: Finish the longer branch.; Action: Finish the longer branch. to the result merge; Action: Finish the short branch. to the result merge; the result merge to End: Rc&lt;Cell&lt;bool&gt;&gt;.</desc>
  <defs>
    <style>
