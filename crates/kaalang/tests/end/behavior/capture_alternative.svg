<svg xmlns="http://www.w3.org/2000/svg" width="704" height="532" viewBox="0 0 704 532" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for capture_alternative</title>
  <desc id="kaalang-description">Nodes: Start: capture_alternative(condition); Question: Choose a result.; Action: Build the yes result.; Action: Build the no result.; End. Connections: Start: capture_alternative(condition) to Question: Choose a result.; Question: Choose a result. to Action: Build the yes result. via yes; Question: Choose a result. to Action: Build the no result. via no; Action: Build the yes result. to End via result; Action: Build the no result. to End via result.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .edge { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .edge-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="edges">
    <path class="edge" d="M 172 90 L 172 162"/>
    <path class="edge" d="M 172 234 L 172 306"/>
    <text class="edge-label" x="214" y="265" xml:space="preserve"><tspan x="214" dy="0">yes</tspan></text>
    <path class="edge" d="M 312 198 L 532 198 L 532 306"/>
    <text class="edge-label" x="422" y="190" xml:space="preserve"><tspan x="422" dy="0">no</tspan></text>
    <path class="edge" d="M 172 370 L 172 442"/>
    <text class="edge-label" x="214" y="388" xml:space="preserve"><tspan x="214" dy="0">result</tspan></text>
    <path class="edge" d="M 532 370 L 532 410 L 172 410 L 172 442"/>
    <text class="edge-label" x="574" y="388" xml:space="preserve"><tspan x="574" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">capture_alternative(condition)</tspan></text>
    </g>
    <g class="node question" transform="translate(172 198)">
      <title xml:space="preserve">Choose a result.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose a result.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 338)">
      <title xml:space="preserve">Build the yes result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the yes result.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 338)">
      <title xml:space="preserve">Build the no result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the no result.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 471)">
      <rect class="node-shape" x="-90" y="-29" width="180" height="58" rx="29"/>
      <text class="label" y="5">End</text>
    </g>
  </g>
</svg>
