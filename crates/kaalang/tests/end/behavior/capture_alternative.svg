<svg xmlns="http://www.w3.org/2000/svg" width="704" height="612" viewBox="0 0 704 612" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for capture_alternative</title>
  <desc id="kaalang-description">Nodes: Start: capture_alternative(condition: bool) -&gt; u32 handing over condition; Question: Choose a result. capturing condition handing over yes / no; Action: Build the yes result. capturing yes handing over result; Action: Build the no result. capturing no handing over result; End: u32 capturing result. Connections: Start: capture_alternative(condition: bool) -&gt; u32 to Question: Choose a result.; Question: Choose a result. branch 1 to Action: Build the yes result.; Question: Choose a result. branch 2 to Action: Build the no result.; Action: Build the yes result. to the result merge; Action: Build the no result. to the result merge; the result merge to End: u32.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="M 172 98 L 172 170"/>
    <path class="connection" d="M 172 242 L 172 314"/>
    <path class="connection" d="M 312 206 L 532 206 L 532 314"/>
    <path class="connection" d="M 172 378 L 172 430"/>
    <path class="connection" d="M 532 378 L 532 430 L 172 430"/>
    <path class="connection" d="M 172 430 L 172 522"/>
    <text class="connection-label" x="214" y="448" xml:space="preserve"><tspan x="214" dy="0">result</tspan></text>
    <text class="connection-label" x="214" y="129" xml:space="preserve"><tspan x="214" dy="0">condition</tspan></text>
    <text class="connection-label" x="214" y="273" xml:space="preserve"><tspan x="214" dy="0">yes</tspan></text>
    <text class="connection-label" x="422" y="195" xml:space="preserve"><tspan x="422" dy="0">no</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="33"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">capture_alternative(condition: </tspan><tspan x="0" dy="18">bool) -&gt; u32</tspan></text>
    </g>
    <g class="node question" transform="translate(172 206)">
      <title xml:space="preserve">Choose a result.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose a result.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 346)">
      <title xml:space="preserve">Build the yes result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the yes result.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 346)">
      <title xml:space="preserve">Build the no result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the no result.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 551)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u32</tspan></text>
    </g>
  </g>
</svg>
