<svg xmlns="http://www.w3.org/2000/svg" width="780" height="812" viewBox="0 0 780 812" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for forbid_unused_variables</title>
  <desc id="kaalang-description">Cycles: Count to the limit. with inputs mut count, limit and outputs _done. Nodes: Start: forbid_unused_variables with parameters limit: u32 handing over limit; Action: Start at zero. capturing nothing handing over mut count; Question: Is the limit reached? capturing &amp;count, limit handing over _done / more; Action: Count one. capturing more, &amp;mut count handing over counted; End: u32 capturing count. Connections: Start: forbid_unused_variables to Action: Start at zero.; Action: Start at zero. to the entry of the cycle; Question: Is the limit reached? branch 1 to End: u32; Question: Is the limit reached? branch 2 to Action: Count one.; Action: Count one. to the iteration tail of the cycle; the entry of the cycle to Question: Is the limit reached?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count to the limit.</title>
    <rect class="cycle-boundary" x="32" y="263" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="736" y="277" text-anchor="end" xml:space="preserve"><tspan x="736" dy="0">Count to the limit.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 298
      M 200 442 L 200 722
      M 340 406 L 560 406 L 560 514
      M 560 578 L 560 650
      M 200 298 L 200 370
    "/>
    <path class="connection" d="
      M 560 650 L 720 650 L 720 298 L 200 298
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">limit</tspan></text>
    <text class="connection-label code" x="213" y="244" xml:space="preserve"><tspan x="213" dy="0">mut count</tspan></text>
    <text class="connection-label code" x="213" y="460" xml:space="preserve"><tspan x="213" dy="0">_done</tspan></text>
    <text class="connection-label code" x="353" y="424" xml:space="preserve"><tspan x="353" dy="0">more</tspan></text>
    <text class="connection-label code" x="573" y="596" xml:space="preserve"><tspan x="573" dy="0">counted</tspan></text>
    <text class="connection-label code" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label code" x="213" y="359" xml:space="preserve"><tspan x="213" dy="0">&amp;count, limit</tspan></text>
    <text class="connection-label code" x="573" y="503" xml:space="preserve"><tspan x="573" dy="0">more, &amp;mut count</tspan></text>
    <text class="connection-label code" x="213" y="711" xml:space="preserve"><tspan x="213" dy="0">count</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label code" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: u32</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <g class="label code">
        <text class="md-badge" x="-104.16" y="5.16" text-anchor="middle">−</text>
        <text x="-97.16" y="6" text-anchor="start" xml:space="preserve"><tspan class="md-code"> forbid_unused_variables</tspan></text>
      </g>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">Start at zero.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start at zero.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 406)">
      <title xml:space="preserve">Is the limit reached?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the limit reached?</tspan></text>
    </g>
    <g class="node action" transform="translate(560 546)">
      <title xml:space="preserve">Count one.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count one.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 751)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
