  <desc id="kaalang-description">Nodes: Start: - mutate_through_partial_merges with parameters source: u8; refine: bool handing over source, refine; Select: Choose the source. capturing source; Case: Refined source. handing over first; Case: Second source. handing over second; Case: Fallback. handing over third; Question: Refine the first source? capturing first, refine handing over yes / no; Action: Build the refined value. capturing yes handing over mut partial; Action: Build the unrefined value. capturing no handing over mut partial; Action: Build the second value. capturing second handing over mut partial; Action: Extend the partially merged value. capturing &amp;mut partial; Action: Carry the partial value to the outer merge. capturing partial handing over mut shared; Action: Build the fallback value. capturing third handing over mut shared; Action: Extend the fully merged value. capturing &amp;mut shared; End: Vec&lt;u8&gt; capturing shared; Merge: mut partial; Merge: mut shared. Connections: Start: - mutate_through_partial_merges to Select: Choose the source.; Select: Choose the source. to Case: Refined source.; Select: Choose the source. to Case: Second source.; Select: Choose the source. to Case: Fallback.; Case: Refined source. to Question: Refine the first source?; Case: Second source. to Action: Build the second value.; Case: Fallback. to Action: Build the fallback value.; Question: Refine the first source? branch 1 to Action: Build the refined value.; Question: Refine the first source? branch 2 to Action: Build the unrefined value.; Action: Build the refined value. to the mut partial merge; Action: Build the unrefined value. to the mut partial merge; Action: Build the second value. to the mut partial merge; Action: Extend the partially merged value. to Action: Carry the partial value to the outer merge.; Action: Carry the partial value to the outer merge. to the mut shared merge; Action: Build the fallback value. to the mut shared merge; Action: Extend the fully merged value. to End: Vec&lt;u8&gt;; the mut partial merge to Action: Extend the partially merged value.; the mut shared merge to Action: Extend the fully merged value..</desc>
