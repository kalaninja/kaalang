  <desc id="kaalang-description">Nodes: Start: partial_choice_todo with parameters input: i32 handing over input; Select: Is the input negative? capturing input; Case: The input is negative. handing over negative; Case: The input is nonnegative. handing over nonnegative; Action: Produce the negative result. capturing negative handing over result; Action: Produce the nonnegative result. capturing nonnegative handing over result; End: &amp;&apos;static str capturing result; Merge: result. Connections: Start: partial_choice_todo to Select: Is the input negative?; Select: Is the input negative? to Case: The input is negative.; Select: Is the input negative? to Case: The input is nonnegative.; Case: The input is negative. to Action: Produce the negative result.; Case: The input is nonnegative. to Action: Produce the nonnegative result.; Action: Produce the negative result. to the result merge; Action: Produce the nonnegative result. to the result merge; the result merge to End: &amp;&apos;static str.</desc>
