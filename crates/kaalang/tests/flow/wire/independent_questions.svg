<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1000" viewBox="0 0 704 1000" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_questions</title>
  <desc id="kaalang-description">Nodes: Start: - independent_questions with parameters left: bool; right: bool; calls: &amp;Cell&lt;u8&gt; handing over left, right, calls; Question: Choose the right value. capturing right, &amp;calls handing over x / y; Action: Build the first right value. capturing x handing over value; Action: Build the second right value. capturing y handing over value; Question: Choose the left branch. capturing left, &amp;calls handing over a / b; Action: Use the left branch and the right value. capturing a, value handing over end; Action: Use the other left branch and the right value. capturing b, value handing over end; End: u8 capturing end; Merge: value; Merge: end. Connections: Start: - independent_questions to Question: Choose the right value.; Question: Choose the right value. branch 1 to Action: Build the first right value.; Question: Choose the right value. branch 2 to Action: Build the second right value.; Action: Build the first right value. to the value merge; Action: Build the second right value. to the value merge; Question: Choose the left branch. branch 1 to Action: Use the left branch and the right value.; Question: Choose the left branch. branch 2 to Action: Use the other left branch and the right value.; Action: Use the left branch and the right value. to the end merge; Action: Use the other left branch and the right value. to the end merge; the value merge to Question: Choose the left branch.; the end merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
      .cycle-caption .md-math { color: #166534; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 103 L 172 188
      M 172 260 L 172 332
      M 312 224 L 532 224 L 532 332
      M 172 396 L 172 472
      M 532 396 L 532 472 L 172 472
      M 172 620 L 172 692
      M 312 584 L 532 584 L 532 692
      M 172 758 L 172 834
      M 532 758 L 532 834 L 172 834
      M 172 472 L 172 548
      M 172 834 L 172 910
    "/>
    <text class="connection-label code" x="185" y="490" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label code" x="185" y="852" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label code" x="185" y="321" xml:space="preserve"><tspan x="185" dy="0">x</tspan></text>
    <text class="connection-label code" x="545" y="321" xml:space="preserve"><tspan x="545" dy="0">y</tspan></text>
    <text class="connection-label code" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">left, right, calls</tspan></text>
    <text class="connection-label code" x="185" y="638" xml:space="preserve"><tspan x="185" dy="0">a</tspan></text>
    <text class="connection-label code" x="325" y="602" xml:space="preserve"><tspan x="325" dy="0">b</tspan></text>
    <text class="connection-label code" x="185" y="177" xml:space="preserve"><tspan x="185" dy="0">right, &amp;calls</tspan></text>
    <text class="connection-label code" x="185" y="537" xml:space="preserve"><tspan x="185" dy="0">left, &amp;calls</tspan></text>
    <text class="connection-label code" x="185" y="681" xml:space="preserve"><tspan x="185" dy="0">a, value</tspan></text>
    <text class="connection-label code" x="545" y="681" xml:space="preserve"><tspan x="545" dy="0">b, value</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 74 L 408 74"/>
    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label code" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">left: bool</tspan><tspan x="-104" dy="18">right: bool</tspan><tspan x="-104" dy="18">calls: &amp;Cell&lt;u8&gt;</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 472)">
      <title xml:space="preserve">the value merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node merge" transform="translate(172 834)">
      <title xml:space="preserve">the end merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <g class="label">
        <text class="md-badge" x="-95.48" y="5.16" text-anchor="middle">−</text>
        <text x="-88.48" y="6" text-anchor="start" xml:space="preserve"><tspan class="md-code"> independent_questions</tspan></text>
      </g>
    </g>
    <g class="node question" transform="translate(172 224)">
      <title xml:space="preserve">Choose the right value.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose the right value.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 364)">
      <title xml:space="preserve">Build the first right value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the first right value.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 364)">
      <title xml:space="preserve">Build the second right value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the second right value.</tspan></text>
    </g>
    <g class="node question" transform="translate(172 584)">
      <title xml:space="preserve">Choose the left branch.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose the left branch.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 725)">
      <title xml:space="preserve">Use the left branch and the right value.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Use the left branch and the right </tspan><tspan x="-124" dy="18">value.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 725)">
      <title xml:space="preserve">Use the other left branch and the right value.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Use the other left branch and the </tspan><tspan x="-124" dy="18">right value.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 939)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
    </g>
  </g>
</svg>
