  <desc id="kaalang-description">Nodes: Start: - branch_output_captured_twice with parameters condition: bool handing over condition; Question: Choose the branch. capturing condition handing over yes / no; Action: Start the yes branch. capturing yes handing over first; Action: Read the same branch output again. capturing yes handing over second; Action: Finish the yes branch. capturing first, second handing over end; Action: Finish the no branch. capturing no handing over end; End: u8 capturing end; Merge: end. Connections: Start: - branch_output_captured_twice to Question: Choose the branch.; Question: Choose the branch. branch 1 to Action: Start the yes branch.; Question: Choose the branch. branch 2 to Action: Finish the no branch.; Action: Start the yes branch. to Action: Read the same branch output again.; Action: Read the same branch output again. to Action: Finish the yes branch.; Action: Finish the yes branch. to the end merge; Action: Finish the no branch. to the end merge; the end merge to End: u8.</desc>
