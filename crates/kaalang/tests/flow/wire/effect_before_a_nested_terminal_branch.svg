<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1154" viewBox="0 0 1064 1154" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for effect_before_a_nested_terminal_branch</title>
  <desc id="kaalang-description">Nodes: Start: effect_before_a_nested_terminal_branch with parameters outer: bool; inner: bool; log: &amp;mut Vec&lt;&amp;&apos;static str&gt; handing over outer, inner, log; Action: Record the effect before branching. capturing log handing over logged; Question: Take the nested branch? capturing outer, &amp;inner handing over nested / direct; Question: Finish early? capturing nested, inner handing over early / late; Action: Produce the early result. capturing early, logged handing over end; Action: Build the late value. capturing late handing over selected; Action: Build the direct value. capturing direct handing over selected; Action: Use the selected value. capturing selected, logged handing over end; End: u32 capturing end; Merge: end; Merge: selected. Connections: Start: effect_before_a_nested_terminal_branch to Action: Record the effect before branching.; Action: Record the effect before branching. to Question: Take the nested branch?; Question: Take the nested branch? branch 1 to Question: Finish early?; Question: Take the nested branch? branch 2 to Action: Build the direct value.; Question: Finish early? branch 1 to Action: Produce the early result.; Question: Finish early? branch 2 to Action: Build the late value.; Action: Produce the early result. to the end merge; Action: Build the late value. to the selected merge; Action: Build the direct value. to the selected merge; Action: Use the selected value. to the end merge; the end merge to End: u32; the selected merge to Action: Use the selected value..</desc>
