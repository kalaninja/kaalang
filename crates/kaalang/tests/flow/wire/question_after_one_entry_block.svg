  <title id="kaalang-title">kaalang diagram for question_after_one_entry_block</title>
  <desc id="kaalang-description">Nodes: Start: question_after_one_entry_block with parameters condition: bool handing over condition; Question: Choose the pair. capturing condition handing over yes / no; Action: Build the yes pair. capturing yes handing over left, right; Action: Build the no pair. capturing no handing over left, right; Action: Use the left value. capturing left handing over first; Action: Use the right value. capturing right handing over second; Question: Is the first value large? capturing first handing over large / small; Action: Combine a large first value with the second. capturing large, second handing over end; Action: Combine a small first value with the second. capturing small, second handing over end; End: u32 capturing end; Merge: left, right; Merge: end. Connections: Start: question_after_one_entry_block to Question: Choose the pair.; Question: Choose the pair. branch 1 to Action: Build the yes pair.; Question: Choose the pair. branch 2 to Action: Build the no pair.; Action: Build the yes pair. to the left and right merge; Action: Build the no pair. to the left and right merge; Action: Use the left value. to Action: Use the right value.; Action: Use the right value. to Question: Is the first value large?; Question: Is the first value large? branch 1 to Action: Combine a large first value with the second.; Question: Is the first value large? branch 2 to Action: Combine a small first value with the second.; Action: Combine a large first value with the second. to the end merge; Action: Combine a small first value with the second. to the end merge; the left and right merge to Action: Use the left value.; the end merge to End: u32.</desc>
