<svg xmlns="http://www.w3.org/2000/svg" width="704" height="604" viewBox="0 0 704 604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for skeleton</title>
  <desc id="kaalang-description">Nodes: Start: skeleton(seed: u32) -&gt; u32 handing over seed; Question: Accept the seed? capturing &amp;seed handing over accepted / rejected; Action: Keep the accepted seed. capturing accepted, seed handing over result; Action: Keep the rejected seed. capturing rejected, seed handing over result; End: u32 capturing result. Connections: Start: skeleton(seed: u32) -&gt; u32 to Question: Accept the seed?; Question: Accept the seed? branch 1 to Action: Keep the accepted seed.; Question: Accept the seed? branch 2 to Action: Keep the rejected seed.; Action: Keep the accepted seed. to the result merge; Action: Keep the rejected seed. to the result merge; the result merge to End: u32.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="M 172 90 L 172 162"/>
    <path class="connection" d="M 172 234 L 172 306"/>
    <path class="connection" d="M 312 198 L 532 198 L 532 306"/>
    <path class="connection" d="M 172 370 L 172 422"/>
    <path class="connection" d="M 532 370 L 532 422 L 172 422"/>
    <path class="connection" d="M 172 422 L 172 514"/>
    <text class="connection-label" x="198" y="108" xml:space="preserve"><tspan x="198" dy="0">seed</tspan></text>
    <text class="connection-label" x="211" y="252" xml:space="preserve"><tspan x="211" dy="0">accepted</tspan></text>
    <text class="connection-label" x="350" y="216" xml:space="preserve"><tspan x="350" dy="0">rejected</tspan></text>
    <text class="connection-label" x="201" y="151" xml:space="preserve"><tspan x="201" dy="0">&amp;seed</tspan></text>
    <text class="connection-label" x="229" y="295" xml:space="preserve"><tspan x="229" dy="0">accepted, seed</tspan></text>
    <text class="connection-label" x="587" y="295" xml:space="preserve"><tspan x="587" dy="0">rejected, seed</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">skeleton(seed: u32) -&gt; u32</tspan></text>
    </g>
    <g class="node question" transform="translate(172 198)">
      <title xml:space="preserve">Accept the seed?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Accept the seed?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 338)">
      <title xml:space="preserve">Keep the accepted seed.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Keep the accepted seed.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 338)">
      <title xml:space="preserve">Keep the rejected seed.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Keep the rejected seed.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 543)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u32</tspan></text>
    </g>
  </g>
</svg>
