<svg xmlns="http://www.w3.org/2000/svg" width="344" height="668" viewBox="0 0 344 668" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_borrowers</title>
  <desc id="kaalang-description">Nodes: Start: independent_borrowers(input: u32) -&gt; (u32, u32); Action: Produce the first value.; Action: Produce the second value.; Action: Pair the two values.; End. Connections: Start: independent_borrowers(input: u32) -&gt; (u32, u32) to Action: Produce the first value. handing over input; Action: Produce the first value. to Action: Produce the second value. handing over first; Action: Produce the second value. to Action: Pair the two values. handing over second, captured as first, second; Action: Pair the two values. to End via result.</desc>
