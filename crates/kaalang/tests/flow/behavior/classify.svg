<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1020" viewBox="0 0 704 1020" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for classify</title>
  <desc id="kaalang-description">Nodes: Start: classify with parameters seed: u32; limit: u32 handing over seed, limit; Action: Normalize the seed. capturing &amp;seed handing over normalized; Action: Split the seed. capturing normalized handing over left, right; Action: Add the values. capturing left, right, &amp;limit handing over total; Question: Is the total above the limit? capturing &amp;total, &amp;limit handing over accepted / rejected; Action: Keep the accepted total. capturing accepted, total handing over result; Action: Keep the rejected total. capturing rejected, total handing over result; End: u32 capturing result. Connections: Start: classify to Action: Normalize the seed.; Action: Normalize the seed. to Action: Split the seed.; Action: Split the seed. to Action: Add the values.; Action: Add the values. to Question: Is the total above the limit?; Question: Is the total above the limit? branch 1 to Action: Keep the accepted total.; Question: Is the total above the limit? branch 2 to Action: Keep the rejected total.; Action: Keep the accepted total. to the result merge; Action: Keep the rejected total. to the result merge; the result merge to End: u32.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 234 L 172 306
      M 172 370 L 172 442
      M 172 506 L 172 578
      M 172 650 L 172 722
      M 312 614 L 532 614 L 532 722
      M 172 786 L 172 858
      M 532 786 L 532 858 L 172 858
      M 172 858 L 172 930
    "/>
    <text class="connection-label" x="185" y="265" xml:space="preserve"><tspan x="185" dy="0">normalized</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">seed, limit</tspan></text>
    <text class="connection-label" x="185" y="388" xml:space="preserve"><tspan x="185" dy="0">left, right</tspan></text>
    <text class="connection-label" x="185" y="524" xml:space="preserve"><tspan x="185" dy="0">total</tspan></text>
    <text class="connection-label" x="185" y="668" xml:space="preserve"><tspan x="185" dy="0">accepted</tspan></text>
    <text class="connection-label" x="325" y="632" xml:space="preserve"><tspan x="325" dy="0">rejected</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">&amp;seed</tspan></text>
    <text class="connection-label" x="185" y="431" xml:space="preserve"><tspan x="185" dy="0">left, right, &amp;limit</tspan></text>
    <text class="connection-label" x="185" y="567" xml:space="preserve"><tspan x="185" dy="0">&amp;total, &amp;limit</tspan></text>
    <text class="connection-label" x="185" y="711" xml:space="preserve"><tspan x="185" dy="0">accepted, total</tspan></text>
    <text class="connection-label" x="545" y="711" xml:space="preserve"><tspan x="545" dy="0">rejected, total</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">seed: u32</tspan><tspan x="-104" dy="18">limit: u32</tspan></text>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">classify</tspan></text>
    </g>
    <g class="node action" transform="translate(172 202)">
      <title xml:space="preserve">Normalize the seed.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Normalize the seed.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 338)">
      <title xml:space="preserve">Split the seed.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Split the seed.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 474)">
      <title xml:space="preserve">Add the values.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Add the values.</tspan></text>
    </g>
    <g class="node question" transform="translate(172 614)">
      <title xml:space="preserve">Is the total above the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the total above the limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 754)">
      <title xml:space="preserve">Keep the accepted total.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Keep the accepted total.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 754)">
      <title xml:space="preserve">Keep the rejected total.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Keep the rejected total.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 959)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u32</tspan></text>
    </g>
  </g>
</svg>
