<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1012" viewBox="0 0 704 1012" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for classify</title>
  <desc id="kaalang-description">Nodes: Start: classify(seed: u32, limit: u32) -&gt; u32 handing over seed, limit; Action: Normalize the seed. capturing &amp;seed handing over normalized; Action: Split the seed. capturing normalized handing over left, right; Action: Add the values. capturing left, right, &amp;limit handing over total; Question: Is the total above the limit? capturing &amp;total, &amp;limit handing over accepted / rejected; Action: Keep the accepted total. capturing accepted, total handing over result; Action: Keep the rejected total. capturing rejected, total handing over result; End: u32 capturing result. Connections: Start: classify(seed: u32, limit: u32) -&gt; u32 to Action: Normalize the seed.; Action: Normalize the seed. to Action: Split the seed.; Action: Split the seed. to Action: Add the values.; Action: Add the values. to Question: Is the total above the limit?; Question: Is the total above the limit? branch 1 to Action: Keep the accepted total.; Question: Is the total above the limit? branch 2 to Action: Keep the rejected total.; Action: Keep the accepted total. to the result merge; Action: Keep the rejected total. to the result merge; the result merge to End: u32.</desc>
