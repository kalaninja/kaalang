<svg xmlns="http://www.w3.org/2000/svg" width="808" height="956" viewBox="0 0 808 956" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nearest_cycle_outputs</title>
  <desc id="kaalang-description">Cycles: Run passes until two have finished. with inputs mut count and outputs done; Complete the inner pass immediately. with inputs () and outputs finished. Nodes: Start: - const nearest_cycle_outputs with parameters mut count: usize handing over mut count; Action: Finish the inner pass. capturing nothing handing over finished; Action: Advance the outer pass. capturing finished, &amp;mut count handing over advanced; Question: Have two passes finished? capturing advanced, &amp;count handing over done / again; Action: Finish this pass. capturing again; End: usize capturing count. Connections: Start: - const nearest_cycle_outputs to the entry of the cycle; Action: Finish the inner pass. to Action: Advance the outer pass.; Action: Advance the outer pass. to Question: Have two passes finished?; Question: Have two passes finished? branch 1 to End: usize; Question: Have two passes finished? branch 2 to Action: Finish this pass.; Action: Finish this pass. to the iteration tail of the cycle; the entry of the cycle to Action: Finish the inner pass.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
      .cycle-caption .md-math { color: #166534; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Run passes until two have finished.</title>
    <rect class="cycle-boundary" x="32" y="135" width="744" height="694" rx="12"/>
    <text class="cycle-caption" x="764" y="149" text-anchor="end" xml:space="preserve"><tspan x="764" dy="0">Run passes until two have finished.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Complete the inner pass immediately.</title>
    <rect class="cycle-boundary" x="60" y="207" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="384" y="221" text-anchor="end" xml:space="preserve"><tspan x="384" dy="0">Complete the </tspan><tspan x="384" dy="14">inner pass …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 228 98 L 228 170
      M 228 306 L 228 378
      M 228 442 L 228 514
      M 228 586 L 228 866
      M 368 550 L 588 550 L 588 658
      M 588 722 L 588 794
      M 228 170 L 228 242
    "/>
    <path class="connection" d="
      M 588 794 L 748 794 L 748 170 L 228 170
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="601" y="647" xml:space="preserve"><tspan x="601" dy="0">again</tspan></text>
    <text class="connection-label code" x="241" y="116" xml:space="preserve"><tspan x="241" dy="0">mut count</tspan></text>
    <text class="connection-label code" x="241" y="324" xml:space="preserve"><tspan x="241" dy="0">finished</tspan></text>
    <text class="connection-label code" x="241" y="460" xml:space="preserve"><tspan x="241" dy="0">advanced</tspan></text>
    <text class="connection-label code" x="241" y="604" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label code" x="241" y="231" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label code" x="241" y="367" xml:space="preserve"><tspan x="241" dy="0">finished, &amp;mut count</tspan></text>
    <text class="connection-label code" x="241" y="503" xml:space="preserve"><tspan x="241" dy="0">advanced, &amp;count</tspan></text>
    <text class="connection-label code" x="241" y="855" xml:space="preserve"><tspan x="241" dy="0">count</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 65 L 464 65"/>
    <g class="parameter-panel" transform="translate(584 65)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label code" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut count: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(228 65)">
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="33"/>
      <g class="label">
        <text class="md-badge" x="-30.38" y="-3.84" text-anchor="middle">−</text>
        <text x="-23.38" y="-3" text-anchor="start" xml:space="preserve"><tspan class="md-code"> const </tspan></text>
        <text x="-91.14" y="15" text-anchor="start" xml:space="preserve"><tspan class="md-code">nearest_cycle_outputs</tspan></text>
      </g>
    </g>
    <g class="node action" transform="translate(228 274)">
      <title xml:space="preserve">Finish the inner pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the inner pass.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 410)">
      <title xml:space="preserve">Advance the outer pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance the outer pass.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 550)">
      <title xml:space="preserve">Have two passes finished?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Have two passes finished?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 690)">
      <title xml:space="preserve">Finish this pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish this pass.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 895)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
