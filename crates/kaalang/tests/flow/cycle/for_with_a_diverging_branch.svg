  <title id="kaalang-title">kaalang diagram for for_with_a_diverging_branch</title>
  <desc id="kaalang-description">Cycles: Add the values, spinning forever on a zero. with inputs values, mut total and outputs (); Spin forever. with inputs zero and outputs (). Nodes: Start: for_with_a_diverging_branch with parameters values: &amp;[u32] handing over values; Action: Start with a total of zero. capturing nothing handing over mut total; For entry: Add the values, spinning forever on a zero. capturing values handing over value; Question: Is the value zero? capturing value handing over zero / nonzero; Action: Add the value. capturing nonzero, value, &amp;mut total; Action: Wait. capturing nothing handing over waited; For end: Add the values, spinning forever on a zero.; End: u32 capturing total. Connections: Start: for_with_a_diverging_branch to Action: Start with a total of zero.; Action: Start with a total of zero. to For entry: Add the values, spinning forever on a zero.; For entry: Add the values, spinning forever on a zero. to Question: Is the value zero?; Question: Is the value zero? branch 1 to the entry of the cycle; Question: Is the value zero? branch 2 to Action: Add the value.; Action: Add the value. to For end: Add the values, spinning forever on a zero.; Action: Wait. to the iteration tail of the cycle; For end: Add the values, spinning forever on a zero. to End: u32; the entry of the cycle to Action: Wait.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
