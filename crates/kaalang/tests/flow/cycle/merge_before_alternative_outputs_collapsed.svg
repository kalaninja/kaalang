<svg xmlns="http://www.w3.org/2000/svg" width="704" height="990" viewBox="0 0 704 990" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for merge_before_alternative_outputs</title>
  <desc id="kaalang-description">Nodes: Start: - merge_before_alternative_outputs with parameters fast: bool; mut count: u32 handing over fast, mut count; Question: Count fast? capturing fast handing over quick / slow; Action: Step by two. capturing quick handing over step; Action: Step by one. capturing slow handing over step; Cycle: Count past five. capturing mut count, step handing over even / odd; Action: Score the even count. capturing even, count handing over score; Action: Score the odd count. capturing odd, count handing over score; End: u32 capturing score; Merge: step; Merge: score. Connections: Start: - merge_before_alternative_outputs to Question: Count fast?; Question: Count fast? branch 1 to Action: Step by two.; Question: Count fast? branch 2 to Action: Step by one.; Action: Step by two. to the step merge; Action: Step by one. to the step merge; Cycle: Count past five. output even to Action: Score the even count.; Cycle: Count past five. output odd to Action: Score the odd count.; Action: Score the even count. to the score merge; Action: Score the odd count. to the score merge; the step merge to Cycle: Count past five.; the score merge to End: u32.</desc>
