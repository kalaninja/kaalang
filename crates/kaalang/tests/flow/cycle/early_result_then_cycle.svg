    <text class="connection-label branch-label" style="font-size: 14px" x="213" y="262" xml:space="preserve"><tspan x="213" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="353" y="194" xml:space="preserve"><tspan x="353" dy="0">NO</tspan></text>
    <text class="connection-label code" x="213" y="620" xml:space="preserve"><tspan x="213" dy="0">finish_early</tspan></text>
    <text class="connection-label code" x="353" y="584" xml:space="preserve"><tspan x="353" dy="0">count_more</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="612" y="902" xml:space="preserve"><tspan x="612" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="752" y="834" xml:space="preserve"><tspan x="752" dy="0">NO</tspan></text>
    <text class="connection-label code" x="213" y="159" xml:space="preserve"><tspan x="213" dy="0">first</tspan></text>
    <text class="connection-label code" x="213" y="519" xml:space="preserve"><tspan x="213" dy="0">&amp;early_result</tspan></text>
    <text class="connection-label code" x="213" y="663" xml:space="preserve"><tspan x="213" dy="0">finish_early, early_result</tspan></text>
    <text class="connection-label code" x="612" y="799" xml:space="preserve"><tspan x="612" dy="0">&amp;count</tspan></text>
    <text class="connection-label code" x="612" y="943" xml:space="preserve"><tspan x="612" dy="0">leave, count</tspan></text>
    <text class="connection-label code" x="1011" y="943" xml:space="preserve"><tspan x="1011" dy="0">iterate, &amp;mut count</tspan></text>
  </g>
  <g class="nodes">
