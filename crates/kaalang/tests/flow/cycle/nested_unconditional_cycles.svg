<svg xmlns="http://www.w3.org/2000/svg" width="836" height="956" viewBox="0 0 836 956" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_unconditional_cycles</title>
  <desc id="kaalang-description">Cycles: Run the nested counter. with inputs limit and outputs result; Count to the limit. with inputs mut count, limit and outputs done. Nodes: Start: nested_unconditional_cycles with parameters limit: usize handing over limit; Action: Initialize the counter. capturing nothing handing over mut count; Question: Has the counter reached the limit? capturing &amp;count, &amp;limit handing over done / again; Action: Increment the counter. capturing again, &amp;mut count; Action: Hand over the count. capturing done, count handing over result; End: usize capturing result. Connections: Start: nested_unconditional_cycles to Action: Initialize the counter.; Action: Initialize the counter. to the entry of the cycle; Question: Has the counter reached the limit? branch 1 to Action: Hand over the count.; Question: Has the counter reached the limit? branch 2 to Action: Increment the counter.; Action: Increment the counter. to the iteration tail of the cycle; Action: Hand over the count. to End: usize; the entry of the cycle to Question: Has the counter reached the limit?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Run the nested counter.</title>
    <rect class="cycle-boundary" x="32" y="135" width="772" height="694" rx="12"/>
    <text class="cycle-caption" x="792" y="149" text-anchor="end" xml:space="preserve"><tspan x="792" dy="0">Run the nested counter.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Count to the limit.</title>
    <rect class="cycle-boundary" x="60" y="271" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="764" y="285" text-anchor="end" xml:space="preserve"><tspan x="764" dy="0">Count to the limit.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 228 98 L 228 170
      M 228 234 L 228 306
      M 228 450 L 228 730
      M 368 414 L 588 414 L 588 522
      M 588 586 L 588 658
      M 228 794 L 228 866
      M 228 306 L 228 378
    "/>
    <path class="connection" d="
      M 588 658 L 748 658 L 748 306 L 228 306
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="241" y="116" xml:space="preserve"><tspan x="241" dy="0">limit</tspan></text>
    <text class="connection-label code" x="241" y="252" xml:space="preserve"><tspan x="241" dy="0">mut count</tspan></text>
    <text class="connection-label code" x="241" y="468" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label code" x="381" y="432" xml:space="preserve"><tspan x="381" dy="0">again</tspan></text>
    <text class="connection-label code" x="241" y="812" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
    <text class="connection-label code" x="241" y="159" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label code" x="241" y="367" xml:space="preserve"><tspan x="241" dy="0">&amp;count, &amp;limit</tspan></text>
    <text class="connection-label code" x="601" y="511" xml:space="preserve"><tspan x="601" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label code" x="241" y="719" xml:space="preserve"><tspan x="241" dy="0">done, count</tspan></text>
    <text class="connection-label code" x="241" y="855" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 65 L 464 65"/>
    <g class="parameter-panel" transform="translate(584 65)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label code" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(228 65)">
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="33"/>
      <g class="label code">
        <text class="md-badge" x="-95.48" y="-3.84" text-anchor="middle">−</text>
        <text x="-88.48" y="-3" text-anchor="start" xml:space="preserve"><tspan class="md-code"> nested_unconditional_</tspan></text>
        <text x="-26.04" y="15" text-anchor="start" xml:space="preserve"><tspan class="md-code">cycles</tspan></text>
      </g>
    </g>
    <g class="node action" transform="translate(228 202)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 414)">
      <title xml:space="preserve">Has the counter reached the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the counter reached </tspan><tspan x="0" dy="18">the limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 554)">
      <title xml:space="preserve">Increment the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 762)">
      <title xml:space="preserve">Hand over the count.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Hand over the count.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 895)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
