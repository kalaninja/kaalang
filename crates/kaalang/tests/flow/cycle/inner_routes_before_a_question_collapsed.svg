<svg xmlns="http://www.w3.org/2000/svg" width="704" height="630" viewBox="0 0 704 630" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for inner_routes_before_a_question</title>
  <desc id="kaalang-description">Nodes: Start: - inner_routes_before_a_question with parameters value: u8; flag: u8 handing over value, flag; Cycle: Classify the value. capturing value, flag handing over first / second; Action: Keep the first class. capturing first handing over result; Action: Scale the second class. capturing second handing over result; End: u8 capturing result; Merge: result. Connections: Start: - inner_routes_before_a_question to Cycle: Classify the value.; Cycle: Classify the value. output first to Action: Keep the first class.; Cycle: Classify the value. output second to Action: Scale the second class.; Action: Keep the first class. to the result merge; Action: Scale the second class. to the result merge; the result merge to End: u8.</desc>
