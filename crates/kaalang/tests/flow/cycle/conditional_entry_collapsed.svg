<svg xmlns="http://www.w3.org/2000/svg" width="704" height="758" viewBox="0 0 704 758" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for conditional_entry</title>
  <desc id="kaalang-description">Nodes: Start: - conditional_entry with parameters enabled: bool; limit: usize handing over enabled, limit; Question: Run the counter? capturing enabled handing over run / skip; Action: Initialize the selected counter. capturing run handing over mut count; Cycle: Count to the limit when selected. capturing mut count, limit handing over end; Action: Skip the counter. capturing skip handing over end; End: usize capturing end; Merge: end. Connections: Start: - conditional_entry to Question: Run the counter?; Question: Run the counter? branch 1 to Action: Initialize the selected counter.; Question: Run the counter? branch 2 to Action: Skip the counter.; Action: Initialize the selected counter. to Cycle: Count to the limit when selected.; Cycle: Count to the limit when selected. to the end merge; Action: Skip the counter. to the end merge; the end merge to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
      .cycle-caption .md-math { color: #166534; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 242 L 172 314
      M 312 206 L 532 206 L 532 314
      M 172 378 L 172 450
      M 172 516 L 172 592
      M 532 378 L 532 592 L 172 592
      M 172 592 L 172 668
    "/>
    <text class="connection-label code" x="185" y="610" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label code" x="185" y="303" xml:space="preserve"><tspan x="185" dy="0">run</tspan></text>
    <text class="connection-label code" x="545" y="303" xml:space="preserve"><tspan x="545" dy="0">skip</tspan></text>
    <text class="connection-label code" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">enabled, limit</tspan></text>
    <text class="connection-label code" x="185" y="396" xml:space="preserve"><tspan x="185" dy="0">mut count</tspan></text>
    <text class="connection-label code" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">enabled</tspan></text>
    <text class="connection-label code" x="185" y="439" xml:space="preserve"><tspan x="185" dy="0">mut count, limit</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label code" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">enabled: bool</tspan><tspan x="-104" dy="18">limit: usize</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 592)">
      <title xml:space="preserve">the end merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <g class="label">
        <text class="md-badge" x="-78.12" y="5.16" text-anchor="middle">−</text>
        <text x="-71.12" y="6" text-anchor="start" xml:space="preserve"><tspan class="md-code"> conditional_entry</tspan></text>
      </g>
    </g>
    <g class="node question" transform="translate(172 206)">
      <title xml:space="preserve">Run the counter?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Run the counter?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 346)">
      <title xml:space="preserve">Initialize the selected counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the selected counter.</tspan></text>
    </g>
    <g class="node cycle" transform="translate(172 483)">
      <title xml:space="preserve">Count to the limit when selected.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Count to the limit when </tspan><tspan x="-124" dy="18">selected.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(532 346)">
      <title xml:space="preserve">Skip the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Skip the counter.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 697)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
