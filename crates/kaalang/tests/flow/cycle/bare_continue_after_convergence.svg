<svg xmlns="http://www.w3.org/2000/svg" width="780" height="823" viewBox="0 0 780 823" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for bare_continue_after_convergence</title>
  <desc id="kaalang-description">Cycles: Repeat after both branches converge. with inputs flag and outputs (). Nodes: Start: - bare_continue_after_convergence with parameters flag: bool handing over flag; Question: Take the first route? capturing flag handing over first / second; Action: Finish the first route. capturing first handing over ready; Action: Finish the second route. capturing second handing over ready; Action: Use the merged wire. capturing ready; Merge: ready. Connections: Start: - bare_continue_after_convergence to the entry of the cycle; Question: Take the first route? branch 1 to Action: Finish the first route.; Question: Take the first route? branch 2 to Action: Finish the second route.; Action: Finish the first route. to the ready merge; Action: Finish the second route. to the ready merge; Action: Use the merged wire. to the iteration tail of the cycle; the ready merge to Action: Use the merged wire.; the entry of the cycle to Question: Take the first route?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
      .cycle-caption .md-math { color: #166534; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat after both branches converge.</title>
    <rect class="cycle-boundary" x="32" y="153" width="716" height="638" rx="12"/>
    <text class="cycle-caption" x="736" y="167" text-anchor="end" xml:space="preserve"><tspan x="736" dy="0">Repeat after both branches converge.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 116 L 220 188
      M 220 332 L 220 404
      M 360 296 L 580 296 L 580 404
      M 220 468 L 220 544
      M 580 468 L 580 544 L 220 544
      M 220 684 L 220 756
      M 220 544 L 220 620
      M 220 188 L 220 260
    "/>
    <path class="connection" d="
      M 220 756 L 60 756 L 60 188 L 220 188
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="233" y="562" xml:space="preserve"><tspan x="233" dy="0">ready</tspan></text>
    <text class="connection-label code" x="233" y="393" xml:space="preserve"><tspan x="233" dy="0">first</tspan></text>
    <text class="connection-label code" x="593" y="393" xml:space="preserve"><tspan x="593" dy="0">second</tspan></text>
    <text class="connection-label code" x="233" y="134" xml:space="preserve"><tspan x="233" dy="0">flag</tspan></text>
    <text class="connection-label code" x="233" y="249" xml:space="preserve"><tspan x="233" dy="0">flag</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 74 L 456 74"/>
    <g class="parameter-panel" transform="translate(576 74)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label code" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(220 544)">
      <title xml:space="preserve">the ready merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 74)">
      <rect class="node-shape" x="-140" y="-42" width="280" height="84" rx="42"/>
      <g class="label">
        <text class="md-badge" x="-4.34" y="-12.84" text-anchor="middle">−</text>
        <text x="2.66" y="-12" text-anchor="start" xml:space="preserve"><tspan class="md-code"> </tspan></text>
        <text x="-121.52" y="6" text-anchor="start" xml:space="preserve"><tspan class="md-code">bare_continue_after_converge</tspan></text>
        <text x="-13.02" y="24" text-anchor="start" xml:space="preserve"><tspan class="md-code">nce</tspan></text>
      </g>
    </g>
    <g class="node question" transform="translate(220 296)">
      <title xml:space="preserve">Take the first route?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Take the first route?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 436)">
      <title xml:space="preserve">Finish the first route.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the first route.</tspan></text>
    </g>
    <g class="node action" transform="translate(580 436)">
      <title xml:space="preserve">Finish the second route.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the second route.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 652)">
      <title xml:space="preserve">Use the merged wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the merged wire.</tspan></text>
    </g>
  </g>
</svg>
