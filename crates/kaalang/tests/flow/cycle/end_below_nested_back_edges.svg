      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance to the next route.</tspan></text>
    </g>
    <g class="node action" transform="translate(640 982)">
      <title xml:space="preserve">Continue with the outer cycle.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Continue with the outer cycle.</tspan></text>
    </g>
    <g class="node action" transform="translate(1000 982)">
      <title xml:space="preserve">Produce eleven.</title>
