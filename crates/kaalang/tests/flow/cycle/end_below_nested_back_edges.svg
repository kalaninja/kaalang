      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Finish with seven.</tspan></text>
    </g>
    <g class="node case" transform="translate(1720 421)">
      <title xml:space="preserve">Finish with nine.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Finish with nine.</tspan></text>
    </g>
    <g class="node select" transform="translate(280 700)">
