      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Which inner route?</tspan></text>
    </g>
    <g class="node case" transform="translate(280 843)">
      <title xml:space="preserve">Repeat the inner cycle.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Repeat the inner cycle.</tspan></text>
    </g>
    <g class="node case" transform="translate(640 843)">
      <title xml:space="preserve">Repeat the outer cycle.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Repeat the outer cycle.</tspan></text>
    </g>
    <g class="node case" transform="translate(1000 843)">
