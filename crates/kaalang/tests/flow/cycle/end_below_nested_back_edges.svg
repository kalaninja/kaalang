<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1616" viewBox="0 0 1920 1616" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for end_below_nested_back_edges</title>
  <desc id="kaalang-description">Cycles: Choose an outer route until one produces a result. with inputs mut mode and outputs selected; Choose an inner route until one completes. with inputs enter, mut mode and outputs inner_result. Nodes: Start: - end_below_nested_back_edges with parameters mut mode: u8 handing over mut mode; Select: Which outer route? capturing mode; Case: Enter the inner cycle. handing over enter; Case: Finish with seven. handing over seven; Case: Finish with nine. handing over nine; Select: Which inner route? capturing &amp;mode; Case: Repeat the inner cycle. handing over repeat; Case: Repeat the outer cycle. handing over leave; Case: Finish with eleven. handing over eleven; Action: Advance to the next route. capturing repeat, &amp;mut mode; Action: Continue with the outer cycle. capturing leave handing over inner_result; Action: Produce eleven. capturing eleven handing over inner_result; Question: Did the inner cycle produce a result? capturing &amp;inner_result handing over repeat_outer / finish_inner; Action: Extract the inner result. capturing finish_inner, inner_result handing over selected; Action: Produce seven. capturing seven handing over selected; Action: Produce nine. capturing nine handing over selected; End: u8 capturing selected; Merge: inner_result; Merge: selected. Connections: Start: - end_below_nested_back_edges to the entry of the cycle; Select: Which outer route? to Case: Enter the inner cycle.; Select: Which outer route? to Case: Finish with seven.; Select: Which outer route? to Case: Finish with nine.; Case: Enter the inner cycle. to the entry of the cycle; Case: Finish with seven. to Action: Produce seven.; Case: Finish with nine. to Action: Produce nine.; Select: Which inner route? to Case: Repeat the inner cycle.; Select: Which inner route? to Case: Repeat the outer cycle.; Select: Which inner route? to Case: Finish with eleven.; Case: Repeat the inner cycle. to Action: Advance to the next route.; Case: Repeat the outer cycle. to Action: Continue with the outer cycle.; Case: Finish with eleven. to Action: Produce eleven.; Action: Advance to the next route. to the iteration tail of the cycle; Action: Continue with the outer cycle. to the inner_result merge at the cycle result; Action: Produce eleven. to the inner_result merge at the cycle result; Question: Did the inner cycle produce a result? branch 1 to the iteration tail of the cycle; Question: Did the inner cycle produce a result? branch 2 to Action: Extract the inner result.; Action: Extract the inner result. to the selected merge at the cycle result; Action: Produce seven. to the selected merge at the cycle result; Action: Produce nine. to the selected merge at the cycle result; the inner_result merge at the cycle result to Question: Did the inner cycle produce a result?; the selected merge at the cycle result to End: u8; the entry of the cycle to Select: Which outer route?; the entry of the cycle to Select: Which inner route?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
      .cycle-caption .md-math { color: #166534; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
