    <text class="cycle-caption" x="1876" y="149" text-anchor="end" xml:space="preserve"><tspan x="1876" dy="0">Choose an outer route until one produces a result.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Choose an inner route until one completes.</title>
