      M 1000 1450 L 1000 1526
      M 280 170 L 280 242
      M 280 560 L 280 664
    "/>
    <path class="connection" d="
      M 280 1090 L 120 1090 L 120 560 L 280 560
    " marker-end="url(#back-edge-arrow)"/>
    <path class="connection" d="
      M 640 1342 L 60 1342 L 60 170 L 280 170
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="653" y="1108" xml:space="preserve"><tspan x="653" dy="0">inner_result</tspan></text>
    <text class="connection-label code" x="1013" y="1468" xml:space="preserve"><tspan x="1013" dy="0">selected</tspan></text>
    <text class="connection-label code" x="1373" y="517" xml:space="preserve"><tspan x="1373" dy="0">seven</tspan></text>
    <text class="connection-label code" x="1733" y="517" xml:space="preserve"><tspan x="1733" dy="0">nine</tspan></text>
    <text class="connection-label code" x="653" y="939" xml:space="preserve"><tspan x="653" dy="0">leave</tspan></text>
    <text class="connection-label code" x="1013" y="939" xml:space="preserve"><tspan x="1013" dy="0">eleven</tspan></text>
    <text class="connection-label code" x="293" y="116" xml:space="preserve"><tspan x="293" dy="0">mut mode</tspan></text>
    <text class="connection-label code" x="293" y="474" xml:space="preserve"><tspan x="293" dy="0">enter</tspan></text>
    <text class="connection-label code" x="293" y="896" xml:space="preserve"><tspan x="293" dy="0">repeat</tspan></text>
    <text class="connection-label code" x="653" y="1256" xml:space="preserve"><tspan x="653" dy="0">repeat_outer</tspan></text>
    <text class="connection-label code" x="793" y="1220" xml:space="preserve"><tspan x="793" dy="0">finish_inner</tspan></text>
    <text class="connection-label code" x="293" y="231" xml:space="preserve"><tspan x="293" dy="0">mode</tspan></text>
    <text class="connection-label code" x="293" y="653" xml:space="preserve"><tspan x="293" dy="0">&amp;mode</tspan></text>
    <text class="connection-label code" x="293" y="939" xml:space="preserve"><tspan x="293" dy="0">repeat, &amp;mut mode</tspan></text>
    <text class="connection-label code" x="653" y="1155" xml:space="preserve"><tspan x="653" dy="0">&amp;inner_result</tspan></text>
    <text class="connection-label code" x="1013" y="1299" xml:space="preserve"><tspan x="1013" dy="0">finish_inner, inner_result</tspan></text>
  </g>
