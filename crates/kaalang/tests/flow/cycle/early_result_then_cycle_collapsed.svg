  <title id="kaalang-title">kaalang diagram for early_result_then_cycle</title>
  <desc id="kaalang-description">Nodes: Start: - early_result_then_cycle with parameters first: bool; mut count: usize handing over first, mut count; Cycle: Select an early result or continue. capturing first handing over early_result; Question: Was an early result selected? capturing &amp;early_result handing over finish_early / count_more; Action: Extract the early result. capturing finish_early, early_result handing over end; Cycle: Count to three. capturing count_more, mut count handing over end; End: usize capturing end; Merge: end. Connections: Start: - early_result_then_cycle to Cycle: Select an early result or continue.; Cycle: Select an early result or continue. to Question: Was an early result selected?; Question: Was an early result selected? branch 1 to Action: Extract the early result.; Question: Was an early result selected? branch 2 to Cycle: Count to three.; Action: Extract the early result. to the end merge; Cycle: Count to three. to the end merge; the end merge to End: usize.</desc>
