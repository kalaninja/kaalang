    <text class="connection-label code" x="1625" y="894" xml:space="preserve"><tspan x="1625" dy="0">retry, &amp;mut retries</tspan></text>
    <text class="connection-label code" x="545" y="1102" xml:space="preserve"><tspan x="545" dy="0">found</tspan></text>
    <text class="connection-label code" x="905" y="1102" xml:space="preserve"><tspan x="905" dy="0">missing</tspan></text>
    <text class="connection-label code" x="1265" y="1102" xml:space="preserve"><tspan x="1265" dy="0">gave_up</tspan></text>
  </g>
