<svg xmlns="http://www.w3.org/2000/svg" width="752" height="684" viewBox="0 0 752 684" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for braced_continue_with_semicolon</title>
  <desc id="kaalang-description">Cycles: Count down. with inputs mut remaining and outputs done. Nodes: Start: braced_continue_with_semicolon with parameters mut remaining: usize handing over mut remaining; Question: Is there another step? capturing &amp;remaining handing over again / done; Action: Count down one step. capturing again, &amp;mut remaining; End: usize capturing remaining. Connections: Start: braced_continue_with_semicolon to the entry of the cycle; Question: Is there another step? branch 1 to Action: Count down one step.; Question: Is there another step? branch 2 to End: usize; Action: Count down one step. to the iteration tail of the cycle; the entry of the cycle to Question: Is there another step?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count down.</title>
    <rect class="cycle-boundary" x="32" y="135" width="403" height="422" rx="12"/>
    <text class="cycle-caption" x="423" y="149" text-anchor="end" xml:space="preserve"><tspan x="423" dy="0">Count down.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 98 L 220 170
      M 220 314 L 220 386
      M 360 278 L 580 278 L 580 594
      M 220 450 L 220 522
      M 220 170 L 220 242
    "/>
    <path class="connection" d="
      M 220 522 L 60 522 L 60 170 L 220 170
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="233" y="116" xml:space="preserve"><tspan x="233" dy="0">mut remaining</tspan></text>
    <text class="connection-label code" x="233" y="332" xml:space="preserve"><tspan x="233" dy="0">again</tspan></text>
    <text class="connection-label code" x="373" y="296" xml:space="preserve"><tspan x="373" dy="0">done</tspan></text>
    <text class="connection-label code" x="233" y="231" xml:space="preserve"><tspan x="233" dy="0">&amp;remaining</tspan></text>
    <text class="connection-label code" x="233" y="375" xml:space="preserve"><tspan x="233" dy="0">again, &amp;mut remaining</tspan></text>
    <text class="connection-label code" x="593" y="583" xml:space="preserve"><tspan x="593" dy="0">remaining</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 65 L 456 65"/>
    <g class="parameter-panel" transform="translate(576 65)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label code" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut remaining: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(220 65)">
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="33"/>
      <text class="label code" y="-3" xml:space="preserve"><tspan x="0" dy="0">braced_continue_with_semicol</tspan><tspan x="0" dy="18">on</tspan></text>
    </g>
    <g class="node question" transform="translate(220 278)">
      <title xml:space="preserve">Is there another step?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is there another step?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 418)">
      <title xml:space="preserve">Count down one step.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count down one step.</tspan></text>
    </g>
    <g class="node end" transform="translate(580 623)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
