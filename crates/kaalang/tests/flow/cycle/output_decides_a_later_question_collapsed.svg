  <desc id="kaalang-description">Nodes: Start: output_decides_a_later_question with parameters mut values: Vec&lt;i32&gt; handing over mut values; Cycle: Take the next positive value. capturing mut values handing over positive / empty; Question: Is the positive value large? capturing &amp;positive handing over large / small; Action: Cap the large value. capturing large, positive handing over result; Action: Keep the small value. capturing small, positive handing over result; Action: Report nothing found. capturing empty handing over result; End: i32 capturing result; Merge: result. Connections: Start: output_decides_a_later_question to Cycle: Take the next positive value.; Cycle: Take the next positive value. output positive to Question: Is the positive value large?; Cycle: Take the next positive value. output empty to Action: Report nothing found.; Question: Is the positive value large? branch 1 to Action: Cap the large value.; Question: Is the positive value large? branch 2 to Action: Keep the small value.; Action: Cap the large value. to the result merge; Action: Keep the small value. to the result merge; Action: Report nothing found. to the result merge; the result merge to End: i32.</desc>
