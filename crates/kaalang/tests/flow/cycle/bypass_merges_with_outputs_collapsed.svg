<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1024" viewBox="0 0 1424 1024" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for bypass_merges_with_outputs</title>
  <desc id="kaalang-description">Nodes: Start: bypass_merges_with_outputs with parameters cached: bool; response: u8; mut retries: u8 handing over cached, response, mut retries; Question: Is the record cached? capturing cached handing over hit_cache / query; Cycle: Query the source until it answers or the retries run out. capturing query, response, mut retries handing over found / missing / gave_up; Action: Use the cached record. capturing hit_cache handing over record; Action: Use the fetched record. capturing found handing over record; Action: Use an empty record. capturing missing handing over record; Action: Format the record. capturing record handing over answer; Action: Report that the source gave up. capturing gave_up handing over answer; End: u8 capturing answer; Merge: record; Merge: answer. Connections: Start: bypass_merges_with_outputs to Question: Is the record cached?; Question: Is the record cached? branch 1 to Action: Use the cached record.; Question: Is the record cached? branch 2 to Cycle: Query the source until it answers or the retries run out.; Cycle: Query the source until it answers or the retries run out. output found to Action: Use the fetched record.; Cycle: Query the source until it answers or the retries run out. output missing to Action: Use an empty record.; Cycle: Query the source until it answers or the retries run out. output gave_up to Action: Report that the source gave up.; Action: Use the cached record. to the record merge; Action: Use the fetched record. to the record merge; Action: Use an empty record. to the record merge; Action: Format the record. to the answer merge; Action: Report that the source gave up. to the answer merge; the record merge to Action: Format the record.; the answer merge to End: u8.</desc>
