  <title id="kaalang-title">kaalang diagram for run_choice_with_shadowing</title>
  <desc id="kaalang-description">Nodes: Start: run_choice_with_shadowing with parameters value: i32; selected: Option&lt;i32&gt; handing over value, selected; Select: Was a value selected? capturing &amp;value, selected; Case: A value was selected. handing over selected_value; Case: No value was selected. handing over absent; Action: Produce the selected pair. capturing selected_value, value handing over result; Action: Produce the fallback pair. capturing absent, value handing over result; End: (i32, i32) capturing result. Connections: Start: run_choice_with_shadowing to Select: Was a value selected?; Select: Was a value selected? to Case: A value was selected.; Select: Was a value selected? to Case: No value was selected.; Case: A value was selected. to Action: Produce the selected pair.; Case: No value was selected. to Action: Produce the fallback pair.; Action: Produce the selected pair. to the result merge; Action: Produce the fallback pair. to the result merge; the result merge to End: (i32, i32).</desc>
