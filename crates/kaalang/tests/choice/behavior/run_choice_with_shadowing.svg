<svg xmlns="http://www.w3.org/2000/svg" width="704" height="762" viewBox="0 0 704 762" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for run_choice_with_shadowing</title>
  <desc id="kaalang-description">Nodes: Start: run_choice_with_shadowing with parameters value: i32; selected: Option&lt;i32&gt; handing over value, selected; Select: Was a value selected? capturing &amp;value, selected; Case: A value was selected. handing over selected_value; Case: No value was selected. handing over absent; Action: Produce the selected pair. capturing selected_value, value handing over end; Action: Produce the fallback pair. capturing absent, value handing over end; End: (i32, i32) capturing end; Merge: end. Connections: Start: run_choice_with_shadowing to Select: Was a value selected?; Select: Was a value selected? to Case: A value was selected.; Select: Was a value selected? to Case: No value was selected.; Case: A value was selected. to Action: Produce the selected pair.; Case: No value was selected. to Action: Produce the fallback pair.; Action: Produce the selected pair. to the end merge; Action: Produce the fallback pair. to the end merge; the end merge to End: (i32, i32).</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 242 L 172 314
      M 300 206 L 532 206 L 532 314
      M 172 384 L 172 456
      M 532 384 L 532 456
      M 172 520 L 172 596
      M 532 520 L 532 596 L 172 596
      M 172 596 L 172 672
    "/>
    <text class="connection-label" x="185" y="614" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">value, selected</tspan></text>
    <text class="connection-label" x="185" y="402" xml:space="preserve"><tspan x="185" dy="0">selected_value</tspan></text>
    <text class="connection-label" x="545" y="402" xml:space="preserve"><tspan x="545" dy="0">absent</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">&amp;value, selected</tspan></text>
    <text class="connection-label" x="185" y="445" xml:space="preserve"><tspan x="185" dy="0">selected_value, value</tspan></text>
    <text class="connection-label" x="545" y="445" xml:space="preserve"><tspan x="545" dy="0">absent, value</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">value: i32</tspan><tspan x="-104" dy="18">selected: Option&lt;i32&gt;</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 596)">
      <title xml:space="preserve">the end merge</title>
