      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the selected pair.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 488)">
      <title xml:space="preserve">Produce the fallback pair.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the fallback pair.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 701)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(i32, i32)</tspan></text>
    </g>
  </g>
</svg>
