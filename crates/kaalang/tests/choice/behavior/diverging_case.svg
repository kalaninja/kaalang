      <polygon class="node-shape" points="-120,-41 120,-41 120,23 0,41 -120,23"/>
      <text class="label" y="-12" xml:space="preserve"><tspan x="0" dy="0">No reading, which the sensor </tspan><tspan x="0" dy="18">rules out.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 493)">
