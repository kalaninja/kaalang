      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Did the sensor answer?</tspan></text>
    </g>
    <g class="node case" transform="translate(172 347)">
