      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the reading.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 493)">
      <title xml:space="preserve">Never reached: the match arm panics first.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Never reached: the match arm </tspan><tspan x="-124" dy="18">panics first.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 707)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
    </g>
  </g>
</svg>
