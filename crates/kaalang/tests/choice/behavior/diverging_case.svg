      <polygon class="node-shape" points="-120,-41 120,-41 120,23 0,41 -120,23"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">A reading.</tspan></text>
    </g>
    <g class="node case" transform="translate(532 347)">
