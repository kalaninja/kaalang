<svg xmlns="http://www.w3.org/2000/svg" width="704" height="768" viewBox="0 0 704 768" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for diverging_case</title>
  <desc id="kaalang-description">Nodes: Start: diverging_case with parameters reading: Option&lt;u8&gt; handing over reading; Select: Did the sensor answer? capturing reading; Case: A reading. handing over answered; Case: No reading, which the sensor rules out. handing over silent; Action: Use the reading. capturing answered handing over level; Action: Never reached: the match arm panics first. capturing silent handing over level; End: u8 capturing level; Merge: level. Connections: Start: diverging_case to Select: Did the sensor answer?; Select: Did the sensor answer? to Case: A reading.; Select: Did the sensor answer? to Case: No reading, which the sensor rules out.; Case: A reading. to Action: Use the reading.; Case: No reading, which the sensor rules out. to Action: Never reached: the match arm panics first.; Action: Use the reading. to the level merge; Action: Never reached: the match arm panics first. to the level merge; the level merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 234 L 172 306
      M 300 198 L 532 198 L 532 306
      M 172 388 L 172 460
      M 532 388 L 532 460
      M 172 526 L 172 602
      M 532 526 L 532 602 L 172 602
      M 172 602 L 172 678
    "/>
    <text class="connection-label" x="185" y="620" xml:space="preserve"><tspan x="185" dy="0">level</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">reading</tspan></text>
    <text class="connection-label" x="185" y="449" xml:space="preserve"><tspan x="185" dy="0">answered</tspan></text>
    <text class="connection-label" x="545" y="449" xml:space="preserve"><tspan x="545" dy="0">silent</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">reading: Option&lt;u8&gt;</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 602)">
      <title xml:space="preserve">the level merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">diverging_case</tspan></text>
    </g>
    <g class="node select" transform="translate(172 198)">
