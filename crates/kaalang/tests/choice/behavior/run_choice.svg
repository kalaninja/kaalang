  <desc id="kaalang-description">Nodes: Start: run_choice with parameters value: i32; branch_action_count: &amp;mut usize handing over value, branch_action_count; Select: What is the sign of the value? capturing value; Case: The value is negative. handing over negative; Case: The value is zero. handing over zero; Case: The value is positive. handing over positive; Action: Produce the negative result. capturing negative, branch_action_count handing over result; Action: Produce the zero result. capturing zero, branch_action_count handing over result; Action: Produce the positive result. capturing positive, branch_action_count handing over result; End: &amp;&apos;static str capturing result. Connections: Start: run_choice to Select: What is the sign of the value?; Select: What is the sign of the value? to Case: The value is negative.; Select: What is the sign of the value? to Case: The value is zero.; Select: What is the sign of the value? to Case: The value is positive.; Case: The value is negative. to Action: Produce the negative result.; Case: The value is zero. to Action: Produce the zero result.; Case: The value is positive. to Action: Produce the positive result.; Action: Produce the negative result. to the result merge; Action: Produce the zero result. to the result merge; Action: Produce the positive result. to the result merge; the result merge to End: &amp;&apos;static str.</desc>
