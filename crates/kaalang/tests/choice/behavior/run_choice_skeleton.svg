  <desc id="kaalang-description">Nodes: Start: run_choice_skeleton with parameters value: i32 handing over value; Select: What is the sign of the value? capturing value; Case: The value is negative. handing over negative; Case: The value is nonnegative. handing over nonnegative; Action: Produce the negative result. capturing negative handing over end; Action: Produce the nonnegative result. capturing nonnegative handing over end; End: &amp;&apos;static str capturing end; Merge: end. Connections: Start: run_choice_skeleton to Select: What is the sign of the value?; Select: What is the sign of the value? to Case: The value is negative.; Select: What is the sign of the value? to Case: The value is nonnegative.; Case: The value is negative. to Action: Produce the negative result.; Case: The value is nonnegative. to Action: Produce the nonnegative result.; Action: Produce the negative result. to the end merge; Action: Produce the nonnegative result. to the end merge; the end merge to End: &amp;&apos;static str.</desc>
