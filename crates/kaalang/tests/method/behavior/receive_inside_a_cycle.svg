<svg xmlns="http://www.w3.org/2000/svg" width="752" height="684" viewBox="0 0 752 684" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for receive_inside_a_cycle</title>
  <desc id="kaalang-description">Cycles: Climb to the top. with inputs &amp;self, mut start and outputs reached. Nodes: Start: receive_inside_a_cycle with parameters &amp;self; start: u32 handing over self, start; Question: Is the rung below the top? capturing &amp;start, &amp;self handing over climb / arrived described as branch 1: YES / branch 2: NO; Action: Step up one rung. capturing climb, &amp;mut start; End: u32 capturing reached. Connections: Start: receive_inside_a_cycle to the entry of the cycle; Question: Is the rung below the top? branch 1 to Action: Step up one rung.; Question: Is the rung below the top? branch 2 to End: u32; Action: Step up one rung. to the iteration tail of the cycle; the entry of the cycle to Question: Is the rung below the top?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Climb to the top.</title>
    <rect class="cycle-boundary" x="32" y="135" width="393" height="422" rx="12"/>
    <text class="cycle-caption" x="413" y="149" text-anchor="end" xml:space="preserve"><tspan x="413" dy="0">Climb to the top.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 94 L 220 170
      M 220 314 L 220 386
      M 360 278 L 580 278 L 580 594
      M 220 450 L 220 522
      M 220 170 L 220 242
    "/>
    <path class="connection" d="
      M 220 522 L 60 522 L 60 170 L 220 170
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="233" y="112" xml:space="preserve"><tspan x="233" dy="0">self, start</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="233" y="334" xml:space="preserve"><tspan x="233" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="373" y="266" xml:space="preserve"><tspan x="373" dy="0">NO</tspan></text>
    <text class="connection-label" x="233" y="231" xml:space="preserve"><tspan x="233" dy="0">&amp;start, &amp;self</tspan></text>
    <text class="connection-label" x="233" y="375" xml:space="preserve"><tspan x="233" dy="0">climb, &amp;mut start</tspan></text>
    <text class="connection-label" x="593" y="583" xml:space="preserve"><tspan x="593" dy="0">reached</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 65 L 456 65"/>
    <g class="parameter-panel" transform="translate(576 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">&amp;self</tspan><tspan x="-104" dy="18">start: u32</tspan></text>
    </g>
    <g class="node start" transform="translate(220 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">receive_inside_a_cycle</tspan></text>
    </g>
    <g class="node question" transform="translate(220 278)">
      <title xml:space="preserve">Is the rung below the top?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the rung below the top?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 418)">
      <title xml:space="preserve">Step up one rung.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Step up one rung.</tspan></text>
    </g>
    <g class="node end" transform="translate(580 623)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
