  <title id="kaalang-title">kaalang diagram for split_nested_tuple</title>
  <desc id="kaalang-description">Nodes: Start: split_nested_tuple with parameters input: u32 handing over input; Action: Build two outputs, including a tuple. capturing input handing over out1, out2; Action: Produce the result pair. capturing out1, out2 handing over result; End: ((u32, u32), u32) capturing result. Connections: Start: split_nested_tuple to Action: Build two outputs, including a tuple.; Action: Build two outputs, including a tuple. to Action: Produce the result pair.; Action: Produce the result pair. to End: ((u32, u32), u32).</desc>
