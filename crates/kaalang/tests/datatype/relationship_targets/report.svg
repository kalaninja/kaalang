<svg xmlns="http://www.w3.org/2000/svg" width="933" height="264" viewBox="0 0 933 264" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Report&lt;&apos;a&gt;</title>
  <desc id="kaalang-description">Type Report&lt;&apos;a&gt;.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card focus">
      <title xml:space="preserve">Report&lt;&apos;a&gt;</title>
      <rect class="card-shape" x="32" y="32" width="869" height="200"/>
      <path class="card-rules" d="M 32 102 L 901 102 M 209 102 L 209 232 M 337 102 L 337 232 M 525 102 L 525 232 M 713 102 L 713 232"/>
      <rect class="card-outline" x="32" y="32" width="869" height="200"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Report&lt;&apos;a&gt;</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="887" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A report with its assigned participants.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="122.28" text-anchor="middle">−</text>
        <text x="58" y="123" text-anchor="start" xml:space="preserve"> revision</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">u32</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="46" dy="0">The current revision.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="229" y="122.28" text-anchor="middle">−</text>
        <text x="235" y="123" text-anchor="start" xml:space="preserve"> author</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="223" dy="0">&amp;&apos;a Member</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="223" dy="0">The author.</tspan></text>
      <text class="target" text-anchor="end" y="221" xml:space="preserve"><tspan x="323" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="357" y="122.28" text-anchor="middle">−</text>
        <text x="363" y="123" text-anchor="start" xml:space="preserve"> assignee</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="351" dy="0">MemberId</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="351" dy="0">The assignee, </tspan><tspan x="351" dy="18">resolved through the </tspan><tspan x="351" dy="18">directory.</tspan></text>
      <text class="target" text-anchor="end" y="221" xml:space="preserve"><tspan x="511" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="545" y="122.28" text-anchor="middle">−</text>
        <text x="551" y="123" text-anchor="start" xml:space="preserve"> delegate</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="539" dy="0">Option&lt;MemberId&gt;</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="539" dy="0">An optional delegate, </tspan><tspan x="539" dy="18">resolved through the </tspan><tspan x="539" dy="18">directory.</tspan></text>
      <text class="target" text-anchor="end" y="221" xml:space="preserve"><tspan x="699" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="733" y="122.28" text-anchor="middle">−</text>
        <text x="739" y="123" text-anchor="start" xml:space="preserve"> contributors</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="727" dy="0">Vec&lt;MemberId&gt;</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="727" dy="0">Contributors in the </tspan><tspan x="727" dy="18">order of their keys.</tspan></text>
      <text class="target" text-anchor="end" y="221" xml:space="preserve"><tspan x="887" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
    </g>
  </g>
  <g class="relationships">
  </g>
</svg>
