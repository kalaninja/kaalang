        <text x="782" y="179" text-anchor="start" xml:space="preserve"> others</text>
      </g>
      <text class="field-type" y="195" xml:space="preserve"><tspan x="770" dy="0">Vec&lt;MemberId&gt;</tspan></text>
      <text class="description" y="181" xml:space="preserve"><tspan x="882" dy="0">The keys of the other </tspan><tspan x="882" dy="18">members.</tspan></text>
      <text class="target" text-anchor="end" y="221" xml:space="preserve"><tspan x="1089" dy="0">▸ <tspan class="md-code">super::MemberId</tspan></tspan></text>
    </g>
    <g class="card focus">
