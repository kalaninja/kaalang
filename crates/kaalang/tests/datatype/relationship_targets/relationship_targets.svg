      <text class="description" y="413" xml:space="preserve"><tspan x="550" dy="0">Contributors in the </tspan><tspan x="550" dy="18">order of their keys.</tspan></text>
      <text class="target" text-anchor="end" y="453" xml:space="preserve"><tspan x="710" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
    </g>
