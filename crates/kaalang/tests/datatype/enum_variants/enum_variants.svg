      <rect class="card-groove" x="32" y="302" width="345" height="20"/>
      <rect class="card-groove" x="32" y="468" width="345" height="20"/>
      <path class="card-rules" d="M 32 102 L 377 102 M 32 136 L 377 136 M 32 156 L 377 156 M 32 190 L 377 190 M 189 190 L 189 302 M 32 302 L 377 302 M 32 322 L 377 322 M 32 356 L 377 356 M 186 356 L 186 468 M 32 468 L 377 468"/>
