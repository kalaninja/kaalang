        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Approval&lt;&apos;a&gt;</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="363" dy="0">enum</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">Who may approve a change.</tspan></text>
      <text class="variant-name" y="125" xml:space="preserve"><tspan x="46" dy="0">Open</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="92" dy="0">Anyone may approve.</tspan></text>
      <text class="variant-name" y="179" xml:space="preserve"><tspan x="46" dy="0">Named</tspan></text>
      <text class="field-name" y="211" xml:space="preserve"><tspan x="46" dy="0">0</tspan></text>
      <text class="field-type" y="227" xml:space="preserve"><tspan x="46" dy="0">&amp;&apos;a Member</tspan></text>
      <text class="description" y="251" xml:space="preserve"><tspan x="46" dy="0">The only approver.</tspan></text>
      <text class="target" text-anchor="end" y="291" xml:space="preserve"><tspan x="175" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <text class="field-name" y="211" xml:space="preserve"><tspan x="203" dy="0">1</tspan></text>
      <text class="field-type" y="227" xml:space="preserve"><tspan x="203" dy="0">Option&lt;&amp;&apos;a Member&gt;</tspan></text>
      <text class="description" y="251" xml:space="preserve"><tspan x="203" dy="0">A deputy who may </tspan><tspan x="203" dy="18">stand in.</tspan></text>
      <text class="target" text-anchor="end" y="291" xml:space="preserve"><tspan x="363" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <text class="variant-name" y="345" xml:space="preserve"><tspan x="46" dy="0">Quorum</tspan></text>
      <text class="description" y="345" xml:space="preserve"><tspan x="110" dy="0">A number of members must agree.</tspan></text>
      <text class="field-name" y="377" xml:space="preserve"><tspan x="46" dy="0">votes</tspan></text>
      <text class="field-type" y="393" xml:space="preserve"><tspan x="46" dy="0">u8</tspan></text>
      <text class="description" y="417" xml:space="preserve"><tspan x="46" dy="0">The votes needed.</tspan></text>
      <text class="field-name" y="377" xml:space="preserve"><tspan x="200" dy="0">voters</tspan></text>
      <text class="field-type" y="393" xml:space="preserve"><tspan x="200" dy="0">Vec&lt;&amp;&apos;a Member&gt;</tspan></text>
      <text class="description" y="417" xml:space="preserve"><tspan x="200" dy="0">The members who </tspan><tspan x="200" dy="18">may vote.</tspan></text>
      <text class="target" text-anchor="end" y="457" xml:space="preserve"><tspan x="363" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
