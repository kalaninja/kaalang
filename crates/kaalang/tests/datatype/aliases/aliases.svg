<svg xmlns="http://www.w3.org/2000/svg" width="851" height="524" viewBox="0 0 851 524" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for RevisionDetails</title>
  <desc id="kaalang-description">Type RevisionDetails with incoming types History, Article.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">History</title>
      <rect class="card-shape" x="32" y="32" width="352" height="144"/>
      <path class="card-rules" d="M 32 102 L 384 102"/>
      <rect class="card-outline" x="32" y="32" width="352" height="144"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> History</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="370" dy="0">type alias</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">An ordered sequence of earlier descriptions.</tspan></text>
      <text class="field-type" y="123" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;RevisionDetails&gt;</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="210" dy="0">Earlier descriptions </tspan><tspan x="210" dy="18">in revision order.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="370" dy="0">▸ <tspan class="md-code">RevisionDetails</tspan></tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Article</title>
      <rect class="card-shape" x="416" y="32" width="375" height="310"/>
      <path class="card-rules" d="M 416 120 L 791 120 M 416 194 L 791 194 M 416 268 L 791 268"/>
      <rect class="card-outline" x="416" y="32" width="375" height="310"/>
      <g class="type-name">
        <text class="md-badge" x="439" y="62.92" text-anchor="middle">−</text>
        <text x="448" y="64" text-anchor="start" xml:space="preserve"> Article</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="777" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="430" dy="0">An article with its current and earlier </tspan><tspan x="430" dy="18">descriptions.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="436" y="140.28" text-anchor="middle">−</text>
        <text x="442" y="141" text-anchor="start" xml:space="preserve"> current</text>
      </g>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="430" dy="0">CurrentDetails</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="617" dy="0">The current </tspan><tspan x="617" dy="18">description.</tspan></text>
      <text class="target" text-anchor="end" y="183" xml:space="preserve"><tspan x="777" dy="0">▸ <tspan class="md-code">CurrentDetails</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="436" y="214.28" text-anchor="middle">−</text>
        <text x="442" y="215" text-anchor="start" xml:space="preserve"> history</text>
      </g>
      <text class="field-type" y="231" xml:space="preserve"><tspan x="430" dy="0">History</tspan></text>
      <text class="description" y="217" xml:space="preserve"><tspan x="617" dy="0">The article&apos;s revision </tspan><tspan x="617" dy="18">history.</tspan></text>
      <text class="target" text-anchor="end" y="257" xml:space="preserve"><tspan x="777" dy="0">▸ <tspan class="md-code">History</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="436" y="288.28" text-anchor="middle">−</text>
        <text x="442" y="289" text-anchor="start" xml:space="preserve"> last_seen</text>
      </g>
      <text class="field-type" y="305" xml:space="preserve"><tspan x="430" dy="0">Option&lt;RevisionDetails&gt;</tspan></text>
      <text class="description" y="291" xml:space="preserve"><tspan x="617" dy="0">The revision readers </tspan><tspan x="617" dy="18">saw last.</tspan></text>
      <text class="target" text-anchor="end" y="331" xml:space="preserve"><tspan x="777" dy="0">▸ <tspan class="md-code">RevisionDetails</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">RevisionDetails</title>
      <rect class="card-shape" x="32" y="390" width="787" height="102"/>
      <path class="card-rules" d="M 32 460 L 819 460"/>
      <rect class="card-outline" x="32" y="390" width="787" height="102"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="420.92" text-anchor="middle">−</text>
        <text x="64" y="422" text-anchor="start" xml:space="preserve"> RevisionDetails</text>
      </g>
      <text class="type-kind" text-anchor="end" y="422" xml:space="preserve"><tspan x="805" dy="0">type alias</tspan></text>
      <text class="description" y="445" xml:space="preserve"><tspan x="46" dy="0">The description retained for an earlier revision.</tspan></text>
      <text class="field-type" y="481" xml:space="preserve"><tspan x="46" dy="0">Details</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">History → RevisionDetails</title>
      <path class="relationship" d="M 384 160 L 398 160 L 398 390" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="384" cy="160" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Article → RevisionDetails</title>
      <path class="relationship" d="M 791 326 L 805 326 L 805 390" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="791" cy="326" r="4"/>
    </g>
  </g>
</svg>
