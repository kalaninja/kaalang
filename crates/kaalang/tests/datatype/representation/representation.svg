<svg xmlns="http://www.w3.org/2000/svg" width="705" height="522" viewBox="0 0 705 522" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Payload</title>
  <desc id="kaalang-description">Type Payload with incoming types Selection, Handle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Selection</title>
      <rect class="card-shape" x="32" y="32" width="303" height="144"/>
      <path class="card-rules" d="M 32 102 L 335 102"/>
      <rect class="card-outline" x="32" y="32" width="303" height="144"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="46" dy="0">Selection</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="321" dy="0">struct · repr(transparent)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A selected payload, by its index.</tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="46" dy="0">index</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">usize</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="99" dy="0">The selected payload, resolved </tspan><tspan x="99" dy="18">by index.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="321" dy="0">▸ <tspan class="md-code">Payload</tspan></tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Handle</title>
      <rect class="card-shape" x="367" y="32" width="278" height="196"/>
      <path class="card-rules" d="M 367 102 L 645 102 M 367 176 L 645 176"/>
      <rect class="card-outline" x="367" y="32" width="278" height="196"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="381" dy="0">Handle</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="631" dy="0">struct · repr(C, packed)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="381" dy="0">A compact handle to a payload.</tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="381" dy="0">slot</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="381" dy="0">u16</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="471" dy="0">The payload in this </tspan><tspan x="471" dy="18">slot.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="631" dy="0">▸ <tspan class="md-code">Payload</tspan></tspan></text>
      <text class="field-name" y="197" xml:space="preserve"><tspan x="381" dy="0">generation</tspan></text>
      <text class="field-type" y="213" xml:space="preserve"><tspan x="381" dy="0">u8</tspan></text>
      <text class="description" y="199" xml:space="preserve"><tspan x="471" dy="0">The generation of the </tspan><tspan x="471" dy="18">slot.</tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Payload</title>
      <rect class="card-shape" x="32" y="276" width="641" height="214"/>
      <path class="card-rules" d="M 32 346 L 673 346 M 32 418 L 673 418"/>
      <rect class="card-outline" x="32" y="276" width="641" height="214"/>
      <text class="type-name" y="308" xml:space="preserve"><tspan x="46" dy="0">Payload</tspan></text>
      <text class="type-kind" text-anchor="end" y="308" xml:space="preserve"><tspan x="659" dy="0">union · repr(C, align(16))</tspan></text>
      <text class="description" y="331" xml:space="preserve"><tspan x="46" dy="0">Overlapping word and byte views of shared storage.</tspan></text>
      <text class="field-name" y="367" xml:space="preserve"><tspan x="46" dy="0">word</tspan></text>
      <text class="field-type" y="383" xml:space="preserve"><tspan x="46" dy="0">u64</tspan></text>
      <text class="description" y="407" xml:space="preserve"><tspan x="46" dy="0">The payload as a word.</tspan></text>
      <text class="field-name" y="439" xml:space="preserve"><tspan x="46" dy="0">bytes</tspan></text>
      <text class="field-type" y="455" xml:space="preserve"><tspan x="46" dy="0">[u8; 8]</tspan></text>
      <text class="description" y="479" xml:space="preserve"><tspan x="46" dy="0">The payload as bytes.</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Selection → Payload</title>
      <path class="relationship" d="M 335 160 L 349 160 L 349 276" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="335" cy="160" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Handle → Payload</title>
      <path class="relationship" d="M 645 160 L 659 160 L 659 276" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="645" cy="160" r="4"/>
    </g>
  </g>
</svg>
