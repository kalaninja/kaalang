<svg xmlns="http://www.w3.org/2000/svg" width="355" height="464" viewBox="0 0 355 464" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for - Member</title>
  <desc id="kaalang-description">Type - Member with incoming types - Lookup.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">- Lookup</title>
      <rect class="card-shape" x="32" y="32" width="263" height="210"/>
      <path class="card-rules" d="M 32 120 L 295 120 M 32 194 L 295 194"/>
      <rect class="card-outline" x="32" y="32" width="263" height="210"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Lookup</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="281" dy="0">union · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A member key or its raw </tspan><tspan x="46" dy="18">number, in shared storage.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="140.28" text-anchor="middle">−</text>
        <text x="58" y="141" text-anchor="start" xml:space="preserve"> id</text>
      </g>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="46" dy="0">MemberId</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="121" dy="0">The member the key </tspan><tspan x="121" dy="18">names.</tspan></text>
      <text class="target" text-anchor="end" y="183" xml:space="preserve"><tspan x="281" dy="0">▸ <tspan class="md-code">Member</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="214.28" text-anchor="middle">−</text>
        <text x="58" y="215" text-anchor="start" xml:space="preserve"> raw</text>
      </g>
      <text class="field-type" y="231" xml:space="preserve"><tspan x="46" dy="0">u32</tspan></text>
      <text class="description" y="217" xml:space="preserve"><tspan x="121" dy="0">The key as a number.</tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">- Member</title>
      <rect class="card-shape" x="32" y="290" width="291" height="142"/>
      <path class="card-rules" d="M 32 360 L 323 360"/>
      <rect class="card-outline" x="32" y="290" width="291" height="142"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="320.92" text-anchor="middle">−</text>
        <text x="64" y="322" text-anchor="start" xml:space="preserve"> Member</text>
      </g>
      <text class="type-kind" text-anchor="end" y="322" xml:space="preserve"><tspan x="309" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="345" xml:space="preserve"><tspan x="46" dy="0">A member of the directory.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="380.28" text-anchor="middle">−</text>
        <text x="58" y="381" text-anchor="start" xml:space="preserve"> id</text>
      </g>
      <text class="field-type" y="397" xml:space="preserve"><tspan x="46" dy="0">MemberId</tspan></text>
      <text class="description" y="421" xml:space="preserve"><tspan x="46" dy="0">The member&apos;s key.</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">- Lookup → - Member</title>
      <path class="relationship" d="M 295 178 L 309 178 L 309 290" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="295" cy="178" r="4"/>
    </g>
  </g>
</svg>
