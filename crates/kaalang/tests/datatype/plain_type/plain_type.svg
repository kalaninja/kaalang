<svg xmlns="http://www.w3.org/2000/svg" width="367" height="400" viewBox="0 0 367 400" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Timestamp</title>
  <desc id="kaalang-description">Type Timestamp with incoming types Change.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Change</title>
      <rect class="card-shape" x="32" y="32" width="275" height="192"/>
      <path class="card-rules" d="M 32 102 L 307 102 M 32 176 L 307 176"/>
      <rect class="card-outline" x="32" y="32" width="275" height="192"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Change</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="293" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A change saved to a document.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="122.28" text-anchor="middle">−</text>
        <text x="58" y="123" text-anchor="start" xml:space="preserve"> saved</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">Timestamp</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="133" dy="0">When the change was </tspan><tspan x="133" dy="18">saved.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="293" dy="0">▸ <tspan class="md-code">Timestamp</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="196.28" text-anchor="middle">−</text>
        <text x="58" y="197" text-anchor="start" xml:space="preserve"> summary</text>
      </g>
      <text class="field-type" y="213" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="199" xml:space="preserve"><tspan x="133" dy="0">What changed.</tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Timestamp</title>
      <rect class="card-shape" x="32" y="272" width="303" height="96"/>
      <path class="card-rules" d="M 32 320 L 335 320 M 183 320 L 183 368"/>
      <rect class="card-outline" x="32" y="272" width="303" height="96"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="302.92" text-anchor="middle">−</text>
        <text x="64" y="304" text-anchor="start" xml:space="preserve"> Timestamp</text>
      </g>
      <text class="type-kind" text-anchor="end" y="304" xml:space="preserve"><tspan x="321" dy="0">struct · repr(Rust)</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="340.28" text-anchor="middle">−</text>
        <text x="58" y="341" text-anchor="start" xml:space="preserve"> seconds</text>
      </g>
      <text class="field-type" y="357" xml:space="preserve"><tspan x="46" dy="0">u64</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="203" y="340.28" text-anchor="middle">−</text>
        <text x="209" y="341" text-anchor="start" xml:space="preserve"> nanos</text>
      </g>
      <text class="field-type" y="357" xml:space="preserve"><tspan x="197" dy="0">u32</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Change → Timestamp</title>
      <path class="relationship" d="M 307 160 L 321 160 L 321 272" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="307" cy="160" r="4"/>
    </g>
  </g>
</svg>
