        <text x="58" y="315" text-anchor="start" xml:space="preserve"> device</text>
      </g>
      <text class="field-type" y="331" xml:space="preserve"><tspan x="46" dy="0">Device</tspan></text>
      <text class="description" y="355" xml:space="preserve"><tspan x="46" dy="0">The device it opens.</tspan></text>
      <text class="target" text-anchor="end" y="377" xml:space="preserve"><tspan x="192" dy="0">▸ <tspan class="md-code">Device</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="226" y="314.28" text-anchor="middle">+</text>
        <text x="232" y="315" text-anchor="start" xml:space="preserve"> fd</text>
      </g>
      <text class="field-type" y="331" xml:space="preserve"><tspan x="220" dy="0">i32</tspan></text>
      <text class="description" y="355" xml:space="preserve"><tspan x="220" dy="0">The file descriptor.</tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Handle</title>
      <rect class="card-shape" x="32" y="420" width="349" height="164"/>
      <path class="card-rules" d="M 32 490 L 381 490 M 220 490 L 220 584"/>
      <rect class="card-outline" x="32" y="420" width="349" height="164"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="450.92" text-anchor="middle">+</text>
        <text x="64" y="452" text-anchor="start" xml:space="preserve"> Handle</text>
      </g>
      <text class="type-kind" text-anchor="end" y="452" xml:space="preserve"><tspan x="367" dy="0">struct · repr(Rust) · cfg(not(unix))</tspan></text>
      <text class="description" y="475" xml:space="preserve"><tspan x="46" dy="0">An open device on other systems.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="510.28" text-anchor="middle">+</text>
        <text x="58" y="511" text-anchor="start" xml:space="preserve"> device</text>
      </g>
      <text class="field-type" y="527" xml:space="preserve"><tspan x="46" dy="0">Device</tspan></text>
      <text class="description" y="551" xml:space="preserve"><tspan x="46" dy="0">The device it opens.</tspan></text>
      <text class="target" text-anchor="end" y="573" xml:space="preserve"><tspan x="206" dy="0">▸ <tspan class="md-code">Device</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="240" y="510.28" text-anchor="middle">+</text>
        <text x="246" y="511" text-anchor="start" xml:space="preserve"> raw</text>
      </g>
      <text class="field-type" y="527" xml:space="preserve"><tspan x="234" dy="0">isize</tspan></text>
      <text class="description" y="551" xml:space="preserve"><tspan x="234" dy="0">The raw handle.</tspan></text>
    </g>
