      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="283" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A session that holds a device </tspan><tspan x="46" dy="18">open.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="140.28" text-anchor="middle">+</text>
        <text x="58" y="141" text-anchor="start" xml:space="preserve"> handle</text>
      </g>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="46" dy="0">Handle</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="126" dy="0">The open device.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="283" dy="0">▸ <tspan class="md-code">Handle</tspan></tspan></text>
    </g>
    <g class="card focus">
