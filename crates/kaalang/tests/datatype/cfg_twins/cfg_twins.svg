<svg xmlns="http://www.w3.org/2000/svg" width="794" height="428" viewBox="0 0 794 428" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Device</title>
  <desc id="kaalang-description">Type Device with incoming types Handle, Handle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Handle</title>
      <rect class="card-shape" x="32" y="32" width="321" height="174"/>
      <path class="card-rules" d="M 32 102 L 353 102 M 32 158 L 353 158"/>
      <rect class="card-outline" x="32" y="32" width="321" height="174"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">+</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Handle</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="339" dy="0">struct · repr(Rust) · cfg(unix)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">An open device on Unix.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="122.28" text-anchor="middle">+</text>
        <text x="58" y="123" text-anchor="start" xml:space="preserve"> device</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">Device</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="126" dy="0">The device it opens.</tspan></text>
      <text class="target" text-anchor="end" y="147" xml:space="preserve"><tspan x="339" dy="0">▸ <tspan class="md-code">Device</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="178.28" text-anchor="middle">+</text>
        <text x="58" y="179" text-anchor="start" xml:space="preserve"> fd</text>
      </g>
      <text class="field-type" y="195" xml:space="preserve"><tspan x="46" dy="0">i32</tspan></text>
      <text class="description" y="181" xml:space="preserve"><tspan x="126" dy="0">The file descriptor.</tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Handle</title>
      <rect class="card-shape" x="385" y="32" width="349" height="174"/>
      <path class="card-rules" d="M 385 102 L 734 102 M 385 158 L 734 158"/>
      <rect class="card-outline" x="385" y="32" width="349" height="174"/>
      <g class="type-name">
        <text class="md-badge" x="408" y="62.92" text-anchor="middle">+</text>
        <text x="417" y="64" text-anchor="start" xml:space="preserve"> Handle</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="720" dy="0">struct · repr(Rust) · cfg(not(unix))</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="399" dy="0">An open device on other systems.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="405" y="122.28" text-anchor="middle">+</text>
        <text x="411" y="123" text-anchor="start" xml:space="preserve"> device</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="399" dy="0">Device</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="479" dy="0">The device it opens.</tspan></text>
      <text class="target" text-anchor="end" y="147" xml:space="preserve"><tspan x="720" dy="0">▸ <tspan class="md-code">Device</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="405" y="178.28" text-anchor="middle">+</text>
        <text x="411" y="179" text-anchor="start" xml:space="preserve"> raw</text>
      </g>
      <text class="field-type" y="195" xml:space="preserve"><tspan x="399" dy="0">isize</tspan></text>
      <text class="description" y="181" xml:space="preserve"><tspan x="479" dy="0">The raw handle.</tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Device</title>
      <rect class="card-shape" x="32" y="254" width="730" height="142"/>
      <path class="card-rules" d="M 32 324 L 762 324"/>
      <rect class="card-outline" x="32" y="254" width="730" height="142"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="284.92" text-anchor="middle">+</text>
        <text x="64" y="286" text-anchor="start" xml:space="preserve"> Device</text>
      </g>
      <text class="type-kind" text-anchor="end" y="286" xml:space="preserve"><tspan x="748" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="309" xml:space="preserve"><tspan x="46" dy="0">A device a session opens.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="344.28" text-anchor="middle">+</text>
        <text x="58" y="345" text-anchor="start" xml:space="preserve"> name</text>
      </g>
      <text class="field-type" y="361" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="385" xml:space="preserve"><tspan x="46" dy="0">The device&apos;s name.</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Handle → Device</title>
      <path class="relationship" d="M 353 142 L 367 142 L 367 254" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="353" cy="142" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Handle → Device</title>
      <path class="relationship" d="M 734 142 L 748 142 L 748 254" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="734" cy="142" r="4"/>
    </g>
  </g>
</svg>
