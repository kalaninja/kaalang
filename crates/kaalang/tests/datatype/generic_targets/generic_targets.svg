<svg xmlns="http://www.w3.org/2000/svg" width="440" height="398" viewBox="0 0 440 398" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for - Attachment&lt;T&gt;</title>
  <desc id="kaalang-description">Type - Attachment&lt;T&gt; with incoming types - Upload.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">- Upload</title>
      <rect class="card-shape" x="32" y="32" width="337" height="126"/>
      <path class="card-rules" d="M 32 102 L 369 102"/>
      <rect class="card-outline" x="32" y="32" width="337" height="126"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Upload</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="355" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">An upload waiting for review.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="122.28" text-anchor="middle">−</text>
        <text x="58" y="123" text-anchor="start" xml:space="preserve"> content</text>
      </g>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">Attachment&lt;Payload&gt;</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="203" dy="0">The uploaded content.</tspan></text>
      <text class="target" text-anchor="end" y="147" xml:space="preserve"><tspan x="355" dy="0">▸ <tspan class="md-code">Attachment</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">- Attachment&lt;T&gt;</title>
      <rect class="card-shape" x="32" y="206" width="376" height="160"/>
      <path class="card-rules" d="M 32 276 L 408 276 M 220 276 L 220 366"/>
      <rect class="card-outline" x="32" y="206" width="376" height="160"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="236.92" text-anchor="middle">−</text>
        <text x="64" y="238" text-anchor="start" xml:space="preserve"> Attachment&lt;T&gt;</text>
      </g>
      <text class="type-kind" text-anchor="end" y="238" xml:space="preserve"><tspan x="394" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="261" xml:space="preserve"><tspan x="46" dy="0">An attachment with a configurable payload.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="296.28" text-anchor="middle">−</text>
        <text x="58" y="297" text-anchor="start" xml:space="preserve"> payload</text>
      </g>
      <text class="field-type" y="313" xml:space="preserve"><tspan x="46" dy="0">Box&lt;T&gt;</tspan></text>
      <text class="description" y="337" xml:space="preserve"><tspan x="46" dy="0">The boxed </tspan><tspan x="46" dy="18">attachment payload.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="240" y="296.28" text-anchor="middle">−</text>
        <text x="246" y="297" text-anchor="start" xml:space="preserve"> digest</text>
      </g>
      <text class="field-type" y="313" xml:space="preserve"><tspan x="234" dy="0">[u8; 4096]</tspan></text>
      <text class="description" y="337" xml:space="preserve"><tspan x="234" dy="0">A digest of the </tspan><tspan x="234" dy="18">payload.</tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">- Upload → - Attachment&lt;T&gt;</title>
      <path class="relationship" d="M 369 142 L 383 142 L 383 206" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="369" cy="142" r="4"/>
    </g>
  </g>
</svg>
