<svg xmlns="http://www.w3.org/2000/svg" width="475" height="580" viewBox="0 0 475 580" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Query</title>
  <desc id="kaalang-description">Type Query; it refers to itself 3 times.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card focus">
      <title xml:space="preserve">Query</title>
      <rect class="card-shape" x="32" y="56" width="397" height="492"/>
      <rect class="card-groove" x="32" y="254" width="397" height="20"/>
      <rect class="card-groove" x="32" y="380" width="397" height="20"/>
      <rect class="card-groove" x="32" y="528" width="397" height="20"/>
      <path class="card-rules" d="M 32 126 L 429 126 M 32 160 L 429 160 M 225 160 L 225 254 M 32 254 L 429 254 M 32 274 L 429 274 M 32 308 L 429 308 M 32 380 L 429 380 M 32 400 L 429 400 M 32 434 L 429 434 M 32 528 L 429 528"/>
      <rect class="card-outline" x="32" y="56" width="397" height="492"/>
      <text class="type-name" y="88" xml:space="preserve"><tspan x="46" dy="0">Query</tspan></text>
      <text class="type-kind" text-anchor="end" y="88" xml:space="preserve"><tspan x="415" dy="0">enum · repr(Rust)</tspan></text>
      <text class="description" y="111" xml:space="preserve"><tspan x="46" dy="0">A query that selects sections.</tspan></text>
      <text class="variant-name" y="149" xml:space="preserve"><tspan x="46" dy="0">Both</tspan></text>
      <text class="description" y="149" xml:space="preserve"><tspan x="92" dy="0">Sections both queries select.</tspan></text>
      <text class="field-name" y="181" xml:space="preserve"><tspan x="46" dy="0">0</tspan></text>
      <text class="field-type" y="197" xml:space="preserve"><tspan x="46" dy="0">Box&lt;Query&gt;</tspan></text>
      <text class="description" y="221" xml:space="preserve"><tspan x="46" dy="0">The first query.</tspan></text>
      <text class="target" text-anchor="end" y="243" xml:space="preserve"><tspan x="211" dy="0">▸ <tspan class="md-code">Query</tspan></tspan></text>
      <text class="field-name" y="181" xml:space="preserve"><tspan x="239" dy="0">1</tspan></text>
      <text class="field-type" y="197" xml:space="preserve"><tspan x="239" dy="0">Box&lt;Query&gt;</tspan></text>
      <text class="description" y="221" xml:space="preserve"><tspan x="239" dy="0">The second query.</tspan></text>
      <text class="target" text-anchor="end" y="243" xml:space="preserve"><tspan x="415" dy="0">▸ <tspan class="md-code">Query</tspan></tspan></text>
      <text class="variant-name" y="297" xml:space="preserve"><tspan x="46" dy="0">Heading</tspan></text>
      <text class="description" y="297" xml:space="preserve"><tspan x="118" dy="0">Sections whose heading contains the text.</tspan></text>
      <text class="field-name" y="329" xml:space="preserve"><tspan x="46" dy="0">0</tspan></text>
      <text class="field-type" y="345" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="369" xml:space="preserve"><tspan x="46" dy="0">The text to find.</tspan></text>
      <text class="variant-name" y="423" xml:space="preserve"><tspan x="46" dy="0">Not</tspan></text>
      <text class="description" y="423" xml:space="preserve"><tspan x="84" dy="0">Sections the query does not select.</tspan></text>
      <text class="field-name" y="455" xml:space="preserve"><tspan x="46" dy="0">0</tspan></text>
      <text class="field-type" y="471" xml:space="preserve"><tspan x="46" dy="0">Box&lt;Query&gt;</tspan></text>
      <text class="description" y="495" xml:space="preserve"><tspan x="46" dy="0">The query to invert.</tspan></text>
      <text class="target" text-anchor="end" y="517" xml:space="preserve"><tspan x="415" dy="0">▸ <tspan class="md-code">Query</tspan></tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Query → Query</title>
      <path class="relationship" d="M 162 254 L 162 264 L 443 264 L 443 42 L 415 42 L 415 56" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="162" cy="254" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Query → Query</title>
      <path class="relationship" d="M 366 254 L 366 264 L 443 264 L 443 42 L 415 42 L 415 56" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="366" cy="254" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Query → Query</title>
      <path class="relationship" d="M 366 528 L 366 538 L 443 538 L 443 42 L 415 42 L 415 56" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="366" cy="528" r="4"/>
    </g>
    <rect class="port" x="425" y="260" width="8" height="8"/>
    <rect class="port" x="425" y="534" width="8" height="8"/>
  </g>
</svg>
