<svg xmlns="http://www.w3.org/2000/svg" width="469" height="336" viewBox="0 0 469 336" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Standing</title>
  <desc id="kaalang-description">Type Standing.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
