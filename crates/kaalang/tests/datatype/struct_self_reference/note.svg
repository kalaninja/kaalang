<svg xmlns="http://www.w3.org/2000/svg" width="385" height="626" viewBox="0 0 385 626" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Note</title>
  <desc id="kaalang-description">Type Note with incoming types Section.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Section</title>
      <rect class="card-shape" x="32" y="32" width="293" height="332"/>
      <path class="card-rules" d="M 32 120 L 325 120 M 32 168 L 325 168 M 32 216 L 325 216 M 32 290 L 325 290"/>
      <rect class="card-outline" x="32" y="32" width="293" height="332"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="46" dy="0">Section</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="311" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A section of an article, nested to </tspan><tspan x="46" dy="18">any depth.</tspan></text>
      <text class="field-name" y="141" xml:space="preserve"><tspan x="46" dy="0">id</tspan></text>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="46" dy="0">SectionId</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="151" dy="0">The section&apos;s key.</tspan></text>
      <text class="field-name" y="189" xml:space="preserve"><tspan x="46" dy="0">heading</tspan></text>
      <text class="field-type" y="205" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="191" xml:space="preserve"><tspan x="151" dy="0">The section heading.</tspan></text>
      <text class="field-name" y="237" xml:space="preserve"><tspan x="46" dy="0">notes</tspan></text>
      <text class="field-type" y="253" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Note&gt;</tspan></text>
      <text class="description" y="239" xml:space="preserve"><tspan x="151" dy="0">Remarks pinned to </tspan><tspan x="151" dy="18">this section.</tspan></text>
      <text class="target" text-anchor="end" y="279" xml:space="preserve"><tspan x="311" dy="0">▸ <tspan class="md-code">Note</tspan></tspan></text>
      <text class="field-name" y="311" xml:space="preserve"><tspan x="46" dy="0">children</tspan></text>
      <text class="field-type" y="327" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Section&gt;</tspan></text>
      <text class="description" y="313" xml:space="preserve"><tspan x="151" dy="0">Subsections in </tspan><tspan x="151" dy="18">reading order.</tspan></text>
      <text class="target" text-anchor="end" y="353" xml:space="preserve"><tspan x="311" dy="0">▸ <tspan class="md-code">Section</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Note</title>
      <rect class="card-shape" x="32" y="412" width="321" height="182"/>
      <path class="card-rules" d="M 32 482 L 353 482 M 162 482 L 162 594"/>
      <rect class="card-outline" x="32" y="412" width="321" height="182"/>
      <text class="type-name" y="444" xml:space="preserve"><tspan x="46" dy="0">Note</tspan></text>
      <text class="type-kind" text-anchor="end" y="444" xml:space="preserve"><tspan x="339" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="467" xml:space="preserve"><tspan x="46" dy="0">A reader&apos;s remark pinned to a section.</tspan></text>
      <text class="field-name" y="503" xml:space="preserve"><tspan x="46" dy="0">text</tspan></text>
      <text class="field-type" y="519" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="543" xml:space="preserve"><tspan x="46" dy="0">The remark.</tspan></text>
      <text class="field-name" y="503" xml:space="preserve"><tspan x="176" dy="0">anchor</tspan></text>
      <text class="field-type" y="519" xml:space="preserve"><tspan x="176" dy="0">SectionId</tspan></text>
      <text class="description" y="543" xml:space="preserve"><tspan x="176" dy="0">The section the </tspan><tspan x="176" dy="18">remark is pinned to.</tspan></text>
      <text class="target" text-anchor="end" y="583" xml:space="preserve"><tspan x="339" dy="0">▸ <tspan class="md-code">Section</tspan></tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Section → Note</title>
      <path class="relationship" d="M 325 274 L 339 274 L 339 412" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="325" cy="274" r="4"/>
    </g>
  </g>
</svg>
