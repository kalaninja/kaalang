<svg xmlns="http://www.w3.org/2000/svg" width="380" height="626" viewBox="0 0 380 626" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Note</title>
  <desc id="kaalang-description">Type Note with incoming types Section.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Section</title>
      <rect class="card-shape" x="32" y="32" width="282" height="332"/>
      <path class="card-rules" d="M 32 120 L 314 120 M 32 168 L 314 168 M 32 216 L 314 216 M 32 290 L 314 290"/>
      <rect class="card-outline" x="32" y="32" width="282" height="332"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Section</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="300" dy="0">struct</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A section of an article, nested to </tspan><tspan x="46" dy="18">any depth.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="140.28" text-anchor="middle">−</text>
        <text x="58" y="141" text-anchor="start" xml:space="preserve"> id</text>
      </g>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="46" dy="0">SectionId</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="140" dy="0">The section&apos;s key.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="188.28" text-anchor="middle">−</text>
        <text x="58" y="189" text-anchor="start" xml:space="preserve"> heading</text>
      </g>
      <text class="field-type" y="205" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="191" xml:space="preserve"><tspan x="140" dy="0">The section heading.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="236.28" text-anchor="middle">−</text>
        <text x="58" y="237" text-anchor="start" xml:space="preserve"> notes</text>
      </g>
      <text class="field-type" y="253" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Note&gt;</tspan></text>
      <text class="description" y="239" xml:space="preserve"><tspan x="140" dy="0">Remarks pinned to </tspan><tspan x="140" dy="18">this section.</tspan></text>
      <text class="target" text-anchor="end" y="279" xml:space="preserve"><tspan x="300" dy="0">▸ <tspan class="md-code">Note</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="310.28" text-anchor="middle">−</text>
        <text x="58" y="311" text-anchor="start" xml:space="preserve"> children</text>
      </g>
      <text class="field-type" y="327" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Self&gt;</tspan></text>
      <text class="description" y="313" xml:space="preserve"><tspan x="140" dy="0">Subsections in </tspan><tspan x="140" dy="18">reading order.</tspan></text>
      <text class="target" text-anchor="end" y="353" xml:space="preserve"><tspan x="300" dy="0">▸ <tspan class="md-code">Self</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Note</title>
      <rect class="card-shape" x="32" y="412" width="316" height="182"/>
      <path class="card-rules" d="M 32 482 L 348 482 M 160 482 L 160 594"/>
      <rect class="card-outline" x="32" y="412" width="316" height="182"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="442.92" text-anchor="middle">−</text>
        <text x="64" y="444" text-anchor="start" xml:space="preserve"> Note</text>
      </g>
      <text class="type-kind" text-anchor="end" y="444" xml:space="preserve"><tspan x="334" dy="0">struct</tspan></text>
      <text class="description" y="467" xml:space="preserve"><tspan x="46" dy="0">A reader&apos;s remark pinned to a section.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="502.28" text-anchor="middle">−</text>
        <text x="58" y="503" text-anchor="start" xml:space="preserve"> text</text>
      </g>
      <text class="field-type" y="519" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="543" xml:space="preserve"><tspan x="46" dy="0">The remark.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="180" y="502.28" text-anchor="middle">−</text>
        <text x="186" y="503" text-anchor="start" xml:space="preserve"> anchor</text>
      </g>
      <text class="field-type" y="519" xml:space="preserve"><tspan x="174" dy="0">SectionId</tspan></text>
      <text class="description" y="543" xml:space="preserve"><tspan x="174" dy="0">The section the </tspan><tspan x="174" dy="18">remark is pinned to.</tspan></text>
      <text class="target" text-anchor="end" y="583" xml:space="preserve"><tspan x="334" dy="0">▸ <tspan class="md-code">Section</tspan></tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">Section → Note</title>
      <path class="relationship" d="M 314 274 L 328 274 L 328 412" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="314" cy="274" r="4"/>
    </g>
  </g>
</svg>
