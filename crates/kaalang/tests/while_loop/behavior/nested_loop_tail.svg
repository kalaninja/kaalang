<svg xmlns="http://www.w3.org/2000/svg" width="944" height="892" viewBox="0 0 944 892" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_loop_tail</title>
  <desc id="kaalang-description">Nodes: Start: nested_loop_tail with parameters mut count: usize; limit: usize handing over mut count, limit; Question: Is another counting pass needed? capturing count, limit described as branch 1: NO / branch 2: YES; Question: Is the count below the limit? capturing count, limit described as branch 1: YES / branch 2: NO; Action: Increment the count. capturing &amp;mut count; Action: Return the count. capturing count handing over end; End: usize capturing end. Connections: Start: nested_loop_tail to the entry of Question: Is another counting pass needed?; Question: Is another counting pass needed? branch 1 to Action: Return the count.; Question: Is another counting pass needed? branch 2 to the entry of Question: Is the count below the limit?; Question: Is the count below the limit? branch 1 to Action: Increment the count.; Question: Is the count below the limit? branch 2 to the iteration tail of Question: Is another counting pass needed?; Action: Increment the count. to the iteration tail of Question: Is the count below the limit?; Action: Return the count. to End: usize; the entry of Question: Is another counting pass needed? to Question: Is another counting pass needed?; the entry of Question: Is the count below the limit? to Question: Is the count below the limit?; Repeat from the iteration tail of Question: Is the count below the limit? to the entry of Question: Is the count below the limit?; Repeat from the iteration tail of Question: Is another counting pass needed? to the entry of Question: Is another counting pass needed?.</desc>
  <defs>
    <style>
