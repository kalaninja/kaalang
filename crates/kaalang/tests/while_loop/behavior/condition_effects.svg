<svg xmlns="http://www.w3.org/2000/svg" width="724" height="604" viewBox="0 0 724 604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for condition_effects</title>
  <desc id="kaalang-description">Nodes: Start: condition_effects with parameters mut checks: usize handing over mut checks; Question: Check once more? capturing &amp;mut checks described as branch 1: YES / branch 2: NO; Action: Return the number of checks. capturing checks handing over result; End: usize capturing result. Connections: Start: condition_effects to the entry of Question: Check once more?; Question: Check once more? branch 1 to the iteration tail of Question: Check once more?; Question: Check once more? branch 2 to Action: Return the number of checks.; Action: Return the number of checks. to End: usize; the entry of Question: Check once more? to Question: Check once more?; Repeat from the iteration tail of Question: Check once more? to the entry of Question: Check once more?.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 192 90 L 192 162
      M 192 306 L 192 378
      M 332 270 L 552 270 L 552 378
      M 552 442 L 552 514
      M 192 162 L 192 234
    "/>
    <path class="connection" d="
      M 192 378 L 32 378 L 32 162 L 192 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="108" xml:space="preserve"><tspan x="205" dy="0">mut checks</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="326" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="258" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="205" y="223" xml:space="preserve"><tspan x="205" dy="0">&amp;mut checks</tspan></text>
    <text class="connection-label" x="565" y="367" xml:space="preserve"><tspan x="565" dy="0">checks</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 61 L 428 61"/>
    <g class="parameter-panel" transform="translate(548 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut checks: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(192 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">condition_effects</tspan></text>
    </g>
    <g class="node question" transform="translate(192 270)">
      <title xml:space="preserve">Check once more?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Check once more?</tspan></text>
    </g>
    <g class="node action" transform="translate(552 410)">
      <title xml:space="preserve">Return the number of checks.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the number of checks.</tspan></text>
    </g>
    <g class="node end" transform="translate(552 543)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; usize</tspan></text>
    </g>
  </g>
</svg>
