<svg xmlns="http://www.w3.org/2000/svg" width="1804" height="1707" viewBox="0 0 1804 1707" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for collect_steps</title>
  <desc id="kaalang-description">Nodes: Start: collect_steps with parameters enabled: bool; limit: usize handing over enabled, limit; Question: Collect the steps? capturing enabled handing over run / skip; Action: Start an empty log. capturing run handing over mut log; Question: Are there more first steps? capturing &amp;log, limit described as branch 1: YES / branch 2: NO; Action: Build the first step. capturing nothing handing over step; Action: Record the first step. capturing &amp;mut log, step; Question: Are there more second steps? capturing &amp;log, limit described as branch 1: YES / branch 2: NO; Question: Is the log length odd? capturing &amp;log handing over odd / even; Action: Build an odd step. capturing odd handing over step; Action: Build an even step. capturing even handing over step; Action: Record the second step. capturing &amp;mut log, step; Action: Return the log. capturing log handing over result; Action: Return an empty log. capturing skip handing over result; End: Vec&lt;String&gt; capturing result. Connections: Start: collect_steps to Question: Collect the steps?; Question: Collect the steps? branch 1 to Action: Start an empty log.; Question: Collect the steps? branch 2 to Action: Return an empty log.; Action: Start an empty log. to the entry of Question: Are there more first steps?; Question: Are there more first steps? branch 1 to Action: Build the first step.; Question: Are there more first steps? branch 2 to the entry of Question: Are there more second steps?; Action: Build the first step. to Action: Record the first step.; Action: Record the first step. to the iteration tail of Question: Are there more first steps?; Question: Are there more second steps? branch 1 to Question: Is the log length odd?; Question: Are there more second steps? branch 2 to Action: Return the log.; Question: Is the log length odd? branch 1 to Action: Build an odd step.; Question: Is the log length odd? branch 2 to Action: Build an even step.; Action: Build an odd step. to the step merge; Action: Build an even step. to the step merge; Action: Record the second step. to the iteration tail of Question: Are there more second steps?; Action: Return the log. to the result merge; Action: Return an empty log. to the result merge; the step merge to Action: Record the second step.; the result merge to End: Vec&lt;String&gt;; the entry of Question: Are there more first steps? to Question: Are there more first steps?; the entry of Question: Are there more second steps? to Question: Are there more second steps?; Repeat from the iteration tail of Question: Are there more second steps? to the entry of Question: Are there more second steps?; Repeat from the iteration tail of Question: Are there more first steps? to the entry of Question: Are there more first steps?.</desc>
  <defs>
    <style>
