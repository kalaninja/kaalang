<svg xmlns="http://www.w3.org/2000/svg" width="680" height="604" viewBox="0 0 680 604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for reversed_empty_loop</title>
  <desc id="kaalang-description">Nodes: Start: reversed_empty_loop with parameters mut checks: usize handing over mut checks; Question: Check once more? capturing &amp;mut checks described as branch 1: NO / branch 2: YES; Action: Return the number of checks. capturing checks handing over result; End: usize capturing result. Connections: Start: reversed_empty_loop to the entry of Question: Check once more?; Question: Check once more? branch 1 to Action: Return the number of checks.; Question: Check once more? branch 2 to the iteration tail of Question: Check once more?; Action: Return the number of checks. to End: usize; the entry of Question: Check once more? to Question: Check once more?; Repeat from the iteration tail of Question: Check once more? to the entry of Question: Check once more?.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="M 172 90 L 172 162"/>
    <path class="connection" d="M 172 306 L 172 378"/>
    <path class="connection" d="M 312 270 L 532 270"/>
    <path class="connection" d="M 172 442 L 172 514"/>
    <path class="connection" d="M 172 162 L 172 234"/>
    <path class="connection" d="M 532 270 L 552 270 L 552 162 L 172 162" marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">mut checks</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="326" xml:space="preserve"><tspan x="185" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="258" xml:space="preserve"><tspan x="325" dy="0">YES</tspan></text>
    <text class="connection-label" x="185" y="223" xml:space="preserve"><tspan x="185" dy="0">&amp;mut checks</tspan></text>
    <text class="connection-label" x="185" y="367" xml:space="preserve"><tspan x="185" dy="0">checks</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut checks: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">reversed_empty_loop</tspan></text>
    </g>
    <g class="node question" transform="translate(172 270)">
      <title xml:space="preserve">Check once more?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Check once more?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 410)">
      <title xml:space="preserve">Return the number of checks.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the number of checks.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 543)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; usize</tspan></text>
    </g>
  </g>
</svg>
