<svg xmlns="http://www.w3.org/2000/svg" width="724" height="740" viewBox="0 0 724 740" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for count_to</title>
  <desc id="kaalang-description">Nodes: Start: const count_to with parameters limit: usize handing over limit; Action: Initialize the counter. capturing nothing handing over mut count; Question: Is the counter below the limit? capturing &amp;count, &amp;limit described as branch 1: YES / branch 2: NO; Action: Increment the counter. capturing &amp;mut count; Action: Return the counter. capturing count handing over end; End: usize capturing end. Connections: Start: const count_to to Action: Initialize the counter.; Action: Initialize the counter. to the entry of Question: Is the counter below the limit?; Question: Is the counter below the limit? branch 1 to Action: Increment the counter.; Question: Is the counter below the limit? branch 2 to Action: Return the counter.; Action: Increment the counter. to the iteration tail of Question: Is the counter below the limit?; Action: Return the counter. to End: usize; the entry of Question: Is the counter below the limit? to Question: Is the counter below the limit?; Repeat from the iteration tail of Question: Is the counter below the limit? to the entry of Question: Is the counter below the limit?.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 192 90 L 192 162
      M 192 226 L 192 298
      M 192 442 L 192 514
      M 332 406 L 552 406 L 552 514
      M 192 578 L 192 650
      M 552 578 L 552 650
      M 192 298 L 192 370
    "/>
    <path class="connection" d="
      M 192 650 L 32 650 L 32 298 L 192 298
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="108" xml:space="preserve"><tspan x="205" dy="0">limit</tspan></text>
    <text class="connection-label" x="205" y="244" xml:space="preserve"><tspan x="205" dy="0">mut count</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="462" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="394" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="205" y="151" xml:space="preserve"><tspan x="205" dy="0">()</tspan></text>
    <text class="connection-label" x="205" y="359" xml:space="preserve"><tspan x="205" dy="0">&amp;count, &amp;limit</tspan></text>
    <text class="connection-label" x="205" y="503" xml:space="preserve"><tspan x="205" dy="0">&amp;mut count</tspan></text>
    <text class="connection-label" x="565" y="503" xml:space="preserve"><tspan x="565" dy="0">count</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 61 L 428 61"/>
    <g class="parameter-panel" transform="translate(548 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(192 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">const count_to</tspan></text>
    </g>
    <g class="node action" transform="translate(192 194)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(192 406)">
      <title xml:space="preserve">Is the counter below the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Is the counter below the </tspan><tspan x="0" dy="18">limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(192 546)">
      <title xml:space="preserve">Increment the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(552 546)">
      <title xml:space="preserve">Return the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the counter.</tspan></text>
    </g>
    <g class="node end" transform="translate(552 679)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
