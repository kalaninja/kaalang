  <title id="kaalang-title">kaalang diagram for early_result_then_loop</title>
  <desc id="kaalang-description">Nodes: Start: early_result_then_loop with parameters first: bool; mut count: usize handing over first, mut count; Question: Check for an early result? capturing first described as branch 1: YES / branch 2: NO; Action: Return the early result. capturing nothing handing over result; Question: Is the count below three? capturing count described as branch 1: YES / branch 2: NO; Action: Increment the count. capturing &amp;mut count; Action: Return the count. capturing count handing over result; End: usize capturing result. Connections: Start: early_result_then_loop to Question: Check for an early result?; Question: Check for an early result? branch 1 to Action: Return the early result.; Question: Check for an early result? branch 2 to the entry of Question: Is the count below three?; Action: Return the early result. to the result merge; Question: Is the count below three? branch 1 to Action: Increment the count.; Question: Is the count below three? branch 2 to Action: Return the count.; Action: Increment the count. to the iteration tail of Question: Is the count below three?; Action: Return the count. to the result merge; the result merge to End: usize; the entry of Question: Is the count below three? to Question: Is the count below three?; Repeat from the iteration tail of Question: Is the count below three? to the entry of Question: Is the count below three?.</desc>
