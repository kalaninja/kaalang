<svg xmlns="http://www.w3.org/2000/svg" width="836" height="1336" viewBox="0 0 836 1336" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_result_propagation</title>
  <desc id="kaalang-description">Cycles: Search until the inner cycle finds the limit. with inputs log, mut count, limit and outputs next; Advance until the search is done. with inputs log, mut count, limit and outputs next. Nodes: Start: nested_result_propagation with parameters limit: usize; log: Rc&lt;RefCell&lt;Vec&lt;&amp;&apos;static str&gt;&gt;&gt; handing over limit, log; Action: Initialize the counter. capturing nothing handing over mut count; Action: Enter the outer scope. capturing &amp;log handing over _outer; Action: Enter the inner scope. capturing &amp;log handing over inner; Question: Has the search finished? capturing &amp;count, limit handing over done / again; Action: Hand over the count and the log. capturing done, count, log, inner handing over next; Action: Advance the search. capturing again, &amp;mut count; Action: Continue after the search. capturing next handing over result; End: usize capturing result. Connections: Start: nested_result_propagation to Action: Initialize the counter.; Action: Initialize the counter. to Action: Enter the outer scope.; Action: Enter the outer scope. to the entry of the cycle; Action: Enter the inner scope. to Question: Has the search finished?; Question: Has the search finished? branch 1 to Action: Hand over the count and the log.; Question: Has the search finished? branch 2 to Action: Advance the search.; Action: Hand over the count and the log. to the cycle result; Action: Advance the search. to the iteration tail of the cycle; Action: Continue after the search. to End: usize; the cycle result to Action: Continue after the search.; the entry of the cycle to Action: Enter the inner scope.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.75; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Search until the inner cycle finds the limit.</title>
    <rect class="cycle-boundary" x="32" y="307" width="772" height="766" rx="12"/>
    <text class="cycle-caption" x="792" y="321" text-anchor="end" xml:space="preserve"><tspan x="792" dy="0">Search until the inner cycle finds the limit.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Advance until the search is done.</title>
    <rect class="cycle-boundary" x="60" y="443" width="716" height="558" rx="12"/>
    <text class="cycle-caption" x="764" y="457" text-anchor="end" xml:space="preserve"><tspan x="764" dy="0">Advance until the search is done.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 228 112 L 228 206
      M 228 270 L 228 342
      M 228 406 L 228 478
      M 228 614 L 228 686
      M 228 758 L 228 830
      M 368 722 L 588 722 L 588 830
      M 228 894 L 228 1038
      M 588 894 L 588 966
      M 228 1174 L 228 1246
      M 228 1038 L 228 1110
      M 228 478 L 228 550
    "/>
    <path class="connection" d="
      M 588 966 L 748 966 L 748 478 L 228 478
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label code" x="241" y="1235" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
    <text class="connection-label code" x="241" y="130" xml:space="preserve"><tspan x="241" dy="0">limit, log</tspan></text>
    <text class="connection-label code" x="241" y="288" xml:space="preserve"><tspan x="241" dy="0">mut count</tspan></text>
    <text class="connection-label code" x="241" y="424" xml:space="preserve"><tspan x="241" dy="0">_outer</tspan></text>
    <text class="connection-label code" x="241" y="632" xml:space="preserve"><tspan x="241" dy="0">inner</tspan></text>
    <text class="connection-label code" x="241" y="776" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label code" x="381" y="740" xml:space="preserve"><tspan x="381" dy="0">again</tspan></text>
    <text class="connection-label code" x="241" y="912" xml:space="preserve"><tspan x="241" dy="0">next</tspan></text>
    <text class="connection-label code" x="241" y="195" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label code" x="241" y="331" xml:space="preserve"><tspan x="241" dy="0">&amp;log</tspan></text>
    <text class="connection-label code" x="241" y="539" xml:space="preserve"><tspan x="241" dy="0">&amp;log</tspan></text>
    <text class="connection-label code" x="241" y="675" xml:space="preserve"><tspan x="241" dy="0">&amp;count, limit</tspan></text>
    <text class="connection-label code" x="241" y="819" xml:space="preserve"><tspan x="241" dy="0">done, count, log, inner</tspan></text>
    <text class="connection-label code" x="601" y="819" xml:space="preserve"><tspan x="601" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label code" x="241" y="1099" xml:space="preserve"><tspan x="241" dy="0">next</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 83 L 464 83"/>
    <g class="parameter-panel" transform="translate(584 83)">
      <rect class="node-shape" x="-120" y="-51" width="240" height="102"/>
      <text class="label code" x="-104" y="-21" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan><tspan x="-104" dy="18">log: </tspan><tspan x="-104" dy="18">Rc&lt;RefCell&lt;Vec&lt;&amp;&apos;static </tspan><tspan x="-104" dy="18">str&gt;&gt;&gt;</tspan></text>
    </g>
    <g class="node start" transform="translate(228 83)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_result_propagation</tspan></text>
    </g>
    <g class="node action" transform="translate(228 238)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 374)">
      <title xml:space="preserve">Enter the outer scope.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Enter the outer scope.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 582)">
      <title xml:space="preserve">Enter the inner scope.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Enter the inner scope.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 722)">
      <title xml:space="preserve">Has the search finished?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Has the search finished?</tspan></text>
    </g>
    <g class="node action" transform="translate(228 862)">
      <title xml:space="preserve">Hand over the count and the log.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Hand over the count and the log.</tspan></text>
    </g>
    <g class="node action" transform="translate(588 862)">
      <title xml:space="preserve">Advance the search.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance the search.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 1142)">
      <title xml:space="preserve">Continue after the search.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Continue after the search.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 1275)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label code" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
