<svg xmlns="http://www.w3.org/2000/svg" width="680" height="705" viewBox="0 0 680 705" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for sequential_exits</title>
  <desc id="kaalang-description">Nodes: Start: sequential_exits with parameters before_limit: usize; after_limit: usize handing over before_limit, after_limit; Action: Initialize the counter and log. capturing nothing handing over mut initial_count, mut initial_log; Cycle: Run work between two stopping checks. capturing mut initial_count, before_limit, mut initial_log, after_limit handing over done; Action: Continue after the cycle. capturing done, mut initial_log handing over result; End: Vec&lt;&amp;&apos;static str&gt; capturing result. Connections: Start: sequential_exits to Action: Initialize the counter and log.; Action: Initialize the counter and log. to Cycle: Run work between two stopping checks.; Cycle: Run work between two stopping checks. to Action: Continue after the cycle.; Action: Continue after the cycle. to End: Vec&lt;&amp;&apos;static str&gt;.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 234 L 172 341
      M 172 407 L 172 479
      M 172 543 L 172 615
    "/>
    <text class="connection-label" x="185" y="604" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">before_limit, after_limit</tspan></text>
    <text class="connection-label" x="185" y="252" xml:space="preserve"><tspan x="185" dy="0">mut initial_count, mut </tspan><tspan x="185" dy="14">initial_log</tspan></text>
    <text class="connection-label" x="185" y="425" xml:space="preserve"><tspan x="185" dy="0">done</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
    <text class="connection-label" x="185" y="302" xml:space="preserve"><tspan x="185" dy="0">mut initial_count, </tspan><tspan x="185" dy="14">before_limit, mut initial_log, </tspan><tspan x="185" dy="14">after_limit</tspan></text>
    <text class="connection-label" x="185" y="468" xml:space="preserve"><tspan x="185" dy="0">done, mut initial_log</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">before_limit: usize</tspan><tspan x="-104" dy="18">after_limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">sequential_exits</tspan></text>
    </g>
    <g class="node action" transform="translate(172 202)">
      <title xml:space="preserve">Initialize the counter and log.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter and log.</tspan></text>
    </g>
    <g class="node cycle" transform="translate(172 374)">
      <title xml:space="preserve">Run work between two stopping checks.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Run work between two </tspan><tspan x="-124" dy="18">stopping checks.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 511)">
      <title xml:space="preserve">Continue after the cycle.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Continue after the cycle.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 644)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;&amp;&apos;static str&gt;</tspan></text>
    </g>
  </g>
</svg>
