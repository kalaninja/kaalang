<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1322" viewBox="0 0 1480 1322" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for output_decides_a_later_question</title>
  <desc id="kaalang-description">Cycles: Take the next positive value. with inputs mut values and outputs positive or empty. Nodes: Start: output_decides_a_later_question with parameters mut values: Vec&lt;i32&gt; handing over mut values; Select: Is another value waiting? capturing &amp;mut values; Case: Check the value. handing over value; Case: The values ran out. handing over empty; Question: Is it zero or negative? capturing &amp;value handing over skip / keep; Action: Keep the positive value. capturing keep, value handing over positive; Question: Is the positive value large? capturing &amp;positive handing over large / small; Action: Cap the large value. capturing large, positive handing over result; Action: Keep the small value. capturing small, positive handing over result; Action: Report nothing found. capturing empty handing over result; End: i32 capturing result; Merge: result. Connections: Start: output_decides_a_later_question to the entry of the cycle; Select: Is another value waiting? to Case: Check the value.; Select: Is another value waiting? to Case: The values ran out.; Case: Check the value. to Question: Is it zero or negative?; Case: The values ran out. to the empty result of the cycle; Question: Is it zero or negative? branch 1 to the iteration tail of the cycle; Question: Is it zero or negative? branch 2 to Action: Keep the positive value.; Action: Keep the positive value. to the positive result of the cycle; Question: Is the positive value large? branch 1 to Action: Cap the large value.; Question: Is the positive value large? branch 2 to Action: Keep the small value.; Action: Cap the large value. to the result merge; Action: Keep the small value. to the result merge; Action: Report nothing found. to the result merge; the result merge to End: i32; the entry of the cycle to Select: Is another value waiting?; the positive result of the cycle to Question: Is the positive value large?; the empty result of the cycle to Action: Report nothing found.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
