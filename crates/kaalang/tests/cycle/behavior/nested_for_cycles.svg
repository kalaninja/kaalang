    <text class="connection-label" x="187" y="423" xml:space="preserve"><tspan x="187" dy="0">row</tspan></text>
    <text class="connection-label" x="187" y="108" xml:space="preserve"><tspan x="187" dy="0">rows</tspan></text>
    <text class="connection-label" x="187" y="244" xml:space="preserve"><tspan x="187" dy="0">mut total</tspan></text>
    <text class="connection-label" x="187" y="516" xml:space="preserve"><tspan x="187" dy="0">value</tspan></text>
    <text class="connection-label" x="187" y="151" xml:space="preserve"><tspan x="187" dy="0">()</tspan></text>
