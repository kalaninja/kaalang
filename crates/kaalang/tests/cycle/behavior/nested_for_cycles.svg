<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1384" viewBox="0 0 1180 1384" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_for_cycles</title>
  <desc id="kaalang-description">Cycles: Add every row. with inputs rows, mut total and outputs (); Add every value of the row. with inputs row, mut total and outputs (). Nodes: Start: nested_for_cycles with parameters rows: &amp;[Vec&lt;u32&gt;] handing over rows; Action: Start with a total of zero. capturing nothing handing over mut total; Select: Add every row. capturing nothing; Case: Take the next item. handing over row; Case: No item is left.; Select: Add every value of the row. capturing nothing; Case: Take the next item. handing over value; Case: No item is left.; Action: Add the value. capturing value, &amp;mut total; End: u32 capturing total. Connections: Start: nested_for_cycles to Action: Start with a total of zero.; Action: Start with a total of zero. to the entry of the cycle; Select: Add every row. to Case: Take the next item.; Select: Add every row. to Case: No item is left.; Case: Take the next item. to the entry of the cycle; Case: No item is left. to End: u32; Select: Add every value of the row. to Case: Take the next item.; Select: Add every value of the row. to Case: No item is left.; Case: Take the next item. to Action: Add the value.; Case: No item is left. to the iteration tail of the cycle; Action: Add the value. to the iteration tail of the cycle; the entry of the cycle to Select: Add every row.; the entry of the cycle to Select: Add every value of the row.; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Add every row.</title>
    <rect class="cycle-boundary" x="32" y="263" width="1116" height="994" rx="12"/>
    <text class="cycle-caption" x="1136" y="277" text-anchor="end" xml:space="preserve"><tspan x="1136" dy="0">Add every row.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Add every value of the row.</title>
    <rect class="cycle-boundary" x="92" y="621" width="696" height="564" rx="12"/>
    <text class="cycle-caption" x="776" y="635" text-anchor="end" xml:space="preserve"><tspan x="776" dy="0">Add every value of the row.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 280 90 L 280 162
      M 280 226 L 280 298
      M 280 442 L 280 514
      M 408 406 L 1000 406 L 1000 514
      M 280 584 L 280 656
      M 1000 584 L 1000 1294
      M 280 800 L 280 872
      M 408 764 L 640 764 L 640 872
      M 280 942 L 280 1014
      M 640 942 L 640 1222
      M 280 1078 L 280 1150
      M 280 298 L 280 370
      M 280 656 L 280 728
    "/>
    <path class="connection" d="
      M 280 1150 L 120 1150 L 120 656 L 280 656
    " marker-end="url(#back-edge-arrow)"/>
    <path class="connection" d="
      M 640 1222 L 60 1222 L 60 298 L 280 298
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="293" y="108" xml:space="preserve"><tspan x="293" dy="0">rows</tspan></text>
    <text class="connection-label" x="293" y="244" xml:space="preserve"><tspan x="293" dy="0">mut total</tspan></text>
    <text class="connection-label" x="293" y="602" xml:space="preserve"><tspan x="293" dy="0">row</tspan></text>
    <text class="connection-label" x="293" y="960" xml:space="preserve"><tspan x="293" dy="0">value</tspan></text>
    <text class="connection-label" x="293" y="151" xml:space="preserve"><tspan x="293" dy="0">()</tspan></text>
    <text class="connection-label" x="293" y="359" xml:space="preserve"><tspan x="293" dy="0">()</tspan></text>
    <text class="connection-label" x="293" y="717" xml:space="preserve"><tspan x="293" dy="0">()</tspan></text>
    <text class="connection-label" x="293" y="1003" xml:space="preserve"><tspan x="293" dy="0">value, &amp;mut total</tspan></text>
    <text class="connection-label" x="1013" y="1283" xml:space="preserve"><tspan x="1013" dy="0">total</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 420 61 L 516 61"/>
    <g class="parameter-panel" transform="translate(636 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">rows: &amp;[Vec&lt;u32&gt;]</tspan></text>
    </g>
    <g class="node start" transform="translate(280 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_for_cycles</tspan></text>
    </g>
    <g class="node action" transform="translate(280 194)">
      <title xml:space="preserve">Start with a total of zero.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start with a total of zero.</tspan></text>
    </g>
    <g class="node select" transform="translate(280 406)">
      <title xml:space="preserve">Add every row.</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Add every row.</tspan></text>
    </g>
    <g class="node case" transform="translate(280 549)">
      <title xml:space="preserve">Take the next item.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Take the next item.</tspan></text>
    </g>
    <g class="node case" transform="translate(1000 549)">
      <title xml:space="preserve">No item is left.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">No item is left.</tspan></text>
    </g>
    <g class="node select" transform="translate(280 764)">
      <title xml:space="preserve">Add every value of the row.</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Add every value of the row.</tspan></text>
    </g>
    <g class="node case" transform="translate(280 907)">
      <title xml:space="preserve">Take the next item.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Take the next item.</tspan></text>
    </g>
    <g class="node case" transform="translate(640 907)">
      <title xml:space="preserve">No item is left.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">No item is left.</tspan></text>
    </g>
    <g class="node action" transform="translate(280 1046)">
      <title xml:space="preserve">Add the value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Add the value.</tspan></text>
    </g>
    <g class="node end" transform="translate(1000 1323)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
