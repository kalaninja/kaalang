<svg xmlns="http://www.w3.org/2000/svg" width="400" height="660" viewBox="0 0 400 660" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for empty_captures</title>
  <desc id="kaalang-description">Cycles: Complete without a header. with inputs () and outputs first; Complete through an explicit empty capture list. with inputs () and outputs second. Nodes: Start: const empty_captures; Action: Produce the first unit. capturing nothing handing over first; Action: Produce the second unit. capturing nothing handing over second; Action: Continue after both cycles. capturing first, second handing over result; End: usize capturing result. Connections: Start: const empty_captures to Action: Produce the first unit.; Action: Produce the first unit. to Action: Produce the second unit.; Action: Produce the second unit. to Action: Continue after both cycles.; Action: Continue after both cycles. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Complete without a header.</title>
    <rect class="cycle-boundary" x="32" y="127" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="141" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Complete without </tspan><tspan x="356" dy="14">a header.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Complete through an explicit empty capture list.</title>
    <rect class="cycle-boundary" x="32" y="263" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="277" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Complete through </tspan><tspan x="356" dy="14">an explicit empty …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 298
      M 200 362 L 200 434
      M 200 498 L 200 570
    "/>
    <text class="connection-label" x="213" y="559" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="244" xml:space="preserve"><tspan x="213" dy="0">first</tspan></text>
    <text class="connection-label" x="213" y="380" xml:space="preserve"><tspan x="213" dy="0">second</tspan></text>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="287" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="423" xml:space="preserve"><tspan x="213" dy="0">first, second</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">const empty_captures</tspan></text>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">Produce the first unit.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the first unit.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 330)">
      <title xml:space="preserve">Produce the second unit.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the second unit.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 466)">
      <title xml:space="preserve">Continue after both cycles.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Continue after both cycles.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 599)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
