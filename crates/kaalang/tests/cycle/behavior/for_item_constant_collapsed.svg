  <desc id="kaalang-description">Nodes: Start: for_item_constant; Action: Start with no visits. capturing nothing handing over mut visits; Cycle: Visit three items. capturing mut visits; End: u32 capturing visits. Connections: Start: for_item_constant to Action: Start with no visits.; Action: Start with no visits. to Cycle: Visit three items.; Cycle: Visit three items. to End: u32.</desc>
