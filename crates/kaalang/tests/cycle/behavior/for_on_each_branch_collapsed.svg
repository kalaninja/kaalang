<svg xmlns="http://www.w3.org/2000/svg" width="728" height="756" viewBox="0 0 728 756" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for for_on_each_branch</title>
  <desc id="kaalang-description">Nodes: Start: for_on_each_branch with parameters values: &amp;[i64]; twice: bool handing over values, twice; Action: Start with a total of zero. capturing nothing handing over mut total; Question: Should every value count twice? capturing twice handing over double / single; Cycle: Add every value twice. capturing double, values, mut total handing over counted; Cycle: Add every value once. capturing single, values, mut total handing over counted; End: i64 capturing total; Merge: counted. Connections: Start: for_on_each_branch to Action: Start with a total of zero.; Action: Start with a total of zero. to Question: Should every value count twice?; Question: Should every value count twice? branch 1 to Cycle: Add every value twice.; Question: Should every value count twice? branch 2 to Cycle: Add every value once.; Cycle: Add every value twice. to the counted merge; Cycle: Add every value once. to the counted merge; the counted merge to End: i64.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 234 L 172 306
      M 172 378 L 172 450
      M 312 342 L 532 342 L 532 450
      M 172 514 L 172 590
      M 532 514 L 532 590 L 172 590
      M 172 590 L 172 666
    "/>
    <text class="connection-label" x="185" y="608" xml:space="preserve"><tspan x="185" dy="0">counted</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">values, twice</tspan></text>
    <text class="connection-label" x="185" y="252" xml:space="preserve"><tspan x="185" dy="0">mut total</tspan></text>
    <text class="connection-label" x="185" y="396" xml:space="preserve"><tspan x="185" dy="0">double</tspan></text>
    <text class="connection-label" x="325" y="360" xml:space="preserve"><tspan x="325" dy="0">single</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
    <text class="connection-label" x="185" y="295" xml:space="preserve"><tspan x="185" dy="0">twice</tspan></text>
    <text class="connection-label" x="185" y="439" xml:space="preserve"><tspan x="185" dy="0">double, values, mut total</tspan></text>
    <text class="connection-label" x="545" y="439" xml:space="preserve"><tspan x="545" dy="0">single, values, mut total</tspan></text>
    <text class="connection-label" x="185" y="655" xml:space="preserve"><tspan x="185" dy="0">total</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">values: &amp;[i64]</tspan><tspan x="-104" dy="18">twice: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 590)">
      <title xml:space="preserve">the counted merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">for_on_each_branch</tspan></text>
    </g>
    <g class="node action" transform="translate(172 202)">
      <title xml:space="preserve">Start with a total of zero.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start with a total of zero.</tspan></text>
    </g>
    <g class="node question" transform="translate(172 342)">
      <title xml:space="preserve">Should every value count twice?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Should every value count </tspan><tspan x="0" dy="18">twice?</tspan></text>
    </g>
    <g class="node cycle" transform="translate(172 482)">
      <title xml:space="preserve">Add every value twice.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64" rx="8"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Add every value twice.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node cycle" transform="translate(532 482)">
      <title xml:space="preserve">Add every value once.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64" rx="8"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Add every value once.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node end" transform="translate(172 695)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">i64</tspan></text>
    </g>
  </g>
</svg>
