<svg xmlns="http://www.w3.org/2000/svg" width="760" height="954" viewBox="0 0 760 954" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for for_ignored_item</title>
  <desc id="kaalang-description">Cycles: Knock as many times as asked. with inputs times, mut text and outputs (). Nodes: Start: for_ignored_item with parameters times: usize handing over times; Action: Start with an empty text. capturing nothing handing over mut text; Select: Knock as many times as asked. capturing nothing; Case: Take the next item.; Case: No item is left.; Action: Knock once. capturing &amp;mut text; End: String capturing text. Connections: Start: for_ignored_item to Action: Start with an empty text.; Action: Start with an empty text. to the entry of the cycle; Select: Knock as many times as asked. to Case: Take the next item.; Select: Knock as many times as asked. to Case: No item is left.; Case: Take the next item. to Action: Knock once.; Case: No item is left. to End: String; Action: Knock once. to the iteration tail of the cycle; the entry of the cycle to Select: Knock as many times as asked.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
