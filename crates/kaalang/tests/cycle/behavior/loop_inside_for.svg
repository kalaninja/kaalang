      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start counting at the value.</tspan></text>
    </g>
    <g class="node question" transform="translate(201 678)">
      <title xml:space="preserve">Has the value been counted down?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the value been counted </tspan><tspan x="0" dy="18">down?</tspan></text>
    </g>
    <g class="node action" transform="translate(561 818)">
      <title xml:space="preserve">Count one down.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count one down.</tspan></text>
    </g>
    <g class="node for-end" transform="translate(201 1026)">
      <title xml:space="preserve">Count down every value.</title>
      <polygon class="node-shape" points="-140,-32 140,-32 140,16 124,32 -124,32 -140,16"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count down every value.</tspan></text>
    </g>
    <g class="node end" transform="translate(201 1159)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
