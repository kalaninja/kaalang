      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Count down every value.</tspan></text>
    </g>
    <g class="node case" transform="translate(280 549)">
      <title xml:space="preserve">Take the next item.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Take the next item.</tspan></text>
    </g>
    <g class="node case" transform="translate(1000 549)">
      <title xml:space="preserve">No item is left.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">No item is left.</tspan></text>
    </g>
    <g class="node action" transform="translate(280 688)">
      <title xml:space="preserve">Start counting at the value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start counting at the value.</tspan></text>
    </g>
    <g class="node question" transform="translate(280 900)">
      <title xml:space="preserve">Is anything left?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is anything left?</tspan></text>
    </g>
    <g class="node action" transform="translate(280 1040)">
      <title xml:space="preserve">Count one down.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count one down.</tspan></text>
    </g>
    <g class="node end" transform="translate(1000 1317)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
