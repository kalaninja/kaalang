      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start with a total of zero.</tspan></text>
    </g>
    <g class="node for-entry" transform="translate(201 330)">
      <title xml:space="preserve">Count down every value.</title>
      <polygon class="node-shape" points="-124,-32 124,-32 140,-16 140,32 -140,32 -140,-16"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count down every value.</tspan></text>
    </g>
    <g class="node action" transform="translate(201 466)">
