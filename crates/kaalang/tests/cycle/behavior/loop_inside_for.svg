<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1378" viewBox="0 0 1180 1378" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for loop_inside_for</title>
  <desc id="kaalang-description">Cycles: Count down every value. with inputs values, mut total and outputs (); Count the value down to zero. with inputs mut left, mut total and outputs _zero. Nodes: Start: loop_inside_for with parameters values: &amp;[u32] handing over values; Action: Start with a total of zero. capturing nothing handing over mut total; Select: Count down every value. capturing nothing; Case: Take the next item. handing over value; Case: No item is left.; Action: Start counting at the value. capturing value handing over mut left; Question: Is anything left? capturing &amp;left handing over more / _zero; Action: Count one down. capturing more, &amp;mut left, &amp;mut total handing over counted; End: u32 capturing total. Connections: Start: loop_inside_for to Action: Start with a total of zero.; Action: Start with a total of zero. to the entry of the cycle; Select: Count down every value. to Case: Take the next item.; Select: Count down every value. to Case: No item is left.; Case: Take the next item. to Action: Start counting at the value.; Case: No item is left. to End: u32; Action: Start counting at the value. to the entry of the cycle; Question: Is anything left? branch 1 to Action: Count one down.; Question: Is anything left? branch 2 to the iteration tail of the cycle; Action: Count one down. to the iteration tail of the cycle; the entry of the cycle to Select: Count down every value.; the entry of the cycle to Question: Is anything left?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count down every value.</title>
    <rect class="cycle-boundary" x="32" y="263" width="1116" height="988" rx="12"/>
    <text class="cycle-caption" x="1136" y="277" text-anchor="end" xml:space="preserve"><tspan x="1136" dy="0">Count down every value.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Count the value down to zero.</title>
    <rect class="cycle-boundary" x="92" y="757" width="407" height="422" rx="12"/>
    <text class="cycle-caption" x="487" y="771" text-anchor="end" xml:space="preserve"><tspan x="487" dy="0">Count the value down to zero.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 280 90 L 280 162
      M 280 226 L 280 298
      M 280 442 L 280 514
      M 408 406 L 1000 406 L 1000 514
      M 280 584 L 280 656
      M 1000 584 L 1000 1288
      M 280 720 L 280 792
      M 280 936 L 280 1008
      M 420 900 L 640 900 L 640 1216
      M 280 1072 L 280 1144
      M 280 298 L 280 370
      M 280 792 L 280 864
    "/>
    <path class="connection" d="
      M 280 1144 L 120 1144 L 120 792 L 280 792
    " marker-end="url(#back-edge-arrow)"/>
    <path class="connection" d="
      M 640 1216 L 60 1216 L 60 298 L 280 298
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="293" y="645" xml:space="preserve"><tspan x="293" dy="0">value</tspan></text>
    <text class="connection-label" x="293" y="108" xml:space="preserve"><tspan x="293" dy="0">values</tspan></text>
    <text class="connection-label" x="293" y="244" xml:space="preserve"><tspan x="293" dy="0">mut total</tspan></text>
    <text class="connection-label" x="293" y="738" xml:space="preserve"><tspan x="293" dy="0">mut left</tspan></text>
    <text class="connection-label" x="293" y="954" xml:space="preserve"><tspan x="293" dy="0">more</tspan></text>
    <text class="connection-label" x="433" y="918" xml:space="preserve"><tspan x="433" dy="0">_zero</tspan></text>
    <text class="connection-label" x="293" y="1090" xml:space="preserve"><tspan x="293" dy="0">counted</tspan></text>
    <text class="connection-label" x="293" y="151" xml:space="preserve"><tspan x="293" dy="0">()</tspan></text>
    <text class="connection-label" x="293" y="359" xml:space="preserve"><tspan x="293" dy="0">()</tspan></text>
    <text class="connection-label" x="293" y="853" xml:space="preserve"><tspan x="293" dy="0">&amp;left</tspan></text>
    <text class="connection-label" x="293" y="997" xml:space="preserve"><tspan x="293" dy="0">more, &amp;mut left, &amp;mut total</tspan></text>
    <text class="connection-label" x="1013" y="1277" xml:space="preserve"><tspan x="1013" dy="0">total</tspan></text>
  </g>
  <g class="nodes">
