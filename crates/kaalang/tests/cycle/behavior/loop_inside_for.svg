    <g class="parameter-panel" transform="translate(557 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">values: &amp;[u32]</tspan></text>
    </g>
    <g class="node start" transform="translate(201 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">loop_inside_for</tspan></text>
    </g>
    <g class="node action" transform="translate(201 194)">
