      M 201 1058 L 201 1130
      M 201 570 L 201 642
    "/>
    <path class="connection" d="
      M 561 922 L 761 922 L 761 570 L 201 570
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="214" y="423" xml:space="preserve"><tspan x="214" dy="0">value</tspan></text>
    <text class="connection-label" x="214" y="108" xml:space="preserve"><tspan x="214" dy="0">values</tspan></text>
    <text class="connection-label" x="214" y="244" xml:space="preserve"><tspan x="214" dy="0">mut total</tspan></text>
    <text class="connection-label" x="214" y="516" xml:space="preserve"><tspan x="214" dy="0">mut left</tspan></text>
    <text class="connection-label" x="214" y="732" xml:space="preserve"><tspan x="214" dy="0">_zero</tspan></text>
    <text class="connection-label" x="354" y="696" xml:space="preserve"><tspan x="354" dy="0">more</tspan></text>
    <text class="connection-label" x="574" y="868" xml:space="preserve"><tspan x="574" dy="0">counted</tspan></text>
    <text class="connection-label" x="214" y="151" xml:space="preserve"><tspan x="214" dy="0">()</tspan></text>
    <text class="connection-label" x="214" y="287" xml:space="preserve"><tspan x="214" dy="0">values</tspan></text>
    <text class="connection-label" x="214" y="631" xml:space="preserve"><tspan x="214" dy="0">&amp;left</tspan></text>
    <text class="connection-label" x="574" y="775" xml:space="preserve"><tspan x="574" dy="0">more, &amp;mut left, &amp;mut total</tspan></text>
    <text class="connection-label" x="214" y="1119" xml:space="preserve"><tspan x="214" dy="0">total</tspan></text>
  </g>
