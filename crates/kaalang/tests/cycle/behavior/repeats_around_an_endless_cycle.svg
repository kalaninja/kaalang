<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1328" viewBox="0 0 1840 1328" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for repeats_around_an_endless_cycle</title>
  <desc id="kaalang-description">Cycles: Settle the mode. with inputs mut mode and outputs leave; Serve requests forever. with inputs serve, mut mode and outputs (). Nodes: Start: repeats_around_an_endless_cycle with parameters mut mode: u8 handing over mut mode; Select: Which route? capturing &amp;mode; Case: Advance on the left. handing over left; Case: Serve forever. handing over serve; Case: Advance on the right. handing over right; Case: Leave. handing over leave; Action: Settle from the left. capturing left, &amp;mut mode handing over advanced; Select: Which request? capturing &amp;mode; Case: A read. handing over read; Case: A write. handing over write; Action: Serve a read. capturing read handing over served; Action: Serve a write. capturing write handing over served; Action: Settle from the right. capturing right, &amp;mut mode handing over advanced; End: u8 capturing mode; Merge: advanced; Merge: served. Connections: Start: repeats_around_an_endless_cycle to the entry of the cycle; Select: Which route? to Case: Advance on the left.; Select: Which route? to Case: Serve forever.; Select: Which route? to Case: Advance on the right.; Select: Which route? to Case: Leave.; Case: Advance on the left. to Action: Settle from the left.; Case: Serve forever. to the entry of the cycle; Case: Advance on the right. to Action: Settle from the right.; Case: Leave. to End: u8; Action: Settle from the left. to the advanced merge at the iteration tail of the cycle; Select: Which request? to Case: A read.; Select: Which request? to Case: A write.; Case: A read. to Action: Serve a read.; Case: A write. to Action: Serve a write.; Action: Serve a read. to the served merge at the iteration tail of the cycle; Action: Serve a write. to the served merge at the iteration tail of the cycle; Action: Settle from the right. to the advanced merge at the iteration tail of the cycle; the entry of the cycle to Select: Which route?; the entry of the cycle to Select: Which request?; Repeat from the served merge at the iteration tail of the cycle to the entry of the cycle; Repeat from the advanced merge at the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
