<svg xmlns="http://www.w3.org/2000/svg" width="708" height="1070" viewBox="0 0 708 1070" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for result_shapes</title>
  <desc id="kaalang-description">Cycles: Produce a named unit result. with inputs () and outputs ready; Produce a mutable scalar result. with inputs value and outputs mut adjusted; Declare a singleton output, which does not destructure. with inputs value and outputs single; Hand over a tuple-valued output whole. with inputs single and outputs pair. Nodes: Start: result_shapes with parameters value: usize handing over value; Action: Get ready. capturing nothing handing over ready; Action: Copy the value. capturing value handing over adjusted; Action: Adjust the mutable cycle result. capturing ready, &amp;mut adjusted; Action: Copy the value again. capturing value handing over single; Action: Build two results. capturing single handing over pair; Action: Destructure the pair after the cycle. capturing pair handing over left, right; End: (usize, usize, usize, usize) capturing adjusted, single, left, right. Connections: Start: result_shapes to Action: Get ready.; Action: Get ready. to Action: Copy the value.; Action: Copy the value. to Action: Adjust the mutable cycle result.; Action: Adjust the mutable cycle result. to Action: Copy the value again.; Action: Copy the value again. to Action: Build two results.; Action: Build two results. to Action: Destructure the pair after the cycle.; Action: Destructure the pair after the cycle. to End: (usize, usize, usize, usize).</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Produce a named unit result.</title>
    <rect class="cycle-boundary" x="32" y="127" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="141" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Produce a named </tspan><tspan x="356" dy="14">unit result.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Produce a mutable scalar result.</title>
    <rect class="cycle-boundary" x="32" y="263" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="277" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Produce a </tspan><tspan x="356" dy="14">mutable scala…</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Declare a singleton output, which does not destructure.</title>
    <rect class="cycle-boundary" x="32" y="535" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="549" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Declare a </tspan><tspan x="356" dy="14">singleton …</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Hand over a tuple-valued output whole.</title>
    <rect class="cycle-boundary" x="32" y="671" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="685" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Hand over a </tspan><tspan x="356" dy="14">tuple-valued …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 298
      M 200 362 L 200 434
      M 200 498 L 200 570
      M 200 634 L 200 706
      M 200 770 L 200 842
      M 200 908 L 200 980
    "/>
    <text class="connection-label" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="213" y="244" xml:space="preserve"><tspan x="213" dy="0">ready</tspan></text>
    <text class="connection-label" x="213" y="380" xml:space="preserve"><tspan x="213" dy="0">adjusted</tspan></text>
    <text class="connection-label" x="213" y="652" xml:space="preserve"><tspan x="213" dy="0">single</tspan></text>
    <text class="connection-label" x="213" y="788" xml:space="preserve"><tspan x="213" dy="0">pair</tspan></text>
    <text class="connection-label" x="213" y="926" xml:space="preserve"><tspan x="213" dy="0">left, right</tspan></text>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="287" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="213" y="423" xml:space="preserve"><tspan x="213" dy="0">ready, &amp;mut adjusted</tspan></text>
    <text class="connection-label" x="213" y="559" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="213" y="695" xml:space="preserve"><tspan x="213" dy="0">single</tspan></text>
    <text class="connection-label" x="213" y="831" xml:space="preserve"><tspan x="213" dy="0">pair</tspan></text>
    <text class="connection-label" x="213" y="969" xml:space="preserve"><tspan x="213" dy="0">adjusted, single, left, right</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">value: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">result_shapes</tspan></text>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">Get ready.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Get ready.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 330)">
      <title xml:space="preserve">Copy the value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Copy the value.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 466)">
      <title xml:space="preserve">Adjust the mutable cycle result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Adjust the mutable cycle result.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 602)">
      <title xml:space="preserve">Copy the value again.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Copy the value again.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 738)">
      <title xml:space="preserve">Build two results.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build two results.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 875)">
      <title xml:space="preserve">Destructure the pair after the cycle.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Destructure the pair after the </tspan><tspan x="-124" dy="18">cycle.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 1009)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(usize, usize, usize, usize)</tspan></text>
    </g>
  </g>
</svg>
