  <title id="kaalang-title">kaalang diagram for output_routes_after_a_merge</title>
  <desc id="kaalang-description">Cycles: Grade the mode. with inputs mode and outputs pass or fail. Nodes: Start: output_routes_after_a_merge with parameters double: bool; mode: u8 handing over double, mode; Question: Double the score? capturing double handing over twice / once; Action: Use a factor of two. capturing twice handing over factor; Action: Use a factor of one. capturing once handing over factor; Select: Which grade? capturing mode; Case: Top marks. handing over top; Case: Enough marks. handing over enough; Case: Too few marks. handing over fail; Action: Pass with top marks. capturing top handing over pass; Action: Pass with enough marks. capturing enough handing over pass; Action: Score the pass. capturing pass, factor handing over score; Action: Score the failure. capturing fail handing over score; End: u32 capturing score; Merge: factor; Merge: pass; Merge: score. Connections: Start: output_routes_after_a_merge to Question: Double the score?; Question: Double the score? branch 1 to Action: Use a factor of two.; Question: Double the score? branch 2 to Action: Use a factor of one.; Action: Use a factor of two. to the factor merge; Action: Use a factor of one. to the factor merge; Select: Which grade? to Case: Top marks.; Select: Which grade? to Case: Enough marks.; Select: Which grade? to Case: Too few marks.; Case: Top marks. to Action: Pass with top marks.; Case: Enough marks. to Action: Pass with enough marks.; Case: Too few marks. to the fail result of the cycle; Action: Pass with top marks. to the pass merge at the pass result of the cycle; Action: Pass with enough marks. to the pass merge at the pass result of the cycle; Action: Score the pass. to the score merge; Action: Score the failure. to the score merge; the factor merge to Select: Which grade?; the pass merge at the pass result of the cycle to Action: Score the pass.; the score merge to End: u32; the fail result of the cycle to Action: Score the failure..</desc>
