<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1414" viewBox="0 0 1536 1414" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for inner_routes_before_a_question</title>
  <desc id="kaalang-description">Cycles: Classify the value. with inputs value, flag and outputs first or second; Sort the value. with inputs value and outputs tiny or larger. Nodes: Start: inner_routes_before_a_question with parameters value: u8; flag: u8 handing over value, flag; Question: Is it below ten? capturing value handing over low / high; Question: Is it below five? capturing low, value handing over below / small; Action: Mark a tiny value. capturing below handing over tiny; Action: Mark a small value. capturing small handing over larger; Action: Mark a high value. capturing high handing over larger; Action: Take the first class for a tiny value. capturing tiny handing over first; Question: Is the flag even? capturing larger, flag handing over even / odd; Action: Take the first class for an even flag. capturing even handing over first; Action: Take the second class. capturing odd handing over second; Action: Keep the first class. capturing first handing over result; Action: Scale the second class. capturing second handing over result; End: u8 capturing result; Merge: larger; Merge: first; Merge: result. Connections: Start: inner_routes_before_a_question to the cycle entry; Question: Is it below ten? branch 1 to Question: Is it below five?; Question: Is it below ten? branch 2 to Action: Mark a high value.; Question: Is it below five? branch 1 to Action: Mark a tiny value.; Question: Is it below five? branch 2 to Action: Mark a small value.; Action: Mark a tiny value. to the tiny result of the cycle; Action: Mark a small value. to the larger merge at the larger result of the cycle; Action: Mark a high value. to the larger merge at the larger result of the cycle; Action: Take the first class for a tiny value. to the first merge at the first result of the cycle; Question: Is the flag even? branch 1 to Action: Take the first class for an even flag.; Question: Is the flag even? branch 2 to Action: Take the second class.; Action: Take the first class for an even flag. to the first merge at the first result of the cycle; Action: Take the second class. to the second result of the cycle; Action: Keep the first class. to the result merge; Action: Scale the second class. to the result merge; the larger merge at the larger result of the cycle to Question: Is the flag even?; the first merge at the first result of the cycle to Action: Keep the first class.; the result merge to End: u8; the cycle entry to Question: Is it below ten?; the second result of the cycle to Action: Scale the second class.; the tiny result of the cycle to Action: Take the first class for a tiny value..</desc>
