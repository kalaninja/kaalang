    <text class="connection-label" x="186" y="575" xml:space="preserve"><tspan x="186" dy="0">value, &amp;mut total</tspan></text>
    <text class="connection-label" x="546" y="439" xml:space="preserve"><tspan x="546" dy="0">single, values</tspan></text>
    <text class="connection-label" x="546" y="575" xml:space="preserve"><tspan x="546" dy="0">value, &amp;mut total</tspan></text>
