<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1186" viewBox="0 0 1480 1186" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for for_on_each_branch</title>
  <desc id="kaalang-description">Cycles: Add every value twice. with inputs double, values, mut total and outputs counted; Add every value once. with inputs single, values, mut total and outputs counted. Nodes: Start: for_on_each_branch with parameters values: &amp;[i64]; twice: bool handing over values, twice; Action: Start with a total of zero. capturing nothing handing over mut total; Question: Should every value count twice? capturing twice handing over double / single; Select: Add every value twice. capturing nothing; Case: Take the next item. handing over value; Case: No item is left. handing over counted; Action: Add the value twice. capturing value, &amp;mut total; Select: Add every value once. capturing nothing; Case: Take the next item. handing over value; Case: No item is left. handing over counted; Action: Add the value. capturing value, &amp;mut total; End: i64 capturing total; Merge: counted. Connections: Start: for_on_each_branch to Action: Start with a total of zero.; Action: Start with a total of zero. to Question: Should every value count twice?; Question: Should every value count twice? branch 1 to the entry of the cycle; Question: Should every value count twice? branch 2 to the entry of the cycle; Select: Add every value twice. to Case: Take the next item.; Select: Add every value twice. to Case: No item is left.; Case: Take the next item. to Action: Add the value twice.; Case: No item is left. to the counted merge; Action: Add the value twice. to the iteration tail of the cycle; Select: Add every value once. to Case: Take the next item.; Select: Add every value once. to Case: No item is left.; Case: Take the next item. to Action: Add the value.; Case: No item is left. to the counted merge; Action: Add the value. to the iteration tail of the cycle; the counted merge to End: i64; the entry of the cycle to Select: Add every value twice.; the entry of the cycle to Select: Add every value once.; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
