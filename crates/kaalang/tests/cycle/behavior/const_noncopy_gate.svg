<svg xmlns="http://www.w3.org/2000/svg" width="708" height="388" viewBox="0 0 708 388" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for const_noncopy_gate</title>
  <desc id="kaalang-description">Cycles: Read an owned gate without moving it. with inputs gate and outputs result. Nodes: Start: const const_noncopy_gate with parameters gate: Gate handing over gate; Action: Borrow the original gate. capturing &amp;gate handing over result; End: u8 capturing result. Connections: Start: const const_noncopy_gate to Action: Borrow the original gate.; Action: Borrow the original gate. to End: u8.</desc>
  <defs>
