<svg xmlns="http://www.w3.org/2000/svg" width="788" height="1125" viewBox="0 0 788 1125" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for for_with_an_endless_body</title>
  <desc id="kaalang-description">Cycles: Spin on the first value, if there is one. with inputs values, mut total and outputs (); Spin forever. with inputs () and outputs (). Nodes: Start: for_with_an_endless_body with parameters values: &amp;[u32] handing over values; Action: Start with a total of zero. capturing nothing handing over mut total; Select: Spin on the first value, if there is one. capturing nothing; Case: Take the next item. handing over value; Case: No item is left.; Action: Take the value. capturing value, &amp;mut total; Action: Wait. capturing nothing handing over waited; End: u32 capturing total. Connections: Start: for_with_an_endless_body to Action: Start with a total of zero.; Action: Start with a total of zero. to Select: Spin on the first value, if there is one.; Select: Spin on the first value, if there is one. to Case: Take the next item.; Select: Spin on the first value, if there is one. to Case: No item is left.; Case: Take the next item. to Action: Take the value.; Case: No item is left. to End: u32; Action: Take the value. to the entry of the cycle; Action: Wait. to the iteration tail of the cycle; the entry of the cycle to Action: Wait.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
