      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Produce a mutable scalar </tspan><tspan x="-124" dy="18">result.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 468)">
      <title xml:space="preserve">Adjust the mutable cycle result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Adjust the mutable cycle result.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 605)">
      <title xml:space="preserve">Declare a singleton output, which does not destructure.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Declare a singleton output, </tspan><tspan x="-124" dy="18">which does not destructure.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node loop" transform="translate(172 743)">
      <title xml:space="preserve">Hand over a tuple-valued output whole.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Hand over a tuple-valued </tspan><tspan x="-124" dy="18">output whole.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 881)">
      <title xml:space="preserve">Destructure the pair after the cycle.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Destructure the pair after the </tspan><tspan x="-124" dy="18">cycle.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 1015)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(usize, usize, usize, usize)</tspan></text>
    </g>
  </g>
</svg>
