<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1076" viewBox="0 0 680 1076" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for result_shapes</title>
  <desc id="kaalang-description">Nodes: Start: result_shapes with parameters value: usize handing over value; Cycle: Produce a named unit result. capturing nothing handing over ready; Cycle: Produce a mutable scalar result. capturing value handing over mut adjusted; Action: Adjust the mutable cycle result. capturing ready, &amp;mut adjusted; Cycle: Declare a singleton output, which does not destructure. capturing value handing over single; Cycle: Hand over a tuple-valued output whole. capturing single handing over pair; Action: Destructure the pair after the cycle. capturing pair handing over left, right; End: (usize, usize, usize, usize) capturing adjusted, single, left, right. Connections: Start: result_shapes to Cycle: Produce a named unit result.; Cycle: Produce a named unit result. to Cycle: Produce a mutable scalar result.; Cycle: Produce a mutable scalar result. to Action: Adjust the mutable cycle result.; Action: Adjust the mutable cycle result. to Cycle: Declare a singleton output, which does not destructure.; Cycle: Declare a singleton output, which does not destructure. to Cycle: Hand over a tuple-valued output whole.; Cycle: Hand over a tuple-valued output whole. to Action: Destructure the pair after the cycle.; Action: Destructure the pair after the cycle. to End: (usize, usize, usize, usize).</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 226 L 172 298
      M 172 364 L 172 436
      M 172 500 L 172 572
      M 172 638 L 172 710
      M 172 776 L 172 848
      M 172 914 L 172 986
    "/>
    <text class="connection-label" x="185" y="699" xml:space="preserve"><tspan x="185" dy="0">single</tspan></text>
    <text class="connection-label" x="185" y="837" xml:space="preserve"><tspan x="185" dy="0">pair</tspan></text>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="244" xml:space="preserve"><tspan x="185" dy="0">ready</tspan></text>
    <text class="connection-label" x="185" y="382" xml:space="preserve"><tspan x="185" dy="0">mut adjusted</tspan></text>
    <text class="connection-label" x="185" y="932" xml:space="preserve"><tspan x="185" dy="0">left, right</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
    <text class="connection-label" x="185" y="287" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="425" xml:space="preserve"><tspan x="185" dy="0">ready, &amp;mut adjusted</tspan></text>
    <text class="connection-label" x="185" y="561" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="975" xml:space="preserve"><tspan x="185" dy="0">adjusted, single, left, right</tspan></text>
  </g>
