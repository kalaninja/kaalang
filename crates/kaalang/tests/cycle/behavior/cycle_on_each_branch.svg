<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="908" viewBox="0 0 1500 908" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for cycle_on_each_branch</title>
  <desc id="kaalang-description">Cycles: Count up to ten. with inputs rise, mut n and outputs done; Count down to zero. with inputs fall, mut n and outputs done. Nodes: Start: cycle_on_each_branch with parameters up: bool; mut n: u32 handing over up, mut n; Question: Count up? capturing up handing over rise / fall; Question: Reached ten? capturing &amp;n handing over done / more; Action: Step up. capturing more, &amp;mut n handing over stepped; Question: Reached zero? capturing &amp;n handing over done / more; Action: Step down. capturing more, &amp;mut n handing over stepped; End: u32 capturing n; Merge: done. Connections: Start: cycle_on_each_branch to Question: Count up?; Question: Count up? branch 1 to the entry of the cycle; Question: Count up? branch 2 to the entry of the cycle; Question: Reached ten? branch 1 to the done merge; Question: Reached ten? branch 2 to Action: Step up.; Action: Step up. to the iteration tail of the cycle; Question: Reached zero? branch 1 to the done merge; Question: Reached zero? branch 2 to Action: Step down.; Action: Step down. to the iteration tail of the cycle; the done merge to End: u32; the entry of the cycle to Question: Reached ten?; the entry of the cycle to Question: Reached zero?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count up to ten.</title>
    <rect class="cycle-boundary" x="32" y="279" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="736" y="293" text-anchor="end" xml:space="preserve"><tspan x="736" dy="0">Count up to ten.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Count down to zero.</title>
    <rect class="cycle-boundary" x="752" y="279" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="1456" y="293" text-anchor="end" xml:space="preserve"><tspan x="1456" dy="0">Count down to zero.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 94 L 200 170
      M 200 242 L 200 314
      M 340 206 L 920 206 L 920 314
      M 200 458 L 200 742
      M 340 422 L 560 422 L 560 530
      M 560 594 L 560 666
      M 920 458 L 920 742 L 200 742
      M 1060 422 L 1280 422 L 1280 530
      M 1280 594 L 1280 666
      M 200 742 L 200 818
      M 200 314 L 200 386
      M 920 314 L 920 386
    "/>
    <path class="connection" d="
      M 1280 666 L 1440 666 L 1440 314 L 920 314
    " marker-end="url(#back-edge-arrow)"/>
    <path class="connection" d="
      M 560 666 L 720 666 L 720 314 L 200 314
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="213" y="760" xml:space="preserve"><tspan x="213" dy="0">done</tspan></text>
    <text class="connection-label" x="213" y="112" xml:space="preserve"><tspan x="213" dy="0">up, mut n</tspan></text>
    <text class="connection-label" x="213" y="260" xml:space="preserve"><tspan x="213" dy="0">rise</tspan></text>
    <text class="connection-label" x="353" y="224" xml:space="preserve"><tspan x="353" dy="0">fall</tspan></text>
    <text class="connection-label" x="353" y="440" xml:space="preserve"><tspan x="353" dy="0">more</tspan></text>
    <text class="connection-label" x="573" y="612" xml:space="preserve"><tspan x="573" dy="0">stepped</tspan></text>
    <text class="connection-label" x="1073" y="440" xml:space="preserve"><tspan x="1073" dy="0">more</tspan></text>
    <text class="connection-label" x="1293" y="612" xml:space="preserve"><tspan x="1293" dy="0">stepped</tspan></text>
    <text class="connection-label" x="213" y="159" xml:space="preserve"><tspan x="213" dy="0">up</tspan></text>
    <text class="connection-label" x="213" y="375" xml:space="preserve"><tspan x="213" dy="0">&amp;n</tspan></text>
    <text class="connection-label" x="573" y="519" xml:space="preserve"><tspan x="573" dy="0">more, &amp;mut n</tspan></text>
    <text class="connection-label" x="933" y="375" xml:space="preserve"><tspan x="933" dy="0">&amp;n</tspan></text>
    <text class="connection-label" x="1293" y="519" xml:space="preserve"><tspan x="1293" dy="0">more, &amp;mut n</tspan></text>
    <text class="connection-label" x="213" y="807" xml:space="preserve"><tspan x="213" dy="0">n</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 65 L 436 65"/>
    <g class="parameter-panel" transform="translate(556 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">up: bool</tspan><tspan x="-104" dy="18">mut n: u32</tspan></text>
    </g>
    <g class="node merge" transform="translate(200 742)">
      <title xml:space="preserve">the done merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(200 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">cycle_on_each_branch</tspan></text>
    </g>
    <g class="node question" transform="translate(200 206)">
      <title xml:space="preserve">Count up?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Count up?</tspan></text>
    </g>
    <g class="node question" transform="translate(200 422)">
      <title xml:space="preserve">Reached ten?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Reached ten?</tspan></text>
    </g>
    <g class="node action" transform="translate(560 562)">
      <title xml:space="preserve">Step up.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Step up.</tspan></text>
    </g>
    <g class="node question" transform="translate(920 422)">
      <title xml:space="preserve">Reached zero?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Reached zero?</tspan></text>
    </g>
    <g class="node action" transform="translate(1280 562)">
      <title xml:space="preserve">Step down.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Step down.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 847)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
