<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="604" viewBox="0 0 1064 604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for three_outputs</title>
  <desc id="kaalang-description">Nodes: Start: three_outputs with parameters mut state: u8 handing over mut state; Cycle: Settle on a colour. capturing mut state handing over red / green / blue; Action: Score red. capturing red handing over score; Action: Score green. capturing green handing over score; Action: Score blue. capturing blue handing over score; End: u8 capturing score; Merge: score. Connections: Start: three_outputs to Cycle: Settle on a colour.; Cycle: Settle on a colour. output red to Action: Score red.; Cycle: Settle on a colour. output green to Action: Score green.; Cycle: Settle on a colour. output blue to Action: Score blue.; Action: Score red. to the score merge; Action: Score green. to the score merge; Action: Score blue. to the score merge; the score merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 226 L 172 298
      M 312 194 L 532 194 L 532 298
      M 312 194 L 892 194 L 892 298
      M 172 362 L 172 438
      M 532 362 L 532 438 L 172 438
      M 892 362 L 892 438 L 172 438
      M 172 438 L 172 514
    "/>
    <text class="connection-label" x="185" y="456" xml:space="preserve"><tspan x="185" dy="0">score</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">mut state</tspan></text>
    <text class="connection-label" x="185" y="287" xml:space="preserve"><tspan x="185" dy="0">red</tspan></text>
    <text class="connection-label" x="545" y="287" xml:space="preserve"><tspan x="545" dy="0">green</tspan></text>
    <text class="connection-label" x="905" y="287" xml:space="preserve"><tspan x="905" dy="0">blue</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut state: u8</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 438)">
      <title xml:space="preserve">the score merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">three_outputs</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 194)">
      <title xml:space="preserve">Settle on a colour.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64" rx="8"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Settle on a colour.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 330)">
      <title xml:space="preserve">Score red.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Score red.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 330)">
      <title xml:space="preserve">Score green.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Score green.</tspan></text>
    </g>
    <g class="node action" transform="translate(892 330)">
      <title xml:space="preserve">Score blue.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Score blue.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 543)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
    </g>
  </g>
</svg>
