      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use an empty record.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 1354)">
      <title xml:space="preserve">Format the record.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Format the record.</tspan></text>
    </g>
    <g class="node action" transform="translate(1252 1138)">
