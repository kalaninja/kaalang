      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">bypass_merges_with_outputs</tspan></text>
    </g>
    <g class="node question" transform="translate(172 224)">
      <title xml:space="preserve">Is the record cached?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the record cached?</tspan></text>
    </g>
    <g class="node select" transform="translate(532 504)">
