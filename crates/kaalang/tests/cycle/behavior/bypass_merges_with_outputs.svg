    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">cached: bool</tspan><tspan x="-104" dy="18">response: u8</tspan><tspan x="-104" dy="18">mut retries: u8</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 1246)">
      <title xml:space="preserve">the record merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node merge" transform="translate(172 1462)">
      <title xml:space="preserve">the answer merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 74)">
