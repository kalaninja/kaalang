    <text class="connection-label" x="1625" y="980" xml:space="preserve"><tspan x="1625" dy="0">spent</tspan></text>
    <text class="connection-label" x="185" y="177" xml:space="preserve"><tspan x="185" dy="0">cached</tspan></text>
