    <text class="connection-label" x="1265" y="743" xml:space="preserve"><tspan x="1265" dy="0">busy, &amp;retries</tspan></text>
    <text class="connection-label" x="1625" y="887" xml:space="preserve"><tspan x="1625" dy="0">retry, &amp;mut retries</tspan></text>
    <text class="connection-label" x="545" y="1095" xml:space="preserve"><tspan x="545" dy="0">found</tspan></text>
    <text class="connection-label" x="905" y="1095" xml:space="preserve"><tspan x="905" dy="0">missing</tspan></text>
    <text class="connection-label" x="1265" y="1095" xml:space="preserve"><tspan x="1265" dy="0">gave_up</tspan></text>
  </g>
  <g class="nodes">
