      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">What did the source </tspan><tspan x="0" dy="18">answer?</tspan></text>
    </g>
    <g class="node case" transform="translate(532 647)">
      <title xml:space="preserve">The record.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">The record.</tspan></text>
    </g>
    <g class="node case" transform="translate(892 647)">
