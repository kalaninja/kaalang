<svg xmlns="http://www.w3.org/2000/svg" width="1832" height="1628" viewBox="0 0 1832 1628" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for bypass_merges_with_outputs</title>
  <desc id="kaalang-description">Cycles: Query the source until it answers or the retries run out. with inputs query, response, mut retries and outputs found or missing or gave_up. Nodes: Start: bypass_merges_with_outputs with parameters cached: bool; response: u8; mut retries: u8 handing over cached, response, mut retries; Question: Is the record cached? capturing cached handing over hit_cache / query; Select: What did the source answer? capturing response; Case: The record. handing over found; Case: No such record. handing over missing; Case: A busy signal. handing over busy; Question: Have the retries run out? capturing busy, &amp;retries handing over gave_up / retry; Action: Spend one retry. capturing retry, &amp;mut retries handing over spent; Action: Use the cached record. capturing hit_cache handing over record; Action: Use the fetched record. capturing found handing over record; Action: Use an empty record. capturing missing handing over record; Action: Format the record. capturing record handing over answer; Action: Report that the source gave up. capturing gave_up handing over answer; End: u8 capturing answer; Merge: record; Merge: answer. Connections: Start: bypass_merges_with_outputs to Question: Is the record cached?; Question: Is the record cached? branch 1 to Action: Use the cached record.; Question: Is the record cached? branch 2 to the entry of the cycle; Select: What did the source answer? to Case: The record.; Select: What did the source answer? to Case: No such record.; Select: What did the source answer? to Case: A busy signal.; Case: The record. to the found result of the cycle; Case: No such record. to the missing result of the cycle; Case: A busy signal. to Question: Have the retries run out?; Question: Have the retries run out? branch 1 to the gave_up result of the cycle; Question: Have the retries run out? branch 2 to Action: Spend one retry.; Action: Spend one retry. to the iteration tail of the cycle; Action: Use the cached record. to the record merge; Action: Use the fetched record. to the record merge; Action: Use an empty record. to the record merge; Action: Format the record. to the answer merge; Action: Report that the source gave up. to the answer merge; the record merge to Action: Format the record.; the answer merge to End: u8; the entry of the cycle to Select: What did the source answer?; the found result of the cycle to Action: Use the fetched record.; the missing result of the cycle to Action: Use an empty record.; the gave_up result of the cycle to Action: Report that the source gave up.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Query the source until it answers or the retries run out.</title>
    <rect class="cycle-boundary" x="364" y="329" width="1436" height="740" rx="12"/>
    <text class="cycle-caption" x="1788" y="343" text-anchor="end" xml:space="preserve"><tspan x="1788" dy="0">Query the source until it answers or the retries run out.</tspan></text>
    </g>
  </g>
