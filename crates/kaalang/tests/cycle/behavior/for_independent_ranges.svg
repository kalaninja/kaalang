<svg xmlns="http://www.w3.org/2000/svg" width="682" height="1076" viewBox="0 0 682 1076" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for for_independent_ranges</title>
  <desc id="kaalang-description">Cycles: Visit every row. with inputs rows, columns, mut visited and outputs (); Visit every column. with inputs columns, mut visited and outputs (). Nodes: Start: for_independent_ranges with parameters rows: u32; columns: u32 handing over rows, columns; Action: Start with no visited cells. capturing nothing handing over mut visited; For entry: Visit every row. capturing rows; For entry: Visit every column. capturing columns; Action: Count one cell. capturing &amp;mut visited; For end: Visit every column.; For end: Visit every row.; End: u32 capturing visited. Connections: Start: for_independent_ranges to Action: Start with no visited cells.; Action: Start with no visited cells. to For entry: Visit every row.; For entry: Visit every row. to For entry: Visit every column.; For entry: Visit every column. to Action: Count one cell.; Action: Count one cell. to For end: Visit every column.; For end: Visit every column. to For end: Visit every row.; For end: Visit every row. to End: u32.</desc>
