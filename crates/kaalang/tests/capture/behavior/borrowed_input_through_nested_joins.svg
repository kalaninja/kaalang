  <desc id="kaalang-description">Nodes: Start: borrowed_input_through_nested_joins with parameters outer: bool; inner: bool; text: String handing over outer, inner, text; Question: Use the nested branch? capturing outer handing over nested / fallback; Question: Borrow the flow input? capturing nested, inner handing over borrow / skip; Action: Borrow the flow input. capturing borrow, &amp;text handing over partial; Action: Use the inner fallback. capturing skip handing over partial; Action: Carry the inner view onward. capturing partial handing over view; Action: Use the outer fallback. capturing fallback handing over view; Action: Measure the final view. capturing view handing over end; End: usize capturing end. Connections: Start: borrowed_input_through_nested_joins to Question: Use the nested branch?; Question: Use the nested branch? branch 1 to Question: Borrow the flow input?; Question: Use the nested branch? branch 2 to Action: Use the outer fallback.; Question: Borrow the flow input? branch 1 to Action: Borrow the flow input.; Question: Borrow the flow input? branch 2 to Action: Use the inner fallback.; Action: Borrow the flow input. to the partial merge; Action: Use the inner fallback. to the partial merge; Action: Carry the inner view onward. to the view merge; Action: Use the outer fallback. to the view merge; Action: Measure the final view. to End: usize; the partial merge to Action: Carry the inner view onward.; the view merge to Action: Measure the final view..</desc>
