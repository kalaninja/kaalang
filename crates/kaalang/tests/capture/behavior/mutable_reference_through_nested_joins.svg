<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1260" viewBox="0 0 1064 1260" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for mutable_reference_through_nested_joins</title>
  <desc id="kaalang-description">Nodes: Start: mutable_reference_through_nested_joins with parameters outer: bool; inner: bool; mut text: String handing over outer, inner, mut text; Question: Use the nested branch? capturing outer handing over nested / fallback; Question: Choose the inner mutation. capturing nested, inner handing over first / second; Action: Borrow and append the first suffix. capturing first, &amp;mut text handing over partial; Action: Borrow and append the second suffix. capturing second, &amp;mut text handing over partial; Action: Carry the borrowed value onward. capturing partial handing over view; Action: Borrow on the fallback branch. capturing fallback, &amp;mut text handing over view; Action: Mutate through the reference after both joins. capturing view handing over length; Action: Move the owner after the reference&apos;s last use. capturing text, length handing over result; End: (String, usize) capturing result. Connections: Start: mutable_reference_through_nested_joins to Question: Use the nested branch?; Question: Use the nested branch? branch 1 to Question: Choose the inner mutation.; Question: Use the nested branch? branch 2 to Action: Borrow on the fallback branch.; Question: Choose the inner mutation. branch 1 to Action: Borrow and append the first suffix.; Question: Choose the inner mutation. branch 2 to Action: Borrow and append the second suffix.; Action: Borrow and append the first suffix. to the partial merge; Action: Borrow and append the second suffix. to the partial merge; Action: Carry the borrowed value onward. to the view merge; Action: Borrow on the fallback branch. to the view merge; Action: Mutate through the reference after both joins. to Action: Move the owner after the reference&apos;s last use.; Action: Move the owner after the reference&apos;s last use. to End: (String, usize); the partial merge to Action: Carry the borrowed value onward.; the view merge to Action: Mutate through the reference after both joins..</desc>
