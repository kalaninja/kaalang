<svg xmlns="http://www.w3.org/2000/svg" width="704" height="876" viewBox="0 0 704 876" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for temporary_borrow_within_branch</title>
  <desc id="kaalang-description">Nodes: Start: temporary_borrow_within_branch with parameters condition: bool handing over condition; Question: Build the temporary text? capturing condition handing over yes / no; Action: Borrow the temporary text. capturing yes handing over owner; Action: Measure the borrowed text. capturing &amp;owner handing over size; Action: Use an empty size. capturing no handing over size; Action: Finish with the merged size. capturing size handing over result; End: usize capturing result. Connections: Start: temporary_borrow_within_branch to Question: Build the temporary text?; Question: Build the temporary text? branch 1 to Action: Borrow the temporary text.; Question: Build the temporary text? branch 2 to Action: Use an empty size.; Action: Borrow the temporary text. to Action: Measure the borrowed text.; Action: Measure the borrowed text. to the size merge; Action: Use an empty size. to the size merge; Action: Finish with the merged size. to End: usize; the size merge to Action: Finish with the merged size..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
