<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for temporary_borrow_within_branch</title>
  <desc id="kaalang-description">Nodes: Start: temporary_borrow_within_branch with parameters condition: bool handing over condition; Question: Build the temporary text? capturing condition handing over yes / no; Action: Borrow the temporary text. capturing yes handing over owner; Action: Measure the borrowed text. capturing &amp;owner handing over size; Action: Use an empty size. capturing no handing over size; End: usize capturing size; Merge: size. Connections: Start: temporary_borrow_within_branch to Question: Build the temporary text?; Question: Build the temporary text? branch 1 to Action: Borrow the temporary text.; Question: Build the temporary text? branch 2 to Action: Use an empty size.; Action: Borrow the temporary text. to Action: Measure the borrowed text.; Action: Measure the borrowed text. to the size merge; Action: Use an empty size. to the size merge; the size merge to End: usize.</desc>
  <defs>
    <style>
