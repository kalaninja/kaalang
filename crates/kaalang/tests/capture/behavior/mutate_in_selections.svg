  <title id="kaalang-title">kaalang diagram for mutate_in_selections</title>
  <desc id="kaalang-description">Nodes: Start: mutate_in_selections with parameters mut text: String; count: u8; mode: u8 handing over mut text, count, mode; Question: Use the choice after changing the text? capturing &amp;mut text, mut count handing over yes / no; Select: Change the text and choose a suffix. capturing yes, &amp;mut text, mut mode; Case: First suffix. handing over first; Case: Second suffix. handing over second; Action: Consume and extend the first case value. capturing mut first, &amp;mut text handing over selected; Action: Consume and extend the second case value. capturing mut second, &amp;mut text handing over selected; Action: Skip the choice. capturing no handing over selected; Action: Return the text and selected suffix. capturing text, selected handing over result; End: String capturing result. Connections: Start: mutate_in_selections to Question: Use the choice after changing the text?; Question: Use the choice after changing the text? branch 1 to Select: Change the text and choose a suffix.; Question: Use the choice after changing the text? branch 2 to Action: Skip the choice.; Select: Change the text and choose a suffix. to Case: First suffix.; Select: Change the text and choose a suffix. to Case: Second suffix.; Case: First suffix. to Action: Consume and extend the first case value.; Case: Second suffix. to Action: Consume and extend the second case value.; Action: Consume and extend the first case value. to the selected merge; Action: Consume and extend the second case value. to the selected merge; Action: Skip the choice. to the selected merge; Action: Return the text and selected suffix. to End: String; the selected merge to Action: Return the text and selected suffix..</desc>
