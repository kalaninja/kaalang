    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="244" xml:space="preserve"><tspan x="185" dy="0">next</tspan></text>
    <text class="connection-label" x="185" y="287" xml:space="preserve"><tspan x="185" dy="0">&amp;value</tspan></text>
    <text class="connection-label" x="185" y="423" xml:space="preserve"><tspan x="185" dy="0">next</tspan></text>
  </g>
  <g class="nodes">
