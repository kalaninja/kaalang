<svg xmlns="http://www.w3.org/2000/svg" width="704" height="622" viewBox="0 0 704 622" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for mutably_borrowed_question_output</title>
  <desc id="kaalang-description">Nodes: Start: mutably_borrowed_question_output with parameters condition: bool handing over condition; Question: Select a branch. capturing condition handing over mut yes / no; Action: Mutably borrow the selected branch output. capturing &amp;mut yes handing over end; Action: Use the other branch. capturing no handing over end; End: u8 capturing end; Merge: end. Connections: Start: mutably_borrowed_question_output to Question: Select a branch.; Question: Select a branch. branch 1 to Action: Mutably borrow the selected branch output.; Question: Select a branch. branch 2 to Action: Use the other branch.; Action: Mutably borrow the selected branch output. to the end merge; Action: Use the other branch. to the end merge; the end merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 98 L 172 170
      M 172 242 L 172 314
      M 312 206 L 532 206 L 532 315
      M 172 380 L 172 456
      M 532 379 L 532 456 L 172 456
      M 172 456 L 172 532
    "/>
    <text class="connection-label" x="185" y="474" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">condition</tspan></text>
    <text class="connection-label" x="545" y="304" xml:space="preserve"><tspan x="545" dy="0">no</tspan></text>
    <text class="connection-label" x="185" y="260" xml:space="preserve"><tspan x="185" dy="0">mut yes</tspan></text>
    <text class="connection-label" x="185" y="303" xml:space="preserve"><tspan x="185" dy="0">&amp;mut yes</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
