  <desc id="kaalang-description">Nodes: Start: mutate_merged_branch_outputs with parameters condition: bool; mode: bool handing over condition, mode; Question: Provide the value directly? capturing condition handing over mut selected / choose; Select: Choose the alternative producer. capturing choose, mode; Case: Provide the value directly. handing over mut selected; Case: Produce it in an action. handing over prepare; Action: Produce the final alternative. capturing prepare handing over mut selected; Action: Mutate only after the branch outputs merge. capturing &amp;mut selected handing over end; End: usize capturing end; Merge: mut selected. Connections: Start: mutate_merged_branch_outputs to Question: Provide the value directly?; Question: Provide the value directly? branch 1 to the mut selected merge; Question: Provide the value directly? branch 2 to Select: Choose the alternative producer.; Select: Choose the alternative producer. to Case: Provide the value directly.; Select: Choose the alternative producer. to Case: Produce it in an action.; Case: Provide the value directly. to the mut selected merge; Case: Produce it in an action. to Action: Produce the final alternative.; Action: Produce the final alternative. to the mut selected merge; Action: Mutate only after the branch outputs merge. to End: usize; the mut selected merge to Action: Mutate only after the branch outputs merge..</desc>
