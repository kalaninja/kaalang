      M 172 226 L 172 298
      M 172 364 L 172 436
      M 172 500 L 172 572
    "/>
    <text class="connection-label" x="185" y="395" xml:space="preserve"><tspan x="185" dy="0">length</tspan></text>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">&amp;value</tspan></text>
    <text class="connection-label" x="185" y="287" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
  </g>
  <g class="nodes">
