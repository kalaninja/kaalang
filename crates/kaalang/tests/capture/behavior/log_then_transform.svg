      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">value: String</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">log_then_transform</tspan></text>
    </g>
    <g class="node action" transform="translate(172 194)">
