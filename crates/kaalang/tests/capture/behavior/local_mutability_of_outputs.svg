  <desc id="kaalang-description">Nodes: Start: local_mutability_of_outputs with parameters input: String; number: u32 handing over input, number; Action: Produce immutable wires. capturing input, number handing over text, count; Action: Change the owned text and a local copy of the count. capturing mut text, mut count handing over mut changed, incremented; Action: Return both counts and the changed text. capturing changed, incremented, count handing over mut end; End: (String, u32, u32) capturing end. Connections: Start: local_mutability_of_outputs to Action: Produce immutable wires.; Action: Produce immutable wires. to Action: Change the owned text and a local copy of the count.; Action: Change the owned text and a local copy of the count. to Action: Return both counts and the changed text.; Action: Return both counts and the changed text. to End: (String, u32, u32).</desc>
