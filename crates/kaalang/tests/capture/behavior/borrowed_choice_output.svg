<svg xmlns="http://www.w3.org/2000/svg" width="704" height="754" viewBox="0 0 704 754" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for borrowed_choice_output</title>
  <desc id="kaalang-description">Nodes: Start: borrowed_choice_output with parameters input: Option&lt;u8&gt; handing over input; Select: Was a value supplied? capturing input; Case: A value is available. handing over value; Case: No value is available. handing over absent; Action: Borrow the supplied value. capturing &amp;value handing over end; Action: Produce the absent result. capturing absent handing over end; End: u8 capturing end; Merge: end. Connections: Start: borrowed_choice_output to Select: Was a value supplied?; Select: Was a value supplied? to Case: A value is available.; Select: Was a value supplied? to Case: No value is available.; Case: A value is available. to Action: Borrow the supplied value.; Case: No value is available. to Action: Produce the absent result.; Action: Borrow the supplied value. to the end merge; Action: Produce the absent result. to the end merge; the end merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 234 L 172 306
      M 300 198 L 532 198 L 532 306
      M 172 376 L 172 448
      M 532 376 L 532 448
      M 172 512 L 172 588
      M 532 512 L 532 588 L 172 588
      M 172 588 L 172 664
    "/>
    <text class="connection-label" x="185" y="606" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">input</tspan></text>
    <text class="connection-label" x="545" y="437" xml:space="preserve"><tspan x="545" dy="0">absent</tspan></text>
    <text class="connection-label" x="185" y="394" xml:space="preserve"><tspan x="185" dy="0">value</tspan></text>
    <text class="connection-label" x="185" y="437" xml:space="preserve"><tspan x="185" dy="0">&amp;value</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">input: Option&lt;u8&gt;</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 588)">
      <title xml:space="preserve">the end merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">borrowed_choice_output</tspan></text>
    </g>
    <g class="node select" transform="translate(172 198)">
      <title xml:space="preserve">Was a value supplied?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Was a value supplied?</tspan></text>
    </g>
    <g class="node case" transform="translate(172 341)">
      <title xml:space="preserve">A value is available.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">A value is available.</tspan></text>
    </g>
    <g class="node case" transform="translate(532 341)">
      <title xml:space="preserve">No value is available.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">No value is available.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 480)">
      <title xml:space="preserve">Borrow the supplied value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Borrow the supplied value.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 480)">
      <title xml:space="preserve">Produce the absent result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the absent result.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 693)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
    </g>
  </g>
</svg>
