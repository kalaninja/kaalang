<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_borrowers</title>
  <desc id="kaalang-description">Nodes: Start: independent_borrowers with parameters input: u32 handing over input; Action: Produce the first value. capturing &amp;input handing over first; Action: Produce the second value. capturing &amp;input handing over second; Action: Pair the two values. capturing first, second handing over end; End: (u32, u32) capturing end. Connections: Start: independent_borrowers to Action: Produce the first value.; Action: Produce the first value. to Action: Produce the second value.; Action: Produce the second value. to Action: Pair the two values.; Action: Pair the two values. to End: (u32, u32).</desc>
  <defs>
    <style>
