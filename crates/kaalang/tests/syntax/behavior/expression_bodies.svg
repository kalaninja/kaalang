<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1170" viewBox="0 0 1064 1170" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for expression_bodies</title>
  <desc id="kaalang-description">Nodes: Start: expression_bodies with parameters input: Option&lt;u32&gt;; visits: &amp;Cell&lt;u32&gt; handing over input, visits; Action: Record a visit. capturing visits; Select: Was a value supplied? capturing input; Case: Use the supplied value. handing over value; Case: Use a default. handing over absent; Action: Capture the supplied branch value. capturing value handing over number; Question: Is the value positive? capturing &amp;number handing over positive / zero; Action: Double the positive value. capturing positive, number handing over result; Action: Return zero. capturing zero handing over result; Action: Return the default. capturing absent handing over result; End: u32 capturing result. Connections: Start: expression_bodies to Action: Record a visit.; Action: Record a visit. to Select: Was a value supplied?; Select: Was a value supplied? to Case: Use the supplied value.; Select: Was a value supplied? to Case: Use a default.; Case: Use the supplied value. to Action: Capture the supplied branch value.; Case: Use a default. to Action: Return the default.; Action: Capture the supplied branch value. to Question: Is the value positive?; Question: Is the value positive? branch 1 to Action: Double the positive value.; Question: Is the value positive? branch 2 to Action: Return zero.; Action: Double the positive value. to the result merge; Action: Return zero. to the result merge; Action: Return the default. to the result merge; the result merge to End: u32.</desc>
