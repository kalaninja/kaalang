<svg xmlns="http://www.w3.org/2000/svg" width="346" height="804" viewBox="0 0 346 804" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for statements_without_semicolons</title>
  <desc id="kaalang-description">Cycles: Knock three times. with inputs mut text and outputs (). Nodes: Start: statements_without_semicolons; Action: Start with an empty text. capturing nothing handing over mut text; For entry: Knock three times. capturing nothing; Action: Knock once. capturing &amp;mut text; For end: Knock three times.; End: String capturing text. Connections: Start: statements_without_semicolons to Action: Start with an empty text.; Action: Start with an empty text. to For entry: Knock three times.; For entry: Knock three times. to Action: Knock once.; Action: Knock once. to For end: Knock three times.; For end: Knock three times. to End: String.</desc>
