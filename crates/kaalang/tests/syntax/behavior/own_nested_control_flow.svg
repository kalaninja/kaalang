<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for own_nested_control_flow</title>
  <desc id="kaalang-description">Nodes: Start: own_nested_control_flow with parameters input: u32 handing over input; Action: Combine values from constructs that own their control flow. capturing input handing over result; End: u32 capturing result. Connections: Start: own_nested_control_flow to Action: Combine values from constructs that own their control flow.; Action: Combine values from constructs that own their control flow. to End: u32.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 228 L 172 300
    "/>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">input</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">input: u32</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">own_nested_control_flow</tspan></text>
    </g>
    <g class="node action" transform="translate(172 195)">
      <title xml:space="preserve">Combine values from constructs that own their control flow.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Combine values from constructs </tspan><tspan x="-124" dy="18">that own their control flow.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 329)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u32</tspan></text>
    </g>
