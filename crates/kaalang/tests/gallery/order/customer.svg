<svg xmlns="http://www.w3.org/2000/svg" width="609" height="600" viewBox="0 0 609 600" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for - Customer</title>
  <desc id="kaalang-description">Type - Customer with incoming types - Order.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .md-badge { fill: #64748b; stroke: none; font-size: 0.9em; font-weight: 700; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">- Order</title>
      <rect class="card-shape" x="32" y="32" width="285" height="288"/>
      <path class="card-rules" d="M 32 120 L 317 120 M 32 172 L 317 172 M 32 228 L 317 228"/>
      <rect class="card-outline" x="32" y="32" width="285" height="288"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="62.92" text-anchor="middle">−</text>
        <text x="64" y="64" text-anchor="start" xml:space="preserve"> Order</text>
      </g>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="303" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">An order a customer placed in the </tspan><tspan x="46" dy="18">shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="140.28" text-anchor="middle">−</text>
        <text x="58" y="141" text-anchor="start" xml:space="preserve"> number</text>
      </g>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="46" dy="0">OrderNumber</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="143" dy="0">The order&apos;s number, </tspan><tspan x="143" dy="18">unique in the shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="192.28" text-anchor="middle">−</text>
        <text x="58" y="193" text-anchor="start" xml:space="preserve"> customer</text>
      </g>
      <text class="field-type" y="209" xml:space="preserve"><tspan x="46" dy="0">CustomerId</tspan></text>
      <text class="description" y="195" xml:space="preserve"><tspan x="143" dy="0">Who placed the order.</tspan></text>
      <text class="target" text-anchor="end" y="217" xml:space="preserve"><tspan x="303" dy="0">▸ <tspan class="md-code">Customer</tspan></tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="248.28" text-anchor="middle">−</text>
        <text x="58" y="249" text-anchor="start" xml:space="preserve"> lines</text>
      </g>
      <text class="field-type" y="265" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;Line&gt;</tspan></text>
      <text class="description" y="251" xml:space="preserve"><tspan x="143" dy="0">What was ordered, in </tspan><tspan x="143" dy="18">the order it was </tspan><tspan x="143" dy="18">added.</tspan></text>
      <text class="target" text-anchor="end" y="309" xml:space="preserve"><tspan x="303" dy="0">▸ <tspan class="md-code">Line</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">- Customer</title>
      <rect class="card-shape" x="32" y="368" width="545" height="200"/>
      <path class="card-rules" d="M 32 438 L 577 438 M 201 438 L 201 568 M 389 438 L 389 568"/>
      <rect class="card-outline" x="32" y="368" width="545" height="200"/>
      <g class="type-name">
        <text class="md-badge" x="55" y="398.92" text-anchor="middle">−</text>
        <text x="64" y="400" text-anchor="start" xml:space="preserve"> Customer</text>
      </g>
      <text class="type-kind" text-anchor="end" y="400" xml:space="preserve"><tspan x="563" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="423" xml:space="preserve"><tspan x="46" dy="0">A person who buys from the shop.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="52" y="458.28" text-anchor="middle">−</text>
        <text x="58" y="459" text-anchor="start" xml:space="preserve"> id</text>
      </g>
      <text class="field-type" y="475" xml:space="preserve"><tspan x="46" dy="0">CustomerId</tspan></text>
      <text class="description" y="499" xml:space="preserve"><tspan x="46" dy="0">The customer&apos;s key.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="221" y="458.28" text-anchor="middle">−</text>
        <text x="227" y="459" text-anchor="start" xml:space="preserve"> name</text>
      </g>
      <text class="field-type" y="475" xml:space="preserve"><tspan x="215" dy="0">String</tspan></text>
      <text class="description" y="499" xml:space="preserve"><tspan x="215" dy="0">The name on the </tspan><tspan x="215" dy="18">parcel.</tspan></text>
      <g class="field-name">
        <text class="md-badge" x="409" y="458.28" text-anchor="middle">−</text>
        <text x="415" y="459" text-anchor="start" xml:space="preserve"> latest</text>
      </g>
      <text class="field-type" y="475" xml:space="preserve"><tspan x="403" dy="0">Option&lt;OrderNumber&gt;</tspan></text>
      <text class="description" y="499" xml:space="preserve"><tspan x="403" dy="0">The customer&apos;s </tspan><tspan x="403" dy="18">latest order, once </tspan><tspan x="403" dy="18">they placed one.</tspan></text>
      <text class="target" text-anchor="end" y="557" xml:space="preserve"><tspan x="563" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
    </g>
  </g>
  <g class="relationships">
    <g class="relationship-route">
      <title xml:space="preserve">- Order → - Customer</title>
      <path class="relationship" d="M 317 212 L 331 212 L 331 368" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="317" cy="212" r="4"/>
    </g>
  </g>
</svg>
