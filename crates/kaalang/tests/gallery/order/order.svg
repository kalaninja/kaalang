      <path class="relationship" d="M 1418 176 L 1432 176 L 1432 740" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="1418" cy="176" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Hold → Order</title>
      <path class="relationship" d="M 1418 284 L 1432 284 L 1432 740" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="1418" cy="284" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Hold → Order</title>
      <path class="relationship" d="M 1418 430 L 1432 430 L 1432 740" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="1418" cy="430" r="4"/>
    </g>
    <g class="relationship-route">
      <title xml:space="preserve">Receipt&lt;&apos;a&gt; → Order</title>
      <path class="relationship" d="M 1729 196 L 1743 196 L 1743 740" marker-end="url(#relationship-arrow)"/>
      <circle class="relationship-source" cx="1729" cy="196" r="4"/>
    </g>
