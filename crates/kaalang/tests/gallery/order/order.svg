<svg xmlns="http://www.w3.org/2000/svg" width="1789" height="936" viewBox="0 0 1789 936" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Order</title>
  <desc id="kaalang-description">Type Order with incoming types Customer, Payment, Shipment, Hold (3 relationships), Receipt&lt;&apos;a&gt;, Backlog.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card">
      <title xml:space="preserve">Customer</title>
      <rect class="card-shape" x="32" y="32" width="345" height="262"/>
      <path class="card-rules" d="M 32 102 L 377 102 M 32 150 L 377 150 M 32 202 L 377 202"/>
      <rect class="card-outline" x="32" y="32" width="345" height="262"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="46" dy="0">Customer</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="363" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A person who buys from the shop.</tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="46" dy="0">id</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">CustomerId</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="203" dy="0">The customer&apos;s key.</tspan></text>
      <text class="field-name" y="171" xml:space="preserve"><tspan x="46" dy="0">name</tspan></text>
      <text class="field-type" y="187" xml:space="preserve"><tspan x="46" dy="0">String</tspan></text>
      <text class="description" y="173" xml:space="preserve"><tspan x="203" dy="0">The name on the </tspan><tspan x="203" dy="18">parcel.</tspan></text>
      <text class="field-name" y="223" xml:space="preserve"><tspan x="46" dy="0">latest</tspan></text>
      <text class="field-type" y="239" xml:space="preserve"><tspan x="46" dy="0">Option&lt;OrderNumber&gt;</tspan></text>
      <text class="description" y="225" xml:space="preserve"><tspan x="203" dy="0">The customer&apos;s </tspan><tspan x="203" dy="18">latest order, once </tspan><tspan x="203" dy="18">they placed one.</tspan></text>
      <text class="target" text-anchor="end" y="283" xml:space="preserve"><tspan x="363" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Payment</title>
      <rect class="card-shape" x="409" y="32" width="285" height="244"/>
      <path class="card-rules" d="M 409 102 L 694 102 M 409 176 L 694 176 M 409 224 L 694 224"/>
      <rect class="card-outline" x="409" y="32" width="285" height="244"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="423" dy="0">Payment</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="680" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="423" dy="0">Money received for an order.</tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="423" dy="0">order</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="423" dy="0">OrderNumber</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="520" dy="0">The order the money </tspan><tspan x="520" dy="18">is for.</tspan></text>
      <text class="target" text-anchor="end" y="165" xml:space="preserve"><tspan x="680" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="197" xml:space="preserve"><tspan x="423" dy="0">amount</tspan></text>
      <text class="field-type" y="213" xml:space="preserve"><tspan x="423" dy="0">Money</tspan></text>
      <text class="description" y="199" xml:space="preserve"><tspan x="520" dy="0">The amount received.</tspan></text>
      <text class="field-name" y="245" xml:space="preserve"><tspan x="423" dy="0">reference</tspan></text>
      <text class="field-type" y="261" xml:space="preserve"><tspan x="423" dy="0">String</tspan></text>
      <text class="description" y="247" xml:space="preserve"><tspan x="520" dy="0">The bank&apos;s reference </tspan><tspan x="520" dy="18">for the transfer.</tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Shipment</title>
      <rect class="card-shape" x="726" y="32" width="285" height="214"/>
      <path class="card-rules" d="M 726 120 L 1011 120 M 726 194 L 1011 194"/>
      <rect class="card-outline" x="726" y="32" width="285" height="214"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="740" dy="0">Shipment</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="997" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="740" dy="0">A parcel on its way to the </tspan><tspan x="740" dy="18">customer.</tspan></text>
      <text class="field-name" y="141" xml:space="preserve"><tspan x="740" dy="0">order</tspan></text>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="740" dy="0">OrderNumber</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="837" dy="0">The order in the </tspan><tspan x="837" dy="18">parcel.</tspan></text>
      <text class="target" text-anchor="end" y="183" xml:space="preserve"><tspan x="997" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="215" xml:space="preserve"><tspan x="740" dy="0">tracking</tspan></text>
      <text class="field-type" y="231" xml:space="preserve"><tspan x="740" dy="0">String</tspan></text>
      <text class="description" y="217" xml:space="preserve"><tspan x="837" dy="0">The carrier&apos;s </tspan><tspan x="837" dy="18">tracking number.</tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Hold</title>
      <rect class="card-shape" x="1043" y="32" width="375" height="466"/>
      <path class="card-rules" d="M 1043 102 L 1418 102 M 1059 136 L 1418 136 M 1043 192 L 1418 192 M 1059 244 L 1418 244 M 1059 300 L 1418 300 M 1043 356 L 1418 356 M 1059 390 L 1418 390 M 1059 446 L 1418 446"/>
      <rect class="card-outline" x="1043" y="32" width="375" height="466"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="1057" dy="0">Hold</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="1404" dy="0">enum · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="1057" dy="0">Why an order is not on its way yet.</tspan></text>
      <text class="variant-name" y="125" xml:space="preserve"><tspan x="1057" dy="0">AwaitingPayment</tspan></text>
      <text class="description" y="125" xml:space="preserve"><tspan x="1199" dy="0">The payment has not arrived.</tspan></text>
      <text class="field-name" y="157" xml:space="preserve"><tspan x="1073" dy="0">order</tspan></text>
      <text class="field-type" y="173" xml:space="preserve"><tspan x="1073" dy="0">OrderNumber</tspan></text>
      <text class="description" y="159" xml:space="preserve"><tspan x="1170" dy="0">The unpaid order.</tspan></text>
      <text class="target" text-anchor="end" y="181" xml:space="preserve"><tspan x="1404" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="variant-name" y="215" xml:space="preserve"><tspan x="1057" dy="0">OutOfStock</tspan></text>
      <text class="description" y="215" xml:space="preserve"><tspan x="1155" dy="0">The shop has fewer units than the </tspan><tspan x="1155" dy="18">order needs.</tspan></text>
      <text class="field-name" y="265" xml:space="preserve"><tspan x="1073" dy="0">order</tspan></text>
      <text class="field-type" y="281" xml:space="preserve"><tspan x="1073" dy="0">OrderNumber</tspan></text>
      <text class="description" y="267" xml:space="preserve"><tspan x="1170" dy="0">The order that waits.</tspan></text>
      <text class="target" text-anchor="end" y="289" xml:space="preserve"><tspan x="1404" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="321" xml:space="preserve"><tspan x="1073" dy="0">product</tspan></text>
      <text class="field-type" y="337" xml:space="preserve"><tspan x="1073" dy="0">Sku</tspan></text>
      <text class="description" y="323" xml:space="preserve"><tspan x="1170" dy="0">The product that ran out.</tspan></text>
      <text class="target" text-anchor="end" y="345" xml:space="preserve"><tspan x="1404" dy="0">▸ <tspan class="md-code">Product</tspan></tspan></text>
      <text class="variant-name" y="379" xml:space="preserve"><tspan x="1057" dy="0">Cancelled</tspan></text>
      <text class="description" y="379" xml:space="preserve"><tspan x="1147" dy="0">The customer asked to cancel.</tspan></text>
      <text class="field-name" y="411" xml:space="preserve"><tspan x="1073" dy="0">order</tspan></text>
      <text class="field-type" y="427" xml:space="preserve"><tspan x="1073" dy="0">OrderNumber</tspan></text>
      <text class="description" y="413" xml:space="preserve"><tspan x="1170" dy="0">The cancelled order.</tspan></text>
      <text class="target" text-anchor="end" y="435" xml:space="preserve"><tspan x="1404" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="467" xml:space="preserve"><tspan x="1073" dy="0">reason</tspan></text>
      <text class="field-type" y="483" xml:space="preserve"><tspan x="1073" dy="0">String</tspan></text>
      <text class="description" y="469" xml:space="preserve"><tspan x="1170" dy="0">The customer&apos;s reason, in their </tspan><tspan x="1170" dy="18">words.</tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Receipt&lt;&apos;a&gt;</title>
      <rect class="card-shape" x="1450" y="32" width="279" height="232"/>
      <path class="card-rules" d="M 1450 120 L 1729 120 M 1450 212 L 1729 212"/>
      <rect class="card-outline" x="1450" y="32" width="279" height="232"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="1464" dy="0">Receipt&lt;&apos;a&gt;</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="1715" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="1464" dy="0">A receipt, printed from the order </tspan><tspan x="1464" dy="18">it lists.</tspan></text>
      <text class="field-name" y="141" xml:space="preserve"><tspan x="1464" dy="0">order</tspan></text>
      <text class="field-type" y="157" xml:space="preserve"><tspan x="1464" dy="0">&amp;&apos;a Order</tspan></text>
      <text class="description" y="143" xml:space="preserve"><tspan x="1546" dy="0">The order the receipt </tspan><tspan x="1546" dy="18">lists, borrowed while </tspan><tspan x="1546" dy="18">it prints.</tspan></text>
      <text class="target" text-anchor="end" y="201" xml:space="preserve"><tspan x="1715" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="233" xml:space="preserve"><tspan x="1464" dy="0">paid</tspan></text>
      <text class="field-type" y="249" xml:space="preserve"><tspan x="1464" dy="0">Money</tspan></text>
      <text class="description" y="235" xml:space="preserve"><tspan x="1546" dy="0">The amount the </tspan><tspan x="1546" dy="18">customer paid.</tspan></text>
    </g>
    <g class="card">
      <title xml:space="preserve">Backlog</title>
      <rect class="card-shape" x="32" y="530" width="345" height="162"/>
      <path class="card-rules" d="M 32 618 L 377 618"/>
      <rect class="card-outline" x="32" y="530" width="345" height="162"/>
      <text class="type-name" y="562" xml:space="preserve"><tspan x="46" dy="0">Backlog</tspan></text>
      <text class="type-kind" text-anchor="end" y="562" xml:space="preserve"><tspan x="363" dy="0">type alias</tspan></text>
      <text class="description" y="585" xml:space="preserve"><tspan x="46" dy="0">The orders waiting to be packed, oldest </tspan><tspan x="46" dy="18">first.</tspan></text>
      <text class="field-type" y="639" xml:space="preserve"><tspan x="46" dy="0">Vec&lt;OrderNumber&gt;</tspan></text>
      <text class="description" y="641" xml:space="preserve"><tspan x="181" dy="0">Paid orders that no </tspan><tspan x="181" dy="18">shipment has taken yet.</tspan></text>
      <text class="target" text-anchor="end" y="681" xml:space="preserve"><tspan x="363" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
    </g>
    <g class="card focus">
      <title xml:space="preserve">Order</title>
      <rect class="card-shape" x="32" y="740" width="1725" height="164"/>
      <path class="card-rules" d="M 32 810 L 1757 810 M 609 810 L 609 904 M 1178 810 L 1178 904"/>
      <rect class="card-outline" x="32" y="740" width="1725" height="164"/>
      <text class="type-name" y="772" xml:space="preserve"><tspan x="46" dy="0">Order</tspan></text>
      <text class="type-kind" text-anchor="end" y="772" xml:space="preserve"><tspan x="1743" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="795" xml:space="preserve"><tspan x="46" dy="0">An order a customer placed in the shop.</tspan></text>
      <text class="field-name" y="831" xml:space="preserve"><tspan x="46" dy="0">number</tspan></text>
      <text class="field-type" y="847" xml:space="preserve"><tspan x="46" dy="0">OrderNumber</tspan></text>
      <text class="description" y="871" xml:space="preserve"><tspan x="46" dy="0">The order&apos;s number, unique in the shop.</tspan></text>
      <text class="field-name" y="831" xml:space="preserve"><tspan x="623" dy="0">customer</tspan></text>
      <text class="field-type" y="847" xml:space="preserve"><tspan x="623" dy="0">CustomerId</tspan></text>
      <text class="description" y="871" xml:space="preserve"><tspan x="623" dy="0">Who placed the order.</tspan></text>
      <text class="target" text-anchor="end" y="893" xml:space="preserve"><tspan x="1164" dy="0">▸ <tspan class="md-code">Customer</tspan></tspan></text>
      <text class="field-name" y="831" xml:space="preserve"><tspan x="1192" dy="0">lines</tspan></text>
      <text class="field-type" y="847" xml:space="preserve"><tspan x="1192" dy="0">Vec&lt;Line&gt;</tspan></text>
      <text class="description" y="871" xml:space="preserve"><tspan x="1192" dy="0">What was ordered, in the order it was added.</tspan></text>
      <text class="target" text-anchor="end" y="893" xml:space="preserve"><tspan x="1743" dy="0">▸ <tspan class="md-code">Line</tspan></tspan></text>
    </g>
  </g>
