<svg xmlns="http://www.w3.org/2000/svg" width="440" height="246" viewBox="0 0 440 246" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang type diagram for Shipment</title>
  <desc id="kaalang-description">Type Shipment.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .card-shape { fill: #ffffff; }
      .card-groove { fill: #f8fafc; }
      .card-outline { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .focus .card-outline { stroke-width: 2.5; }
      .card-rules { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .type-name, .description, .field-type, .variant-name { fill: currentColor; }
      .type-kind, .field-name, .target { fill: #64748b; font-size: 12px; }
      .type-name { font-size: 18px; font-weight: 700; }
      .description, .variant-name { font-size: 14px; }
      .field-type { font-size: 12px; }
      .field-name, .field-type, .variant-name { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .target .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 400; }
      .relationship { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
      .relationship-source { fill: currentColor; }
      .port { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
    </style>
    <marker id="relationship-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cards">
    <g class="card focus">
      <title xml:space="preserve">Shipment</title>
      <rect class="card-shape" x="32" y="32" width="376" height="182"/>
      <path class="card-rules" d="M 32 102 L 408 102 M 220 102 L 220 214"/>
      <rect class="card-outline" x="32" y="32" width="376" height="182"/>
      <text class="type-name" y="64" xml:space="preserve"><tspan x="46" dy="0">Shipment</tspan></text>
      <text class="type-kind" text-anchor="end" y="64" xml:space="preserve"><tspan x="394" dy="0">struct · repr(Rust)</tspan></text>
      <text class="description" y="87" xml:space="preserve"><tspan x="46" dy="0">A parcel on its way to the customer.</tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="46" dy="0">order</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="46" dy="0">OrderNumber</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="46" dy="0">The order in the </tspan><tspan x="46" dy="18">parcel.</tspan></text>
      <text class="target" text-anchor="end" y="203" xml:space="preserve"><tspan x="206" dy="0">▸ <tspan class="md-code">Order</tspan></tspan></text>
      <text class="field-name" y="123" xml:space="preserve"><tspan x="234" dy="0">tracking</tspan></text>
      <text class="field-type" y="139" xml:space="preserve"><tspan x="234" dy="0">String</tspan></text>
      <text class="description" y="163" xml:space="preserve"><tspan x="234" dy="0">The carrier&apos;s </tspan><tspan x="234" dy="18">tracking number.</tspan></text>
    </g>
  </g>
  <g class="relationships">
  </g>
</svg>
