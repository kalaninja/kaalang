<svg xmlns="http://www.w3.org/2000/svg" width="1622" height="1131" viewBox="0 0 1622 1131" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for partition</title>
  <desc id="kaalang-description">Cycles: Classify every value around the pivot. with inputs mut cursor, mut upper, mut values, pivot, mut lower and outputs classified. Nodes: Start: partition&lt;T: Ord&gt; with parameters mut values: &amp;mut [T] handing over mut values; Action: Move the middle pivot to the end; start the three regions. capturing &amp;mut values handing over mut lower, mut cursor, mut upper, pivot; Question: Does an unclassified value remain? capturing cursor, upper handing over compare / classified; Select: Where does this value belong? capturing compare, &amp;values, cursor, pivot; Case: Less than the pivot. handing over less; Case: Equal to the pivot. handing over equal; Case: Greater than the pivot. handing over greater; Action: Move the value left; advance lower and cursor. capturing less, &amp;mut values, &amp;mut lower, &amp;mut cursor handing over stepped; Action: Keep the equal value; advance cursor. capturing equal, &amp;mut cursor handing over stepped; Action: Move the value right; inspect its replacement next. capturing greater, &amp;mut values, cursor, &amp;mut upper handing over stepped; Action: Place the pivot between the equal and greater regions. capturing classified, &amp;mut values, lower, upper, pivot handing over bounds; End: (usize, usize) capturing bounds; Merge: stepped. Connections: Start: partition&lt;T: Ord&gt; to Action: Move the middle pivot to the end; start the three regions.; Action: Move the middle pivot to the end; start the three regions. to the entry of the cycle; Question: Does an unclassified value remain? branch 1 to Select: Where does this value belong?; Question: Does an unclassified value remain? branch 2 to Action: Place the pivot between the equal and greater regions.; Select: Where does this value belong? to Case: Less than the pivot.; Select: Where does this value belong? to Case: Equal to the pivot.; Select: Where does this value belong? to Case: Greater than the pivot.; Case: Less than the pivot. to Action: Move the value left; advance lower and cursor.; Case: Equal to the pivot. to Action: Keep the equal value; advance cursor.; Case: Greater than the pivot. to Action: Move the value right; inspect its replacement next.; Action: Move the value left; advance lower and cursor. to the stepped merge at the iteration tail of the cycle; Action: Keep the equal value; advance cursor. to the stepped merge at the iteration tail of the cycle; Action: Move the value right; inspect its replacement next. to the stepped merge at the iteration tail of the cycle; Action: Place the pivot between the equal and greater regions. to End: (usize, usize); the entry of the cycle to Question: Does an unclassified value remain?; Repeat from the stepped merge at the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Classify every value around the pivot.</title>
    <rect class="cycle-boundary" x="32" y="272" width="1192" height="728" rx="12"/>
    <text class="cycle-caption" x="1212" y="286" text-anchor="end" xml:space="preserve"><tspan x="1212" dy="0">Classify every value around the pivot.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 90 L 220 162
      M 220 228 L 220 307
      M 220 451 L 220 530
      M 360 415 L 1384 415 L 1384 530
      M 220 602 L 220 674
      M 348 566 L 608 566 L 608 674
      M 348 566 L 996 566 L 996 674
      M 220 744 L 220 823
      M 608 744 L 608 823
      M 996 744 L 996 823
      M 220 889 L 220 965
      M 608 889 L 608 965 L 220 965
      M 996 889 L 996 965 L 220 965
      M 1384 602 L 1384 1041
      M 220 307 L 220 379
    "/>
    <path class="connection" d="
      M 220 965 L 60 965 L 60 307 L 220 307
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="233" y="983" xml:space="preserve"><tspan x="233" dy="0">stepped</tspan></text>
    <text class="connection-label" x="1397" y="1030" xml:space="preserve"><tspan x="1397" dy="0">bounds</tspan></text>
    <text class="connection-label" x="233" y="108" xml:space="preserve"><tspan x="233" dy="0">mut values</tspan></text>
    <text class="connection-label" x="233" y="246" xml:space="preserve"><tspan x="233" dy="0">mut lower, mut cursor, mut </tspan><tspan x="233" dy="14">upper, pivot</tspan></text>
    <text class="connection-label" x="233" y="469" xml:space="preserve"><tspan x="233" dy="0">compare</tspan></text>
    <text class="connection-label" x="373" y="433" xml:space="preserve"><tspan x="373" dy="0">classified</tspan></text>
    <text class="connection-label" x="233" y="762" xml:space="preserve"><tspan x="233" dy="0">less</tspan></text>
    <text class="connection-label" x="621" y="762" xml:space="preserve"><tspan x="621" dy="0">equal</tspan></text>
    <text class="connection-label" x="1009" y="762" xml:space="preserve"><tspan x="1009" dy="0">greater</tspan></text>
    <text class="connection-label" x="233" y="151" xml:space="preserve"><tspan x="233" dy="0">&amp;mut values</tspan></text>
    <text class="connection-label" x="233" y="368" xml:space="preserve"><tspan x="233" dy="0">cursor, upper</tspan></text>
    <text class="connection-label" x="233" y="519" xml:space="preserve"><tspan x="233" dy="0">compare, &amp;values, cursor, pivot</tspan></text>
    <text class="connection-label" x="233" y="798" xml:space="preserve"><tspan x="233" dy="0">less, &amp;mut values, &amp;mut lower, </tspan><tspan x="233" dy="14">&amp;mut cursor</tspan></text>
    <text class="connection-label" x="621" y="812" xml:space="preserve"><tspan x="621" dy="0">equal, &amp;mut cursor</tspan></text>
    <text class="connection-label" x="1009" y="798" xml:space="preserve"><tspan x="1009" dy="0">greater, &amp;mut values, cursor, </tspan><tspan x="1009" dy="14">&amp;mut upper</tspan></text>
    <text class="connection-label" x="1397" y="505" xml:space="preserve"><tspan x="1397" dy="0">classified, &amp;mut values, lower, </tspan><tspan x="1397" dy="14">upper, pivot</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 61 L 456 61"/>
    <g class="parameter-panel" transform="translate(576 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut values: &amp;mut [T]</tspan></text>
    </g>
    <g class="node merge" transform="translate(220 965)">
      <title xml:space="preserve">the stepped merge at the iteration tail of the cycle</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">partition&lt;T: Ord&gt;</tspan></text>
    </g>
    <g class="node action" transform="translate(220 195)">
      <title xml:space="preserve">Move the middle pivot to the end; start the three regions.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Move the middle pivot to the end; </tspan><tspan x="-124" dy="18">start the three regions.</tspan></text>
    </g>
    <g class="node question" transform="translate(220 415)">
      <title xml:space="preserve">Does an unclassified value remain?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Does an unclassified value </tspan><tspan x="0" dy="18">remain?</tspan></text>
    </g>
    <g class="node select" transform="translate(220 566)">
      <title xml:space="preserve">Where does this value belong?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Where does this value </tspan><tspan x="0" dy="18">belong?</tspan></text>
    </g>
    <g class="node case" transform="translate(220 709)">
      <title xml:space="preserve">Less than the pivot.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Less than the pivot.</tspan></text>
    </g>
    <g class="node case" transform="translate(608 709)">
      <title xml:space="preserve">Equal to the pivot.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Equal to the pivot.</tspan></text>
    </g>
    <g class="node case" transform="translate(996 709)">
      <title xml:space="preserve">Greater than the pivot.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Greater than the pivot.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 856)">
      <title xml:space="preserve">Move the value left; advance lower and cursor.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Move the value left; advance </tspan><tspan x="-124" dy="18">lower and cursor.</tspan></text>
    </g>
    <g class="node action" transform="translate(608 856)">
      <title xml:space="preserve">Keep the equal value; advance cursor.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Keep the equal value; advance </tspan><tspan x="-124" dy="18">cursor.</tspan></text>
    </g>
    <g class="node action" transform="translate(996 856)">
      <title xml:space="preserve">Move the value right; inspect its replacement next.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Move the value right; inspect its </tspan><tspan x="-124" dy="18">replacement next.</tspan></text>
    </g>
    <g class="node action" transform="translate(1384 566)">
      <title xml:space="preserve">Place the pivot between the equal and greater regions.</title>
      <rect class="node-shape" x="-140" y="-36" width="280" height="72"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Place the pivot between the equal </tspan><tspan x="-124" dy="18">and greater regions.</tspan></text>
    </g>
    <g class="node end" transform="translate(1384 1070)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(usize, usize)</tspan></text>
    </g>
  </g>
</svg>
