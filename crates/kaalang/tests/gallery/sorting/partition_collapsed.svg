<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for partition</title>
  <desc id="kaalang-description">Nodes: Start: partition&lt;T: Ord&gt; with parameters mut values: &amp;mut [T] handing over mut values; Action: Move the middle pivot to the end; start the three regions. capturing &amp;mut values handing over mut lower, mut cursor, mut upper, pivot; Cycle: Classify every value around the pivot. capturing mut cursor, mut upper, mut values, pivot, mut lower handing over classified; Action: Place the pivot between the equal and greater regions. capturing classified, &amp;mut values, lower, upper, pivot handing over bounds; End: (usize, usize) capturing bounds. Connections: Start: partition&lt;T: Ord&gt; to Action: Move the middle pivot to the end; start the three regions.; Action: Move the middle pivot to the end; start the three regions. to Cycle: Classify every value around the pivot.; Cycle: Classify every value around the pivot. to Action: Place the pivot between the equal and greater regions.; Action: Place the pivot between the equal and greater regions. to End: (usize, usize).</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 228 L 172 307
      M 172 373 L 172 452
      M 172 518 L 172 590
    "/>
    <text class="connection-label" x="185" y="579" xml:space="preserve"><tspan x="185" dy="0">bounds</tspan></text>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">mut values</tspan></text>
    <text class="connection-label" x="185" y="246" xml:space="preserve"><tspan x="185" dy="0">mut lower, mut cursor, mut </tspan><tspan x="185" dy="14">upper, pivot</tspan></text>
    <text class="connection-label" x="185" y="391" xml:space="preserve"><tspan x="185" dy="0">classified</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">&amp;mut values</tspan></text>
    <text class="connection-label" x="185" y="282" xml:space="preserve"><tspan x="185" dy="0">mut cursor, mut upper, mut </tspan><tspan x="185" dy="14">values, pivot, mut lower</tspan></text>
    <text class="connection-label" x="185" y="427" xml:space="preserve"><tspan x="185" dy="0">classified, &amp;mut values, lower, </tspan><tspan x="185" dy="14">upper, pivot</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut values: &amp;mut [T]</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">partition&lt;T: Ord&gt;</tspan></text>
    </g>
    <g class="node action" transform="translate(172 195)">
      <title xml:space="preserve">Move the middle pivot to the end; start the three regions.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Move the middle pivot to the end; </tspan><tspan x="-124" dy="18">start the three regions.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 340)">
      <title xml:space="preserve">Classify every value around the pivot.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Classify every value around </tspan><tspan x="-124" dy="18">the pivot.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 485)">
      <title xml:space="preserve">Place the pivot between the equal and greater regions.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Place the pivot between the equal </tspan><tspan x="-124" dy="18">and greater regions.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 619)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(usize, usize)</tspan></text>
    </g>
  </g>
</svg>
