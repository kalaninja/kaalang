  <desc id="kaalang-description">Nodes: Start: fizzbuzz with parameters number: u32 handing over number; Select: Which of 3 and 5 divide the number? capturing number; Case: Both 3 and 5. handing over fizz_buzz; Case: Only 3. handing over fizz; Case: Only 5. handing over buzz; Case: Neither 3 nor 5. handing over plain; Action: 🎉 Use FizzBuzz for this number. capturing fizz_buzz handing over end; Action: 🫧 Use Fizz for this number. capturing fizz handing over end; Action: 🐝 Use Buzz for this number. capturing buzz handing over end; Action: 🔢 Use the number itself, written as text. capturing plain handing over end; End: String capturing end; Merge: end. Connections: Start: fizzbuzz to Select: Which of 3 and 5 divide the number?; Select: Which of 3 and 5 divide the number? to Case: Both 3 and 5.; Select: Which of 3 and 5 divide the number? to Case: Only 3.; Select: Which of 3 and 5 divide the number? to Case: Only 5.; Select: Which of 3 and 5 divide the number? to Case: Neither 3 nor 5.; Case: Both 3 and 5. to Action: 🎉 Use FizzBuzz for this number.; Case: Only 3. to Action: 🫧 Use Fizz for this number.; Case: Only 5. to Action: 🐝 Use Buzz for this number.; Case: Neither 3 nor 5. to Action: 🔢 Use the number itself, written as text.; Action: 🎉 Use FizzBuzz for this number. to the end merge; Action: 🫧 Use Fizz for this number. to the end merge; Action: 🐝 Use Buzz for this number. to the end merge; Action: 🔢 Use the number itself, written as text. to the end merge; the end merge to End: String.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
