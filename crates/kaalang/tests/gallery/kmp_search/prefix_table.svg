<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="1539" viewBox="0 0 1182 1539" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for prefix_table</title>
  <desc id="kaalang-description">Cycles: Find how much of the pattern&apos;s beginning repeats at each ending. with inputs pattern, mut matched, mut prefix and outputs finished; Extend the matched beginning or try a shorter one. with inputs byte, pattern, mut matched, mut prefix and outputs settled. Nodes: Start: prefix_table with parameters pattern: &amp;[u8] handing over pattern; Action: Set all prefix lengths to zero; no pattern beginning is matched yet. capturing pattern handing over mut prefix, mut matched; For entry: Find how much of the pattern&apos;s beginning repeats at each ending. capturing pattern handing over position; Action: Read the pattern byte at this position. capturing position, pattern handing over byte; Question: Does this byte match the next byte of the pattern&apos;s beginning? capturing byte, pattern, matched handing over extend / mismatch described as branch 1: YES / branch 2: NO; Action: Include this byte in the matched beginning. capturing extend, &amp;mut matched handing over settled; Question: Is there a matched beginning to shorten? capturing mismatch, matched handing over settled / shrink described as branch 1: NO / branch 2: YES; Action: Use the table to keep the next shorter matching beginning. capturing shrink, &amp;prefix, &amp;mut matched; Action: Save the matched length for this byte. capturing settled, &amp;mut prefix, position, matched; For end: Find how much of the pattern&apos;s beginning repeats at each ending. handing over finished; End: Vec&lt;usize&gt; capturing prefix; Merge: settled. Connections: Start: prefix_table to Action: Set all prefix lengths to zero; no pattern beginning is matched yet.; Action: Set all prefix lengths to zero; no pattern beginning is matched yet. to For entry: Find how much of the pattern&apos;s beginning repeats at each ending.; For entry: Find how much of the pattern&apos;s beginning repeats at each ending. to Action: Read the pattern byte at this position.; Action: Read the pattern byte at this position. to the entry of the cycle; Question: Does this byte match the next byte of the pattern&apos;s beginning? branch 1 to Action: Include this byte in the matched beginning.; Question: Does this byte match the next byte of the pattern&apos;s beginning? branch 2 to Question: Is there a matched beginning to shorten?; Action: Include this byte in the matched beginning. to the settled merge at the cycle result; Question: Is there a matched beginning to shorten? branch 1 to the settled merge at the cycle result; Question: Is there a matched beginning to shorten? branch 2 to Action: Use the table to keep the next shorter matching beginning.; Action: Use the table to keep the next shorter matching beginning. to the iteration tail of the cycle; Action: Save the matched length for this byte. to For end: Find how much of the pattern&apos;s beginning repeats at each ending.; For end: Find how much of the pattern&apos;s beginning repeats at each ending. to End: Vec&lt;usize&gt;; the settled merge at the cycle result to Action: Save the matched length for this byte.; the entry of the cycle to Question: Does this byte match the next byte of the pattern&apos;s beginning?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .for-entry .node-shape, .for-end .node-shape { fill: #f0fdf4; }
      .for-entry .label, .for-end .label { font-weight: 500; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Extend the matched beginning or try a shorter one.</title>
    <rect class="cycle-boundary" x="33" y="541" width="1116" height="584" rx="12"/>
    <text class="cycle-caption" x="1137" y="555" text-anchor="end" xml:space="preserve"><tspan x="1137" dy="0">Extend the matched beginning or try a shorter one.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 201 90 L 201 162
      M 201 228 L 201 300
      M 201 366 L 201 438
      M 201 504 L 201 576
      M 201 732 L 201 804
      M 341 690 L 561 690 L 561 804
      M 201 876 L 201 1090
      M 561 876 L 561 1090 L 201 1090
      M 701 840 L 921 840 L 921 948
      M 921 1014 L 921 1090
      M 201 1239 L 201 1311
      M 201 1377 L 201 1449
      M 201 1090 L 201 1173
      M 201 576 L 201 648
    "/>
    <path class="connection" d="
      M 921 1090 L 1121 1090 L 1121 576 L 201 576
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="214" y="1108" xml:space="preserve"><tspan x="214" dy="0">settled</tspan></text>
    <text class="connection-label" x="214" y="151" xml:space="preserve"><tspan x="214" dy="0">pattern</tspan></text>
    <text class="connection-label" x="214" y="246" xml:space="preserve"><tspan x="214" dy="0">mut prefix, mut matched</tspan></text>
    <text class="connection-label" x="214" y="384" xml:space="preserve"><tspan x="214" dy="0">position</tspan></text>
    <text class="connection-label" x="214" y="522" xml:space="preserve"><tspan x="214" dy="0">byte</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="214" y="752" xml:space="preserve"><tspan x="214" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="354" y="678" xml:space="preserve"><tspan x="354" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="574" y="896" xml:space="preserve"><tspan x="574" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="714" y="828" xml:space="preserve"><tspan x="714" dy="0">YES</tspan></text>
    <text class="connection-label" x="214" y="1395" xml:space="preserve"><tspan x="214" dy="0">finished</tspan></text>
    <text class="connection-label" x="214" y="289" xml:space="preserve"><tspan x="214" dy="0">pattern</tspan></text>
    <text class="connection-label" x="214" y="427" xml:space="preserve"><tspan x="214" dy="0">position, pattern</tspan></text>
    <text class="connection-label" x="214" y="637" xml:space="preserve"><tspan x="214" dy="0">byte, pattern, matched</tspan></text>
    <text class="connection-label" x="214" y="793" xml:space="preserve"><tspan x="214" dy="0">extend, &amp;mut matched</tspan></text>
    <text class="connection-label" x="574" y="793" xml:space="preserve"><tspan x="574" dy="0">mismatch, matched</tspan></text>
    <text class="connection-label" x="934" y="937" xml:space="preserve"><tspan x="934" dy="0">shrink, &amp;prefix, &amp;mut matched</tspan></text>
    <text class="connection-label" x="214" y="1148" xml:space="preserve"><tspan x="214" dy="0">settled, &amp;mut prefix, position, </tspan><tspan x="214" dy="14">matched</tspan></text>
    <text class="connection-label" x="214" y="1438" xml:space="preserve"><tspan x="214" dy="0">prefix</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 341 61 L 437 61"/>
    <g class="parameter-panel" transform="translate(557 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">pattern: &amp;[u8]</tspan></text>
    </g>
    <g class="node merge" transform="translate(201 1090)">
      <title xml:space="preserve">the settled merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(201 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">prefix_table</tspan></text>
    </g>
    <g class="node action" transform="translate(201 195)">
      <title xml:space="preserve">Set all prefix lengths to zero; no pattern beginning is matched yet.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Set all prefix lengths to zero; no </tspan><tspan x="-124" dy="18">pattern beginning is matched yet.</tspan></text>
    </g>
    <g class="node for-entry" transform="translate(201 333)">
      <title xml:space="preserve">Find how much of the pattern&apos;s beginning repeats at each ending.</title>
      <polygon class="node-shape" points="-124,-33 124,-33 140,-17 140,33 -140,33 -140,-17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Find how much of the pattern&apos;s </tspan><tspan x="-124" dy="18">beginning repeats at each ending.</tspan></text>
    </g>
    <g class="node action" transform="translate(201 471)">
      <title xml:space="preserve">Read the pattern byte at this position.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Read the pattern byte at this </tspan><tspan x="-124" dy="18">position.</tspan></text>
    </g>
    <g class="node question" transform="translate(201 690)">
      <title xml:space="preserve">Does this byte match the next byte of the pattern&apos;s beginning?</title>
      <polygon class="node-shape" points="-112,-42 112,-42 140,0 112,42 -112,42 -140,0"/>
      <text class="label" y="-12" xml:space="preserve"><tspan x="0" dy="0">Does this byte match the </tspan><tspan x="0" dy="18">next byte of the pattern&apos;s </tspan><tspan x="0" dy="18">beginning?</tspan></text>
    </g>
    <g class="node action" transform="translate(201 840)">
      <title xml:space="preserve">Include this byte in the matched beginning.</title>
      <rect class="node-shape" x="-140" y="-36" width="280" height="72"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Include this byte in the matched </tspan><tspan x="-124" dy="18">beginning.</tspan></text>
    </g>
    <g class="node question" transform="translate(561 840)">
      <title xml:space="preserve">Is there a matched beginning to shorten?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Is there a matched </tspan><tspan x="0" dy="18">beginning to shorten?</tspan></text>
    </g>
    <g class="node action" transform="translate(921 981)">
      <title xml:space="preserve">Use the table to keep the next shorter matching beginning.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Use the table to keep the next </tspan><tspan x="-124" dy="18">shorter matching beginning.</tspan></text>
    </g>
    <g class="node action" transform="translate(201 1206)">
      <title xml:space="preserve">Save the matched length for this byte.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Save the matched length for this </tspan><tspan x="-124" dy="18">byte.</tspan></text>
    </g>
    <g class="node for-end" transform="translate(201 1344)">
      <title xml:space="preserve">Find how much of the pattern&apos;s beginning repeats at each ending.</title>
      <polygon class="node-shape" points="-140,-33 140,-33 140,17 124,33 -124,33 -140,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Find how much of the pattern&apos;s </tspan><tspan x="-124" dy="18">beginning repeats at each ending.</tspan></text>
    </g>
    <g class="node end" transform="translate(201 1478)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;usize&gt;</tspan></text>
    </g>
  </g>
</svg>
