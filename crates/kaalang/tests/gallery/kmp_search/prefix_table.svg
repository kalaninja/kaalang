<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="1079" viewBox="0 0 1256 1079" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for prefix_table</title>
  <desc id="kaalang-description">Cycles: Build prefixes from left to right. with inputs mut position, pattern, mut matched, mut prefix and outputs finished; Find an extendable prefix. with inputs next, pattern, mut position, mut matched, mut prefix and outputs settled. Nodes: Start: prefix_table with parameters pattern: &amp;[u8] handing over pattern; Action: Start with zero prefix lengths. capturing pattern handing over mut prefix, mut position, mut matched; Question: Is the table complete? capturing position, pattern handing over finished / next described as branch 1: YES / branch 2: NO; Question: Must the prefix shrink? capturing pattern, position, matched handing over shrink / settled described as branch 1: YES / branch 2: NO; Action: Follow the previous prefix length. capturing shrink, &amp;prefix, &amp;mut matched; Action: Extend if matched; save and advance. capturing settled, pattern, &amp;mut prefix, &amp;mut position, &amp;mut matched; End: Vec&lt;usize&gt; capturing prefix. Connections: Start: prefix_table to Action: Start with zero prefix lengths.; Action: Start with zero prefix lengths. to the entry of the cycle; Question: Is the table complete? branch 1 to End: Vec&lt;usize&gt;; Question: Is the table complete? branch 2 to the entry of the cycle; Question: Must the prefix shrink? branch 1 to Action: Follow the previous prefix length.; Question: Must the prefix shrink? branch 2 to Action: Extend if matched; save and advance.; Action: Follow the previous prefix length. to the iteration tail of the cycle; Action: Extend if matched; save and advance. to the iteration tail of the cycle; the entry of the cycle to Question: Is the table complete?; the entry of the cycle to Question: Must the prefix shrink?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Build prefixes from left to right.</title>
    <rect class="cycle-boundary" x="32" y="270" width="1192" height="682" rx="12"/>
    <text class="cycle-caption" x="1212" y="284" text-anchor="end" xml:space="preserve"><tspan x="1212" dy="0">Build prefixes from left to right.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Find an extendable prefix.</title>
    <rect class="cycle-boundary" x="400" y="486" width="416" height="431" rx="12"/>
    <text class="cycle-caption" x="804" y="500" text-anchor="end" xml:space="preserve"><tspan x="804" dy="0">Find an extendable prefix.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 305
      M 200 449 L 200 989
      M 340 413 L 588 413 L 588 521
      M 588 665 L 588 744
      M 728 629 L 976 629 L 976 744
      M 588 810 L 588 882
      M 976 810 L 976 882
      M 200 305 L 200 377
      M 588 521 L 588 593
    "/>
    <path class="connection" d="
      M 588 882 L 428 882 L 428 521 L 588 521
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 976 882 L 1196 882 L 1196 305 L 200 305
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">pattern</tspan></text>
    <text class="connection-label" x="213" y="244" xml:space="preserve"><tspan x="213" dy="0">mut prefix, mut position, mut </tspan><tspan x="213" dy="14">matched</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="213" y="469" xml:space="preserve"><tspan x="213" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="353" y="401" xml:space="preserve"><tspan x="353" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="601" y="685" xml:space="preserve"><tspan x="601" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="741" y="617" xml:space="preserve"><tspan x="741" dy="0">NO</tspan></text>
    <text class="connection-label" x="213" y="366" xml:space="preserve"><tspan x="213" dy="0">position, pattern</tspan></text>
    <text class="connection-label" x="601" y="582" xml:space="preserve"><tspan x="601" dy="0">pattern, position, matched</tspan></text>
    <text class="connection-label" x="601" y="733" xml:space="preserve"><tspan x="601" dy="0">shrink, &amp;prefix, &amp;mut matched</tspan></text>
    <text class="connection-label" x="989" y="719" xml:space="preserve"><tspan x="989" dy="0">settled, pattern, &amp;mut prefix, </tspan><tspan x="989" dy="14">&amp;mut position, &amp;mut matched</tspan></text>
    <text class="connection-label" x="213" y="978" xml:space="preserve"><tspan x="213" dy="0">prefix</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">pattern: &amp;[u8]</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">prefix_table</tspan></text>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">Start with zero prefix lengths.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Start with zero prefix lengths.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 413)">
      <title xml:space="preserve">Is the table complete?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the table complete?</tspan></text>
    </g>
    <g class="node question" transform="translate(588 629)">
      <title xml:space="preserve">Must the prefix shrink?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Must the prefix shrink?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 777)">
      <title xml:space="preserve">Follow the previous prefix length.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Follow the previous prefix length.</tspan></text>
    </g>
    <g class="node action" transform="translate(976 777)">
      <title xml:space="preserve">Extend if matched; save and advance.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Extend if matched; save and </tspan><tspan x="-124" dy="18">advance.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 1018)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;usize&gt;</tspan></text>
    </g>
  </g>
</svg>
