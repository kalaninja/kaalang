<svg xmlns="http://www.w3.org/2000/svg" width="680" height="535" viewBox="0 0 680 535" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for prefix_table</title>
  <desc id="kaalang-description">Nodes: Start: prefix_table with parameters pattern: &amp;[u8] handing over pattern; Action: Initialize prefix lengths; the first byte has no proper prefix. capturing pattern handing over mut prefix, mut position, mut matched; Cycle: Compute the prefix table from left to right. capturing mut position, pattern, mut matched, mut prefix handing over finished; End: Vec&lt;usize&gt; capturing prefix. Connections: Start: prefix_table to Action: Initialize prefix lengths; the first byte has no proper prefix.; Action: Initialize prefix lengths; the first byte has no proper prefix. to Cycle: Compute the prefix table from left to right.; Cycle: Compute the prefix table from left to right. to End: Vec&lt;usize&gt;.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 228 L 172 307
      M 172 373 L 172 445
    "/>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">pattern</tspan></text>
    <text class="connection-label" x="185" y="246" xml:space="preserve"><tspan x="185" dy="0">mut prefix, mut position, mut </tspan><tspan x="185" dy="14">matched</tspan></text>
    <text class="connection-label" x="185" y="391" xml:space="preserve"><tspan x="185" dy="0">finished</tspan></text>
    <text class="connection-label" x="185" y="282" xml:space="preserve"><tspan x="185" dy="0">mut position, pattern, mut </tspan><tspan x="185" dy="14">matched, mut prefix</tspan></text>
    <text class="connection-label" x="185" y="434" xml:space="preserve"><tspan x="185" dy="0">prefix</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">pattern: &amp;[u8]</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">prefix_table</tspan></text>
    </g>
    <g class="node action" transform="translate(172 195)">
      <title xml:space="preserve">Initialize prefix lengths; the first byte has no proper prefix.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Initialize prefix lengths; the first </tspan><tspan x="-124" dy="18">byte has no proper prefix.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 340)">
      <title xml:space="preserve">Compute the prefix table from left to right.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Compute the prefix table </tspan><tspan x="-124" dy="18">from left to right.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node end" transform="translate(172 474)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;usize&gt;</tspan></text>
    </g>
  </g>
</svg>
