<svg xmlns="http://www.w3.org/2000/svg" width="680" height="666" viewBox="0 0 680 666" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for do_while</title>
  <desc id="kaalang-description">Nodes: Start: do_while with parameters mut number: u64 handing over mut number; Action: 📭 Start an empty list for the digits. capturing nothing handing over mut digits; Cycle: Collect the number&apos;s decimal digits from right to left. capturing mut number, mut digits handing over collected; Action: 🔄 Reverse the collected digits to read from left to right. capturing collected, mut digits handing over result; End: Vec&lt;u8&gt; capturing result. Connections: Start: do_while to Action: 📭 Start an empty list for the digits.; Action: 📭 Start an empty list for the digits. to Cycle: Collect the number&apos;s decimal digits from right to left.; Cycle: Collect the number&apos;s decimal digits from right to left. to Action: 🔄 Reverse the collected digits to read from left to right.; Action: 🔄 Reverse the collected digits to read from left to right. to End: Vec&lt;u8&gt;.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 228 L 172 300
      M 172 366 L 172 438
      M 172 504 L 172 576
    "/>
    <text class="connection-label" x="185" y="565" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">mut number</tspan></text>
    <text class="connection-label" x="185" y="246" xml:space="preserve"><tspan x="185" dy="0">mut digits</tspan></text>
    <text class="connection-label" x="185" y="384" xml:space="preserve"><tspan x="185" dy="0">collected</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
    <text class="connection-label" x="185" y="289" xml:space="preserve"><tspan x="185" dy="0">mut number, mut digits</tspan></text>
    <text class="connection-label" x="185" y="427" xml:space="preserve"><tspan x="185" dy="0">collected, mut digits</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut number: u64</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">do_while</tspan></text>
    </g>
    <g class="node action" transform="translate(172 195)">
      <title xml:space="preserve">📭 Start an empty list for the digits.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">📭 Start an empty list for the </tspan><tspan x="-124" dy="18">digits.</tspan></text>
    </g>
    <g class="node cycle" transform="translate(172 333)">
      <title xml:space="preserve">Collect the number&apos;s decimal digits from right to left.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Collect the number&apos;s decimal </tspan><tspan x="-124" dy="18">digits from right to left.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 471)">
      <title xml:space="preserve">🔄 Reverse the collected digits to read from left to right.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">🔄 Reverse the collected digits to </tspan><tspan x="-124" dy="18">read from left to right.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 605)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;u8&gt;</tspan></text>
    </g>
  </g>
</svg>
