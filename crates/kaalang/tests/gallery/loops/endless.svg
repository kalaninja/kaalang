<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="729" viewBox="0 0 1142 729" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for endless</title>
  <desc id="kaalang-description">Cycles: 🚦 Keep changing the traffic light. with inputs mut showing and outputs (). Nodes: Start: endless with parameters mut showing: Light handing over mut showing; Select: Which light is on now? capturing &amp;showing; Case: 🔴 Red. handing over red; Case: 🟡 Amber. handing over amber; Case: 🟢 Green. handing over green; Action: 🚗 Switch to green so traffic can go. capturing red, &amp;mut showing handing over changed; Action: 🛑 Switch to red so traffic stops. capturing amber, &amp;mut showing handing over changed; Action: ⚠️ Switch to amber to warn traffic to stop. capturing green, &amp;mut showing handing over changed; Merge: changed. Connections: Start: endless to the entry of the cycle; Select: Which light is on now? to Case: 🔴 Red.; Select: Which light is on now? to Case: 🟡 Amber.; Select: Which light is on now? to Case: 🟢 Green.; Case: 🔴 Red. to Action: 🚗 Switch to green so traffic can go.; Case: 🟡 Amber. to Action: 🛑 Switch to red so traffic stops.; Case: 🟢 Green. to Action: ⚠️ Switch to amber to warn traffic to stop.; Action: 🚗 Switch to green so traffic can go. to the changed merge at the iteration tail of the cycle; Action: 🛑 Switch to red so traffic stops. to the changed merge at the iteration tail of the cycle; Action: ⚠️ Switch to amber to warn traffic to stop. to the changed merge at the iteration tail of the cycle; the entry of the cycle to Select: Which light is on now?; Repeat from the changed merge at the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">🚦 Keep changing the traffic light.</title>
    <rect class="cycle-boundary" x="32" y="127" width="1078" height="570" rx="12"/>
    <text class="cycle-caption" x="1098" y="141" text-anchor="end" xml:space="preserve"><tspan x="1098" dy="0">🚦 Keep changing the traffic light.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="back-edge-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 90 L 220 162
      M 220 306 L 220 378
      M 348 270 L 580 270 L 580 378
      M 348 270 L 940 270 L 940 378
      M 220 448 L 220 520
      M 580 448 L 580 520
      M 940 448 L 940 520
      M 220 586 L 220 662
      M 580 586 L 580 662 L 220 662
      M 940 586 L 940 662 L 220 662
      M 220 162 L 220 234
    "/>
    <path class="connection" d="
      M 220 662 L 60 662 L 60 162 L 220 162
    " marker-end="url(#back-edge-arrow)"/>
    <text class="connection-label" x="233" y="680" xml:space="preserve"><tspan x="233" dy="0">changed</tspan></text>
    <text class="connection-label" x="233" y="108" xml:space="preserve"><tspan x="233" dy="0">mut showing</tspan></text>
    <text class="connection-label" x="233" y="466" xml:space="preserve"><tspan x="233" dy="0">red</tspan></text>
    <text class="connection-label" x="593" y="466" xml:space="preserve"><tspan x="593" dy="0">amber</tspan></text>
    <text class="connection-label" x="953" y="466" xml:space="preserve"><tspan x="953" dy="0">green</tspan></text>
    <text class="connection-label" x="233" y="223" xml:space="preserve"><tspan x="233" dy="0">&amp;showing</tspan></text>
    <text class="connection-label" x="233" y="509" xml:space="preserve"><tspan x="233" dy="0">red, &amp;mut showing</tspan></text>
    <text class="connection-label" x="593" y="509" xml:space="preserve"><tspan x="593" dy="0">amber, &amp;mut showing</tspan></text>
    <text class="connection-label" x="953" y="509" xml:space="preserve"><tspan x="953" dy="0">green, &amp;mut showing</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 61 L 456 61"/>
    <g class="parameter-panel" transform="translate(576 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut showing: Light</tspan></text>
    </g>
    <g class="node merge" transform="translate(220 662)">
      <title xml:space="preserve">the changed merge at the iteration tail of the cycle</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">endless</tspan></text>
    </g>
    <g class="node select" transform="translate(220 270)">
      <title xml:space="preserve">Which light is on now?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Which light is on now?</tspan></text>
    </g>
    <g class="node case" transform="translate(220 413)">
      <title xml:space="preserve">🔴 Red.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">🔴 Red.</tspan></text>
    </g>
    <g class="node case" transform="translate(580 413)">
      <title xml:space="preserve">🟡 Amber.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">🟡 Amber.</tspan></text>
    </g>
    <g class="node case" transform="translate(940 413)">
      <title xml:space="preserve">🟢 Green.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">🟢 Green.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 553)">
      <title xml:space="preserve">🚗 Switch to green so traffic can go.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">🚗 Switch to green so traffic can </tspan><tspan x="-124" dy="18">go.</tspan></text>
    </g>
    <g class="node action" transform="translate(580 553)">
      <title xml:space="preserve">🛑 Switch to red so traffic stops.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">🛑 Switch to red so traffic stops.</tspan></text>
    </g>
    <g class="node action" transform="translate(940 553)">
      <title xml:space="preserve">⚠️ Switch to amber to warn traffic to stop.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">⚠️ Switch to amber to warn </tspan><tspan x="-124" dy="18">traffic to stop.</tspan></text>
    </g>
  </g>
</svg>
