<svg xmlns="http://www.w3.org/2000/svg" width="708" height="880" viewBox="0 0 708 880" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for do_while</title>
  <desc id="kaalang-description">Cycles: Take one digit off the end. with inputs mut number, mut digits and outputs collected. Nodes: Start: do_while with parameters number: u64 handing over number; Action: 📭 Start with no digits. capturing nothing handing over digits; Action: ✂️ Record the last digit and drop it. capturing &amp;mut number, &amp;mut digits; Question: Is the number gone? capturing number handing over done / _again described as branch 1: YES / branch 2: NO; Action: 🔄 Put the digits back in reading order. capturing mut collected handing over result; End: Vec&lt;u8&gt; capturing result. Connections: Start: do_while to Action: 📭 Start with no digits.; Action: 📭 Start with no digits. to the entry of the cycle; Action: ✂️ Record the last digit and drop it. to Question: Is the number gone?; Question: Is the number gone? branch 1 to Action: 🔄 Put the digits back in reading order.; Question: Is the number gone? branch 2 to the iteration tail of the cycle; Action: 🔄 Put the digits back in reading order. to End: Vec&lt;u8&gt;; the entry of the cycle to Action: ✂️ Record the last digit and drop it.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Take one digit off the end.</title>
    <rect class="cycle-boundary" x="32" y="263" width="576" height="352" rx="12"/>
    <text class="cycle-caption" x="596" y="277" text-anchor="end" xml:space="preserve"><tspan x="596" dy="0">Take one digit off the end.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 298
      M 200 436 L 200 508
      M 200 580 L 200 652
      M 340 544 L 560 544
      M 200 718 L 200 790
      M 200 298 L 200 370
    "/>
    <path class="connection" d="
      M 560 544 L 580 544 L 580 298 L 200 298
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="779" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">number</tspan></text>
    <text class="connection-label" x="213" y="244" xml:space="preserve"><tspan x="213" dy="0">digits</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="213" y="600" xml:space="preserve"><tspan x="213" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="353" y="532" xml:space="preserve"><tspan x="353" dy="0">NO</tspan></text>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="359" xml:space="preserve"><tspan x="213" dy="0">&amp;mut number, &amp;mut digits</tspan></text>
    <text class="connection-label" x="213" y="497" xml:space="preserve"><tspan x="213" dy="0">number</tspan></text>
    <text class="connection-label" x="213" y="641" xml:space="preserve"><tspan x="213" dy="0">mut collected</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">number: u64</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">do_while</tspan></text>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">📭 Start with no digits.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">📭 Start with no digits.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 403)">
      <title xml:space="preserve">✂️ Record the last digit and drop it.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">✂️ Record the last digit and drop </tspan><tspan x="-124" dy="18">it.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 544)">
      <title xml:space="preserve">Is the number gone?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the number gone?</tspan></text>
    </g>
    <g class="node action" transform="translate(200 685)">
      <title xml:space="preserve">🔄 Put the digits back in reading order.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">🔄 Put the digits back in reading </tspan><tspan x="-124" dy="18">order.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 819)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;u8&gt;</tspan></text>
    </g>
  </g>
</svg>
