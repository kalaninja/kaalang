<svg xmlns="http://www.w3.org/2000/svg" width="708" height="882" viewBox="0 0 708 882" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for do_while</title>
  <desc id="kaalang-description">Cycles: Collect the number&apos;s decimal digits from right to left. with inputs mut number, mut digits and outputs collected. Nodes: Start: do_while with parameters mut number: u64 handing over mut number; Action: 📭 Start an empty list for the digits. capturing nothing handing over mut digits; Action: ✂️ Append the last digit to the list; remove it from the number. capturing &amp;mut number, &amp;mut digits; Question: Have all digits been removed from the number? capturing number handing over collected / again described as branch 1: YES / branch 2: NO; Action: 🔄 Reverse the collected digits to read from left to right. capturing collected, mut digits handing over result; End: Vec&lt;u8&gt; capturing result. Connections: Start: do_while to Action: 📭 Start an empty list for the digits.; Action: 📭 Start an empty list for the digits. to the entry of the cycle; Action: ✂️ Append the last digit to the list; remove it from the number. to Question: Have all digits been removed from the number?; Question: Have all digits been removed from the number? branch 1 to Action: 🔄 Reverse the collected digits to read from left to right.; Question: Have all digits been removed from the number? branch 2 to the iteration tail of the cycle; Action: 🔄 Reverse the collected digits to read from left to right. to End: Vec&lt;u8&gt;; the entry of the cycle to Action: ✂️ Append the last digit to the list; remove it from the number.; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Collect the number&apos;s decimal digits from right to left.</title>
    <rect class="cycle-boundary" x="32" y="265" width="576" height="352" rx="12"/>
    <text class="cycle-caption" x="596" y="279" text-anchor="end" xml:space="preserve"><tspan x="596" dy="0">Collect the number&apos;s decimal digits from right to left.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 228 L 200 300
      M 200 438 L 200 510
      M 200 582 L 200 654
      M 340 546 L 560 546
      M 200 720 L 200 792
      M 200 300 L 200 372
    "/>
    <path class="connection" d="
      M 560 546 L 580 546 L 580 300 L 200 300
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="781" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">mut number</tspan></text>
    <text class="connection-label" x="213" y="246" xml:space="preserve"><tspan x="213" dy="0">mut digits</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="213" y="602" xml:space="preserve"><tspan x="213" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="353" y="534" xml:space="preserve"><tspan x="353" dy="0">NO</tspan></text>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="361" xml:space="preserve"><tspan x="213" dy="0">&amp;mut number, &amp;mut digits</tspan></text>
    <text class="connection-label" x="213" y="499" xml:space="preserve"><tspan x="213" dy="0">number</tspan></text>
    <text class="connection-label" x="213" y="643" xml:space="preserve"><tspan x="213" dy="0">collected, mut digits</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut number: u64</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">do_while</tspan></text>
    </g>
    <g class="node action" transform="translate(200 195)">
      <title xml:space="preserve">📭 Start an empty list for the digits.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">📭 Start an empty list for the </tspan><tspan x="-124" dy="18">digits.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 405)">
      <title xml:space="preserve">✂️ Append the last digit to the list; remove it from the number.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">✂️ Append the last digit to the </tspan><tspan x="-124" dy="18">list; remove it from the number.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 546)">
      <title xml:space="preserve">Have all digits been removed from the number?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Have all digits been </tspan><tspan x="0" dy="18">removed from the number?</tspan></text>
    </g>
    <g class="node action" transform="translate(200 687)">
      <title xml:space="preserve">🔄 Reverse the collected digits to read from left to right.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">🔄 Reverse the collected digits to </tspan><tspan x="-124" dy="18">read from left to right.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 821)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;u8&gt;</tspan></text>
    </g>
  </g>
</svg>
