<svg xmlns="http://www.w3.org/2000/svg" width="704" height="750" viewBox="0 0 704 750" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for middle_exit</title>
  <desc id="kaalang-description">Nodes: Start: middle_exit with parameters number: u64 handing over number; Question: Is the number positive? capturing number handing over positive / zero described as branch 1: YES / branch 2: NO; Action: Guess half the number. capturing positive, number handing over mut guess; Cycle: Average the guess with the number divided by it. capturing number, mut guess handing over root; Action: The root of zero is zero. capturing zero handing over root; End: u64 capturing root; Merge: root. Connections: Start: middle_exit to Question: Is the number positive?; Question: Is the number positive? branch 1 to Action: Guess half the number.; Question: Is the number positive? branch 2 to Action: The root of zero is zero.; Action: Guess half the number. to Cycle: Average the guess with the number divided by it.; Cycle: Average the guess with the number divided by it. to the root merge; Action: The root of zero is zero. to the root merge; the root merge to End: u64.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 234 L 172 306
      M 312 198 L 532 198 L 532 306
      M 172 370 L 172 442
      M 172 508 L 172 584
      M 532 370 L 532 584 L 172 584
      M 172 584 L 172 660
    "/>
    <text class="connection-label" x="185" y="602" xml:space="preserve"><tspan x="185" dy="0">root</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">number</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="254" xml:space="preserve"><tspan x="185" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="186" xml:space="preserve"><tspan x="325" dy="0">NO</tspan></text>
    <text class="connection-label" x="185" y="388" xml:space="preserve"><tspan x="185" dy="0">mut guess</tspan></text>
    <text class="connection-label" x="185" y="295" xml:space="preserve"><tspan x="185" dy="0">positive, number</tspan></text>
    <text class="connection-label" x="185" y="431" xml:space="preserve"><tspan x="185" dy="0">number, mut guess</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">number: u64</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 584)">
      <title xml:space="preserve">the root merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">middle_exit</tspan></text>
    </g>
    <g class="node question" transform="translate(172 198)">
      <title xml:space="preserve">Is the number positive?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the number positive?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 338)">
      <title xml:space="preserve">Guess half the number.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Guess half the number.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 475)">
      <title xml:space="preserve">Average the guess with the number divided by it.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Average the guess with the </tspan><tspan x="-124" dy="18">number divided by it.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(532 338)">
      <title xml:space="preserve">The root of zero is zero.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">The root of zero is zero.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 689)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u64</tspan></text>
    </g>
  </g>
</svg>
