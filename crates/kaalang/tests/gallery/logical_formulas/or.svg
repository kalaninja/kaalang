      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">c</tspan></text>
    </g>
    <g class="node action" transform="translate(172 724)">
