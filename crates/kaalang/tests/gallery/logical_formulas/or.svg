<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="990" viewBox="0 0 1424 990" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for or</title>
  <desc id="kaalang-description">Nodes: Start: or with parameters a: bool; b: bool; c: bool handing over a, b, c; Question: a capturing a handing over true_result / check_b described as branch 1: Yes / branch 2: No; Question: b capturing check_b, b handing over true_result / check_c described as branch 1: Yes / branch 2: No; Question: c capturing check_c, c handing over true_result / false_result described as branch 1: Yes / branch 2: No; Action: Return true. capturing true_result handing over result; Action: Return false. capturing false_result handing over result; End: bool capturing result. Connections: Start: or to Question: a; Question: a branch 1 to the true_result merge; Question: a branch 2 to Question: b; Question: b branch 1 to the true_result merge; Question: b branch 2 to Question: c; Question: c branch 1 to the true_result merge; Question: c branch 2 to Action: Return false.; Action: Return true. to the result merge; Action: Return false. to the result merge; the true_result merge to Action: Return true.; the result merge to End: bool.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="M 172 103 L 172 188"/>
    <path class="connection" d="M 172 260 L 172 600"/>
    <path class="connection" d="M 312 224 L 532 224 L 532 332"/>
    <path class="connection" d="M 532 404 L 532 600 L 172 600"/>
    <path class="connection" d="M 672 368 L 892 368 L 892 476"/>
    <path class="connection" d="M 892 548 L 892 600 L 172 600"/>
    <path class="connection" d="M 1032 512 L 1252 512 L 1252 692"/>
    <path class="connection" d="M 172 756 L 172 808"/>
    <path class="connection" d="M 1252 756 L 1252 808 L 172 808"/>
    <path class="connection" d="M 172 600 L 172 692"/>
    <path class="connection" d="M 172 808 L 172 900"/>
    <text class="connection-label" x="220" y="618" xml:space="preserve"><tspan x="220" dy="0">true_result</tspan></text>
    <text class="connection-label" x="202" y="121" xml:space="preserve"><tspan x="202" dy="0">a, b, c</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="197" y="280" xml:space="preserve"><tspan x="197" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="333" y="212" xml:space="preserve"><tspan x="333" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="557" y="424" xml:space="preserve"><tspan x="557" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="693" y="356" xml:space="preserve"><tspan x="693" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="917" y="568" xml:space="preserve"><tspan x="917" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="1053" y="500" xml:space="preserve"><tspan x="1053" dy="0">No</tspan></text>
    <text class="connection-label" x="188" y="177" xml:space="preserve"><tspan x="188" dy="0">a</tspan></text>
    <text class="connection-label" x="575" y="321" xml:space="preserve"><tspan x="575" dy="0">check_b, b</tspan></text>
    <text class="connection-label" x="935" y="465" xml:space="preserve"><tspan x="935" dy="0">check_c, c</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 74 L 408 74"/>
    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">a: bool</tspan><tspan x="-104" dy="18">b: bool</tspan><tspan x="-104" dy="18">c: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(172 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">or</tspan></text>
    </g>
    <g class="node question" transform="translate(172 224)">
      <title xml:space="preserve">a</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">a</tspan></text>
    </g>
    <g class="node question" transform="translate(532 368)">
