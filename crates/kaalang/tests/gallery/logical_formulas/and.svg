<svg xmlns="http://www.w3.org/2000/svg" width="704" height="990" viewBox="0 0 704 990" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for and</title>
  <desc id="kaalang-description">Nodes: Start: and with parameters a: bool; b: bool; c: bool handing over a, b, c; Question: a capturing a handing over check_b / false_result described as branch 1: Yes / branch 2: No; Question: b capturing check_b, b handing over check_c / false_result described as branch 1: Yes / branch 2: No; Question: c capturing check_c, c handing over true_result / false_result described as branch 1: Yes / branch 2: No; Action: Return true. capturing true_result handing over result; Action: Return false. capturing false_result handing over result; End: bool capturing result; Merge: false_result; Merge: result. Connections: Start: and to Question: a; Question: a branch 1 to Question: b; Question: a branch 2 to the false_result merge; Question: b branch 1 to Question: c; Question: b branch 2 to the false_result merge; Question: c branch 1 to Action: Return true.; Question: c branch 2 to the false_result merge; Action: Return true. to the result merge; Action: Return false. to the result merge; the false_result merge to Action: Return false.; the result merge to End: bool.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 103 L 172 188
      M 172 260 L 172 332
      M 312 224 L 532 224 L 532 620
      M 172 404 L 172 476
      M 312 368 L 532 368 L 532 620
      M 172 548 L 172 692
      M 312 512 L 532 512 L 532 620
      M 172 756 L 172 828
      M 532 756 L 532 828 L 172 828
      M 532 620 L 532 692
      M 172 828 L 172 900
    "/>
    <text class="connection-label" x="545" y="638" xml:space="preserve"><tspan x="545" dy="0">false_result</tspan></text>
    <text class="connection-label" x="185" y="846" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">a, b, c</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="280" xml:space="preserve"><tspan x="185" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="212" xml:space="preserve"><tspan x="325" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="424" xml:space="preserve"><tspan x="185" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="356" xml:space="preserve"><tspan x="325" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="568" xml:space="preserve"><tspan x="185" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="500" xml:space="preserve"><tspan x="325" dy="0">No</tspan></text>
    <text class="connection-label" x="185" y="177" xml:space="preserve"><tspan x="185" dy="0">a</tspan></text>
    <text class="connection-label" x="185" y="321" xml:space="preserve"><tspan x="185" dy="0">check_b, b</tspan></text>
    <text class="connection-label" x="185" y="465" xml:space="preserve"><tspan x="185" dy="0">check_c, c</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 74 L 408 74"/>
    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">a: bool</tspan><tspan x="-104" dy="18">b: bool</tspan><tspan x="-104" dy="18">c: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(532 620)">
      <title xml:space="preserve">the false_result merge</title>
