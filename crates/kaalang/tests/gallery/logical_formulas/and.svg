    <text class="connection-label" x="203" y="800" xml:space="preserve"><tspan x="203" dy="0">result</tspan></text>
    <text class="connection-label" x="202" y="108" xml:space="preserve"><tspan x="202" dy="0">a, b, c</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="197" y="254" xml:space="preserve"><tspan x="197" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="333" y="186" xml:space="preserve"><tspan x="333" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="197" y="398" xml:space="preserve"><tspan x="197" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="333" y="330" xml:space="preserve"><tspan x="333" dy="0">No</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="197" y="542" xml:space="preserve"><tspan x="197" dy="0">Yes</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="333" y="474" xml:space="preserve"><tspan x="333" dy="0">No</tspan></text>
    <text class="connection-label" x="188" y="151" xml:space="preserve"><tspan x="188" dy="0">a</tspan></text>
