<svg xmlns="http://www.w3.org/2000/svg" width="704" height="928" viewBox="0 0 704 928" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for and</title>
  <desc id="kaalang-description">Nodes: Start: and with parameters a: bool; b: bool; c: bool handing over a, b, c; Question: Is condition a true? capturing a handing over check_b / false_result described as branch 1: YES / branch 2: NO; Question: Is condition b true? capturing check_b, b handing over check_c / false_result described as branch 1: YES / branch 2: NO; Question: Is condition c true? capturing check_c, c handing over true_result / false_result described as branch 1: YES / branch 2: NO; Action: ✅ All three conditions are true; return true. capturing true_result handing over result; Action: ❌ At least one condition is false; return false. capturing false_result handing over result; End: bool capturing result; Merge: false_result; Merge: result. Connections: Start: and to Question: Is condition a true?; Question: Is condition a true? branch 1 to Question: Is condition b true?; Question: Is condition a true? branch 2 to the false_result merge; Question: Is condition b true? branch 1 to Question: Is condition c true?; Question: Is condition b true? branch 2 to the false_result merge; Question: Is condition c true? branch 1 to Action: ✅ All three conditions are true; return true.; Question: Is condition c true? branch 2 to the false_result merge; Action: ✅ All three conditions are true; return true. to the result merge; Action: ❌ At least one condition is false; return false. to the result merge; the false_result merge to Action: ❌ At least one condition is false; return false.; the result merge to End: bool.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .md-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-weight: 600; }
      .md-bold { font-weight: 800; }
      .md-italic { font-style: italic; }
      .md-quote { font-style: italic; }
      .md-strikethrough { text-decoration: line-through; }
      .md-underline { text-decoration: underline; }
      .md-strikethrough.md-underline { text-decoration: underline line-through; }
      .md-highlight-box { fill: #fef08a; stroke: none; }
      .md-superscript, .md-subscript { font-size: 75%; }
      .md-superscript { baseline-shift: 0.4em; }
      .md-subscript { baseline-shift: -0.2em; }
      .md-math { color: inherit; overflow: visible; }
      .md-math path, .md-math rect:not([stroke]) { stroke: none; vector-effect: non-scaling-stroke; }
      .md-math.md-bold path { stroke: currentColor; stroke-width: 0.7px; stroke-linejoin: round; }
      .md-math.md-bold g[stroke] path { stroke: inherit; }
      .cycle-caption .md-math { color: #166534; }
      .md-color-red, .md-math.md-color-red { fill: #b91c1c; color: #b91c1c; }
      .md-color-green, .md-math.md-color-green { fill: #166534; color: #166534; }
      .md-color-blue, .md-math.md-color-blue { fill: #1d4ed8; color: #1d4ed8; }
      .md-color-purple, .md-math.md-color-purple { fill: #6d28d9; color: #6d28d9; }
      .md-color-muted, .md-math.md-color-muted { fill: #475569; color: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 103 L 172 188
      M 172 260 L 172 332
      M 312 224 L 532 224 L 532 512
      M 172 404 L 172 476
      M 312 368 L 532 368 L 532 512
      M 172 548 L 172 620
      M 312 512 L 532 512
      M 172 686 L 172 762
      M 532 686 L 532 762 L 172 762
      M 532 512 L 532 620
      M 172 762 L 172 838
    "/>
    <text class="connection-label" x="545" y="530" xml:space="preserve"><tspan x="545" dy="0">false_result</tspan></text>
    <text class="connection-label" x="185" y="780" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">a, b, c</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="280" xml:space="preserve"><tspan x="185" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="212" xml:space="preserve"><tspan x="325" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="424" xml:space="preserve"><tspan x="185" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="356" xml:space="preserve"><tspan x="325" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="185" y="568" xml:space="preserve"><tspan x="185" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="325" y="500" xml:space="preserve"><tspan x="325" dy="0">NO</tspan></text>
    <text class="connection-label" x="185" y="177" xml:space="preserve"><tspan x="185" dy="0">a</tspan></text>
    <text class="connection-label" x="185" y="321" xml:space="preserve"><tspan x="185" dy="0">check_b, b</tspan></text>
    <text class="connection-label" x="185" y="465" xml:space="preserve"><tspan x="185" dy="0">check_c, c</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 74 L 408 74"/>
    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">a: bool</tspan><tspan x="-104" dy="18">b: bool</tspan><tspan x="-104" dy="18">c: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(532 512)">
      <title xml:space="preserve">the false_result merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node merge" transform="translate(172 762)">
      <title xml:space="preserve">the result merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">and</tspan></text>
    </g>
    <g class="node question" transform="translate(172 224)">
      <title xml:space="preserve">Is condition a true?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is condition <tspan class="md-code">a</tspan> true?</tspan></text>
    </g>
    <g class="node question" transform="translate(172 368)">
      <title xml:space="preserve">Is condition b true?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is condition <tspan class="md-code">b</tspan> true?</tspan></text>
    </g>
    <g class="node question" transform="translate(172 512)">
      <title xml:space="preserve">Is condition c true?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is condition <tspan class="md-code">c</tspan> true?</tspan></text>
    </g>
    <g class="node action" transform="translate(172 653)">
      <title xml:space="preserve">✅ All three conditions are true; return true.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">✅ All three conditions are true; </tspan><tspan x="-124" dy="18">return <tspan class="md-code">true</tspan>.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 653)">
      <title xml:space="preserve">❌ At least one condition is false; return false.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">❌ At least one condition is false; </tspan><tspan x="-124" dy="18">return <tspan class="md-code">false</tspan>.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 867)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">bool</tspan></text>
    </g>
  </g>
</svg>
