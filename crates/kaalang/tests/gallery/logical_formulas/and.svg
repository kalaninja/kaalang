      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">b</tspan></text>
    </g>
    <g class="node question" transform="translate(172 512)">
