<svg xmlns="http://www.w3.org/2000/svg" width="704" height="964" viewBox="0 0 704 964" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for and</title>
  <desc id="kaalang-description">Nodes: Start: and(a: bool, b: bool, c: bool) -&gt; bool handing over a, b, c; Question: a capturing a handing over check_b / false_result described as branch 1: Yes / branch 2: No; Question: b capturing check_b, b handing over check_c / false_result described as branch 1: Yes / branch 2: No; Question: c capturing check_c, c handing over true_result / false_result described as branch 1: Yes / branch 2: No; Action: Return true. capturing true_result handing over result; Action: Return false. capturing false_result handing over result; End: bool capturing result. Connections: Start: and(a: bool, b: bool, c: bool) -&gt; bool to Question: a; Question: a branch 1 to Question: b; Question: a branch 2 to the false_result merge; Question: b branch 1 to Question: c; Question: b branch 2 to the false_result merge; Question: c branch 1 to Action: Return true.; Question: c branch 2 to the false_result merge; Action: Return true. to the result merge; Action: Return false. to the result merge; the false_result merge to Action: Return false.; the result merge to End: bool.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
