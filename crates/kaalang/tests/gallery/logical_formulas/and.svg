      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">c</tspan></text>
    </g>
    <g class="node action" transform="translate(172 724)">
      <title xml:space="preserve">Return true.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return true.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 724)">
      <title xml:space="preserve">Return false.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return false.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 929)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">bool</tspan></text>
    </g>
  </g>
</svg>
