<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="972" viewBox="0 0 1424 972" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for inverted_and</title>
  <desc id="kaalang-description">Nodes: Start: inverted_and(a: bool, b: bool, c: bool) -&gt; bool handing over a, b, c; Question: a capturing a handing over true_result / check_b described as branch 1: No / branch 2: Yes; Question: b capturing check_b, b handing over true_result / check_c described as branch 1: No / branch 2: Yes; Question: c capturing check_c, c handing over true_result / false_result described as branch 1: No / branch 2: Yes; Action: Return true. capturing true_result handing over result; Action: Return false. capturing false_result handing over result; End: bool capturing result. Connections: Start: inverted_and(a: bool, b: bool, c: bool) -&gt; bool to Question: a; Question: a branch 1 to the true_result merge; Question: a branch 2 to Question: b; Question: b branch 1 to the true_result merge; Question: b branch 2 to Question: c; Question: c branch 1 to the true_result merge; Question: c branch 2 to Action: Return false.; Action: Return true. to the result merge; Action: Return false. to the result merge; the true_result merge to Action: Return true.; the result merge to End: bool.</desc>
