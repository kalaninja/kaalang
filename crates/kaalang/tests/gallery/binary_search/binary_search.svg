<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="1314" viewBox="0 0 1444 1314" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for binary_search</title>
  <desc id="kaalang-description">Nodes: Start: binary_search with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: Initialize the search range. capturing values handing over mut left, mut right; Question: Does the search range contain any elements? capturing &amp;left, &amp;right described as branch 1: YES / branch 2: NO; Action: Find the middle index. capturing left, right handing over mid; Select: Compare the middle element with the target. capturing values, target, mid; Case: Less than the target. handing over less; Case: Greater than the target. handing over greater; Case: Equal to the target. handing over equal; Action: Search the right half. capturing less, mid, &amp;mut left; Action: Search the left half. capturing greater, mid, &amp;mut right; Action: The target was found. capturing equal, mid handing over end; Action: The target is absent. capturing nothing handing over end; End: Option&lt;usize&gt; capturing end. Connections: Start: binary_search to Action: Initialize the search range.; Action: Initialize the search range. to the entry of Question: Does the search range contain any elements?; Question: Does the search range contain any elements? branch 1 to Action: Find the middle index.; Question: Does the search range contain any elements? branch 2 to Action: The target is absent.; Action: Find the middle index. to Select: Compare the middle element with the target.; Select: Compare the middle element with the target. to Case: Less than the target.; Select: Compare the middle element with the target. to Case: Greater than the target.; Select: Compare the middle element with the target. to Case: Equal to the target.; Case: Less than the target. to Action: Search the right half.; Case: Greater than the target. to Action: Search the left half.; Case: Equal to the target. to Action: The target was found.; Action: Search the right half. to the iteration tail of Question: Does the search range contain any elements?; Action: Search the left half. to the iteration tail of Question: Does the search range contain any elements?; Action: The target was found. to the end merge; Action: The target is absent. to the end merge; the end merge to End: Option&lt;usize&gt;; the entry of Question: Does the search range contain any elements? to Question: Does the search range contain any elements?; Repeat from the iteration tail of Question: Does the search range contain any elements? to the entry of Question: Does the search range contain any elements?.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 192 94 L 192 170
      M 192 234 L 192 306
      M 192 450 L 192 522
      M 332 414 L 1272 414 L 1272 522
      M 192 586 L 192 658
      M 192 730 L 192 874
      M 192 730 L 192 802 L 552 802 L 552 874
      M 192 730 L 192 802 L 912 802 L 912 874
      M 192 944 L 192 1016
      M 552 944 L 552 1016
      M 912 944 L 912 1016
      M 192 1080 L 192 1152
      M 552 1080 L 552 1152 L 192 1152
      M 912 1080 L 912 1152
      M 1272 586 L 1272 1152 L 912 1152
      M 912 1152 L 912 1224
      M 192 306 L 192 378
    "/>
    <path class="connection" d="
      M 192 1152 L 32 1152 L 32 306 L 192 306
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="112" xml:space="preserve"><tspan x="205" dy="0">values, target</tspan></text>
    <text class="connection-label" x="205" y="252" xml:space="preserve"><tspan x="205" dy="0">mut left, mut right</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="470" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="402" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="205" y="604" xml:space="preserve"><tspan x="205" dy="0">mid</tspan></text>
    <text class="connection-label" x="205" y="962" xml:space="preserve"><tspan x="205" dy="0">less</tspan></text>
    <text class="connection-label" x="565" y="962" xml:space="preserve"><tspan x="565" dy="0">greater</tspan></text>
    <text class="connection-label" x="925" y="962" xml:space="preserve"><tspan x="925" dy="0">equal</tspan></text>
    <text class="connection-label" x="205" y="159" xml:space="preserve"><tspan x="205" dy="0">values</tspan></text>
    <text class="connection-label" x="205" y="367" xml:space="preserve"><tspan x="205" dy="0">&amp;left, &amp;right</tspan></text>
    <text class="connection-label" x="205" y="511" xml:space="preserve"><tspan x="205" dy="0">left, right</tspan></text>
    <text class="connection-label" x="205" y="647" xml:space="preserve"><tspan x="205" dy="0">values, target, mid</tspan></text>
    <text class="connection-label" x="205" y="1005" xml:space="preserve"><tspan x="205" dy="0">less, mid, &amp;mut left</tspan></text>
    <text class="connection-label" x="565" y="1005" xml:space="preserve"><tspan x="565" dy="0">greater, mid, &amp;mut right</tspan></text>
    <text class="connection-label" x="925" y="1005" xml:space="preserve"><tspan x="925" dy="0">equal, mid</tspan></text>
    <text class="connection-label" x="1285" y="511" xml:space="preserve"><tspan x="1285" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 65 L 428 65"/>
    <g class="parameter-panel" transform="translate(548 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">values: &amp;[i32]</tspan><tspan x="-104" dy="18">target: i32</tspan></text>
    </g>
    <g class="node start" transform="translate(192 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">binary_search</tspan></text>
    </g>
    <g class="node action" transform="translate(192 202)">
      <title xml:space="preserve">Initialize the search range.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the search range.</tspan></text>
    </g>
    <g class="node question" transform="translate(192 414)">
      <title xml:space="preserve">Does the search range contain any elements?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Does the search range </tspan><tspan x="0" dy="18">contain any elements?</tspan></text>
    </g>
    <g class="node action" transform="translate(192 554)">
      <title xml:space="preserve">Find the middle index.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Find the middle index.</tspan></text>
    </g>
    <g class="node select" transform="translate(192 694)">
      <title xml:space="preserve">Compare the middle element with the target.</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Compare the middle </tspan><tspan x="0" dy="18">element with the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(192 909)">
      <title xml:space="preserve">Less than the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Less than the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(552 909)">
      <title xml:space="preserve">Greater than the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Greater than the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(912 909)">
      <title xml:space="preserve">Equal to the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Equal to the target.</tspan></text>
    </g>
    <g class="node action" transform="translate(192 1048)">
      <title xml:space="preserve">Search the right half.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Search the right half.</tspan></text>
    </g>
    <g class="node action" transform="translate(552 1048)">
      <title xml:space="preserve">Search the left half.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Search the left half.</tspan></text>
    </g>
    <g class="node action" transform="translate(912 1048)">
      <title xml:space="preserve">The target was found.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">The target was found.</tspan></text>
    </g>
    <g class="node action" transform="translate(1272 554)">
      <title xml:space="preserve">The target is absent.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">The target is absent.</tspan></text>
    </g>
    <g class="node end" transform="translate(912 1253)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Option&lt;usize&gt;</tspan></text>
    </g>
  </g>
</svg>
