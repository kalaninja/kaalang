<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for binary_search</title>
  <desc id="kaalang-description">Cycles: 🔍 Search the remaining range. with inputs values, target, mut left, mut right and outputs result. Nodes: Start: binary_search with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: 📏 Initialize the search range. capturing values handing over left, right; Question: Does the search range contain any elements? capturing left, right handing over iterate / leave described as branch 1: YES / branch 2: NO; Action: 🚫 The target is absent. capturing leave handing over outcome; Action: 📍 Find the middle index. capturing iterate, left, right handing over mid; Select: Compare the middle element with the target. capturing values, target, mid; Case: Less than the target. handing over less; Case: Greater than the target. handing over greater; Case: Equal to the target. handing over equal; Action: ➡️ Search the right half. capturing less, mid, &amp;mut left; Action: ⬅️ Search the left half. capturing greater, mid, &amp;mut right; Action: 🎯 The target was found. capturing equal, mid handing over outcome; End: Option&lt;usize&gt; capturing result; Merge: outcome. Connections: Start: binary_search to Action: 📏 Initialize the search range.; Action: 📏 Initialize the search range. to the entry of the cycle; Question: Does the search range contain any elements? branch 1 to Action: 📍 Find the middle index.; Question: Does the search range contain any elements? branch 2 to Action: 🚫 The target is absent.; Action: 🚫 The target is absent. to the outcome merge at the cycle result; Action: 📍 Find the middle index. to Select: Compare the middle element with the target.; Select: Compare the middle element with the target. to Case: Less than the target.; Select: Compare the middle element with the target. to Case: Greater than the target.; Select: Compare the middle element with the target. to Case: Equal to the target.; Case: Less than the target. to Action: ➡️ Search the right half.; Case: Greater than the target. to Action: ⬅️ Search the left half.; Case: Equal to the target. to Action: 🎯 The target was found.; Action: ➡️ Search the right half. to the iteration tail of the cycle; Action: ⬅️ Search the left half. to the iteration tail of the cycle; Action: 🎯 The target was found. to the outcome merge at the cycle result; the outcome merge at the cycle result to End: Option&lt;usize&gt;; the entry of the cycle to Question: Does the search range contain any elements?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">🔍 Search the remaining range.</title>
    <rect class="cycle-boundary" x="32" y="271" width="1436" height="848" rx="12"/>
    <text class="cycle-caption" x="1456" y="285" text-anchor="end" xml:space="preserve"><tspan x="1456" dy="0">🔍 Search the remaining range.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 94 L 220 170
      M 220 234 L 220 306
      M 220 450 L 220 522
      M 360 414 L 1300 414 L 1300 522
      M 1300 586 L 1300 1084 L 940 1084
      M 220 586 L 220 658
      M 220 730 L 220 802
      M 348 694 L 580 694 L 580 802
      M 348 694 L 940 694 L 940 802
      M 220 872 L 220 944
      M 580 872 L 580 944
      M 940 872 L 940 944
      M 220 1008 L 220 1084
      M 580 1008 L 580 1084 L 220 1084
      M 940 1008 L 940 1084
      M 940 1084 L 940 1160
      M 220 306 L 220 378
    "/>
    <path class="connection" d="
      M 220 1084 L 60 1084 L 60 306 L 220 306
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="953" y="1102" xml:space="preserve"><tspan x="953" dy="0">outcome</tspan></text>
    <text class="connection-label" x="233" y="112" xml:space="preserve"><tspan x="233" dy="0">values, target</tspan></text>
    <text class="connection-label" x="233" y="252" xml:space="preserve"><tspan x="233" dy="0">left, right</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="233" y="470" xml:space="preserve"><tspan x="233" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="373" y="402" xml:space="preserve"><tspan x="373" dy="0">NO</tspan></text>
    <text class="connection-label" x="233" y="604" xml:space="preserve"><tspan x="233" dy="0">mid</tspan></text>
    <text class="connection-label" x="233" y="890" xml:space="preserve"><tspan x="233" dy="0">less</tspan></text>
    <text class="connection-label" x="593" y="890" xml:space="preserve"><tspan x="593" dy="0">greater</tspan></text>
    <text class="connection-label" x="953" y="890" xml:space="preserve"><tspan x="953" dy="0">equal</tspan></text>
    <text class="connection-label" x="233" y="159" xml:space="preserve"><tspan x="233" dy="0">values</tspan></text>
    <text class="connection-label" x="233" y="367" xml:space="preserve"><tspan x="233" dy="0">left, right</tspan></text>
    <text class="connection-label" x="233" y="511" xml:space="preserve"><tspan x="233" dy="0">iterate, left, right</tspan></text>
    <text class="connection-label" x="233" y="647" xml:space="preserve"><tspan x="233" dy="0">values, target, mid</tspan></text>
    <text class="connection-label" x="233" y="933" xml:space="preserve"><tspan x="233" dy="0">less, mid, &amp;mut left</tspan></text>
    <text class="connection-label" x="593" y="933" xml:space="preserve"><tspan x="593" dy="0">greater, mid, &amp;mut right</tspan></text>
    <text class="connection-label" x="953" y="933" xml:space="preserve"><tspan x="953" dy="0">equal, mid</tspan></text>
    <text class="connection-label" x="953" y="1149" xml:space="preserve"><tspan x="953" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 65 L 456 65"/>
    <g class="parameter-panel" transform="translate(576 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">values: &amp;[i32]</tspan><tspan x="-104" dy="18">target: i32</tspan></text>
    </g>
    <g class="node merge" transform="translate(940 1084)">
      <title xml:space="preserve">the outcome merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">binary_search</tspan></text>
    </g>
    <g class="node action" transform="translate(220 202)">
      <title xml:space="preserve">📏 Initialize the search range.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">📏 Initialize the search range.</tspan></text>
    </g>
    <g class="node question" transform="translate(220 414)">
      <title xml:space="preserve">Does the search range contain any elements?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Does the search range </tspan><tspan x="0" dy="18">contain any elements?</tspan></text>
    </g>
    <g class="node action" transform="translate(1300 554)">
      <title xml:space="preserve">🚫 The target is absent.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">🚫 The target is absent.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 554)">
      <title xml:space="preserve">📍 Find the middle index.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">📍 Find the middle index.</tspan></text>
    </g>
    <g class="node select" transform="translate(220 694)">
      <title xml:space="preserve">Compare the middle element with the target.</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Compare the middle </tspan><tspan x="0" dy="18">element with the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(220 837)">
      <title xml:space="preserve">Less than the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Less than the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(580 837)">
      <title xml:space="preserve">Greater than the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Greater than the target.</tspan></text>
    </g>
    <g class="node case" transform="translate(940 837)">
      <title xml:space="preserve">Equal to the target.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Equal to the target.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 976)">
      <title xml:space="preserve">➡️ Search the right half.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">➡️ Search the right half.</tspan></text>
    </g>
    <g class="node action" transform="translate(580 976)">
      <title xml:space="preserve">⬅️ Search the left half.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">⬅️ Search the left half.</tspan></text>
    </g>
    <g class="node action" transform="translate(940 976)">
      <title xml:space="preserve">🎯 The target was found.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">🎯 The target was found.</tspan></text>
    </g>
    <g class="node end" transform="translate(940 1189)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Option&lt;usize&gt;</tspan></text>
    </g>
  </g>
</svg>
