<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1314" viewBox="0 0 1464 1314" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for binary_search_swapped</title>
  <desc id="kaalang-description">Nodes: Start: binary_search_swapped with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: Initialize the search range. capturing values handing over mut left, mut right; Question: Does the search range contain any elements? capturing left, right handing over leave / iterate described as branch 1: NO / branch 2: YES; Action: Find the middle index. capturing iterate, left, right handing over mid; Select: Compare the middle element with the target. capturing values, target, mid; Case: Equal to the target. handing over equal; Case: Less than the target. handing over less; Case: Greater than the target. handing over greater; Action: The target was found. capturing equal, mid handing over end; Action: Search the right half. capturing less, mid, &amp;mut left; Action: Search the left half. capturing greater, mid, &amp;mut right; Action: The target is absent. capturing nothing handing over end; End: Option&lt;usize&gt; capturing end. Connections: Start: binary_search_swapped to Action: Initialize the search range.; Action: Initialize the search range. to the entry of the loop; Question: Does the search range contain any elements? branch 1 to Action: The target is absent.; Question: Does the search range contain any elements? branch 2 to Action: Find the middle index.; Action: Find the middle index. to Select: Compare the middle element with the target.; Select: Compare the middle element with the target. to Case: Equal to the target.; Select: Compare the middle element with the target. to Case: Less than the target.; Select: Compare the middle element with the target. to Case: Greater than the target.; Case: Equal to the target. to Action: The target was found.; Case: Less than the target. to Action: Search the right half.; Case: Greater than the target. to Action: Search the left half.; Action: The target was found. to the end merge; Action: Search the right half. to the iteration tail of the loop; Action: Search the left half. to the iteration tail of the loop; Action: The target is absent. to the end merge; the end merge to End: Option&lt;usize&gt;; the entry of the loop to Question: Does the search range contain any elements?; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
