    <rect class="cycle-boundary" x="32" y="271" width="1456" height="848" rx="12"/>
    <text class="cycle-caption" x="1476" y="285" text-anchor="end" xml:space="preserve"><tspan x="1476" dy="0">Search the remaining range.</tspan></text>
    </g>
  </g>
