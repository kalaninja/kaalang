      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Are any values left in the </tspan><tspan x="0" dy="18">search range?</tspan></text>
    </g>
