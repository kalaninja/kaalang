<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1250" viewBox="0 0 1520 1250" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for binary_search_swapped</title>
  <desc id="kaalang-description">Cycles: Search the remaining range. with inputs values, target, mut left, mut right and outputs result. Nodes: Start: binary_search_swapped with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: Initialize the search range. capturing values handing over mut left, mut right; Question: Does the search range contain any elements? capturing left, right handing over leave / iterate described as branch 1: NO / branch 2: YES; Action: The target is absent. capturing leave handing over outcome; Action: Find the middle index. capturing iterate, left, right handing over mid; Select: Compare the middle element with the target. capturing values, target, mid; Case: Equal to the target. handing over equal; Case: Less than the target. handing over less; Case: Greater than the target. handing over greater; Action: The target was found. capturing equal, mid handing over outcome; Action: Search the right half. capturing less, mid, &amp;mut left; Action: Search the left half. capturing greater, mid, &amp;mut right; End: Option&lt;usize&gt; capturing result; Merge: outcome. Connections: Start: binary_search_swapped to Action: Initialize the search range.; Action: Initialize the search range. to the entry of the cycle; Question: Does the search range contain any elements? branch 1 to Action: The target is absent.; Question: Does the search range contain any elements? branch 2 to Action: Find the middle index.; Action: The target is absent. to the outcome merge at the cycle result; Action: Find the middle index. to Select: Compare the middle element with the target.; Select: Compare the middle element with the target. to Case: Equal to the target.; Select: Compare the middle element with the target. to Case: Less than the target.; Select: Compare the middle element with the target. to Case: Greater than the target.; Case: Equal to the target. to Action: The target was found.; Case: Less than the target. to Action: Search the right half.; Case: Greater than the target. to Action: Search the left half.; Action: The target was found. to the outcome merge at the cycle result; Action: Search the right half. to the iteration tail of the cycle; Action: Search the left half. to the iteration tail of the cycle; the outcome merge at the cycle result to End: Option&lt;usize&gt;; the entry of the cycle to Question: Does the search range contain any elements?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
