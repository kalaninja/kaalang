<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1256" viewBox="0 0 1520 1256" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for binary_search_swapped</title>
  <desc id="kaalang-description">Cycles: 🔍 Narrow the range until the target is found or ruled out. with inputs mut left, mut right, values, target and outputs result. Nodes: Start: binary_search_swapped with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: 📏 Start with the entire sorted list. capturing values handing over mut left, mut right; Question: Are any values left in the search range? capturing left, right handing over leave / iterate described as branch 1: NO / branch 2: YES; Action: 🚫 Report that the target is absent. capturing leave handing over result; Action: 📍 Select the middle value of this range. capturing iterate, values, left, right handing over mid, value; Select: How does this value compare with the target? capturing value, target; Case: Equal to the target. handing over equal; Case: Less than the target. handing over less; Case: Greater than the target. handing over greater; Action: 🎯 Report the position of this matching value. capturing equal, mid handing over result; Action: ➡️ Discard this value and everything to its left. capturing less, mid, &amp;mut left handing over stepped; Action: ⬅️ Discard this value and everything to its right. capturing greater, mid, &amp;mut right handing over stepped; End: Option&lt;usize&gt; capturing result; Merge: result; Merge: stepped. Connections: Start: binary_search_swapped to Action: 📏 Start with the entire sorted list.; Action: 📏 Start with the entire sorted list. to the entry of the cycle; Question: Are any values left in the search range? branch 1 to Action: 🚫 Report that the target is absent.; Question: Are any values left in the search range? branch 2 to Action: 📍 Select the middle value of this range.; Action: 🚫 Report that the target is absent. to the result merge at the cycle result; Action: 📍 Select the middle value of this range. to Select: How does this value compare with the target?; Select: How does this value compare with the target? to Case: Equal to the target.; Select: How does this value compare with the target? to Case: Less than the target.; Select: How does this value compare with the target? to Case: Greater than the target.; Case: Equal to the target. to Action: 🎯 Report the position of this matching value.; Case: Less than the target. to Action: ➡️ Discard this value and everything to its left.; Case: Greater than the target. to Action: ⬅️ Discard this value and everything to its right.; Action: 🎯 Report the position of this matching value. to the result merge at the cycle result; Action: ➡️ Discard this value and everything to its left. to the stepped merge at the iteration tail of the cycle; Action: ⬅️ Discard this value and everything to its right. to the stepped merge at the iteration tail of the cycle; the result merge at the cycle result to End: Option&lt;usize&gt;; the entry of the cycle to Question: Are any values left in the search range?; Repeat from the stepped merge at the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .cycle .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .cycle .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
