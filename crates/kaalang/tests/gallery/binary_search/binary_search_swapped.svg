    <text class="connection-label" x="213" y="159" xml:space="preserve"><tspan x="213" dy="0">values</tspan></text>
    <text class="connection-label" x="213" y="367" xml:space="preserve"><tspan x="213" dy="0">left, right</tspan></text>
    <text class="connection-label" x="573" y="511" xml:space="preserve"><tspan x="573" dy="0">iterate, left, right</tspan></text>
    <text class="connection-label" x="573" y="647" xml:space="preserve"><tspan x="573" dy="0">values, target, mid</tspan></text>
    <text class="connection-label" x="573" y="933" xml:space="preserve"><tspan x="573" dy="0">equal, mid</tspan></text>
    <text class="connection-label" x="933" y="933" xml:space="preserve"><tspan x="933" dy="0">less, mid, &amp;mut left</tspan></text>
    <text class="connection-label" x="1293" y="933" xml:space="preserve"><tspan x="1293" dy="0">greater, mid, &amp;mut right</tspan></text>
    <text class="connection-label" x="213" y="1149" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
  </g>
