    <text class="connection-label" x="573" y="651" xml:space="preserve"><tspan x="573" dy="0">value, target</tspan></text>
    <text class="connection-label" x="573" y="937" xml:space="preserve"><tspan x="573" dy="0">equal, mid</tspan></text>
    <text class="connection-label" x="933" y="937" xml:space="preserve"><tspan x="933" dy="0">less, mid, &amp;mut left</tspan></text>
    <text class="connection-label" x="1293" y="937" xml:space="preserve"><tspan x="1293" dy="0">greater, mid, &amp;mut right</tspan></text>
  </g>
