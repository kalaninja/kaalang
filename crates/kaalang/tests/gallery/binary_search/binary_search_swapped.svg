  <title id="kaalang-title">kaalang diagram for binary_search_swapped</title>
  <desc id="kaalang-description">Nodes: Start: binary_search_swapped with parameters values: &amp;[i32]; target: i32 handing over values, target; Action: Initialize the search range. capturing values handing over mut left, mut right; Question: Does the search range contain any elements? capturing &amp;left, &amp;right described as branch 1: NO / branch 2: YES; Action: Find the middle index. capturing left, right handing over mid; Select: Compare the middle element with the target. capturing values, target, mid; Case: The target was found. handing over equal; Case: Search the right half. handing over less; Case: Search the left half. handing over greater; Action: Return the matching index. capturing equal, mid handing over result; Action: Advance the lower bound. capturing less, mid, &amp;mut left; Action: Reduce the upper bound. capturing greater, mid, &amp;mut right; Action: The target is absent. capturing nothing handing over result; End: Option&lt;usize&gt; capturing result. Connections: Start: binary_search_swapped to Action: Initialize the search range.; Action: Initialize the search range. to the entry of Question: Does the search range contain any elements?; Question: Does the search range contain any elements? branch 1 to Action: The target is absent.; Question: Does the search range contain any elements? branch 2 to Action: Find the middle index.; Action: Find the middle index. to Select: Compare the middle element with the target.; Select: Compare the middle element with the target. to Case: The target was found.; Select: Compare the middle element with the target. to Case: Search the right half.; Select: Compare the middle element with the target. to Case: Search the left half.; Case: The target was found. to Action: Return the matching index.; Case: Search the right half. to Action: Advance the lower bound.; Case: Search the left half. to Action: Reduce the upper bound.; Action: Return the matching index. to the result merge; Action: Advance the lower bound. to the iteration tail of Question: Does the search range contain any elements?; Action: Reduce the upper bound. to the iteration tail of Question: Does the search range contain any elements?; Action: The target is absent. to the result merge; the result merge to End: Option&lt;usize&gt;; the entry of Question: Does the search range contain any elements? to Question: Does the search range contain any elements?; Repeat from the iteration tail of Question: Does the search range contain any elements? to the entry of Question: Does the search range contain any elements?.</desc>
