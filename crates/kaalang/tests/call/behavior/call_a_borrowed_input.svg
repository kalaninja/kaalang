  <desc id="kaalang-description">Nodes: Start: call_a_borrowed_input with parameters mut total: usize; text: String handing over mut total, text; Call: Add the length of the text to the total. capturing &amp;mut total, &amp;text handing over extended; Action: Report the total. capturing extended, total handing over end; End: usize capturing end. Connections: Start: call_a_borrowed_input to Call: Add the length of the text to the total.; Call: Add the length of the text to the total. to Action: Report the total.; Action: Report the total. to End: usize.</desc>
