<svg xmlns="http://www.w3.org/2000/svg" width="704" height="606" viewBox="0 0 704 606" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for const_alternative_producers</title>
  <desc id="kaalang-description">Nodes: Start: const const_alternative_producers with parameters condition: bool handing over condition; Question: Choose a value. capturing condition handing over yes / no; Action: Build the yes value and an unused marker. capturing yes handing over end, _marker; Action: Build the no value and an unused marker. capturing no handing over end, _marker; End: u8 capturing end; Merge: end. Connections: Start: const const_alternative_producers to Question: Choose a value.; Question: Choose a value. branch 1 to Action: Build the yes value and an unused marker.; Question: Choose a value. branch 2 to Action: Build the no value and an unused marker.; Action: Build the yes value and an unused marker. to the end merge; Action: Build the no value and an unused marker. to the end merge; the end merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 234 L 172 306
      M 312 198 L 532 198 L 532 306
      M 172 372 L 172 444
      M 532 372 L 532 444 L 172 444
      M 172 444 L 172 516
    "/>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">condition</tspan></text>
    <text class="connection-label" x="185" y="265" xml:space="preserve"><tspan x="185" dy="0">yes</tspan></text>
    <text class="connection-label" x="416" y="187" xml:space="preserve"><tspan x="416" dy="0">no</tspan></text>
    <text class="connection-label" x="185" y="390" xml:space="preserve"><tspan x="185" dy="0">end, _marker</tspan></text>
    <text class="connection-label" x="545" y="390" xml:space="preserve"><tspan x="545" dy="0">end, _marker</tspan></text>
    <text class="connection-label" x="185" y="505" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
