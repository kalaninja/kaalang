      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Build the no value and an unused </tspan><tspan x="-124" dy="18">marker.</tspan></text>
