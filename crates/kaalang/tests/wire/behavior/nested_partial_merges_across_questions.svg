  <title id="kaalang-title">kaalang diagram for nested_partial_merges_across_questions</title>
  <desc id="kaalang-description">Nodes: Start: nested_partial_merges_across_questions with parameters first: bool; second: bool; third: bool handing over first, second, third; Question: Take the shortcut? capturing first handing over shortcut / onward; Question: Keep refining? capturing onward, second handing over refine / stop; Question: Refine once more? capturing refine, third handing over again / settle; Action: Start the inner value from two. capturing shortcut handing over inner; Action: Start the inner value from three. capturing again handing over inner; Action: Start the middle value from four. capturing settle handing over middle; Action: Wrap the inner value. capturing inner handing over middle; Action: Wrap the middle value. capturing middle handing over end; Action: Stop at five. capturing stop handing over end; End: u32 capturing end; Merge: inner; Merge: middle; Merge: end. Connections: Start: nested_partial_merges_across_questions to Question: Take the shortcut?; Question: Take the shortcut? branch 1 to Action: Start the inner value from two.; Question: Take the shortcut? branch 2 to Question: Keep refining?; Question: Keep refining? branch 1 to Question: Refine once more?; Question: Keep refining? branch 2 to Action: Stop at five.; Question: Refine once more? branch 1 to Action: Start the inner value from three.; Question: Refine once more? branch 2 to Action: Start the middle value from four.; Action: Start the inner value from two. to the inner merge; Action: Start the inner value from three. to the inner merge; Action: Start the middle value from four. to the middle merge; Action: Wrap the inner value. to the middle merge; Action: Wrap the middle value. to the end merge; Action: Stop at five. to the end merge; the inner merge to Action: Wrap the inner value.; the middle merge to Action: Wrap the middle value.; the end merge to End: u32.</desc>
