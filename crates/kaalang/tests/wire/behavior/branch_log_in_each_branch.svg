    <text class="connection-label" x="185" y="303" xml:space="preserve"><tspan x="185" dy="0">yes, &amp;value</tspan></text>
    <text class="connection-label" x="185" y="439" xml:space="preserve"><tspan x="185" dy="0">logged, value</tspan></text>
    <text class="connection-label" x="545" y="303" xml:space="preserve"><tspan x="545" dy="0">no, value</tspan></text>
  </g>
