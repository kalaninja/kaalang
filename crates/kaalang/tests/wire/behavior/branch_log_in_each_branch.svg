<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for branch_log_in_each_branch</title>
  <desc id="kaalang-description">Nodes: Start: branch_log_in_each_branch with parameters condition: bool; value: String handing over condition, value; Question: Log the value? capturing condition handing over yes / no; Action: Log. capturing yes, &amp;value handing over logged; Action: Transform after logging. capturing logged, value handing over end; Action: Transform without logging. capturing no, value handing over end; End: usize capturing end. Connections: Start: branch_log_in_each_branch to Question: Log the value?; Question: Log the value? branch 1 to Action: Log.; Question: Log the value? branch 2 to Action: Transform without logging.; Action: Log. to Action: Transform after logging.; Action: Transform after logging. to the end merge; Action: Transform without logging. to the end merge; the end merge to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
