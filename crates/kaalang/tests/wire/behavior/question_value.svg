<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for question_value</title>
  <desc id="kaalang-description">Nodes: Start: question_value with parameters condition: bool; shared_runs: &amp;mut usize handing over condition, shared_runs; Question: Choose a value. capturing condition handing over yes / no; Action: Build the yes value. capturing yes handing over selected; Action: Build the no value. capturing no handing over selected; Action: Use the selected value once. capturing selected, shared_runs handing over end; End: u32 capturing end; Merge: selected. Connections: Start: question_value to Question: Choose a value.; Question: Choose a value. branch 1 to Action: Build the yes value.; Question: Choose a value. branch 2 to Action: Build the no value.; Action: Build the yes value. to the selected merge; Action: Build the no value. to the selected merge; Action: Use the selected value once. to End: u32; the selected merge to Action: Use the selected value once..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 242 L 172 314
      M 312 206 L 532 206 L 532 314
      M 172 378 L 172 450
      M 532 378 L 532 450 L 172 450
      M 172 586 L 172 658
      M 172 450 L 172 522
    "/>
    <text class="connection-label" x="185" y="468" xml:space="preserve"><tspan x="185" dy="0">selected</tspan></text>
    <text class="connection-label" x="185" y="273" xml:space="preserve"><tspan x="185" dy="0">yes</tspan></text>
    <text class="connection-label" x="416" y="195" xml:space="preserve"><tspan x="416" dy="0">no</tspan></text>
    <text class="connection-label" x="185" y="617" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">condition, shared_runs</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">condition</tspan></text>
    <text class="connection-label" x="185" y="511" xml:space="preserve"><tspan x="185" dy="0">selected, shared_runs</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">condition: bool</tspan><tspan x="-104" dy="18">shared_runs: &amp;mut usize</tspan></text>
    </g>
    <g class="node merge" transform="translate(172 450)">
      <title xml:space="preserve">the selected merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">question_value</tspan></text>
    </g>
    <g class="node question" transform="translate(172 206)">
      <title xml:space="preserve">Choose a value.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose a value.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 346)">
      <title xml:space="preserve">Build the yes value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the yes value.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 346)">
      <title xml:space="preserve">Build the no value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the no value.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 554)">
      <title xml:space="preserve">Use the selected value once.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the selected value once.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 687)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u32</tspan></text>
    </g>
  </g>
</svg>
