<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for question_value</title>
  <desc id="kaalang-description">Nodes: Start: question_value(condition: bool, shared_runs: &amp;mut usize) -&gt; u32 handing over condition, shared_runs; Question: Choose a value. capturing condition handing over yes / no; Action: Build the yes value. capturing yes handing over selected; Action: Build the no value. capturing no handing over selected; Action: Use the selected value once. capturing selected, shared_runs handing over result; End: u32 capturing result. Connections: Start: question_value(condition: bool, shared_runs: &amp;mut usize) -&gt; u32 to Question: Choose a value.; Question: Choose a value. branch 1 to Action: Build the yes value.; Question: Choose a value. branch 2 to Action: Build the no value.; Action: Build the yes value. to the selected merge; Action: Build the no value. to the selected merge; Action: Use the selected value once. to End: u32; the selected merge to Action: Use the selected value once..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
