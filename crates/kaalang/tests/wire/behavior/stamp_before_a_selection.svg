  <desc id="kaalang-description">Nodes: Start: stamp_before_a_selection(flag: bool) -&gt; u64 handing over flag; Action: Stamp. capturing nothing handing over stamp; Question: Which way? capturing flag handing over yes / no; Action: Finish with the stamp. capturing yes, stamp handing over result; Action: Finish without it. capturing no handing over result; End: u64 capturing result. Connections: Start: stamp_before_a_selection(flag: bool) -&gt; u64 to Action: Stamp.; Action: Stamp. to Question: Which way?; Question: Which way? branch 1 to Action: Finish with the stamp.; Question: Which way? branch 2 to Action: Finish without it.; Action: Finish with the stamp. to the result merge; Action: Finish without it. to the result merge; the result merge to End: u64.</desc>
