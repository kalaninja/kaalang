<svg xmlns="http://www.w3.org/2000/svg" width="704" height="876" viewBox="0 0 704 876" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for stamp_after_a_merge</title>
  <desc id="kaalang-description">Nodes: Start: stamp_after_a_merge with parameters flag: bool handing over flag; Question: Which value? capturing flag handing over yes / no; Action: Build the yes value. capturing yes handing over value; Action: Build the no value. capturing no handing over value; Action: Stamp. capturing nothing handing over stamp; Action: Finish. capturing value, stamp handing over result; End: u8 capturing result. Connections: Start: stamp_after_a_merge to Question: Which value?; Question: Which value? branch 1 to Action: Build the yes value.; Question: Which value? branch 2 to Action: Build the no value.; Action: Build the yes value. to the value merge; Action: Build the no value. to the value merge; Action: Stamp. to Action: Finish.; Action: Finish. to End: u8; the value merge to Action: Stamp..</desc>
