  <desc id="kaalang-description">Nodes: Start: stamp_after_a_merge(flag: bool) -&gt; u8 handing over flag; Question: Which value? capturing flag handing over yes / no; Action: Build the yes value. capturing yes handing over value; Action: Build the no value. capturing no handing over value; Action: Stamp. capturing nothing handing over stamp; Action: Finish. capturing value, stamp handing over result; End: u8 capturing result. Connections: Start: stamp_after_a_merge(flag: bool) -&gt; u8 to Question: Which value?; Question: Which value? branch 1 to Action: Build the yes value.; Question: Which value? branch 2 to Action: Build the no value.; Action: Build the yes value. to the value merge; Action: Build the no value. to the value merge; Action: Stamp. to Action: Finish.; Action: Finish. to End: u8; the value merge to Action: Stamp..</desc>
