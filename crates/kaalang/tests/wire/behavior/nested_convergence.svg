<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="892" viewBox="0 0 1064 892" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_convergence</title>
  <desc id="kaalang-description">Nodes: Start: nested_convergence(outer: bool, inner: bool) -&gt; u32 handing over outer, inner; Question: Take the nested branch? capturing outer, &amp;inner handing over nested / direct; Question: Choose the nested value. capturing nested, inner handing over inner_yes / inner_no; Action: Build the nested yes value. capturing inner_yes handing over selected; Action: Build the nested no value. capturing inner_no handing over selected; Action: Build the direct value. capturing direct handing over selected; Action: Use the selected nested value. capturing selected handing over result; End: u32 capturing result. Connections: Start: nested_convergence(outer: bool, inner: bool) -&gt; u32 to Question: Take the nested branch?; Question: Take the nested branch? branch 1 to Question: Choose the nested value.; Question: Take the nested branch? branch 2 to Action: Build the direct value.; Question: Choose the nested value. branch 1 to Action: Build the nested yes value.; Question: Choose the nested value. branch 2 to Action: Build the nested no value.; Action: Build the nested yes value. to the selected merge; Action: Build the nested no value. to the selected merge; Action: Build the direct value. to the selected merge; Action: Use the selected nested value. to End: u32; the selected merge to Action: Use the selected nested value..</desc>
  <defs>
    <style>
