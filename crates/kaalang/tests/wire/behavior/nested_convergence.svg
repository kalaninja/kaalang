<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="892" viewBox="0 0 1064 892" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_convergence</title>
  <desc id="kaalang-description">Nodes: Start: nested_convergence with parameters outer: bool; inner: bool handing over outer, inner; Question: Take the nested branch? capturing outer, &amp;inner handing over nested / direct; Question: Choose the nested value. capturing nested, inner handing over inner_yes / inner_no; Action: Build the nested yes value. capturing inner_yes handing over selected; Action: Build the nested no value. capturing inner_no handing over selected; Action: Build the direct value. capturing direct handing over selected; Action: Use the selected nested value. capturing selected handing over result; End: u32 capturing result. Connections: Start: nested_convergence to Question: Take the nested branch?; Question: Take the nested branch? branch 1 to Question: Choose the nested value.; Question: Take the nested branch? branch 2 to Action: Build the direct value.; Question: Choose the nested value. branch 1 to Action: Build the nested yes value.; Question: Choose the nested value. branch 2 to Action: Build the nested no value.; Action: Build the nested yes value. to the selected merge; Action: Build the nested no value. to the selected merge; Action: Build the direct value. to the selected merge; Action: Use the selected nested value. to End: u32; the selected merge to Action: Use the selected nested value..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 242 L 172 314
      M 312 206 L 892 206 L 892 318
      M 172 386 L 172 458
      M 312 350 L 532 350 L 532 458
      M 172 522 L 172 594
      M 532 522 L 532 594 L 172 594
      M 892 382 L 892 594 L 172 594
      M 172 730 L 172 802
      M 172 594 L 172 666
    "/>
    <text class="connection-label" x="185" y="612" xml:space="preserve"><tspan x="185" dy="0">selected</tspan></text>
    <text class="connection-label" x="584" y="195" xml:space="preserve"><tspan x="584" dy="0">direct</tspan></text>
    <text class="connection-label" x="185" y="417" xml:space="preserve"><tspan x="185" dy="0">inner_yes</tspan></text>
    <text class="connection-label" x="397" y="339" xml:space="preserve"><tspan x="397" dy="0">inner_no</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">outer, inner</tspan></text>
    <text class="connection-label" x="185" y="260" xml:space="preserve"><tspan x="185" dy="0">nested</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">outer, &amp;inner</tspan></text>
    <text class="connection-label" x="185" y="303" xml:space="preserve"><tspan x="185" dy="0">nested, inner</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">outer: bool</tspan><tspan x="-104" dy="18">inner: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(172 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_convergence</tspan></text>
    </g>
    <g class="node question" transform="translate(172 206)">
      <title xml:space="preserve">Take the nested branch?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Take the nested branch?</tspan></text>
    </g>
    <g class="node question" transform="translate(172 350)">
      <title xml:space="preserve">Choose the nested value.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose the nested value.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 490)">
      <title xml:space="preserve">Build the nested yes value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the nested yes value.</tspan></text>
    </g>
    <g class="node action" transform="translate(532 490)">
      <title xml:space="preserve">Build the nested no value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the nested no value.</tspan></text>
    </g>
    <g class="node action" transform="translate(892 350)">
      <title xml:space="preserve">Build the direct value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the direct value.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 698)">
      <title xml:space="preserve">Use the selected nested value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the selected nested value.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 831)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">-&gt; u32</tspan></text>
    </g>
  </g>
</svg>
