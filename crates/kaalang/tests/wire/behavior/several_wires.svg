<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for several_wires</title>
  <desc id="kaalang-description">Nodes: Start: several_wires(condition: bool) -&gt; (u32, &amp;&apos;static str) handing over condition; Question: Choose a pair. capturing condition handing over yes / no; Action: Build the yes pair. capturing yes handing over number, label; Action: Build the no pair. capturing no handing over number, label; Action: Use both selected values. capturing label, number handing over result; End: (u32, &amp;&apos;static str) capturing result. Connections: Start: several_wires(condition: bool) -&gt; (u32, &amp;&apos;static str) to Question: Choose a pair.; Question: Choose a pair. branch 1 to Action: Build the yes pair.; Question: Choose a pair. branch 2 to Action: Build the no pair.; Action: Build the yes pair. to the number and label merge; Action: Build the no pair. to the number and label merge; Action: Use both selected values. to End: (u32, &amp;&apos;static str); the number and label merge to Action: Use both selected values..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
