  <title id="kaalang-title">kaalang diagram for temporary_borrow_within_branch</title>
  <desc id="kaalang-description">Nodes: Start: temporary_borrow_within_branch(condition: bool) -&gt; usize handing over condition; Question: Build the temporary text? capturing condition handing over yes / no; Action: Borrow the temporary text. capturing yes handing over owner; Action: Measure the borrowed text. capturing &amp;owner handing over size; Action: Use an empty size. capturing no handing over size; Action: Finish with the merged size. capturing size handing over result; End: usize capturing result. Connections: Start: temporary_borrow_within_branch(condition: bool) -&gt; usize to Question: Build the temporary text?; Question: Build the temporary text? branch 1 to Action: Borrow the temporary text.; Question: Build the temporary text? branch 2 to Action: Use an empty size.; Action: Borrow the temporary text. to Action: Measure the borrowed text.; Action: Measure the borrowed text. to the size merge; Action: Use an empty size. to the size merge; Action: Finish with the merged size. to End: usize; the size merge to Action: Finish with the merged size..</desc>
