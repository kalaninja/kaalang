<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1116" viewBox="0 0 704 1116" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for two_merges_before_one_finish</title>
  <desc id="kaalang-description">Nodes: Start: two_merges_before_one_finish with parameters left: bool; right: bool handing over left, right; Question: Left enabled? capturing left handing over left_yes / left_no; Action: Left value. capturing left_yes handing over counted; Action: Other left value. capturing left_no handing over counted; Question: Right enabled? capturing right handing over right_yes / right_no; Action: Right value. capturing right_yes handing over seen; Action: Other right value. capturing right_no handing over seen; Action: Finish with both merged values. capturing counted, seen handing over end; End: u8 capturing end; Merge: counted; Merge: seen. Connections: Start: two_merges_before_one_finish to Question: Left enabled?; Question: Left enabled? branch 1 to Action: Left value.; Question: Left enabled? branch 2 to Action: Other left value.; Action: Left value. to the counted merge; Action: Other left value. to the counted merge; Question: Right enabled? branch 1 to Action: Right value.; Question: Right enabled? branch 2 to Action: Other right value.; Action: Right value. to the seen merge; Action: Other right value. to the seen merge; Action: Finish with both merged values. to End: u8; the counted merge to Question: Right enabled?; the seen merge to Action: Finish with both merged values..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
