  <title id="kaalang-title">kaalang diagram for two_merges_before_one_finish</title>
  <desc id="kaalang-description">Nodes: Start: two_merges_before_one_finish with parameters left: bool; right: bool handing over left, right; Question: Left enabled? capturing left handing over left_yes / left_no; Action: Left value. capturing left_yes handing over counted; Action: Other left value. capturing left_no handing over counted; Question: Right enabled? capturing right handing over right_yes / right_no; Action: Right value. capturing right_yes handing over seen; Action: Other right value. capturing right_no handing over seen; Action: Finish with both merged values. capturing counted, seen handing over end; End: u8 capturing end. Connections: Start: two_merges_before_one_finish to Question: Left enabled?; Question: Left enabled? branch 1 to Action: Left value.; Question: Left enabled? branch 2 to Action: Other left value.; Action: Left value. to the counted merge; Action: Other left value. to the counted merge; Question: Right enabled? branch 1 to Action: Right value.; Question: Right enabled? branch 2 to Action: Other right value.; Action: Right value. to the seen merge; Action: Other right value. to the seen merge; Action: Finish with both merged values. to End: u8; the counted merge to Question: Right enabled?; the seen merge to Action: Finish with both merged values..</desc>
