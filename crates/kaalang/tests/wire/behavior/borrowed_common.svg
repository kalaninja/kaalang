  <title id="kaalang-title">kaalang diagram for borrowed_common</title>
  <desc id="kaalang-description">Nodes: Start: borrowed_common(condition: bool, prefix: String) -&gt; String handing over condition, prefix; Question: Choose a suffix. capturing condition handing over yes / no; Action: Build the yes suffix. capturing yes, &amp;prefix handing over suffix; Action: Build the no suffix. capturing no, &amp;prefix handing over suffix; Action: Use the suffix and the preserved prefix. capturing suffix, prefix handing over result; End: String capturing result. Connections: Start: borrowed_common(condition: bool, prefix: String) -&gt; String to Question: Choose a suffix.; Question: Choose a suffix. branch 1 to Action: Build the yes suffix.; Question: Choose a suffix. branch 2 to Action: Build the no suffix.; Action: Build the yes suffix. to the suffix merge; Action: Build the no suffix. to the suffix merge; Action: Use the suffix and the preserved prefix. to End: String; the suffix merge to Action: Use the suffix and the preserved prefix..</desc>
