  <desc id="kaalang-description">Nodes: Start: builds_before_a_second_choice with parameters first: u8; second: u8 handing over first, second; Select: Which build? capturing first; Case: Build A. handing over a; Case: Build B. handing over b; Case: Build C. handing over c; Action: Build A. capturing a handing over value; Action: Build B. capturing b handing over value; Action: Build C. capturing c handing over value; Select: Which finish? capturing second; Case: Finish X. handing over x; Case: Finish Y. handing over y; Case: Finish Z. handing over z; Action: Finish X. capturing x, value handing over end; Action: Finish Y. capturing y, value handing over end; Action: Finish Z. capturing z, value handing over end; End: u8 capturing end; Merge: value; Merge: end. Connections: Start: builds_before_a_second_choice to Select: Which build?; Select: Which build? to Case: Build A.; Select: Which build? to Case: Build B.; Select: Which build? to Case: Build C.; Case: Build A. to Action: Build A.; Case: Build B. to Action: Build B.; Case: Build C. to Action: Build C.; Action: Build A. to the value merge; Action: Build B. to the value merge; Action: Build C. to the value merge; Select: Which finish? to Case: Finish X.; Select: Which finish? to Case: Finish Y.; Select: Which finish? to Case: Finish Z.; Case: Finish X. to Action: Finish X.; Case: Finish Y. to Action: Finish Y.; Case: Finish Z. to Action: Finish Z.; Action: Finish X. to the end merge; Action: Finish Y. to the end merge; Action: Finish Z. to the end merge; the value merge to Select: Which finish?; the end merge to End: u8.</desc>
