<svg xmlns="http://www.w3.org/2000/svg" width="704" height="748" viewBox="0 0 704 748" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for branch_log_with_merge</title>
  <desc id="kaalang-description">Nodes: Start: branch_log_with_merge with parameters condition: bool; value: String handing over condition, value; Question: Log the value? capturing condition handing over yes / no; Action: Log. capturing yes, &amp;value handing over ready; Action: Continue without logging. capturing no handing over ready; Action: Transform. capturing ready, value handing over end; End: usize capturing end. Connections: Start: branch_log_with_merge to Question: Log the value?; Question: Log the value? branch 1 to Action: Log.; Question: Log the value? branch 2 to Action: Continue without logging.; Action: Log. to the ready merge; Action: Continue without logging. to the ready merge; Action: Transform. to End: usize; the ready merge to Action: Transform..</desc>
  <defs>
    <style>
