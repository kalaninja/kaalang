  <desc id="kaalang-description">Nodes: Start: nested_partial_merges with parameters source: u8 handing over source; Select: Which source? capturing source; Case: First. handing over a; Case: Second. handing over b; Case: Third. handing over c; Case: Fourth. handing over d; Action: First value. capturing a handing over ab; Action: Second value. capturing b handing over ab; Action: Close the first pair. capturing ab handing over abc; Action: Third value. capturing c handing over abc; Action: Close the first three. capturing abc handing over abcd; Action: Fourth value. capturing d handing over abcd; Action: Finish. capturing abcd handing over result; End: u8 capturing result. Connections: Start: nested_partial_merges to Select: Which source?; Select: Which source? to Case: First.; Select: Which source? to Case: Second.; Select: Which source? to Case: Third.; Select: Which source? to Case: Fourth.; Case: First. to Action: First value.; Case: Second. to Action: Second value.; Case: Third. to Action: Third value.; Case: Fourth. to Action: Fourth value.; Action: First value. to the ab merge; Action: Second value. to the ab merge; Action: Close the first pair. to the abc merge; Action: Third value. to the abc merge; Action: Close the first three. to the abcd merge; Action: Fourth value. to the abcd merge; Action: Finish. to End: u8; the ab merge to Action: Close the first pair.; the abc merge to Action: Close the first three.; the abcd merge to Action: Finish..</desc>
