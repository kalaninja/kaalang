  <title id="kaalang-title">kaalang diagram for choice_value</title>
  <desc id="kaalang-description">Nodes: Start: choice_value with parameters case: u8 handing over case; Select: Choose one of three values. capturing case; Case: First handing over first; Case: Second handing over second; Case: Third handing over third; Action: Build the first value. capturing first handing over selected; Action: Build the second value. capturing second handing over selected; Action: Build the third value. capturing third handing over selected; Action: Use the selected value. capturing selected handing over result; End: &amp;&apos;static str capturing result. Connections: Start: choice_value to Select: Choose one of three values.; Select: Choose one of three values. to Case: First; Select: Choose one of three values. to Case: Second; Select: Choose one of three values. to Case: Third; Case: First to Action: Build the first value.; Case: Second to Action: Build the second value.; Case: Third to Action: Build the third value.; Action: Build the first value. to the selected merge; Action: Build the second value. to the selected merge; Action: Build the third value. to the selected merge; Action: Use the selected value. to End: &amp;&apos;static str; the selected merge to Action: Use the selected value..</desc>
