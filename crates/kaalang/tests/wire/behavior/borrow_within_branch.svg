<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1020" viewBox="0 0 704 1020" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for borrow_within_branch</title>
  <desc id="kaalang-description">Nodes: Start: borrow_within_branch(condition: bool) -&gt; usize handing over condition; Question: Build the text? capturing condition handing over yes / no; Action: Build text. capturing yes handing over text; Action: Borrow text. capturing &amp;text handing over view; Action: Log the view. capturing view; Action: Finish yes. capturing text handing over result; Action: Finish no. capturing no handing over result; End: usize capturing result. Connections: Start: borrow_within_branch(condition: bool) -&gt; usize to Question: Build the text?; Question: Build the text? branch 1 to Action: Build text.; Question: Build the text? branch 2 to Action: Finish no.; Action: Build text. to Action: Borrow text.; Action: Borrow text. to Action: Log the view.; Action: Log the view. to Action: Finish yes.; Action: Finish yes. to the result merge; Action: Finish no. to the result merge; the result merge to End: usize.</desc>
