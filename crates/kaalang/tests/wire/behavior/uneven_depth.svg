  <desc id="kaalang-description">Nodes: Start: uneven_depth with parameters condition: bool handing over condition; Question: Choose a branch depth. capturing condition handing over short / long; Action: Build the short value. capturing short handing over selected; Action: Prepare the long value. capturing long handing over prepared; Action: Build the long value. capturing prepared handing over selected; Action: Use the selected value. capturing selected handing over result; End: u32 capturing result. Connections: Start: uneven_depth to Question: Choose a branch depth.; Question: Choose a branch depth. branch 1 to Action: Build the short value.; Question: Choose a branch depth. branch 2 to Action: Prepare the long value.; Action: Build the short value. to the selected merge; Action: Prepare the long value. to Action: Build the long value.; Action: Build the long value. to the selected merge; Action: Use the selected value. to End: u32; the selected merge to Action: Use the selected value..</desc>
