<svg xmlns="http://www.w3.org/2000/svg" width="366" height="686" viewBox="0 0 366 686" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_effects</title>
  <desc id="kaalang-description">Nodes: Start: independent_effects(first: &amp;mut Vec&lt;&amp;&apos;static str&gt;, second: &amp;mut Vec&lt;&amp;&apos;static str&gt;) handing over first, second; Action: Record the first effect. capturing first handing over first_done; Action: Record the second effect. capturing second handing over second_done; Action: Finish once both effects have run. capturing first_done, second_done handing over result; End: () capturing result. Connections: Start: independent_effects(first: &amp;mut Vec&lt;&amp;&apos;static str&gt;, second: &amp;mut Vec&lt;&amp;&apos;static str&gt;) to Action: Record the first effect.; Action: Record the first effect. to Action: Record the second effect.; Action: Record the second effect. to Action: Finish once both effects have run.; Action: Finish once both effects have run. to End: ().</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: currentColor; font-size: 12px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
