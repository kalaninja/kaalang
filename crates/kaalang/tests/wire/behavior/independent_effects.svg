    <text class="connection-label" x="214" y="313" xml:space="preserve"><tspan x="214" dy="0">second</tspan></text>
    <text class="connection-label" x="257" y="449" xml:space="preserve"><tspan x="257" dy="0">first_done, second_done</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(172 74)">
      <rect class="node-shape" x="-140" y="-42" width="280" height="84" rx="42"/>
      <text class="label" y="-12" xml:space="preserve"><tspan x="0" dy="0">independent_effects(first: &amp;mut </tspan><tspan x="0" dy="18">Vec&lt;&amp;&apos;static str&gt;, second: &amp;mut </tspan><tspan x="0" dy="18">Vec&lt;&amp;&apos;static str&gt;)</tspan></text>
    </g>
    <g class="node action" transform="translate(172 220)">
