ep toward the second terminal result.; Action: Build the left shared value. to the shared merge; Action: Build the right shared value. to the shared merge; Action: Produce the first terminal result. to the end merge; Action: Take one more step toward the second terminal result. to Action: Produce the second terminal result.; Action: Produce the second terminal result. to the end merge; Select: Choose an inner case wide enough to block both terminal columns. to Case: Build A.; Select: Choose an inner case wide enough to block both terminal columns. to Case: Build B.; Select: Choose an inner case wide enough to block both terminal columns. to Case: Build C.; Select: Choose an inner case wide enough to block both terminal columns. to Case: Build D.; Case: Build A. to Action: Build result A.; Case: Build B. to Action: Build result B.; Case: Build C. to Action: Build result C.; Case: Build D. to Action: Build result D.; Action: Build result A. to the selected merge; Action: Build result B. to the selected merge; Action: Build result C. to the selected merge; Action: Build result D. to the selected merge; Action: Use the result. to the end merge; the shared merge to Select: Choose an inner case wide enough to block both terminal columns.; the end merge to End: u8; the selected merge to Action: Use the result..</desc>
