<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1020" viewBox="0 0 704 1020" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_entry_blocks</title>
  <desc id="kaalang-description">Nodes: Start: independent_entry_blocks(condition: bool) -&gt; (u32, u32) handing over condition; Question: Choose the pair. capturing condition handing over yes / no; Action: Build the yes pair. capturing yes handing over left, right; Action: Build the no pair. capturing no handing over left, right; Action: Use the left value. capturing left handing over first; Action: Use the right value. capturing right handing over second; Action: Pair the entry results. capturing first, second handing over result; End: (u32, u32) capturing result. Connections: Start: independent_entry_blocks(condition: bool) -&gt; (u32, u32) to Question: Choose the pair.; Question: Choose the pair. branch 1 to Action: Build the yes pair.; Question: Choose the pair. branch 2 to Action: Build the no pair.; Action: Build the yes pair. to the left and right merge; Action: Build the no pair. to the left and right merge; Action: Use the left value. to Action: Use the right value.; Action: Use the right value. to Action: Pair the entry results.; Action: Pair the entry results. to End: (u32, u32); the left and right merge to Action: Use the left value..</desc>
