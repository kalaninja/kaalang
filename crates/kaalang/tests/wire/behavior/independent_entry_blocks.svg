<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1012" viewBox="0 0 704 1012" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_entry_blocks</title>
  <desc id="kaalang-description">Nodes: Start: independent_entry_blocks with parameters condition: bool handing over condition; Question: Choose the pair. capturing condition handing over yes / no; Action: Build the yes pair. capturing yes handing over left, right; Action: Build the no pair. capturing no handing over left, right; Action: Use the left value. capturing left handing over first; Action: Use the right value. capturing right handing over second; Action: Pair the entry results. capturing first, second handing over end; End: (u32, u32) capturing end. Connections: Start: independent_entry_blocks to Question: Choose the pair.; Question: Choose the pair. branch 1 to Action: Build the yes pair.; Question: Choose the pair. branch 2 to Action: Build the no pair.; Action: Build the yes pair. to the left and right merge; Action: Build the no pair. to the left and right merge; Action: Use the left value. to Action: Use the right value.; Action: Use the right value. to Action: Pair the entry results.; Action: Pair the entry results. to End: (u32, u32); the left and right merge to Action: Use the left value..</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 234 L 172 306
      M 312 198 L 532 198 L 532 306
      M 172 370 L 172 442
      M 532 370 L 532 442 L 172 442
      M 172 578 L 172 650
      M 172 714 L 172 786
      M 172 850 L 172 922
      M 172 442 L 172 514
    "/>
    <text class="connection-label" x="185" y="460" xml:space="preserve"><tspan x="185" dy="0">left, right</tspan></text>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">condition</tspan></text>
    <text class="connection-label" x="185" y="265" xml:space="preserve"><tspan x="185" dy="0">yes</tspan></text>
    <text class="connection-label" x="416" y="187" xml:space="preserve"><tspan x="416" dy="0">no</tspan></text>
    <text class="connection-label" x="185" y="596" xml:space="preserve"><tspan x="185" dy="0">first</tspan></text>
    <text class="connection-label" x="185" y="732" xml:space="preserve"><tspan x="185" dy="0">second</tspan></text>
    <text class="connection-label" x="185" y="503" xml:space="preserve"><tspan x="185" dy="0">left</tspan></text>
    <text class="connection-label" x="185" y="639" xml:space="preserve"><tspan x="185" dy="0">right</tspan></text>
    <text class="connection-label" x="185" y="775" xml:space="preserve"><tspan x="185" dy="0">first, second</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
