      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Pair the entry results.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 951)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(u32, u32)</tspan></text>
    </g>
  </g>
