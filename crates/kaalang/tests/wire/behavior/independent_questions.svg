<svg xmlns="http://www.w3.org/2000/svg" width="704" height="966" viewBox="0 0 704 966" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_questions</title>
  <desc id="kaalang-description">Nodes: Start: independent_questions(left: bool, right: bool, calls: &amp;Cell&lt;u8&gt;) -&gt; u8 handing over left, right, calls; Question: Choose the right value. capturing right, &amp;calls handing over x / y; Action: Build the first right value. capturing x handing over value; Action: Build the second right value. capturing y handing over value; Question: Choose the left branch. capturing left, &amp;calls handing over a / b; Action: Use the left branch and the right value. capturing a, value handing over result; Action: Use the other left branch and the right value. capturing b, value handing over result; End: u8 capturing result. Connections: Start: independent_questions(left: bool, right: bool, calls: &amp;Cell&lt;u8&gt;) -&gt; u8 to Question: Choose the right value.; Question: Choose the right value. branch 1 to Action: Build the first right value.; Question: Choose the right value. branch 2 to Action: Build the second right value.; Action: Build the first right value. to the value merge; Action: Build the second right value. to the value merge; Question: Choose the left branch. branch 1 to Action: Use the left branch and the right value.; Question: Choose the left branch. branch 2 to Action: Use the other left branch and the right value.; Action: Use the left branch and the right value. to the result merge; Action: Use the other left branch and the right value. to the result merge; the value merge to Question: Choose the left branch.; the result merge to End: u8.</desc>
