<svg xmlns="http://www.w3.org/2000/svg" width="704" height="984" viewBox="0 0 704 984" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for independent_questions</title>
  <desc id="kaalang-description">Nodes: Start: independent_questions with parameters left: bool; right: bool; calls: &amp;Cell&lt;u8&gt; handing over left, right, calls; Question: Choose the right value. capturing right, &amp;calls handing over x / y; Action: Build the first right value. capturing x handing over value; Action: Build the second right value. capturing y handing over value; Question: Choose the left branch. capturing left, &amp;calls handing over a / b; Action: Use the left branch and the right value. capturing a, value handing over result; Action: Use the other left branch and the right value. capturing b, value handing over result; End: u8 capturing result. Connections: Start: independent_questions to Question: Choose the right value.; Question: Choose the right value. branch 1 to Action: Build the first right value.; Question: Choose the right value. branch 2 to Action: Build the second right value.; Action: Build the first right value. to the value merge; Action: Build the second right value. to the value merge; Question: Choose the left branch. branch 1 to Action: Use the left branch and the right value.; Question: Choose the left branch. branch 2 to Action: Use the other left branch and the right value.; Action: Use the left branch and the right value. to the result merge; Action: Use the other left branch and the right value. to the result merge; the value merge to Question: Choose the left branch.; the result merge to End: u8.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
