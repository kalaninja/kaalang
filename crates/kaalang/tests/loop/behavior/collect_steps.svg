      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return an empty log.</tspan></text>
    </g>
    <g class="node end" transform="translate(1456 1543)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;String&gt;</tspan></text>
