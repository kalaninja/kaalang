    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 220 982 L 60 982 L 60 450 L 220 450
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="645" y="1248" xml:space="preserve"><tspan x="645" dy="0">step</tspan></text>
    <text class="connection-label" x="233" y="303" xml:space="preserve"><tspan x="233" dy="0">run</tspan></text>
    <text class="connection-label" x="1469" y="303" xml:space="preserve"><tspan x="1469" dy="0">skip</tspan></text>
    <text class="connection-label" x="645" y="1079" xml:space="preserve"><tspan x="645" dy="0">odd</tspan></text>
    <text class="connection-label" x="1057" y="1079" xml:space="preserve"><tspan x="1057" dy="0">even</tspan></text>
    <text class="connection-label" x="233" y="112" xml:space="preserve"><tspan x="233" dy="0">enabled, limit</tspan></text>
    <text class="connection-label" x="233" y="396" xml:space="preserve"><tspan x="233" dy="0">mut initial_log</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="233" y="614" xml:space="preserve"><tspan x="233" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="373" y="546" xml:space="preserve"><tspan x="373" dy="0">NO</tspan></text>
    <text class="connection-label" x="233" y="748" xml:space="preserve"><tspan x="233" dy="0">step</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="645" y="894" xml:space="preserve"><tspan x="645" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="785" y="826" xml:space="preserve"><tspan x="785" dy="0">NO</tspan></text>
    <text class="connection-label" x="1469" y="396" xml:space="preserve"><tspan x="1469" dy="0">end</tspan></text>
    <text class="connection-label" x="233" y="159" xml:space="preserve"><tspan x="233" dy="0">enabled</tspan></text>
    <text class="connection-label" x="233" y="511" xml:space="preserve"><tspan x="233" dy="0">&amp;initial_log, limit</tspan></text>
    <text class="connection-label" x="233" y="795" xml:space="preserve"><tspan x="233" dy="0">&amp;mut initial_log, step</tspan></text>
    <text class="connection-label" x="645" y="791" xml:space="preserve"><tspan x="645" dy="0">&amp;log, limit</tspan></text>
    <text class="connection-label" x="645" y="935" xml:space="preserve"><tspan x="645" dy="0">iterate_2, &amp;log</tspan></text>
    <text class="connection-label" x="645" y="1295" xml:space="preserve"><tspan x="645" dy="0">&amp;mut log, step</tspan></text>
    <text class="connection-label" x="1469" y="1503" xml:space="preserve"><tspan x="1469" dy="0">end</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 65 L 456 65"/>
    <g class="parameter-panel" transform="translate(576 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">enabled: bool</tspan><tspan x="-104" dy="18">limit: usize</tspan></text>
    </g>
    <g class="node merge" transform="translate(1456 838)">
      <title xml:space="preserve">the end merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node merge" transform="translate(632 1230)">
      <title xml:space="preserve">the step merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">collect_steps</tspan></text>
    </g>
    <g class="node question" transform="translate(220 206)">
      <title xml:space="preserve">Collect the steps?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Collect the steps?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 346)">
