    <text class="connection-label" x="1673" y="396" xml:space="preserve"><tspan x="1673" dy="0">end</tspan></text>
    <text class="connection-label" x="233" y="159" xml:space="preserve"><tspan x="233" dy="0">enabled</tspan></text>
    <text class="connection-label" x="233" y="511" xml:space="preserve"><tspan x="233" dy="0">&amp;initial_log, limit</tspan></text>
    <text class="connection-label" x="233" y="791" xml:space="preserve"><tspan x="233" dy="0">&amp;mut initial_log, step</tspan></text>
    <text class="connection-label" x="593" y="1071" xml:space="preserve"><tspan x="593" dy="0">&amp;log, limit</tspan></text>
    <text class="connection-label" x="593" y="1215" xml:space="preserve"><tspan x="593" dy="0">iterate_2, &amp;log</tspan></text>
    <text class="connection-label" x="593" y="1567" xml:space="preserve"><tspan x="593" dy="0">&amp;mut log, step</tspan></text>
