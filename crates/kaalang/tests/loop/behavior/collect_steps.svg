<svg xmlns="http://www.w3.org/2000/svg" width="1628" height="1604" viewBox="0 0 1628 1604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for collect_steps</title>
  <desc id="kaalang-description">Cycles: Collect the first steps. with inputs mut initial_log, &amp;limit and outputs log; Collect the second steps. with inputs mut log, &amp;limit and outputs end. Nodes: Start: collect_steps with parameters enabled: bool; limit: usize handing over enabled, limit; Question: Collect the steps? capturing enabled handing over run / skip; Action: Start an empty log. capturing run handing over mut initial_log; Question: Are there more first steps? capturing &amp;initial_log, limit handing over iterate_1 / leave_1 described as branch 1: YES / branch 2: NO; Action: Build the first step. capturing iterate_1 handing over step; Action: Record the first step. capturing &amp;mut initial_log, step; Question: Are there more second steps? capturing &amp;log, limit handing over iterate_2 / leave_2 described as branch 1: YES / branch 2: NO; Question: Is the log length odd? capturing iterate_2, &amp;log handing over odd / even; Action: Build an odd step. capturing odd handing over step; Action: Build an even step. capturing even handing over step; Action: Record the second step. capturing &amp;mut log, step; Action: Return an empty log. capturing skip handing over end; End: Vec&lt;String&gt; capturing end; Merge: end; Merge: step. Connections: Start: collect_steps to Question: Collect the steps?; Question: Collect the steps? branch 1 to Action: Start an empty log.; Question: Collect the steps? branch 2 to Action: Return an empty log.; Action: Start an empty log. to the entry of the cycle; Question: Are there more first steps? branch 1 to Action: Build the first step.; Question: Are there more first steps? branch 2 to the entry of the cycle; Action: Build the first step. to Action: Record the first step.; Action: Record the first step. to the iteration tail of the cycle; Question: Are there more second steps? branch 1 to Question: Is the log length odd?; Question: Are there more second steps? branch 2 to the end merge; Question: Is the log length odd? branch 1 to Action: Build an odd step.; Question: Is the log length odd? branch 2 to Action: Build an even step.; Action: Build an odd step. to the step merge; Action: Build an even step. to the step merge; Action: Record the second step. to the iteration tail of the cycle; Action: Return an empty log. to the end merge; the end merge to End: Vec&lt;String&gt;; the step merge to Action: Record the second step.; the entry of the cycle to Question: Are there more first steps?; the entry of the cycle to Question: Are there more second steps?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Collect the first steps.</title>
    <rect class="cycle-boundary" x="32" y="415" width="393" height="602" rx="12"/>
    <text class="cycle-caption" x="413" y="429" text-anchor="end" xml:space="preserve"><tspan x="413" dy="0">Collect the first steps.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Collect the second steps.</title>
    <rect class="cycle-boundary" x="444" y="663" width="768" height="814" rx="12"/>
    <text class="cycle-caption" x="1200" y="677" text-anchor="end" xml:space="preserve"><tspan x="1200" dy="0">Collect the second steps.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
