      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build an odd step.</tspan></text>
    </g>
    <g class="node action" transform="translate(1044 1122)">
      <title xml:space="preserve">Build an even step.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build an even step.</tspan></text>
    </g>
    <g class="node action" transform="translate(632 1338)">
      <title xml:space="preserve">Record the second step.</title>
