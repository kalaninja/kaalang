<svg xmlns="http://www.w3.org/2000/svg" width="836" height="884" viewBox="0 0 836 884" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_unconditional_loops</title>
  <desc id="kaalang-description">Cycles: Run the nested counter. with inputs limit and outputs result; Count to the limit. with inputs mut count, limit and outputs final_count. Nodes: Start: nested_unconditional_loops with parameters limit: usize handing over limit; Action: Initialize the counter. capturing nothing handing over mut count; Question: Has the counter reached the limit? capturing &amp;count, &amp;limit handing over done / again; Action: Increment the counter. capturing again, &amp;mut count; End: usize capturing result. Connections: Start: nested_unconditional_loops to Action: Initialize the counter.; Action: Initialize the counter. to the entry of the cycle; Question: Has the counter reached the limit? branch 1 to the cycle result; Question: Has the counter reached the limit? branch 2 to Action: Increment the counter.; Action: Increment the counter. to the iteration tail of the cycle; the cycle result to End: usize; the entry of the cycle to Question: Has the counter reached the limit?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Run the nested counter.</title>
    <rect class="cycle-boundary" x="32" y="127" width="772" height="630" rx="12"/>
    <text class="cycle-caption" x="792" y="141" text-anchor="end" xml:space="preserve"><tspan x="792" dy="0">Run the nested counter.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Count to the limit.</title>
    <rect class="cycle-boundary" x="60" y="263" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="764" y="277" text-anchor="end" xml:space="preserve"><tspan x="764" dy="0">Count to the limit.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 228 90 L 228 162
      M 228 226 L 228 298
      M 228 442 L 228 722
      M 368 406 L 588 406 L 588 514
      M 588 578 L 588 650
      M 228 722 L 228 794
      M 228 298 L 228 370
    "/>
    <path class="connection" d="
      M 588 650 L 748 650 L 748 298 L 228 298
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="241" y="108" xml:space="preserve"><tspan x="241" dy="0">limit</tspan></text>
    <text class="connection-label" x="241" y="244" xml:space="preserve"><tspan x="241" dy="0">mut count</tspan></text>
    <text class="connection-label" x="241" y="460" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label" x="381" y="424" xml:space="preserve"><tspan x="381" dy="0">again</tspan></text>
    <text class="connection-label" x="241" y="151" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label" x="241" y="359" xml:space="preserve"><tspan x="241" dy="0">&amp;count, &amp;limit</tspan></text>
    <text class="connection-label" x="601" y="503" xml:space="preserve"><tspan x="601" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label" x="241" y="783" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 61 L 464 61"/>
    <g class="parameter-panel" transform="translate(584 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(228 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_unconditional_loops</tspan></text>
    </g>
    <g class="node action" transform="translate(228 194)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 406)">
      <title xml:space="preserve">Has the counter reached the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the counter reached </tspan><tspan x="0" dy="18">the limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 546)">
      <title xml:space="preserve">Increment the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the counter.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 823)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
