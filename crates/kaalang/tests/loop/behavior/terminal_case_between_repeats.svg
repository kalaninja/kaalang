<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="890" viewBox="0 0 1084 890" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for terminal_case_between_repeats</title>
  <desc id="kaalang-description">Nodes: Start: terminal_case_between_repeats with parameters mut mode: u8 handing over mut mode; Select: Which route? capturing mode; Case: Advance on the left. handing over left; Case: Finish in the middle. handing over middle; Case: Advance on the right. handing over right; Action: Finish from the middle case. capturing middle handing over end; Action: Advance through the left case. capturing left, &amp;mut mode; Action: Advance through the right case. capturing right, &amp;mut mode; End: u8 capturing end. Connections: Start: terminal_case_between_repeats to the entry of the loop; Select: Which route? to Case: Advance on the left.; Select: Which route? to Case: Finish in the middle.; Select: Which route? to Case: Advance on the right.; Case: Advance on the left. to Action: Advance through the left case.; Case: Finish in the middle. to Action: Finish from the middle case.; Case: Advance on the right. to Action: Advance through the right case.; Action: Finish from the middle case. to End: u8; Action: Advance through the left case. to the iteration tail of the loop; Action: Advance through the right case. to the iteration tail of the loop; the entry of the loop to Select: Which route?; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
