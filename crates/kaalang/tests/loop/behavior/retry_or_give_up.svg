<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="978" viewBox="0 0 1500 978" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for retry_or_give_up</title>
  <desc id="kaalang-description">Cycles: Poll until a response arrives. with inputs mut state, mut attempts and outputs response. Nodes: Start: retry_or_give_up with parameters mut attempts: u32; mut state: u8 handing over mut attempts, mut state; Select: What did the poll return? capturing &amp;state; Case: A response. handing over value; Case: A timeout. handing over timeout; Case: The server is busy. handing over busy; Question: Are the attempts exhausted? capturing timeout, &amp;mut attempts handing over exhausted / retry; Action: Keep the response. capturing value handing over result; Action: Give up. capturing exhausted handing over result; Action: Wait until the server is free. capturing busy, &amp;mut state handing over again; Action: Poll again after the timeout. capturing retry handing over again; End: Option&lt;u8&gt; capturing response; Merge: result; Merge: again. Connections: Start: retry_or_give_up to the entry of the cycle; Select: What did the poll return? to Case: A response.; Select: What did the poll return? to Case: A timeout.; Select: What did the poll return? to Case: The server is busy.; Case: A response. to Action: Keep the response.; Case: A timeout. to Question: Are the attempts exhausted?; Case: The server is busy. to Action: Wait until the server is free.; Question: Are the attempts exhausted? branch 1 to Action: Give up.; Question: Are the attempts exhausted? branch 2 to Action: Poll again after the timeout.; Action: Keep the response. to the result merge at the cycle result; Action: Give up. to the result merge at the cycle result; Action: Wait until the server is free. to the again merge at the iteration tail of the cycle; Action: Poll again after the timeout. to the again merge at the iteration tail of the cycle; the result merge at the cycle result to End: Option&lt;u8&gt;; the entry of the cycle to Select: What did the poll return?; Repeat from the again merge at the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Poll until a response arrives.</title>
    <rect class="cycle-boundary" x="32" y="135" width="1436" height="712" rx="12"/>
    <text class="cycle-caption" x="1456" y="149" text-anchor="end" xml:space="preserve"><tspan x="1456" dy="0">Poll until a response arrives.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 94 L 200 170
      M 200 314 L 200 386
      M 328 278 L 560 278 L 560 386
      M 328 278 L 1280 278 L 1280 386
      M 200 456 L 200 532
      M 560 456 L 560 528
      M 1280 456 L 1280 532
      M 560 600 L 560 672
      M 700 564 L 920 564 L 920 672
      M 200 596 L 200 812
      M 560 736 L 560 812 L 200 812
      M 1280 596 L 1280 812
      M 920 736 L 920 812 L 1280 812
      M 200 812 L 200 888
      M 200 170 L 200 242
    "/>
    <path class="connection" d="
      M 1280 812 L 1440 812 L 1440 170 L 200 170
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="830" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="1293" y="830" xml:space="preserve"><tspan x="1293" dy="0">again</tspan></text>
    <text class="connection-label" x="213" y="521" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="573" y="661" xml:space="preserve"><tspan x="573" dy="0">exhausted</tspan></text>
    <text class="connection-label" x="933" y="661" xml:space="preserve"><tspan x="933" dy="0">retry</tspan></text>
    <text class="connection-label" x="213" y="112" xml:space="preserve"><tspan x="213" dy="0">mut attempts, mut state</tspan></text>
    <text class="connection-label" x="573" y="474" xml:space="preserve"><tspan x="573" dy="0">timeout</tspan></text>
    <text class="connection-label" x="1293" y="474" xml:space="preserve"><tspan x="1293" dy="0">busy</tspan></text>
    <text class="connection-label" x="213" y="231" xml:space="preserve"><tspan x="213" dy="0">&amp;state</tspan></text>
    <text class="connection-label" x="573" y="517" xml:space="preserve"><tspan x="573" dy="0">timeout, &amp;mut attempts</tspan></text>
    <text class="connection-label" x="1293" y="521" xml:space="preserve"><tspan x="1293" dy="0">busy, &amp;mut state</tspan></text>
    <text class="connection-label" x="213" y="877" xml:space="preserve"><tspan x="213" dy="0">response</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 65 L 436 65"/>
    <g class="parameter-panel" transform="translate(556 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">mut attempts: u32</tspan><tspan x="-104" dy="18">mut state: u8</tspan></text>
    </g>
    <g class="node merge" transform="translate(200 812)">
      <title xml:space="preserve">the result merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node merge" transform="translate(1280 812)">
      <title xml:space="preserve">the again merge at the iteration tail of the cycle</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(200 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">retry_or_give_up</tspan></text>
    </g>
    <g class="node select" transform="translate(200 278)">
      <title xml:space="preserve">What did the poll return?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">What did the poll return?</tspan></text>
    </g>
    <g class="node case" transform="translate(200 421)">
      <title xml:space="preserve">A response.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">A response.</tspan></text>
    </g>
    <g class="node case" transform="translate(560 421)">
      <title xml:space="preserve">A timeout.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">A timeout.</tspan></text>
    </g>
    <g class="node case" transform="translate(1280 421)">
      <title xml:space="preserve">The server is busy.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">The server is busy.</tspan></text>
    </g>
    <g class="node question" transform="translate(560 564)">
      <title xml:space="preserve">Are the attempts exhausted?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Are the attempts </tspan><tspan x="0" dy="18">exhausted?</tspan></text>
    </g>
    <g class="node action" transform="translate(200 564)">
      <title xml:space="preserve">Keep the response.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Keep the response.</tspan></text>
    </g>
    <g class="node action" transform="translate(560 704)">
      <title xml:space="preserve">Give up.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Give up.</tspan></text>
    </g>
    <g class="node action" transform="translate(1280 564)">
      <title xml:space="preserve">Wait until the server is free.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Wait until the server is free.</tspan></text>
    </g>
    <g class="node action" transform="translate(920 704)">
      <title xml:space="preserve">Poll again after the timeout.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Poll again after the timeout.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 917)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Option&lt;u8&gt;</tspan></text>
    </g>
  </g>
</svg>
