<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="954" viewBox="0 0 1084 954" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for outer_repeat_contour</title>
  <desc id="kaalang-description">Nodes: Start: outer_repeat_contour with parameters mut mode: u8 handing over mut mode; Select: Which route? capturing mode; Case: Leave on the left. handing over leave; Case: Advance in the middle. handing over middle; Case: Advance on the right. handing over right; Action: Advance through the middle case. capturing middle, &amp;mut mode; Action: Advance through the right case. capturing right, &amp;mut mode; Action: Return the mode. capturing mode handing over end; End: u8 capturing end. Connections: Start: outer_repeat_contour to the entry of the loop; Select: Which route? to Case: Leave on the left.; Select: Which route? to Case: Advance in the middle.; Select: Which route? to Case: Advance on the right.; Case: Leave on the left. to the loop exit; Case: Advance in the middle. to Action: Advance through the middle case.; Case: Advance on the right. to Action: Advance through the right case.; Action: Advance through the middle case. to the iteration tail of the loop; Action: Advance through the right case. to the iteration tail of the loop; Action: Return the mode. to End: u8; the entry of the loop to Select: Which route?; the loop exit to Action: Return the mode.; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
