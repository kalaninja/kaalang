<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1556" viewBox="0 0 1140 1556" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for merged_outputs_gate_a_cycle</title>
  <desc id="kaalang-description">Cycles: Count the first number past five. with inputs mut first and outputs even or odd; Count the second number past three. with inputs base, mut second and outputs large or small. Nodes: Start: merged_outputs_gate_a_cycle with parameters mut first: u32; mut second: u32 handing over mut first, mut second; Question: Past five? capturing &amp;first handing over past / again; Action: Count the first number up. capturing again, &amp;mut first handing over stepped; Question: Is it even? capturing past, &amp;first handing over even / odd; Action: Start from one. capturing even handing over base; Action: Start from two. capturing odd handing over base; Question: Past three? capturing &amp;second handing over past / again; Action: Count the second number up. capturing again, &amp;mut second handing over stepped; Question: Is it large? capturing past, &amp;second handing over large / small; Action: Add three. capturing large, base handing over result; Action: Add two. capturing small, base handing over result; End: u32 capturing result; Merge: base; Merge: result. Connections: Start: merged_outputs_gate_a_cycle to the entry of the cycle; Question: Past five? branch 1 to Question: Is it even?; Question: Past five? branch 2 to Action: Count the first number up.; Action: Count the first number up. to the iteration tail of the cycle; Question: Is it even? branch 1 to the even result of the cycle; Question: Is it even? branch 2 to the odd result of the cycle; Action: Start from one. to the base merge; Action: Start from two. to the base merge; Question: Past three? branch 1 to Question: Is it large?; Question: Past three? branch 2 to Action: Count the second number up.; Action: Count the second number up. to the iteration tail of the cycle; Question: Is it large? branch 1 to the large result of the cycle; Question: Is it large? branch 2 to the small result of the cycle; Action: Add three. to the result merge; Action: Add two. to the result merge; the base merge to the entry of the cycle; the result merge to End: u32; the entry of the cycle to Question: Past five?; the even result of the cycle to Action: Start from one.; the odd result of the cycle to Action: Start from two.; the entry of the cycle to Question: Past three?; the large result of the cycle to Action: Add three.; the small result of the cycle to Action: Add two.; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
