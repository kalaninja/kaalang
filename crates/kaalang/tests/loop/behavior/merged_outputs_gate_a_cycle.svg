    <text class="connection-label" x="213" y="1239" xml:space="preserve"><tspan x="213" dy="0">large, base</tspan></text>
    <text class="connection-label" x="573" y="1239" xml:space="preserve"><tspan x="573" dy="0">small, base</tspan></text>
