    <text class="connection-label" x="213" y="591" xml:space="preserve"><tspan x="213" dy="0">even</tspan></text>
    <text class="connection-label" x="573" y="591" xml:space="preserve"><tspan x="573" dy="0">odd</tspan></text>
    <text class="connection-label" x="213" y="879" xml:space="preserve"><tspan x="213" dy="0">&amp;second</tspan></text>
