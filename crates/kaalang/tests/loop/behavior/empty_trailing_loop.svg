<svg xmlns="http://www.w3.org/2000/svg" width="756" height="552" viewBox="0 0 756 552" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for empty_trailing_loop</title>
  <desc id="kaalang-description">Cycles: Repeat the outer pass forever. with inputs flag and outputs (); Repeat the inner check until it leaves. with inputs flag and outputs (). Nodes: Start: empty_trailing_loop with parameters flag: bool handing over flag; Question: Repeat the inner iteration? capturing flag handing over _iterate_1 / leave_1 described as branch 1: YES / branch 2: NO. Connections: Start: empty_trailing_loop to the entry of the cycle; Question: Repeat the inner iteration? branch 1 to the iteration tail of the cycle; Question: Repeat the inner iteration? branch 2 to the iteration tail of the cycle; the entry of the cycle to the entry of the cycle; the entry of the cycle to Question: Repeat the inner iteration?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat the outer pass forever.</title>
    <rect class="cycle-boundary" x="32" y="127" width="624" height="393" rx="12"/>
    <text class="cycle-caption" x="644" y="141" text-anchor="end" xml:space="preserve"><tspan x="644" dy="0">Repeat the outer pass forever.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Repeat the inner check until it leaves.</title>
    <rect class="cycle-boundary" x="60" y="199" width="393" height="286" rx="12"/>
    <text class="cycle-caption" x="441" y="213" text-anchor="end" xml:space="preserve"><tspan x="441" dy="0">Repeat the inner check until </tspan><tspan x="441" dy="14">it leaves.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 248 90 L 248 162
      M 248 378 L 248 450
      M 388 342 L 608 342
      M 248 162 L 248 234
      M 248 234 L 248 306
    "/>
    <path class="connection" d="
      M 248 450 L 88 450 L 88 234 L 248 234
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 608 342 L 628 342 L 628 162 L 248 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="261" y="108" xml:space="preserve"><tspan x="261" dy="0">flag</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="261" y="398" xml:space="preserve"><tspan x="261" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="401" y="330" xml:space="preserve"><tspan x="401" dy="0">NO</tspan></text>
    <text class="connection-label" x="261" y="295" xml:space="preserve"><tspan x="261" dy="0">flag</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 388 61 L 484 61"/>
    <g class="parameter-panel" transform="translate(604 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(248 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">empty_trailing_loop</tspan></text>
    </g>
    <g class="node question" transform="translate(248 342)">
      <title xml:space="preserve">Repeat the inner iteration?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Repeat the inner iteration?</tspan></text>
    </g>
  </g>
</svg>
