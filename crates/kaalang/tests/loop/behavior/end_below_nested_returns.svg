  <desc id="kaalang-description">Nodes: Start: end_below_nested_returns with parameters mut mode: u8 handing over mut mode; Select: Which outer route? capturing mode; Case: Enter the inner loop. handing over enter; Case: Finish with seven. handing over seven; Case: Finish with nine. handing over nine; Select: Which inner route? capturing mode; Case: Repeat the inner loop. handing over repeat; Case: Repeat the outer loop. handing over leave; Case: Finish with eleven. handing over eleven; Action: Advance to the next route. capturing repeat, &amp;mut mode; Action: Return eleven. capturing eleven handing over end; Action: Return seven. capturing seven handing over end; Action: Return nine. capturing nine handing over end; End: u8 capturing end. Connections: Start: end_below_nested_returns to the entry of the loop; Select: Which outer route? to Case: Enter the inner loop.; Select: Which outer route? to Case: Finish with seven.; Select: Which outer route? to Case: Finish with nine.; Case: Enter the inner loop. to the entry of the loop; Case: Finish with seven. to Action: Return seven.; Case: Finish with nine. to Action: Return nine.; Select: Which inner route? to Case: Repeat the inner loop.; Select: Which inner route? to Case: Repeat the outer loop.; Select: Which inner route? to Case: Finish with eleven.; Case: Repeat the inner loop. to Action: Advance to the next route.; Case: Repeat the outer loop. to the loop exit; Case: Finish with eleven. to Action: Return eleven.; Action: Advance to the next route. to the iteration tail of the loop; Action: Return eleven. to the end merge; Action: Return seven. to the end merge; Action: Return nine. to the end merge; the end merge to End: u8; the entry of the loop to Select: Which outer route?; the entry of the loop to Select: Which inner route?; the loop exit to the iteration tail of the loop; Repeat from the iteration tail of the loop to the entry of the loop; Repeat from the iteration tail of the loop to the entry of the loop.<