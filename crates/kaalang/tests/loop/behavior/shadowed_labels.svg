<svg xmlns="http://www.w3.org/2000/svg" width="724" height="740" viewBox="0 0 724 740" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for shadowed_labels</title>
  <desc id="kaalang-description">Nodes: Start: const shadowed_labels with parameters mut count: usize handing over mut count; Action: Advance the outer pass. capturing &amp;mut count handing over advanced; Question: Have two passes finished? capturing advanced, &amp;count handing over done / again; Action: Finish this pass. capturing again; Action: Return the count. capturing count handing over end; End: usize capturing end. Connections: Start: const shadowed_labels to the entry of the loop; Action: Advance the outer pass. to Question: Have two passes finished?; Question: Have two passes finished? branch 1 to Action: Return the count.; Question: Have two passes finished? branch 2 to Action: Finish this pass.; Action: Finish this pass. to the iteration tail of the loop; Action: Return the count. to End: usize; the entry of the loop to Action: Advance the outer pass.; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 298 L 172 370
      M 172 442 L 172 514
      M 312 406 L 532 406 L 532 514
      M 532 578 L 532 650
      M 172 578 L 172 650
      M 172 162 L 172 234
    "/>
    <path class="connection" d="
      M 532 650 L 692 650 L 692 162 L 172 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="407" y="395" xml:space="preserve"><tspan x="407" dy="0">again</tspan></text>
    <text class="connection-label" x="185" y="108" xml:space="preserve"><tspan x="185" dy="0">mut count</tspan></text>
    <text class="connection-label" x="185" y="316" xml:space="preserve"><tspan x="185" dy="0">advanced</tspan></text>
    <text class="connection-label" x="185" y="460" xml:space="preserve"><tspan x="185" dy="0">done</tspan></text>
    <text class="connection-label" x="185" y="223" xml:space="preserve"><tspan x="185" dy="0">&amp;mut count</tspan></text>
    <text class="connection-label" x="185" y="359" xml:space="preserve"><tspan x="185" dy="0">advanced, &amp;count</tspan></text>
    <text class="connection-label" x="185" y="503" xml:space="preserve"><tspan x="185" dy="0">count</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut count: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">const shadowed_labels</tspan></text>
    </g>
    <g class="node action" transform="translate(172 266)">
      <title xml:space="preserve">Advance the outer pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance the outer pass.</tspan></text>
    </g>
    <g class="node question" transform="translate(172 406)">
      <title xml:space="preserve">Have two passes finished?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Have two passes finished?</tspan></text>
    </g>
    <g class="node action" transform="translate(532 546)">
      <title xml:space="preserve">Finish this pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish this pass.</tspan></text>
    </g>
    <g class="node action" transform="translate(172 546)">
      <title xml:space="preserve">Return the count.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the count.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 679)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
