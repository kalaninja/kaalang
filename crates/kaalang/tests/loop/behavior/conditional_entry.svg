<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="1044" viewBox="0 0 1092 1044" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for conditional_entry</title>
  <desc id="kaalang-description">Cycles: Count to the limit when selected. with inputs mut count, limit and outputs end. Nodes: Start: conditional_entry with parameters enabled: bool; limit: usize handing over enabled, limit; Question: Run the counter? capturing enabled handing over run / skip; Action: Initialize the selected counter. capturing run handing over mut count; Question: Has the counter reached the limit? capturing &amp;count, &amp;limit handing over done / again; Action: Increment the counter. capturing again, &amp;mut count; Action: Skip the counter. capturing skip handing over end; End: usize capturing end; Merge: end. Connections: Start: conditional_entry to Question: Run the counter?; Question: Run the counter? branch 1 to Action: Initialize the selected counter.; Question: Run the counter? branch 2 to Action: Skip the counter.; Action: Initialize the selected counter. to the entry of the cycle; Question: Has the counter reached the limit? branch 1 to the end merge; Question: Has the counter reached the limit? branch 2 to Action: Increment the counter.; Action: Increment the counter. to the iteration tail of the cycle; Action: Skip the counter. to the end merge; the end merge to End: usize; the entry of the cycle to Question: Has the counter reached the limit?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count to the limit when selected.</title>
    <rect class="cycle-boundary" x="32" y="415" width="716" height="422" rx="12"/>
    <text class="cycle-caption" x="736" y="429" text-anchor="end" xml:space="preserve"><tspan x="736" dy="0">Count to the limit when selected.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 94 L 200 170
      M 200 242 L 200 314
      M 340 206 L 920 206 L 920 314
      M 200 378 L 200 450
      M 200 594 L 200 878
      M 340 558 L 560 558 L 560 666
      M 560 730 L 560 802
      M 920 378 L 920 878 L 200 878
      M 200 878 L 200 954
      M 200 450 L 200 522
    "/>
    <path class="connection" d="
      M 560 802 L 720 802 L 720 450 L 200 450
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="303" xml:space="preserve"><tspan x="213" dy="0">run</tspan></text>
    <text class="connection-label" x="933" y="303" xml:space="preserve"><tspan x="933" dy="0">skip</tspan></text>
    <text class="connection-label" x="213" y="112" xml:space="preserve"><tspan x="213" dy="0">enabled, limit</tspan></text>
    <text class="connection-label" x="213" y="396" xml:space="preserve"><tspan x="213" dy="0">mut count</tspan></text>
    <text class="connection-label" x="213" y="612" xml:space="preserve"><tspan x="213" dy="0">done</tspan></text>
    <text class="connection-label" x="353" y="576" xml:space="preserve"><tspan x="353" dy="0">again</tspan></text>
    <text class="connection-label" x="933" y="396" xml:space="preserve"><tspan x="933" dy="0">end</tspan></text>
    <text class="connection-label" x="213" y="159" xml:space="preserve"><tspan x="213" dy="0">enabled</tspan></text>
    <text class="connection-label" x="213" y="511" xml:space="preserve"><tspan x="213" dy="0">&amp;count, &amp;limit</tspan></text>
    <text class="connection-label" x="573" y="655" xml:space="preserve"><tspan x="573" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label" x="213" y="943" xml:space="preserve"><tspan x="213" dy="0">end</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 65 L 436 65"/>
    <g class="parameter-panel" transform="translate(556 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">enabled: bool</tspan><tspan x="-104" dy="18">limit: usize</tspan></text>
    </g>
    <g class="node merge" transform="translate(200 878)">
      <title xml:space="preserve">the end merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(200 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">conditional_entry</tspan></text>
    </g>
    <g class="node question" transform="translate(200 206)">
      <title xml:space="preserve">Run the counter?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Run the counter?</tspan></text>
    </g>
    <g class="node action" transform="translate(200 346)">
      <title xml:space="preserve">Initialize the selected counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the selected counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 558)">
      <title xml:space="preserve">Has the counter reached the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the counter reached </tspan><tspan x="0" dy="18">the limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(560 698)">
      <title xml:space="preserve">Increment the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(920 346)">
      <title xml:space="preserve">Skip the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Skip the counter.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 983)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
