<svg xmlns="http://www.w3.org/2000/svg" width="752" height="948" viewBox="0 0 752 948" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for consume_before_continue</title>
  <desc id="kaalang-description">Cycles: Collect one value per iteration. with inputs mut remaining, mut values and outputs done. Nodes: Start: consume_before_continue with parameters mut remaining: usize handing over mut remaining; Action: Initialize the collection. capturing nothing handing over mut values; Question: Is another value needed? capturing &amp;remaining handing over again / done; Action: Create an owned value. capturing again, &amp;mut remaining handing over value; Action: Consume the owned value. capturing value, &amp;mut values handing over kept; End: Vec&lt;String&gt; capturing values. Connections: Start: consume_before_continue to Action: Initialize the collection.; Action: Initialize the collection. to the entry of the cycle; Question: Is another value needed? branch 1 to Action: Create an owned value.; Question: Is another value needed? branch 2 to End: Vec&lt;String&gt;; Action: Create an owned value. to Action: Consume the owned value.; Action: Consume the owned value. to the iteration tail of the cycle; the entry of the cycle to Question: Is another value needed?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Collect one value per iteration.</title>
    <rect class="cycle-boundary" x="32" y="263" width="400" height="558" rx="12"/>
    <text class="cycle-caption" x="420" y="277" text-anchor="end" xml:space="preserve"><tspan x="420" dy="0">Collect one value per iteration.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 90 L 220 162
      M 220 226 L 220 298
      M 220 442 L 220 514
      M 360 406 L 580 406 L 580 858
      M 220 578 L 220 650
      M 220 714 L 220 786
      M 220 298 L 220 370
    "/>
    <path class="connection" d="
      M 220 786 L 60 786 L 60 298 L 220 298
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="233" y="108" xml:space="preserve"><tspan x="233" dy="0">mut remaining</tspan></text>
    <text class="connection-label" x="233" y="244" xml:space="preserve"><tspan x="233" dy="0">mut values</tspan></text>
    <text class="connection-label" x="233" y="460" xml:space="preserve"><tspan x="233" dy="0">again</tspan></text>
    <text class="connection-label" x="373" y="424" xml:space="preserve"><tspan x="373" dy="0">done</tspan></text>
    <text class="connection-label" x="233" y="596" xml:space="preserve"><tspan x="233" dy="0">value</tspan></text>
    <text class="connection-label" x="233" y="732" xml:space="preserve"><tspan x="233" dy="0">kept</tspan></text>
    <text class="connection-label" x="233" y="151" xml:space="preserve"><tspan x="233" dy="0">()</tspan></text>
    <text class="connection-label" x="233" y="359" xml:space="preserve"><tspan x="233" dy="0">&amp;remaining</tspan></text>
    <text class="connection-label" x="233" y="503" xml:space="preserve"><tspan x="233" dy="0">again, &amp;mut remaining</tspan></text>
    <text class="connection-label" x="233" y="639" xml:space="preserve"><tspan x="233" dy="0">value, &amp;mut values</tspan></text>
    <text class="connection-label" x="593" y="847" xml:space="preserve"><tspan x="593" dy="0">values</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 61 L 456 61"/>
    <g class="parameter-panel" transform="translate(576 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mut remaining: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(220 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">consume_before_continue</tspan></text>
    </g>
    <g class="node action" transform="translate(220 194)">
      <title xml:space="preserve">Initialize the collection.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the collection.</tspan></text>
    </g>
    <g class="node question" transform="translate(220 406)">
      <title xml:space="preserve">Is another value needed?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is another value needed?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 546)">
      <title xml:space="preserve">Create an owned value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Create an owned value.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 682)">
      <title xml:space="preserve">Consume the owned value.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Consume the owned value.</tspan></text>
    </g>
    <g class="node end" transform="translate(580 887)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;String&gt;</tspan></text>
    </g>
  </g>
</svg>
