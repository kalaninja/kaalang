<svg xmlns="http://www.w3.org/2000/svg" width="704" height="604" viewBox="0 0 704 604" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for first_value</title>
  <desc id="kaalang-description">Nodes: Start: first_value with parameters values: &amp;[i32] handing over values; Question: Is there a first value? capturing values handing over iterate_1 / leave_1 described as branch 1: YES / branch 2: NO; Action: Return the first value. capturing iterate_1, values handing over end; Action: No first value exists. capturing nothing handing over end; End: Option&lt;i32&gt; capturing end. Connections: Start: first_value to Question: Is there a first value?; Question: Is there a first value? branch 1 to Action: Return the first value.; Question: Is there a first value? branch 2 to Action: No first value exists.; Action: Return the first value. to the end merge; Action: No first value exists. to the end merge; the end merge to End: Option&lt;i32&gt;.</desc>
