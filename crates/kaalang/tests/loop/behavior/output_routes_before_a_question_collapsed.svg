<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="972" viewBox="0 0 1064 972" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for output_routes_before_a_question</title>
  <desc id="kaalang-description">Nodes: Start: output_routes_before_a_question with parameters value: u8; flag: u8 handing over value, flag; Cycle: Sort the value. capturing value handing over tiny / larger; Question: Is the flag even? capturing larger, flag handing over even / odd; Action: Score the tiny value. capturing tiny handing over score; Action: Score the even flag. capturing even handing over score; Action: Keep the score. capturing score handing over result; Action: Score the odd flag. capturing odd handing over result; End: u8 capturing result; Merge: score; Merge: result. Connections: Start: output_routes_before_a_question to Cycle: Sort the value.; Cycle: Sort the value. output tiny to Action: Score the tiny value.; Cycle: Sort the value. output larger to Question: Is the flag even?; Question: Is the flag even? branch 1 to Action: Score the even flag.; Question: Is the flag even? branch 2 to Action: Score the odd flag.; Action: Score the tiny value. to the score merge; Action: Score the even flag. to the score merge; Action: Keep the score. to the result merge; Action: Score the odd flag. to the result merge; the score merge to Action: Keep the score.; the result merge to End: u8.</desc>
