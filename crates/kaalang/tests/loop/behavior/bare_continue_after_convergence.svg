<svg xmlns="http://www.w3.org/2000/svg" width="780" height="797" viewBox="0 0 780 797" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for bare_continue_after_convergence</title>
  <desc id="kaalang-description">Cycles: Repeat after both branches converge. with inputs flag and outputs (). Nodes: Start: bare_continue_after_convergence with parameters flag: bool handing over flag; Question: Take the first route? capturing flag handing over first / second; Action: Finish the first route. capturing first handing over ready; Action: Finish the second route. capturing second handing over ready; Action: Use the merged wire. capturing ready; Merge: ready. Connections: Start: bare_continue_after_convergence to the entry of the cycle; Question: Take the first route? branch 1 to Action: Finish the first route.; Question: Take the first route? branch 2 to Action: Finish the second route.; Action: Finish the first route. to the ready merge; Action: Finish the second route. to the ready merge; Action: Use the merged wire. to the iteration tail of the cycle; the ready merge to Action: Use the merged wire.; the entry of the cycle to Question: Take the first route?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat after both branches converge.</title>
    <rect class="cycle-boundary" x="32" y="127" width="716" height="638" rx="12"/>
    <text class="cycle-caption" x="736" y="141" text-anchor="end" xml:space="preserve"><tspan x="736" dy="0">Repeat after both branches converge.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 90 L 220 162
      M 220 306 L 220 378
      M 360 270 L 580 270 L 580 378
      M 220 442 L 220 518
      M 580 442 L 580 518 L 220 518
      M 220 658 L 220 730
      M 220 518 L 220 594
      M 220 162 L 220 234
    "/>
    <path class="connection" d="
      M 220 730 L 60 730 L 60 162 L 220 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="233" y="536" xml:space="preserve"><tspan x="233" dy="0">ready</tspan></text>
    <text class="connection-label" x="233" y="367" xml:space="preserve"><tspan x="233" dy="0">first</tspan></text>
    <text class="connection-label" x="593" y="367" xml:space="preserve"><tspan x="593" dy="0">second</tspan></text>
    <text class="connection-label" x="233" y="108" xml:space="preserve"><tspan x="233" dy="0">flag</tspan></text>
    <text class="connection-label" x="233" y="223" xml:space="preserve"><tspan x="233" dy="0">flag</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 61 L 456 61"/>
    <g class="parameter-panel" transform="translate(576 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(220 518)">
      <title xml:space="preserve">the ready merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">bare_continue_after_convergence</tspan></text>
    </g>
    <g class="node question" transform="translate(220 270)">
      <title xml:space="preserve">Take the first route?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Take the first route?</tspan></text>
    </g>
    <g class="node action" transform="translate(220 410)">
      <title xml:space="preserve">Finish the first route.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the first route.</tspan></text>
    </g>
    <g class="node action" transform="translate(580 410)">
      <title xml:space="preserve">Finish the second route.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the second route.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 626)">
      <title xml:space="preserve">Use the merged wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Use the merged wire.</tspan></text>
    </g>
  </g>
</svg>
