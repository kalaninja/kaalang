<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="826" viewBox="0 0 1500 826" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for terminal_cases_after_repeats</title>
  <desc id="kaalang-description">Cycles: Repeat until either finishing case. with inputs mut mode and outputs result. Nodes: Start: terminal_cases_after_repeats with parameters mode: u8 handing over mode; Select: Which route? capturing mode; Case: Advance on the left. handing over left; Case: Advance on the right. handing over right; Case: Finish with seven. handing over seven; Case: Finish with nine. handing over nine; Action: Finish the flow with seven. capturing seven handing over selected; Action: Finish the flow with nine. capturing nine handing over selected; Action: Advance through the left case. capturing left, &amp;mut mode; Action: Advance through the right case. capturing right, &amp;mut mode; End: u8 capturing result; Merge: selected. Connections: Start: terminal_cases_after_repeats to the entry of the cycle; Select: Which route? to Case: Advance on the left.; Select: Which route? to Case: Advance on the right.; Select: Which route? to Case: Finish with seven.; Select: Which route? to Case: Finish with nine.; Case: Advance on the left. to Action: Advance through the left case.; Case: Advance on the right. to Action: Advance through the right case.; Case: Finish with seven. to Action: Finish the flow with seven.; Case: Finish with nine. to Action: Finish the flow with nine.; Action: Finish the flow with seven. to the selected merge at the cycle result; Action: Finish the flow with nine. to the selected merge at the cycle result; Action: Advance through the left case. to the iteration tail of the cycle; Action: Advance through the right case. to the iteration tail of the cycle; the selected merge at the cycle result to End: u8; the entry of the cycle to Select: Which route?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat until either finishing case.</title>
    <rect class="cycle-boundary" x="32" y="127" width="1436" height="568" rx="12"/>
    <text class="cycle-caption" x="1456" y="141" text-anchor="end" xml:space="preserve"><tspan x="1456" dy="0">Repeat until either finishing case.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 90 L 220 162
      M 220 306 L 220 378
      M 348 270 L 580 270 L 580 378
      M 348 270 L 940 270 L 940 378
      M 348 270 L 1300 270 L 1300 378
      M 220 448 L 220 520
      M 580 448 L 580 520
      M 940 448 L 940 520
      M 1300 448 L 1300 520
      M 940 584 L 940 660
      M 1300 584 L 1300 660 L 940 660
      M 220 584 L 220 660
      M 580 584 L 580 660 L 220 660
      M 940 660 L 940 736
      M 220 162 L 220 234
    "/>
    <path class="connection" d="
      M 220 660 L 60 660 L 60 162 L 220 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="953" y="678" xml:space="preserve"><tspan x="953" dy="0">selected</tspan></text>
    <text class="connection-label" x="953" y="509" xml:space="preserve"><tspan x="953" dy="0">seven</tspan></text>
    <text class="connection-label" x="1313" y="509" xml:space="preserve"><tspan x="1313" dy="0">nine</tspan></text>
    <text class="connection-label" x="233" y="108" xml:space="preserve"><tspan x="233" dy="0">mode</tspan></text>
    <text class="connection-label" x="233" y="466" xml:space="preserve"><tspan x="233" dy="0">left</tspan></text>
    <text class="connection-label" x="593" y="466" xml:space="preserve"><tspan x="593" dy="0">right</tspan></text>
    <text class="connection-label" x="233" y="223" xml:space="preserve"><tspan x="233" dy="0">mode</tspan></text>
    <text class="connection-label" x="233" y="509" xml:space="preserve"><tspan x="233" dy="0">left, &amp;mut mode</tspan></text>
    <text class="connection-label" x="593" y="509" xml:space="preserve"><tspan x="593" dy="0">right, &amp;mut mode</tspan></text>
    <text class="connection-label" x="953" y="725" xml:space="preserve"><tspan x="953" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 61 L 456 61"/>
    <g class="parameter-panel" transform="translate(576 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">mode: u8</tspan></text>
    </g>
    <g class="node merge" transform="translate(940 660)">
      <title xml:space="preserve">the selected merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(220 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">terminal_cases_after_repeats</tspan></text>
    </g>
    <g class="node select" transform="translate(220 270)">
      <title xml:space="preserve">Which route?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Which route?</tspan></text>
    </g>
    <g class="node case" transform="translate(220 413)">
      <title xml:space="preserve">Advance on the left.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Advance on the left.</tspan></text>
    </g>
    <g class="node case" transform="translate(580 413)">
      <title xml:space="preserve">Advance on the right.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Advance on the right.</tspan></text>
    </g>
    <g class="node case" transform="translate(940 413)">
      <title xml:space="preserve">Finish with seven.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Finish with seven.</tspan></text>
    </g>
    <g class="node case" transform="translate(1300 413)">
      <title xml:space="preserve">Finish with nine.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Finish with nine.</tspan></text>
    </g>
    <g class="node action" transform="translate(940 552)">
      <title xml:space="preserve">Finish the flow with seven.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the flow with seven.</tspan></text>
    </g>
    <g class="node action" transform="translate(1300 552)">
      <title xml:space="preserve">Finish the flow with nine.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the flow with nine.</tspan></text>
    </g>
    <g class="node action" transform="translate(220 552)">
      <title xml:space="preserve">Advance through the left case.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance through the left case.</tspan></text>
    </g>
    <g class="node action" transform="translate(580 552)">
      <title xml:space="preserve">Advance through the right case.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance through the right case.</tspan></text>
    </g>
    <g class="node end" transform="translate(940 765)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
    </g>
  </g>
</svg>
