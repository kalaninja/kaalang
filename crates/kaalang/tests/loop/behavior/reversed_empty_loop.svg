<svg xmlns="http://www.w3.org/2000/svg" width="708" height="468" viewBox="0 0 708 468" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for reversed_empty_loop</title>
  <desc id="kaalang-description">Cycles: Repeat the check until its first branch leaves. with inputs mut checks and outputs checked. Nodes: Start: reversed_empty_loop with parameters checks: usize handing over checks; Question: Check once more? capturing &amp;mut checks handing over leave_1 / _iterate_1 described as branch 1: NO / branch 2: YES; End: usize capturing checked. Connections: Start: reversed_empty_loop to the entry of the cycle; Question: Check once more? branch 1 to End: usize; Question: Check once more? branch 2 to the iteration tail of the cycle; the entry of the cycle to Question: Check once more?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat the check until its first branch leaves.</title>
    <rect class="cycle-boundary" x="32" y="127" width="576" height="214" rx="12"/>
    <text class="cycle-caption" x="596" y="141" text-anchor="end" xml:space="preserve"><tspan x="596" dy="0">Repeat the check until its first branch leaves.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 306 L 200 378
      M 340 270 L 560 270
      M 200 162 L 200 234
    "/>
    <path class="connection" d="
      M 560 270 L 580 270 L 580 162 L 200 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">checks</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="213" y="326" xml:space="preserve"><tspan x="213" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="353" y="258" xml:space="preserve"><tspan x="353" dy="0">YES</tspan></text>
    <text class="connection-label" x="213" y="223" xml:space="preserve"><tspan x="213" dy="0">&amp;mut checks</tspan></text>
    <text class="connection-label" x="213" y="367" xml:space="preserve"><tspan x="213" dy="0">checked</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">checks: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">reversed_empty_loop</tspan></text>
    </g>
    <g class="node question" transform="translate(200 270)">
      <title xml:space="preserve">Check once more?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Check once more?</tspan></text>
    </g>
    <g class="node end" transform="translate(200 407)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
