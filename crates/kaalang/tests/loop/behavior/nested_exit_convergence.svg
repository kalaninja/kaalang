<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="1242" viewBox="0 0 1104 1242" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_exit_convergence</title>
  <desc id="kaalang-description">Nodes: Start: nested_exit_convergence with parameters mut count: usize handing over mut count; Select: Leave the inner loop? capturing count; Case: Leave at zero. handing over zero; Case: Leave at one. handing over one; Case: Count down. handing over again; Action: Count down. capturing again, &amp;mut count; Question: Finish the outer loop? capturing count handing over done / again; Action: Count down once more. capturing again, &amp;mut count; Action: Return the result. capturing count handing over end; End: usize capturing end. Connections: Start: nested_exit_convergence to the entry of the loop; Select: Leave the inner loop? to Case: Leave at zero.; Select: Leave the inner loop? to Case: Leave at one.; Select: Leave the inner loop? to Case: Count down.; Case: Leave at zero. to the loop exit; Case: Leave at one. to the loop exit; Case: Count down. to Action: Count down.; Action: Count down. to the iteration tail of the loop; Question: Finish the outer loop? branch 1 to Action: Return the result.; Question: Finish the outer loop? branch 2 to Action: Count down once more.; Action: Count down once more. to the iteration tail of the loop; Action: Return the result. to End: usize; the entry of the loop to the entry of the loop; the entry of the loop to Select: Leave the inner loop?; the loop exit to Question: Finish the outer loop?; the loop exit to Question: Finish the outer loop?; Repeat from the iteration tail of the loop to the entry of the loop; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
