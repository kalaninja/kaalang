<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="1250" viewBox="0 0 1228 1250" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_exit_convergence</title>
  <desc id="kaalang-description">Cycles: Count down to zero. with inputs mut count and outputs result; Converge the inner stopping routes. with inputs &amp;mut count and outputs (). Nodes: Start: nested_exit_convergence with parameters count: usize handing over count; Select: Leave the inner loop? capturing &amp;count; Case: Leave at zero. handing over zero; Case: Leave at one. handing over one; Case: Count down. handing over again; Action: Finish at zero. capturing zero handing over done; Action: Finish at one. capturing one handing over done; Action: Count down. capturing again, &amp;mut count; Question: Finish the outer loop? capturing &amp;count handing over done / again; Action: Count down once more. capturing again, &amp;mut count; End: usize capturing result; Merge: done. Connections: Start: nested_exit_convergence to the entry of the cycle; Select: Leave the inner loop? to Case: Leave at zero.; Select: Leave the inner loop? to Case: Leave at one.; Select: Leave the inner loop? to Case: Count down.; Case: Leave at zero. to Action: Finish at zero.; Case: Leave at one. to Action: Finish at one.; Case: Count down. to Action: Count down.; Action: Finish at zero. to the done merge at the cycle result; Action: Finish at one. to the done merge at the cycle result; Action: Count down. to the iteration tail of the cycle; Question: Finish the outer loop? branch 1 to End: usize; Question: Finish the outer loop? branch 2 to Action: Count down once more.; Action: Count down once more. to the iteration tail of the cycle; the done merge at the cycle result to Question: Finish the outer loop?; the entry of the cycle to the entry of the cycle; the entry of the cycle to Select: Leave the inner loop?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count down to zero.</title>
    <rect class="cycle-boundary" x="32" y="127" width="1164" height="996" rx="12"/>
    <text class="cycle-caption" x="1184" y="141" text-anchor="end" xml:space="preserve"><tspan x="1184" dy="0">Count down to zero.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Converge the inner stopping routes.</title>
    <rect class="cycle-boundary" x="60" y="199" width="1076" height="568" rx="12"/>
    <text class="cycle-caption" x="1124" y="213" text-anchor="end" xml:space="preserve"><tspan x="1124" dy="0">Converge the inner stopping routes.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 228 90 L 228 162
      M 228 378 L 228 450
      M 356 342 L 588 342 L 588 450
      M 356 342 L 948 342 L 948 450
      M 228 520 L 228 592
      M 588 520 L 588 592
      M 948 520 L 948 592
      M 228 656 L 228 732
      M 588 656 L 588 732 L 228 732
      M 948 656 L 948 732
      M 228 880 L 228 1160
      M 368 844 L 588 844 L 588 952
      M 588 1016 L 588 1088
      M 228 732 L 228 808
      M 228 162 L 228 234
      M 228 234 L 228 306
    "/>
    <path class="connection" d="
      M 948 732 L 1108 732 L 1108 234 L 228 234
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 588 1088 L 1168 1088 L 1168 162 L 228 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="241" y="750" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label" x="241" y="581" xml:space="preserve"><tspan x="241" dy="0">zero</tspan></text>
    <text class="connection-label" x="601" y="581" xml:space="preserve"><tspan x="601" dy="0">one</tspan></text>
    <text class="connection-label" x="241" y="108" xml:space="preserve"><tspan x="241" dy="0">count</tspan></text>
    <text class="connection-label" x="961" y="538" xml:space="preserve"><tspan x="961" dy="0">again</tspan></text>
    <text class="connection-label" x="241" y="898" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label" x="381" y="862" xml:space="preserve"><tspan x="381" dy="0">again</tspan></text>
    <text class="connection-label" x="241" y="295" xml:space="preserve"><tspan x="241" dy="0">&amp;count</tspan></text>
    <text class="connection-label" x="961" y="581" xml:space="preserve"><tspan x="961" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label" x="241" y="797" xml:space="preserve"><tspan x="241" dy="0">&amp;count</tspan></text>
    <text class="connection-label" x="601" y="941" xml:space="preserve"><tspan x="601" dy="0">again, &amp;mut count</tspan></text>
    <text class="connection-label" x="241" y="1149" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 61 L 464 61"/>
    <g class="parameter-panel" transform="translate(584 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">count: usize</tspan></text>
    </g>
    <g class="node merge" transform="translate(228 732)">
      <title xml:space="preserve">the done merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(228 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_exit_convergence</tspan></text>
    </g>
    <g class="node select" transform="translate(228 342)">
      <title xml:space="preserve">Leave the inner loop?</title>
      <polygon class="node-shape" points="-116,-36 140,-36 116,36 -140,36"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Leave the inner loop?</tspan></text>
    </g>
    <g class="node case" transform="translate(228 485)">
      <title xml:space="preserve">Leave at zero.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Leave at zero.</tspan></text>
    </g>
    <g class="node case" transform="translate(588 485)">
      <title xml:space="preserve">Leave at one.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Leave at one.</tspan></text>
    </g>
    <g class="node case" transform="translate(948 485)">
      <title xml:space="preserve">Count down.</title>
      <polygon class="node-shape" points="-120,-35 120,-35 120,17 0,35 -120,17"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Count down.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 624)">
      <title xml:space="preserve">Finish at zero.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish at zero.</tspan></text>
    </g>
    <g class="node action" transform="translate(588 624)">
      <title xml:space="preserve">Finish at one.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish at one.</tspan></text>
    </g>
    <g class="node action" transform="translate(948 624)">
      <title xml:space="preserve">Count down.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count down.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 844)">
      <title xml:space="preserve">Finish the outer loop?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Finish the outer loop?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 984)">
      <title xml:space="preserve">Count down once more.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count down once more.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 1189)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
