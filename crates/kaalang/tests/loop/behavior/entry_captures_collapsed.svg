<svg xmlns="http://www.w3.org/2000/svg" width="680" height="688" viewBox="0 0 680 688" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for entry_captures</title>
  <desc id="kaalang-description">Nodes: Start: entry_captures with parameters entry: Entry; mut log: Rc&lt;RefCell&lt;Vec&lt;usize&gt;&gt;&gt; handing over entry, mut log; Action: Initialize the counter. capturing nothing handing over mut count; Cycle: Count three entries. capturing entry, mut count handing over final_count; Action: Record work after the cycle input drops. capturing final_count, &amp;mut log handing over result; End: usize capturing result. Connections: Start: entry_captures to Action: Initialize the counter.; Action: Initialize the counter. to Cycle: Count three entries.; Cycle: Count three entries. to Action: Record work after the cycle input drops.; Action: Record work after the cycle input drops. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 103 L 172 188
      M 172 252 L 172 324
      M 172 388 L 172 460
      M 172 526 L 172 598
    "/>
    <text class="connection-label" x="185" y="557" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">entry, mut log</tspan></text>
    <text class="connection-label" x="185" y="270" xml:space="preserve"><tspan x="185" dy="0">mut count</tspan></text>
    <text class="connection-label" x="185" y="406" xml:space="preserve"><tspan x="185" dy="0">final_count</tspan></text>
    <text class="connection-label" x="185" y="177" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
    <text class="connection-label" x="185" y="313" xml:space="preserve"><tspan x="185" dy="0">entry, mut count</tspan></text>
    <text class="connection-label" x="185" y="449" xml:space="preserve"><tspan x="185" dy="0">final_count, &amp;mut log</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 74 L 408 74"/>
    <g class="parameter-panel" transform="translate(528 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">entry: Entry</tspan><tspan x="-104" dy="18">mut log: </tspan><tspan x="-104" dy="18">Rc&lt;RefCell&lt;Vec&lt;usize&gt;&gt;&gt;</tspan></text>
    </g>
    <g class="node start" transform="translate(172 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">entry_captures</tspan></text>
    </g>
    <g class="node action" transform="translate(172 220)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 356)">
      <title xml:space="preserve">Count three entries.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64" rx="8"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Count three entries.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 493)">
      <title xml:space="preserve">Record work after the cycle input drops.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Record work after the cycle input </tspan><tspan x="-124" dy="18">drops.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 627)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
