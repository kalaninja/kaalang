<svg xmlns="http://www.w3.org/2000/svg" width="704" height="968" viewBox="0 0 704 968" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for merged_outputs_gate_a_cycle</title>
  <desc id="kaalang-description">Nodes: Start: merged_outputs_gate_a_cycle with parameters mut first: u32; mut second: u32 handing over mut first, mut second; Cycle: Count the first number past five. capturing mut first handing over even / odd; Action: Start from one. capturing even handing over base; Action: Start from two. capturing odd handing over base; Cycle: Count the second number past three. capturing base, mut second handing over large / small; Action: Add three. capturing large, base handing over result; Action: Add two. capturing small, base handing over result; End: u32 capturing result; Merge: base; Merge: result. Connections: Start: merged_outputs_gate_a_cycle to Cycle: Count the first number past five.; Cycle: Count the first number past five. output even to Action: Start from one.; Cycle: Count the first number past five. output odd to Action: Start from two.; Action: Start from one. to the base merge; Action: Start from two. to the base merge; Cycle: Count the second number past three. output large to Action: Add three.; Cycle: Count the second number past three. output small to Action: Add two.; Action: Add three. to the result merge; Action: Add two. to the result merge; the base merge to Cycle: Count the second number past three.; the result merge to End: u32.</desc>
