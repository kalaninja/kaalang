<svg xmlns="http://www.w3.org/2000/svg" width="1632" height="1079" viewBox="0 0 1632 1079" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_alternating_returns</title>
  <desc id="kaalang-description">Cycles: Repeat level 0. with inputs flag and outputs (); Repeat level 1. with inputs stay_0, flag and outputs (); Repeat level 2. with inputs stay_1, flag and outputs (). Nodes: Start: nested_alternating_returns with parameters flag: bool handing over flag; Question: Leave level 0? capturing flag handing over stay_0 / leave_0; Question: Leave level 1? capturing flag handing over leave_1 / stay_1; Question: Leave level 2? capturing flag handing over _stay_2 / leave_2; End: () capturing nothing. Connections: Start: nested_alternating_returns to the entry of the cycle; Question: Leave level 0? branch 1 to the entry of the cycle; Question: Leave level 0? branch 2 to End: (); Question: Leave level 1? branch 1 to the iteration tail of the cycle; Question: Leave level 1? branch 2 to the entry of the cycle; Question: Leave level 2? branch 1 to the iteration tail of the cycle; Question: Leave level 2? branch 2 to the iteration tail of the cycle; the entry of the cycle to Question: Leave level 0?; the entry of the cycle to Question: Leave level 1?; the entry of the cycle to Question: Leave level 2?; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat level 0.</title>
    <rect class="cycle-boundary" x="32" y="127" width="1104" height="825" rx="12"/>
    <text class="cycle-caption" x="1124" y="141" text-anchor="end" xml:space="preserve"><tspan x="1124" dy="0">Repeat level 0.</tspan></text>
    </g>
    <g>
