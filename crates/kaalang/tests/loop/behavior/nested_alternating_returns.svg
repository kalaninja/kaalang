    <text class="connection-label" x="273" y="324" xml:space="preserve"><tspan x="273" dy="0">stay_0</tspan></text>
    <text class="connection-label" x="413" y="288" xml:space="preserve"><tspan x="413" dy="0">leave_0</tspan></text>
    <text class="connection-label" x="273" y="540" xml:space="preserve"><tspan x="273" dy="0">leave_1</tspan></text>
    <text class="connection-label" x="413" y="504" xml:space="preserve"><tspan x="413" dy="0">stay_1</tspan></text>
    <text class="connection-label" x="673" y="756" xml:space="preserve"><tspan x="673" dy="0">_stay_2</tspan></text>
    <text class="connection-label" x="813" y="720" xml:space="preserve"><tspan x="813" dy="0">leave_2</tspan></text>
    <text class="connection-label" x="273" y="223" xml:space="preserve"><tspan x="273" dy="0">flag</tspan></text>
    <text class="connection-label" x="273" y="439" xml:space="preserve"><tspan x="273" dy="0">flag</tspan></text>
    <text class="connection-label" x="673" y="655" xml:space="preserve"><tspan x="673" dy="0">flag</tspan></text>
    <text class="connection-label" x="1473" y="978" xml:space="preserve"><tspan x="1473" dy="0">()</tspan></text>
  </g>
