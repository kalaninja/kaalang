    </g>
    <g>
      <title xml:space="preserve">Repeat level 2.</title>
    <rect class="cycle-boundary" x="472" y="559" width="418" height="286" rx="12"/>
    <text class="cycle-caption" x="878" y="573" text-anchor="end" xml:space="preserve"><tspan x="878" dy="0">Repeat level 2.</tspan></text>
    </g>
  </g>
