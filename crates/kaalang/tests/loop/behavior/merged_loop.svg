<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="828" viewBox="0 0 1064 828" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for merged_loop</title>
  <desc id="kaalang-description">Nodes: Start: merged_loop with parameters first: bool; second: bool handing over first, second; Question: Enter immediately? capturing first handing over enter / check; Question: Enter after checking? capturing check, second handing over enter / skip; Action: Skip the loop. capturing skip handing over end; Action: Finish inside the loop. capturing nothing handing over end; End: usize capturing end. Connections: Start: merged_loop to Question: Enter immediately?; Question: Enter immediately? branch 1 to the enter merge; Question: Enter immediately? branch 2 to Question: Enter after checking?; Question: Enter after checking? branch 1 to the enter merge; Question: Enter after checking? branch 2 to Action: Skip the loop.; Action: Skip the loop. to the end merge; Action: Finish inside the loop. to the end merge; the enter merge to Action: Finish inside the loop.; the end merge to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <path class="connection" d="
      M 172 94 L 172 170
      M 172 242 L 172 458
      M 312 206 L 532 206 L 532 314
      M 532 386 L 532 458 L 172 458
      M 672 350 L 892 350 L 892 530
      M 892 594 L 892 666 L 172 666
      M 172 594 L 172 666
      M 172 458 L 172 530
      M 172 666 L 172 738
    "/>
    <text class="connection-label" x="185" y="476" xml:space="preserve"><tspan x="185" dy="0">enter</tspan></text>
    <text class="connection-label" x="770" y="339" xml:space="preserve"><tspan x="770" dy="0">skip</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">first, second</tspan></text>
    <text class="connection-label" x="325" y="224" xml:space="preserve"><tspan x="325" dy="0">check</tspan></text>
    <text class="connection-label" x="185" y="159" xml:space="preserve"><tspan x="185" dy="0">first</tspan></text>
    <text class="connection-label" x="545" y="303" xml:space="preserve"><tspan x="545" dy="0">check, second</tspan></text>
    <text class="connection-label" x="185" y="519" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 65 L 408 65"/>
    <g class="parameter-panel" transform="translate(528 65)">
