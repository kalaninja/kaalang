    <text class="connection-label" x="427" y="883" xml:space="preserve"><tspan x="427" dy="0">again</tspan></text>
    <text class="connection-label" x="205" y="244" xml:space="preserve"><tspan x="205" dy="0">mut outer, mut inner</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="670" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="602" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="205" y="948" xml:space="preserve"><tspan x="205" dy="0">done</tspan></text>
    <text class="connection-label" x="205" y="151" xml:space="preserve"><tspan x="205" dy="0">()</tspan></text>
    <text class="connection-label" x="205" y="359" xml:space="preserve"><tspan x="205" dy="0">&amp;mut outer</tspan></text>
    <text class="connection-label" x="205" y="567" xml:space="preserve"><tspan x="205" dy="0">&amp;inner</tspan></text>
    <text class="connection-label" x="205" y="711" xml:space="preserve"><tspan x="205" dy="0">&amp;mut inner</tspan></text>
    <text class="connection-label" x="205" y="847" xml:space="preserve"><tspan x="205" dy="0">&amp;inner</tspan></text>
    <text class="connection-label" x="205" y="991" xml:space="preserve"><tspan x="205" dy="0">done, &amp;outer</tspan></text>
