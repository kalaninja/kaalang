      M 192 506 L 192 578
    "/>
    <path class="connection" d="
      M 552 1268 L 32 1268 L 32 506 L 192 506
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 369 614 L 389 614 L 389 298 L 192 298
