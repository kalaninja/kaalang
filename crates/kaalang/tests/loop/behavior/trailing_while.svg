<svg xmlns="http://www.w3.org/2000/svg" width="724" height="1300" viewBox="0 0 724 1300" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for trailing_while</title>
  <desc id="kaalang-description">Nodes: Start: trailing_while; Action: Initialize the counters. capturing nothing handing over mut outer, mut inner; Action: Enter the outer iteration. capturing &amp;mut outer; Question: Is the inner counter below three? capturing &amp;inner described as branch 1: YES / branch 2: NO; Action: Increment the inner counter. capturing &amp;mut inner; Question: Has the inner counter reached three? capturing &amp;inner handing over done / again; Action: Return the outer counter. capturing done, &amp;outer handing over end; Action: Finish the inner iteration. capturing again; End: usize capturing end. Connections: Start: trailing_while to Action: Initialize the counters.; Action: Initialize the counters. to the entry of the loop; Action: Enter the outer iteration. to the entry of Question: Is the inner counter below three?; Question: Is the inner counter below three? branch 1 to Action: Increment the inner counter.; Question: Is the inner counter below three? branch 2 to the iteration tail of the loop; Action: Increment the inner counter. to Question: Has the inner counter reached three?; Question: Has the inner counter reached three? branch 1 to Action: Return the outer counter.; Question: Has the inner counter reached three? branch 2 to Action: Finish the inner iteration.; Action: Return the outer counter. to End: usize; Action: Finish the inner iteration. to the iteration tail of Question: Is the inner counter below three?; the entry of the loop to Action: Enter the outer iteration.; the entry of Question: Is the inner counter below three? to Question: Is the inner counter below three?; Repeat from the iteration tail of Question: Is the inner counter below three? to the entry of Question: Is the inner counter below three?; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
