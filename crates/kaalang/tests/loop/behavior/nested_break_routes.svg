<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="1062" viewBox="0 0 1304 1062" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_break_routes</title>
  <desc id="kaalang-description">Nodes: Start: nested_break_routes with parameters a: bool; b: bool; c: bool handing over a, b, c; Question: First? capturing a handing over next / stop_a; Question: Second? capturing next, b handing over next_b / stop_b; Question: Third? capturing next_b, c handing over _again / stop_c; Action: Finish. capturing nothing handing over end; End: () capturing end. Connections: Start: nested_break_routes to the entry of the loop; Question: First? branch 1 to Question: Second?; Question: First? branch 2 to Action: Finish.; Question: Second? branch 1 to Question: Third?; Question: Second? branch 2 to Action: Finish.; Question: Third? branch 1 to the iteration tail of the loop; Question: Third? branch 2 to Action: Finish.; Action: Finish. to End: (); the entry of the loop to Question: First?; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 192 103 L 192 188
      M 192 332 L 192 404
      M 332 296 L 1272 296 L 1272 764 L 552 764 L 552 836
      M 192 476 L 192 620
      M 332 440 L 912 440 L 912 548 L 552 548 L 552 836
      M 192 692 L 192 764
      M 332 656 L 552 656 L 552 836
      M 552 900 L 552 972
      M 192 188 L 192 260
    "/>
    <path class="connection" d="
      M 192 764 L 32 764 L 32 188 L 192 188
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="121" xml:space="preserve"><tspan x="205" dy="0">a, b, c</tspan></text>
    <text class="connection-label" x="205" y="350" xml:space="preserve"><tspan x="205" dy="0">next</tspan></text>
    <text class="connection-label" x="345" y="314" xml:space="preserve"><tspan x="345" dy="0">stop_a</tspan></text>
    <text class="connection-label" x="205" y="494" xml:space="preserve"><tspan x="205" dy="0">next_b</tspan></text>
    <text class="connection-label" x="345" y="458" xml:space="preserve"><tspan x="345" dy="0">stop_b</tspan></text>
    <text class="connection-label" x="205" y="710" xml:space="preserve"><tspan x="205" dy="0">_again</tspan></text>
    <text class="connection-label" x="345" y="674" xml:space="preserve"><tspan x="345" dy="0">stop_c</tspan></text>
    <text class="connection-label" x="205" y="249" xml:space="preserve"><tspan x="205" dy="0">a</tspan></text>
    <text class="connection-label" x="205" y="393" xml:space="preserve"><tspan x="205" dy="0">next, b</tspan></text>
    <text class="connection-label" x="205" y="609" xml:space="preserve"><tspan x="205" dy="0">next_b, c</tspan></text>
    <text class="connection-label" x="565" y="825" xml:space="preserve"><tspan x="565" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 74 L 428 74"/>
    <g class="parameter-panel" transform="translate(548 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">a: bool</tspan><tspan x="-104" dy="18">b: bool</tspan><tspan x="-104" dy="18">c: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(192 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_break_routes</tspan></text>
    </g>
    <g class="node question" transform="translate(192 296)">
      <title xml:space="preserve">First?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">First?</tspan></text>
    </g>
    <g class="node question" transform="translate(192 440)">
      <title xml:space="preserve">Second?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Second?</tspan></text>
    </g>
    <g class="node question" transform="translate(192 656)">
      <title xml:space="preserve">Third?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Third?</tspan></text>
    </g>
    <g class="node action" transform="translate(552 868)">
      <title xml:space="preserve">Finish.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish.</tspan></text>
    </g>
    <g class="node end" transform="translate(552 1001)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">()</tspan></text>
    </g>
  </g>
</svg>
