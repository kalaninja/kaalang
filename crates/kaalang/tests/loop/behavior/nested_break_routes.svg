<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="854" viewBox="0 0 1360 854" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_break_routes</title>
  <desc id="kaalang-description">Cycles: Leave from any nested question. with inputs a, b, c and outputs (). Nodes: Start: nested_break_routes with parameters a: bool; b: bool; c: bool handing over a, b, c; Question: First? capturing a handing over next / stop_a; Question: Second? capturing next, b handing over next_b / stop_b; Question: Third? capturing next_b, c handing over _again / stop_c; End: () capturing nothing. Connections: Start: nested_break_routes to the entry of the cycle; Question: First? branch 1 to Question: Second?; Question: First? branch 2 to a cycle break; Question: Second? branch 1 to Question: Third?; Question: Second? branch 2 to a cycle break; Question: Third? branch 1 to the iteration tail of the cycle; Question: Third? branch 2 to a cycle break; the entry of the cycle to Question: First?; the cycle result to End: (); a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Leave from any nested question.</title>
    <rect class="cycle-boundary" x="32" y="153" width="1296" height="574" rx="12"/>
    <text class="cycle-caption" x="1316" y="167" text-anchor="end" xml:space="preserve"><tspan x="1316" dy="0">Leave from any nested question.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 220 103 L 220 188
      M 220 332 L 220 404
      M 360 296 L 1300 296 L 1300 404
      M 220 476 L 220 548
      M 360 440 L 940 440 L 940 548
      M 220 620 L 220 692
      M 360 584 L 580 584 L 580 692
      M 220 188 L 220 260
      M 580 692 L 580 764
      M 580 692 L 580 692
      M 940 548 L 940 692 L 580 692
      M 1300 404 L 1300 692 L 580 692
    "/>
    <path class="connection" d="
      M 220 692 L 60 692 L 60 188 L 220 188
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="233" y="121" xml:space="preserve"><tspan x="233" dy="0">a, b, c</tspan></text>
    <text class="connection-label" x="233" y="350" xml:space="preserve"><tspan x="233" dy="0">next</tspan></text>
    <text class="connection-label" x="373" y="314" xml:space="preserve"><tspan x="373" dy="0">stop_a</tspan></text>
    <text class="connection-label" x="233" y="494" xml:space="preserve"><tspan x="233" dy="0">next_b</tspan></text>
    <text class="connection-label" x="373" y="458" xml:space="preserve"><tspan x="373" dy="0">stop_b</tspan></text>
    <text class="connection-label" x="233" y="638" xml:space="preserve"><tspan x="233" dy="0">_again</tspan></text>
    <text class="connection-label" x="373" y="602" xml:space="preserve"><tspan x="373" dy="0">stop_c</tspan></text>
    <text class="connection-label" x="233" y="249" xml:space="preserve"><tspan x="233" dy="0">a</tspan></text>
    <text class="connection-label" x="233" y="393" xml:space="preserve"><tspan x="233" dy="0">next, b</tspan></text>
    <text class="connection-label" x="233" y="537" xml:space="preserve"><tspan x="233" dy="0">next_b, c</tspan></text>
    <text class="connection-label" x="593" y="753" xml:space="preserve"><tspan x="593" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 360 74 L 456 74"/>
    <g class="parameter-panel" transform="translate(576 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">a: bool</tspan><tspan x="-104" dy="18">b: bool</tspan><tspan x="-104" dy="18">c: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(220 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_break_routes</tspan></text>
    </g>
    <g class="node question" transform="translate(220 296)">
      <title xml:space="preserve">First?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">First?</tspan></text>
    </g>
    <g class="node question" transform="translate(220 440)">
      <title xml:space="preserve">Second?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Second?</tspan></text>
    </g>
    <g class="node question" transform="translate(220 584)">
      <title xml:space="preserve">Third?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Third?</tspan></text>
    </g>
    <g class="node end" transform="translate(580 793)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">()</tspan></text>
    </g>
  </g>
</svg>
