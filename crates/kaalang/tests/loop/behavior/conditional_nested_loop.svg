<svg xmlns="http://www.w3.org/2000/svg" width="788" height="612" viewBox="0 0 788 612" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for conditional_nested_loop</title>
  <desc id="kaalang-description">Cycles: Choose between a nested cycle and a direct result. with inputs flag and outputs result; Produce one. with inputs iterate_1 and outputs selected. Nodes: Start: conditional_nested_loop with parameters flag: bool handing over flag; Question: Enter the loop? capturing flag handing over iterate_1 / leave_1 described as branch 1: YES / branch 2: NO; Action: Produce two. capturing leave_1 handing over selected; Action: Produce one. capturing nothing handing over one; End: usize capturing result; Merge: selected. Connections: Start: conditional_nested_loop to Question: Enter the loop?; Question: Enter the loop? branch 1 to Action: Produce one.; Question: Enter the loop? branch 2 to Action: Produce two.; Action: Produce two. to the selected merge at the cycle result; Action: Produce one. to the selected merge at the cycle result; the selected merge at the cycle result to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Choose between a nested cycle and a direct result.</title>
    <rect class="cycle-boundary" x="32" y="127" width="724" height="354" rx="12"/>
    <text class="cycle-caption" x="744" y="141" text-anchor="end" xml:space="preserve"><tspan x="744" dy="0">Choose between a nested cycle and a direct result.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Produce one.</title>
    <rect class="cycle-boundary" x="60" y="271" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="384" y="285" text-anchor="end" xml:space="preserve"><tspan x="384" dy="0">Produce one.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 228 90 L 228 162
      M 228 234 L 228 306
      M 368 198 L 588 198 L 588 306
      M 588 370 L 588 446 L 228 446
      M 228 370 L 228 446
      M 228 446 L 228 522
    "/>
    <text class="connection-label" x="241" y="151" xml:space="preserve"><tspan x="241" dy="0">flag</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="241" y="254" xml:space="preserve"><tspan x="241" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="381" y="186" xml:space="preserve"><tspan x="381" dy="0">NO</tspan></text>
    <text class="connection-label" x="601" y="388" xml:space="preserve"><tspan x="601" dy="0">selected</tspan></text>
    <text class="connection-label" x="241" y="388" xml:space="preserve"><tspan x="241" dy="0">one</tspan></text>
    <text class="connection-label" x="241" y="295" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label" x="241" y="511" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 368 61 L 464 61"/>
    <g class="parameter-panel" transform="translate(584 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(228 446)">
      <title xml:space="preserve">the selected merge at the cycle result</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(228 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">conditional_nested_loop</tspan></text>
    </g>
    <g class="node question" transform="translate(228 198)">
      <title xml:space="preserve">Enter the loop?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Enter the loop?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 338)">
      <title xml:space="preserve">Produce two.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce two.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 338)">
      <title xml:space="preserve">Produce one.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce one.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 551)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
