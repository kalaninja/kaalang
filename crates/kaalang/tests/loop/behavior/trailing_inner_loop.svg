<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="1652" viewBox="0 0 1228 1652" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for trailing_inner_loop</title>
  <desc id="kaalang-description">Cycles: Repeat outer iterations until the inner cycle finishes. with inputs mut outer, mut inner and outputs result; Advance the inner counter or request another outer pass. with inputs &amp;mut inner, &amp;outer and outputs inner_result. Nodes: Start: trailing_inner_loop; Action: Initialize the counters. capturing nothing handing over mut outer, mut inner; Action: Enter the outer iteration. capturing &amp;mut outer; Question: Is the inner counter below three? capturing &amp;inner handing over leave_1 / iterate_1 described as branch 1: NO / branch 2: YES; Action: Request another outer pass. capturing leave_1 handing over repeat_outer; Action: Increment the inner counter. capturing iterate_1, &amp;mut inner handing over incremented; Question: Has the inner counter reached three? capturing incremented, &amp;inner handing over done / again; Action: Produce the outer counter. capturing done, outer handing over result; Action: Finish the inner iteration. capturing again; Question: Did the inner cycle finish the flow? capturing &amp;inner_result handing over done / again; Action: Extract the result. capturing done, inner_result handing over result; Action: Finish the outer iteration. capturing again; End: usize capturing result. Connections: Start: trailing_inner_loop to Action: Initialize the counters.; Action: Initialize the counters. to the entry of the cycle; Action: Enter the outer iteration. to the entry of the cycle; Question: Is the inner counter below three? branch 1 to Action: Request another outer pass.; Question: Is the inner counter below three? branch 2 to Action: Increment the inner counter.; Action: Request another outer pass. to a cycle break; Action: Increment the inner counter. to Question: Has the inner counter reached three?; Question: Has the inner counter reached three? branch 1 to Action: Produce the outer counter.; Question: Has the inner counter reached three? branch 2 to Action: Finish the inner iteration.; Action: Produce the outer counter. to a cycle break; Action: Finish the inner iteration. to the iteration tail of the cycle; Question: Did the inner cycle finish the flow? branch 1 to Action: Extract the result.; Question: Did the inner cycle finish the flow? branch 2 to Action: Finish the outer iteration.; Action: Extract the result. to a cycle break; Action: Finish the outer iteration. to the iteration tail of the cycle; the entry of the cycle to Action: Enter the outer iteration.; the cycle result to End: usize; the entry of the cycle to Question: Is the inner counter below three?; the cycle result to Question: Did the inner cycle finish the flow?; a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Repeat outer iterations until the inner cycle finishes.</title>
    <rect class="cycle-boundary" x="32" y="263" width="1164" height="1262" rx="12"/>
    <text class="cycle-caption" x="1184" y="277" text-anchor="end" xml:space="preserve"><tspan x="1184" dy="0">Repeat outer iterations until the inner cycle finishes.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Advance the inner counter or request another outer pass.</title>
    <rect class="cycle-boundary" x="60" y="471" width="1096" height="702" rx="12"/>
    <text class="cycle-caption" x="1144" y="485" text-anchor="end" xml:space="preserve"><tspan x="1144" dy="0">Advance the inner counter or request another outer pass.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
