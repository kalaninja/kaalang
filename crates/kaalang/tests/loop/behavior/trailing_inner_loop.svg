    <text class="connection-label" x="833" y="883" xml:space="preserve"><tspan x="833" dy="0">again</tspan></text>
    <text class="connection-label" x="463" y="1235" xml:space="preserve"><tspan x="463" dy="0">again</tspan></text>
    <text class="connection-label" x="241" y="244" xml:space="preserve"><tspan x="241" dy="0">mut outer, mut inner</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="241" y="670" xml:space="preserve"><tspan x="241" dy="0">NO</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="381" y="602" xml:space="preserve"><tspan x="381" dy="0">YES</tspan></text>
    <text class="connection-label" x="241" y="804" xml:space="preserve"><tspan x="241" dy="0">repeat_outer</tspan></text>
    <text class="connection-label" x="601" y="804" xml:space="preserve"><tspan x="601" dy="0">incremented</tspan></text>
    <text class="connection-label" x="601" y="948" xml:space="preserve"><tspan x="601" dy="0">done</tspan></text>
    <text class="connection-label" x="601" y="1084" xml:space="preserve"><tspan x="601" dy="0">result</tspan></text>
    <text class="connection-label" x="241" y="1300" xml:space="preserve"><tspan x="241" dy="0">done</tspan></text>
    <text class="connection-label" x="241" y="1436" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
    <text class="connection-label" x="241" y="151" xml:space="preserve"><tspan x="241" dy="0">()</tspan></text>
    <text class="connection-label" x="241" y="359" xml:space="preserve"><tspan x="241" dy="0">&amp;mut outer</tspan></text>
    <text class="connection-label" x="241" y="567" xml:space="preserve"><tspan x="241" dy="0">&amp;inner</tspan></text>
    <text class="connection-label" x="601" y="711" xml:space="preserve"><tspan x="601" dy="0">iterate_1, &amp;mut inner</tspan></text>
    <text class="connection-label" x="601" y="847" xml:space="preserve"><tspan x="601" dy="0">incremented, &amp;inner</tspan></text>
    <text class="connection-label" x="601" y="991" xml:space="preserve"><tspan x="601" dy="0">done, outer</tspan></text>
    <text class="connection-label" x="241" y="1199" xml:space="preserve"><tspan x="241" dy="0">&amp;inner_result</tspan></text>
    <text class="connection-label" x="241" y="1343" xml:space="preserve"><tspan x="241" dy="0">done, inner_result</tspan></text>
    <text class="connection-label" x="241" y="1551" xml:space="preserve"><tspan x="241" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(228 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">trailing_inner_loop</tspan></text>
    </g>
    <g class="node action" transform="translate(228 194)">
      <title xml:space="preserve">Initialize the counters.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counters.</tspan></text>
    </g>
    <g class="node action" transform="translate(228 402)">
      <title xml:space="preserve">Enter the outer iteration.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Enter the outer iteration.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 614)">
      <title xml:space="preserve">Is the inner counter below three?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Is the inner counter below </tspan><tspan x="0" dy="18">three?</tspan></text>
    </g>
    <g class="node action" transform="translate(228 754)">
      <title xml:space="preserve">Request another outer pass.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Request another outer pass.</tspan></text>
    </g>
    <g class="node action" transform="translate(588 754)">
      <title xml:space="preserve">Increment the inner counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the inner counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(588 894)">
      <title xml:space="preserve">Has the inner counter reached three?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the inner counter </tspan><tspan x="0" dy="18">reached three?</tspan></text>
    </g>
    <g class="node action" transform="translate(588 1034)">
      <title xml:space="preserve">Produce the outer counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce the outer counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(968 1034)">
      <title xml:space="preserve">Finish the inner iteration.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the inner iteration.</tspan></text>
    </g>
    <g class="node question" transform="translate(228 1246)">
      <title xml:space="preserve">Did the inner cycle finish the flow?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Did the inner cycle finish </tspan><tspan x="0" dy="18">the flow?</tspan></text>
    </g>
    <g class="node action" transform="translate(228 1386)">
      <title xml:space="preserve">Extract the result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Extract the result.</tspan></text>
    </g>
    <g class="node action" transform="translate(588 1386)">
      <title xml:space="preserve">Finish the outer iteration.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the outer iteration.</tspan></text>
    </g>
    <g class="node end" transform="translate(228 1591)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
