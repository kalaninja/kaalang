      M 192 378 L 192 450
      M 332 342 L 369 342
      M 192 162 L 192 234
      M 192 234 L 192 306
    "/>
    <path class="connection" d="
      M 192 450 L 32 450 L 32 234 L 192 234
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 369 342 L 389 342 L 389 162 L 192 162
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="108" xml:space="preserve"><tspan x="205" dy="0">flag</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="398" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="330" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="205" y="295" xml:space="preserve"><tspan x="205" dy="0">&amp;flag</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 61 L 428 61"/>
    <g class="parameter-panel" transform="translate(548 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node start" transform="translate(192 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">empty_trailing_while</tspan></text>
    </g>
    <g class="node question" transform="translate(192 342)">
