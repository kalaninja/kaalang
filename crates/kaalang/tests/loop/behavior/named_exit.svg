<svg xmlns="http://www.w3.org/2000/svg" width="724" height="1246" viewBox="0 0 724 1246" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for named_exit</title>
  <desc id="kaalang-description">Nodes: Start: named_exit with parameters limit: usize; log: Rc&lt;RefCell&lt;Vec&lt;&amp;&apos;static str&gt;&gt;&gt; handing over limit, log; Action: Initialize the counter. capturing nothing handing over mut count; Action: Enter the outer scope. capturing &amp;log handing over _outer; Action: Enter the inner scope. capturing &amp;log handing over inner; Question: Has the search finished? capturing &amp;count, limit handing over done / again; Action: Advance the search. capturing again, &amp;mut count; Action: Continue after the search. capturing count, &amp;log handing over end; End: usize capturing end. Connections: Start: named_exit to Action: Initialize the counter.; Action: Initialize the counter. to the entry of the loop; Action: Enter the outer scope. to the entry of the loop; Action: Enter the inner scope. to Question: Has the search finished?; Question: Has the search finished? branch 1 to the loop exit; Question: Has the search finished? branch 2 to Action: Advance the search.; Action: Advance the search. to the iteration tail of the loop; Action: Continue after the search. to End: usize; the entry of the loop to Action: Enter the inner scope.; the entry of the loop to Action: Enter the outer scope.; the loop exit to Action: Continue after the search.; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
