<svg xmlns="http://www.w3.org/2000/svg" width="708" height="796" viewBox="0 0 708 796" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for ordinary_wire_names</title>
  <desc id="kaalang-description">Cycles: Use completion-like names inside a cycle. with inputs end and outputs out. Nodes: Start: ordinary_wire_names with parameters input: usize handing over input; Action: Produce an end wire. capturing input handing over end; Action: Produce a local result wire. capturing end handing over result; Action: Produce a local out wire. capturing result handing over out; Action: Produce a root result wire. capturing out handing over result; End: usize capturing result. Connections: Start: ordinary_wire_names to Action: Produce an end wire.; Action: Produce an end wire. to Action: Produce a local result wire.; Action: Produce a local result wire. to Action: Produce a local out wire.; Action: Produce a local out wire. to Action: Produce a root result wire.; Action: Produce a root result wire. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Use completion-like names inside a cycle.</title>
    <rect class="cycle-boundary" x="32" y="263" width="336" height="270" rx="12"/>
    <text class="cycle-caption" x="356" y="277" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Use </tspan><tspan x="356" dy="14">completion-like …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 226 L 200 298
      M 200 362 L 200 434
      M 200 498 L 200 570
      M 200 634 L 200 706
    "/>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">input</tspan></text>
    <text class="connection-label" x="213" y="287" xml:space="preserve"><tspan x="213" dy="0">end</tspan></text>
    <text class="connection-label" x="213" y="423" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="695" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="516" xml:space="preserve"><tspan x="213" dy="0">out</tspan></text>
    <text class="connection-label" x="213" y="559" xml:space="preserve"><tspan x="213" dy="0">out</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">input: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">ordinary_wire_names</tspan></text>
    </g>
    <g class="node action" transform="translate(200 194)">
      <title xml:space="preserve">Produce an end wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce an end wire.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 330)">
      <title xml:space="preserve">Produce a local result wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce a local result wire.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 466)">
      <title xml:space="preserve">Produce a local out wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce a local out wire.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 602)">
      <title xml:space="preserve">Produce a root result wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce a root result wire.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 735)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
