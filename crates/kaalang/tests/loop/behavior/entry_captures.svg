<svg xmlns="http://www.w3.org/2000/svg" width="800" height="976" viewBox="0 0 800 976" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for entry_captures</title>
  <desc id="kaalang-description">Cycles: Count three entries. with inputs entry, mut count and outputs final_count. Nodes: Start: entry_captures with parameters entry: Entry; mut log: Rc&lt;RefCell&lt;Vec&lt;usize&gt;&gt;&gt; handing over entry, mut log; Action: Initialize the counter. capturing nothing handing over mut count; Question: Has the counter reached three? capturing &amp;count handing over done / again; Action: Record and advance the counter. capturing again, &amp;mut count, &amp;entry; Action: Record work after the cycle input drops. capturing final_count, &amp;mut log handing over result; End: usize capturing result. Connections: Start: entry_captures to Action: Initialize the counter.; Action: Initialize the counter. to the entry of the cycle; Question: Has the counter reached three? branch 1 to Action: Record work after the cycle input drops.; Question: Has the counter reached three? branch 2 to Action: Record and advance the counter.; Action: Record and advance the counter. to the iteration tail of the cycle; Action: Record work after the cycle input drops. to End: usize; the entry of the cycle to Question: Has the counter reached three?; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Count three entries.</title>
    <rect class="cycle-boundary" x="32" y="289" width="736" height="422" rx="12"/>
    <text class="cycle-caption" x="756" y="303" text-anchor="end" xml:space="preserve"><tspan x="756" dy="0">Count three entries.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 103 L 200 188
      M 200 252 L 200 324
      M 200 468 L 200 748
      M 340 432 L 560 432 L 560 540
      M 560 604 L 560 676
      M 200 814 L 200 886
      M 200 324 L 200 396
    "/>
    <path class="connection" d="
      M 560 676 L 740 676 L 740 324 L 200 324
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="875" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="121" xml:space="preserve"><tspan x="213" dy="0">entry, mut log</tspan></text>
    <text class="connection-label" x="213" y="270" xml:space="preserve"><tspan x="213" dy="0">mut count</tspan></text>
    <text class="connection-label" x="213" y="486" xml:space="preserve"><tspan x="213" dy="0">done</tspan></text>
    <text class="connection-label" x="353" y="450" xml:space="preserve"><tspan x="353" dy="0">again</tspan></text>
    <text class="connection-label" x="213" y="177" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="385" xml:space="preserve"><tspan x="213" dy="0">&amp;count</tspan></text>
    <text class="connection-label" x="573" y="529" xml:space="preserve"><tspan x="573" dy="0">again, &amp;mut count, &amp;entry</tspan></text>
    <text class="connection-label" x="213" y="737" xml:space="preserve"><tspan x="213" dy="0">final_count, &amp;mut log</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 74 L 436 74"/>
    <g class="parameter-panel" transform="translate(556 74)">
      <rect class="node-shape" x="-120" y="-42" width="240" height="84"/>
      <text class="label" x="-104" y="-12" xml:space="preserve"><tspan x="-104" dy="0">entry: Entry</tspan><tspan x="-104" dy="18">mut log: </tspan><tspan x="-104" dy="18">Rc&lt;RefCell&lt;Vec&lt;usize&gt;&gt;&gt;</tspan></text>
    </g>
    <g class="node start" transform="translate(200 74)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">entry_captures</tspan></text>
    </g>
    <g class="node action" transform="translate(200 220)">
      <title xml:space="preserve">Initialize the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 432)">
      <title xml:space="preserve">Has the counter reached three?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the counter reached </tspan><tspan x="0" dy="18">three?</tspan></text>
    </g>
    <g class="node action" transform="translate(560 572)">
      <title xml:space="preserve">Record and advance the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Record and advance the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 781)">
      <title xml:space="preserve">Record work after the cycle input drops.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Record work after the cycle input </tspan><tspan x="-124" dy="18">drops.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 915)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
