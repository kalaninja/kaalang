<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1301" viewBox="0 0 1140 1301" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for sequential_exits</title>
  <desc id="kaalang-description">Cycles: Run work between two stopping checks. with inputs before_limit, after_limit, mut initial_count, mut initial_log and outputs log. Nodes: Start: sequential_exits with parameters before_limit: usize; after_limit: usize handing over before_limit, after_limit; Action: Initialize the counter and log. capturing nothing handing over initial_count, initial_log; Question: Stop before the work? capturing &amp;initial_count, before_limit, &amp;mut initial_log handing over stop_before / work; Action: Perform the work and advance the counter. capturing work, &amp;mut initial_count, &amp;mut initial_log handing over worked; Question: Stop after the work? capturing worked, &amp;initial_count, after_limit, &amp;mut initial_log handing over stop_after / again; Action: Finish the iteration. capturing again, &amp;mut initial_log; Action: Continue after the loop. capturing mut log handing over result; End: Vec&lt;&amp;&apos;static str&gt; capturing result. Connections: Start: sequential_exits to Action: Initialize the counter and log.; Action: Initialize the counter and log. to the entry of the cycle; Question: Stop before the work? branch 1 to a cycle break; Question: Stop before the work? branch 2 to Action: Perform the work and advance the counter.; Action: Perform the work and advance the counter. to Question: Stop after the work?; Question: Stop after the work? branch 1 to a cycle break; Question: Stop after the work? branch 2 to Action: Finish the iteration.; Action: Finish the iteration. to the iteration tail of the cycle; Action: Continue after the loop. to End: Vec&lt;&amp;&apos;static str&gt;; the entry of the cycle to Question: Stop before the work?; the cycle result to Action: Continue after the loop.; a cycle break to the cycle result; a cycle break to the cycle result; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Run work between two stopping checks.</title>
    <rect class="cycle-boundary" x="32" y="285" width="1076" height="739" rx="12"/>
    <text class="cycle-caption" x="1096" y="299" text-anchor="end" xml:space="preserve"><tspan x="1096" dy="0">Run work between two stopping checks.</tspan></text>
    </g>
  </g>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 200 94 L 200 177
      M 200 241 L 200 320
      M 200 471 L 200 550
      M 340 435 L 560 435 L 560 550
      M 560 616 L 560 695
      M 560 767 L 560 846
      M 700 731 L 920 731 L 920 846
      M 920 910 L 920 989
      M 200 1132 L 200 1211
      M 200 320 L 200 399
      M 200 989 L 200 1068
      M 200 550 L 200 989
      M 560 846 L 560 989 L 200 989
    "/>
    <path class="connection" d="
      M 920 989 L 1080 989 L 1080 320 L 200 320
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="1166" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
    <text class="connection-label" x="213" y="112" xml:space="preserve"><tspan x="213" dy="0">before_limit, after_limit</tspan></text>
    <text class="connection-label" x="213" y="259" xml:space="preserve"><tspan x="213" dy="0">initial_count, initial_log</tspan></text>
    <text class="connection-label" x="213" y="489" xml:space="preserve"><tspan x="213" dy="0">stop_before</tspan></text>
    <text class="connection-label" x="353" y="453" xml:space="preserve"><tspan x="353" dy="0">work</tspan></text>
    <text class="connection-label" x="573" y="634" xml:space="preserve"><tspan x="573" dy="0">worked</tspan></text>
    <text class="connection-label" x="573" y="785" xml:space="preserve"><tspan x="573" dy="0">stop_after</tspan></text>
    <text class="connection-label" x="713" y="749" xml:space="preserve"><tspan x="713" dy="0">again</tspan></text>
    <text class="connection-label" x="213" y="166" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
    <text class="connection-label" x="213" y="374" xml:space="preserve"><tspan x="213" dy="0">&amp;initial_count, before_limit, </tspan><tspan x="213" dy="14">&amp;mut initial_log</tspan></text>
    <text class="connection-label" x="573" y="525" xml:space="preserve"><tspan x="573" dy="0">work, &amp;mut initial_count, &amp;mut </tspan><tspan x="573" dy="14">initial_log</tspan></text>
    <text class="connection-label" x="573" y="670" xml:space="preserve"><tspan x="573" dy="0">worked, &amp;initial_count, </tspan><tspan x="573" dy="14">after_limit, &amp;mut initial_log</tspan></text>
    <text class="connection-label" x="933" y="835" xml:space="preserve"><tspan x="933" dy="0">again, &amp;mut initial_log</tspan></text>
    <text class="connection-label" x="213" y="1057" xml:space="preserve"><tspan x="213" dy="0">mut log</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 65 L 436 65"/>
    <g class="parameter-panel" transform="translate(556 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">before_limit: usize</tspan><tspan x="-104" dy="18">after_limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 65)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">sequential_exits</tspan></text>
    </g>
    <g class="node action" transform="translate(200 209)">
      <title xml:space="preserve">Initialize the counter and log.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counter and log.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 435)">
      <title xml:space="preserve">Stop before the work?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Stop before the work?</tspan></text>
    </g>
    <g class="node action" transform="translate(560 583)">
      <title xml:space="preserve">Perform the work and advance the counter.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Perform the work and advance </tspan><tspan x="-124" dy="18">the counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(560 731)">
      <title xml:space="preserve">Stop after the work?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Stop after the work?</tspan></text>
    </g>
    <g class="node action" transform="translate(920 878)">
      <title xml:space="preserve">Finish the iteration.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Finish the iteration.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 1100)">
      <title xml:space="preserve">Continue after the loop.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Continue after the loop.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 1240)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Vec&lt;&amp;&apos;static str&gt;</tspan></text>
    </g>
  </g>
</svg>
