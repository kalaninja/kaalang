<svg xmlns="http://www.w3.org/2000/svg" width="350" height="526" viewBox="0 0 350 526" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for trailing_inner_loop</title>
  <desc id="kaalang-description">Nodes: Start: trailing_inner_loop; Action: Initialize the counters. capturing nothing handing over mut outer, mut inner; Cycle: Repeat outer iterations until the inner cycle finishes. capturing mut outer, mut inner handing over result; End: usize capturing result. Connections: Start: trailing_inner_loop to Action: Initialize the counters.; Action: Initialize the counters. to Cycle: Repeat outer iterations until the inner cycle finishes.; Cycle: Repeat outer iterations until the inner cycle finishes. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 226 L 172 298
      M 172 364 L 172 436
    "/>
    <text class="connection-label" x="185" y="287" xml:space="preserve"><tspan x="185" dy="0">mut outer, mut inner</tspan></text>
    <text class="connection-label" x="185" y="425" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
    <text class="connection-label" x="185" y="151" xml:space="preserve"><tspan x="185" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">trailing_inner_loop</tspan></text>
    </g>
    <g class="node action" transform="translate(172 194)">
      <title xml:space="preserve">Initialize the counters.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the counters.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 331)">
      <title xml:space="preserve">Repeat outer iterations until the inner cycle finishes.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Repeat outer iterations until </tspan><tspan x="-124" dy="18">the inner cycle finishes.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node end" transform="translate(172 465)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
