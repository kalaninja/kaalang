<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1340" viewBox="0 0 1480 1340" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for output_routes_before_a_question</title>
  <desc id="kaalang-description">Cycles: Sort the value. with inputs value and outputs tiny or larger. Nodes: Start: output_routes_before_a_question with parameters value: u8; flag: u8 handing over value, flag; Question: Is it below ten? capturing value handing over low / high; Question: Is it below five? capturing low, value handing over below / small; Action: Mark a tiny value. capturing below handing over tiny; Action: Mark a small value. capturing small handing over larger; Action: Mark a high value. capturing high handing over larger; Question: Is the flag even? capturing larger, flag handing over even / odd; Action: Score the tiny value. capturing tiny handing over score; Action: Score the even flag. capturing even handing over score; Action: Keep the score. capturing score handing over result; Action: Score the odd flag. capturing odd handing over result; End: u8 capturing result; Merge: larger; Merge: score; Merge: result. Connections: Start: output_routes_before_a_question to Question: Is it below ten?; Question: Is it below ten? branch 1 to Question: Is it below five?; Question: Is it below ten? branch 2 to Action: Mark a high value.; Question: Is it below five? branch 1 to Action: Mark a tiny value.; Question: Is it below five? branch 2 to Action: Mark a small value.; Action: Mark a tiny value. to the tiny result of the cycle; Action: Mark a small value. to the larger merge at the larger result of the cycle; Action: Mark a high value. to the larger merge at the larger result of the cycle; Question: Is the flag even? branch 1 to Action: Score the even flag.; Question: Is the flag even? branch 2 to Action: Score the odd flag.; Action: Score the tiny value. to the score merge; Action: Score the even flag. to the score merge; Action: Keep the score. to the result merge; Action: Score the odd flag. to the result merge; the larger merge at the larger result of the cycle to Question: Is the flag even?; the score merge to Action: Keep the score.; the result merge to End: u8; the tiny result of the cycle to Action: Score the tiny value..</desc>
