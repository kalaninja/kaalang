      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Stay in the loop?</tspan></text>
    </g>
    <g class="node action" transform="translate(912 860)">
      <title xml:space="preserve">Advance after the decision.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Advance after the decision.</tspan></text>
    </g>
    <g class="node action" transform="translate(1272 860)">
      <title xml:space="preserve">Return the mode.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the mode.</tspan></text>
    </g>
    <g class="node end" transform="translate(1272 1065)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">u8</tspan></text>
