      M 192 314 L 192 386 L 912 386 L 912 458
      M 192 314 L 192 386 L 1272 386 L 1272 464
      M 192 534 L 192 688
      M 552 534 L 552 616
      M 912 540 L 912 684
      M 1272 534 L 1272 612
      M 192 752 L 192 964
      M 552 752 L 552 824
      M 912 756 L 912 828
      M 1052 720 L 1272 720 L 1272 828
      M 912 892 L 912 964 L 192 964
      M 1272 892 L 1272 1036
