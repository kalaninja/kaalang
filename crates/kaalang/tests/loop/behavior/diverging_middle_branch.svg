<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="1126" viewBox="0 0 1444 1126" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for diverging_middle_branch</title>
  <desc id="kaalang-description">Nodes: Start: diverging_middle_branch with parameters mode: u8; stay: bool handing over mode, stay; Select: Which route? capturing mode; Case: Advance and repeat. handing over advance; Case: Spin forever. handing over spin; Case: Advance, then repeat or leave. handing over decide; Case: Leave at once. handing over leave_now; Action: Advance. capturing advance; Action: Spin. capturing nothing; Question: Stay in the loop? capturing decide, stay handing over again / leave; Action: Advance after the decision. capturing again; Action: Return the mode. capturing mode handing over end; End: u8 capturing end. Connections: Start: diverging_middle_branch to the entry of the loop; Select: Which route? to Case: Advance and repeat.; Select: Which route? to Case: Spin forever.; Select: Which route? to Case: Advance, then repeat or leave.; Select: Which route? to Case: Leave at once.; Case: Advance and repeat. to Action: Advance.; Case: Spin forever. to the entry of the loop; Case: Advance, then repeat or leave. to Question: Stay in the loop?; Case: Leave at once. to the loop exit; Action: Advance. to the iteration tail of the loop; Action: Spin. to the iteration tail of the loop; Question: Stay in the loop? branch 1 to Action: Advance after the decision.; Question: Stay in the loop? branch 2 to Action: Return the mode.; Action: Advance after the decision. to the iteration tail of the loop; Action: Return the mode. to End: u8; the entry of the loop to Select: Which route?; the entry of the loop to Action: Spin.; the loop exit to Action: Return the mode.; Repeat from the iteration tail of the loop to the entry of the loop; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
