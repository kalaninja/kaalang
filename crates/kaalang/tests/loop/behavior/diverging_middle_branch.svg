    <text class="connection-label" x="925" y="787" xml:space="preserve"><tspan x="925" dy="0">again</tspan></text>
    <text class="connection-label" x="205" y="112" xml:space="preserve"><tspan x="205" dy="0">mode, stay</tspan></text>
    <text class="connection-label" x="565" y="552" xml:space="preserve"><tspan x="565" dy="0">spin</tspan></text>
    <text class="connection-label" x="925" y="558" xml:space="preserve"><tspan x="925" dy="0">decide</tspan></text>
    <text class="connection-label" x="1285" y="552" xml:space="preserve"><tspan x="1285" dy="0">leave_now</tspan></text>
    <text class="connection-label" x="1065" y="738" xml:space="preserve"><tspan x="1065" dy="0">leave</tspan></text>
    <text class="connection-label" x="205" y="231" xml:space="preserve"><tspan x="205" dy="0">mode</tspan></text>
    <text class="connection-label" x="565" y="677" xml:space="preserve"><tspan x="565" dy="0">()</tspan></text>
    <text class="connection-label" x="925" y="673" xml:space="preserve"><tspan x="925" dy="0">decide, stay</tspan></text>
    <text class="connection-label" x="1285" y="817" xml:space="preserve"><tspan x="1285" dy="0">mode</tspan></text>
  </g>
  <g class="nodes">
