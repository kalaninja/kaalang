    <text class="connection-label" x="185" y="610" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="112" xml:space="preserve"><tspan x="185" dy="0">first, count</tspan></text>
    <text class="connection-label" x="185" y="254" xml:space="preserve"><tspan x="185" dy="0">early_result</tspan></text>
    <text class="connection-label" x="185" y="398" xml:space="preserve"><tspan x="185" dy="0">finish_early</tspan></text>
