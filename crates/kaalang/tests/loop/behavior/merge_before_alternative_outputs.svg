      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Step by two.</tspan></text>
    </g>
    <g class="node action" transform="translate(560 346)">
      <title xml:space="preserve">Step by one.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Step by one.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 638)">
      <title xml:space="preserve">Past five?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Past five?</tspan></text>
    </g>
    <g class="node action" transform="translate(920 782)">
      <title xml:space="preserve">Take a step.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Take a step.</tspan></text>
    </g>
    <g class="node question" transform="translate(200 782)">
      <title xml:space="preserve">Is the count even?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Is the count even?</tspan></text>
    </g>
    <g class="node action" transform="translate(200 994)">
      <title xml:space="preserve">Score the even count.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Score the even count.</tspan></text>
    </g>
    <g class="node action" transform="translate(560 994)">
      <title xml:space="preserve">Score the odd count.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Score the odd count.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 1207)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
