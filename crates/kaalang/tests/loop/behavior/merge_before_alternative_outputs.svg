      M 920 814 L 920 890
      M 200 818 L 200 890
      M 340 782 L 560 782 L 560 890
      M 200 1026 L 200 1102
      M 560 1026 L 560 1102 L 200 1102
      M 200 454 L 200 530
      M 200 1102 L 200 1178
      M 200 530 L 200 602
      M 200 890 L 200 962
      M 560 890 L 560 962
    "/>
    <path class="connection" d="
      M 920 890 L 1080 890 L 1080 530 L 200 530
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="213" y="472" xml:space="preserve"><tspan x="213" dy="0">step</tspan></text>
    <text class="connection-label" x="213" y="1120" xml:space="preserve"><tspan x="213" dy="0">score</tspan></text>
    <text class="connection-label" x="213" y="303" xml:space="preserve"><tspan x="213" dy="0">quick</tspan></text>
    <text class="connection-label" x="573" y="303" xml:space="preserve"><tspan x="573" dy="0">slow</tspan></text>
    <text class="connection-label" x="213" y="112" xml:space="preserve"><tspan x="213" dy="0">fast, mut count</tspan></text>
    <text class="connection-label" x="213" y="692" xml:space="preserve"><tspan x="213" dy="0">past</tspan></text>
    <text class="connection-label" x="353" y="656" xml:space="preserve"><tspan x="353" dy="0">again</tspan></text>
    <text class="connection-label" x="933" y="832" xml:space="preserve"><tspan x="933" dy="0">stepped</tspan></text>
    <text class="connection-label" x="213" y="836" xml:space="preserve"><tspan x="213" dy="0">even</tspan></text>
    <text class="connection-label" x="353" y="800" xml:space="preserve"><tspan x="353" dy="0">odd</tspan></text>
    <text class="connection-label" x="213" y="159" xml:space="preserve"><tspan x="213" dy="0">fast</tspan></text>
    <text class="connection-label" x="213" y="591" xml:space="preserve"><tspan x="213" dy="0">&amp;count</tspan></text>
    <text class="connection-label" x="933" y="739" xml:space="preserve"><tspan x="933" dy="0">again, step, &amp;mut count</tspan></text>
    <text class="connection-label" x="213" y="735" xml:space="preserve"><tspan x="213" dy="0">past, &amp;count</tspan></text>
    <text class="connection-label" x="213" y="951" xml:space="preserve"><tspan x="213" dy="0">even, count</tspan></text>
    <text class="connection-label" x="573" y="951" xml:space="preserve"><tspan x="573" dy="0">odd, count</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 65 L 436 65"/>
    <g class="parameter-panel" transform="translate(556 65)">
      <rect class="node-shape" x="-120" y="-33" width="240" height="66"/>
      <text class="label" x="-104" y="-3" xml:space="preserve"><tspan x="-104" dy="0">fast: bool</tspan><tspan x="-104" dy="18">mut count: u32</tspan></text>
    </g>
    <g class="node merge" transform="translate(200 454)">
