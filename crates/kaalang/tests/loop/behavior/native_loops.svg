<svg xmlns="http://www.w3.org/2000/svg" width="708" height="390" viewBox="0 0 708 390" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for native_loops</title>
  <desc id="kaalang-description">Cycles: Run native Rust control flow once. with inputs limit and outputs result. Nodes: Start: native_loops with parameters limit: usize handing over limit; Action: Count with local Rust control flow. capturing limit handing over count; End: usize capturing result. Connections: Start: native_loops to Action: Count with local Rust control flow.; Action: Count with local Rust control flow. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Run native Rust control flow once.</title>
    <rect class="cycle-boundary" x="32" y="127" width="336" height="136" rx="12"/>
    <text class="cycle-caption" x="356" y="141" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Run native </tspan><tspan x="356" dy="14">Rust control …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 228 L 200 300
    "/>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">limit</tspan></text>
    <text class="connection-label" x="213" y="246" xml:space="preserve"><tspan x="213" dy="0">count</tspan></text>
    <text class="connection-label" x="213" y="289" xml:space="preserve"><tspan x="213" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">native_loops</tspan></text>
    </g>
    <g class="node action" transform="translate(200 195)">
      <title xml:space="preserve">Count with local Rust control flow.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Count with local Rust control </tspan><tspan x="-124" dy="18">flow.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 329)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
