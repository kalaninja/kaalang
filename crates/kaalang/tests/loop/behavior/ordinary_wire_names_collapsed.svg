<svg xmlns="http://www.w3.org/2000/svg" width="680" height="662" viewBox="0 0 680 662" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for ordinary_wire_names</title>
  <desc id="kaalang-description">Nodes: Start: ordinary_wire_names with parameters input: usize handing over input; Action: Produce an end wire. capturing input handing over end; Cycle: Use completion-like names inside a cycle. capturing end handing over out; Action: Produce a root result wire. capturing out handing over result; End: usize capturing result. Connections: Start: ordinary_wire_names to Action: Produce an end wire.; Action: Produce an end wire. to Cycle: Use completion-like names inside a cycle.; Cycle: Use completion-like names inside a cycle. to Action: Produce a root result wire.; Action: Produce a root result wire. to End: usize.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
  </g>
  <g class="connections">
    <path class="connection" d="
      M 172 90 L 172 162
      M 172 226 L 172 298
      M 172 364 L 172 436
      M 172 500 L 172 572
    "/>
    <text class="connection-label" x="185" y="121" xml:space="preserve"><tspan x="185" dy="0">input</tspan></text>
    <text class="connection-label" x="185" y="257" xml:space="preserve"><tspan x="185" dy="0">end</tspan></text>
    <text class="connection-label" x="185" y="395" xml:space="preserve"><tspan x="185" dy="0">out</tspan></text>
    <text class="connection-label" x="185" y="531" xml:space="preserve"><tspan x="185" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 312 61 L 408 61"/>
    <g class="parameter-panel" transform="translate(528 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">input: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(172 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">ordinary_wire_names</tspan></text>
    </g>
    <g class="node action" transform="translate(172 194)">
      <title xml:space="preserve">Produce an end wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce an end wire.</tspan></text>
    </g>
    <g class="node loop" transform="translate(172 331)">
      <title xml:space="preserve">Use completion-like names inside a cycle.</title>
      <rect class="node-shape" x="-140" y="-33" width="280" height="66" rx="8"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="-124" dy="0">Use completion-like names </tspan><tspan x="-124" dy="18">inside a cycle.</tspan></text>
      <text class="loop-marker" x="122" y="7" aria-hidden="true">↻</text>
    </g>
    <g class="node action" transform="translate(172 468)">
      <title xml:space="preserve">Produce a root result wire.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Produce a root result wire.</tspan></text>
    </g>
    <g class="node end" transform="translate(172 601)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
