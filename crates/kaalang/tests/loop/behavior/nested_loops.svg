<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="1092" viewBox="0 0 1104 1092" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for nested_loops</title>
  <desc id="kaalang-description">Nodes: Start: nested_loops with parameters limit: usize handing over limit; Action: Initialize the outer counter. capturing nothing handing over mut outer; Action: Initialize the iteration counter. capturing nothing handing over mut inner; Question: Is the iteration counter below the outer counter? capturing &amp;inner, &amp;outer handing over iterate_1 / leave_1 described as branch 1: YES / branch 2: NO; Action: Increment the iteration counter. capturing iterate_1, &amp;mut inner; Question: Has the outer counter reached the limit? capturing &amp;outer, &amp;limit handing over done / again; Action: Return the counter. capturing done, &amp;outer handing over end; Action: Increment the outer counter. capturing again, &amp;mut outer; End: usize capturing end. Connections: Start: nested_loops to Action: Initialize the outer counter.; Action: Initialize the outer counter. to the entry of the loop; Action: Initialize the iteration counter. to the entry of the loop; Question: Is the iteration counter below the outer counter? branch 1 to Action: Increment the iteration counter.; Question: Is the iteration counter below the outer counter? branch 2 to Question: Has the outer counter reached the limit?; Action: Increment the iteration counter. to the iteration tail of the loop; Question: Has the outer counter reached the limit? branch 1 to Action: Return the counter.; Question: Has the outer counter reached the limit? branch 2 to Action: Increment the outer counter.; Action: Return the counter. to End: usize; Action: Increment the outer counter. to the iteration tail of the loop; the entry of the loop to Action: Initialize the iteration counter.; the entry of the loop to Question: Is the iteration counter below the outer counter?; Repeat from the iteration tail of the loop to the entry of the loop; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="connections">
    <defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/></marker></defs>
    <path class="connection" d="
      M 192 90 L 192 162
      M 192 226 L 192 298
      M 192 434 L 192 506
      M 192 650 L 192 726
      M 332 614 L 552 614 L 552 722
      M 192 790 L 192 862
      M 552 794 L 552 866
      M 692 758 L 912 758 L 912 866
      M 552 930 L 552 1002
      M 912 930 L 912 1002
      M 192 298 L 192 370
      M 192 506 L 192 578
    "/>
    <path class="connection" d="
      M 192 862 L 32 862 L 32 506 L 192 506
    " marker-end="url(#loop-arrow)"/>
    <path class="connection" d="
      M 912 1002 L 1072 1002 L 1072 298 L 192 298
    " marker-end="url(#loop-arrow)"/>
    <text class="connection-label" x="205" y="108" xml:space="preserve"><tspan x="205" dy="0">limit</tspan></text>
    <text class="connection-label" x="205" y="244" xml:space="preserve"><tspan x="205" dy="0">mut outer</tspan></text>
    <text class="connection-label" x="205" y="452" xml:space="preserve"><tspan x="205" dy="0">mut inner</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="205" y="670" xml:space="preserve"><tspan x="205" dy="0">YES</tspan></text>
    <text class="connection-label branch-label" style="font-size: 14px" x="345" y="602" xml:space="preserve"><tspan x="345" dy="0">NO</tspan></text>
    <text class="connection-label" x="565" y="812" xml:space="preserve"><tspan x="565" dy="0">done</tspan></text>
    <text class="connection-label" x="705" y="776" xml:space="preserve"><tspan x="705" dy="0">again</tspan></text>
    <text class="connection-label" x="205" y="151" xml:space="preserve"><tspan x="205" dy="0">()</tspan></text>
    <text class="connection-label" x="205" y="359" xml:space="preserve"><tspan x="205" dy="0">()</tspan></text>
    <text class="connection-label" x="205" y="567" xml:space="preserve"><tspan x="205" dy="0">&amp;inner, &amp;outer</tspan></text>
    <text class="connection-label" x="205" y="715" xml:space="preserve"><tspan x="205" dy="0">iterate_1, &amp;mut inner</tspan></text>
    <text class="connection-label" x="565" y="711" xml:space="preserve"><tspan x="565" dy="0">&amp;outer, &amp;limit</tspan></text>
    <text class="connection-label" x="565" y="855" xml:space="preserve"><tspan x="565" dy="0">done, &amp;outer</tspan></text>
    <text class="connection-label" x="925" y="855" xml:space="preserve"><tspan x="925" dy="0">again, &amp;mut outer</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 332 61 L 428 61"/>
    <g class="parameter-panel" transform="translate(548 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">limit: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(192 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">nested_loops</tspan></text>
    </g>
    <g class="node action" transform="translate(192 194)">
      <title xml:space="preserve">Initialize the outer counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the outer counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(192 402)">
      <title xml:space="preserve">Initialize the iteration counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Initialize the iteration counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(192 614)">
      <title xml:space="preserve">Is the iteration counter below the outer counter?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Is the iteration counter </tspan><tspan x="0" dy="18">below the outer counter?</tspan></text>
    </g>
    <g class="node action" transform="translate(192 758)">
      <title xml:space="preserve">Increment the iteration counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the iteration counter.</tspan></text>
    </g>
    <g class="node question" transform="translate(552 758)">
      <title xml:space="preserve">Has the outer counter reached the limit?</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Has the outer counter </tspan><tspan x="0" dy="18">reached the limit?</tspan></text>
    </g>
    <g class="node action" transform="translate(552 898)">
      <title xml:space="preserve">Return the counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Return the counter.</tspan></text>
    </g>
    <g class="node action" transform="translate(912 898)">
      <title xml:space="preserve">Increment the outer counter.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Increment the outer counter.</tspan></text>
    </g>
    <g class="node end" transform="translate(552 1031)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">usize</tspan></text>
    </g>
  </g>
</svg>
