<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="830" viewBox="0 0 1084 830" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for terminal_case_after_repeats</title>
  <desc id="kaalang-description">Nodes: Start: terminal_case_after_repeats with parameters mut mode: u8 handing over mut mode; Select: Which route? capturing mode; Case: Advance on the left. handing over left; Case: Advance on the right. handing over right; Case: Finish after the repeating cases. handing over finish; Action: Finish from the final case. capturing finish handing over end; Action: Advance through the left case. capturing left, &amp;mut mode; Action: Advance through the right case. capturing right, &amp;mut mode; End: u8 capturing end. Connections: Start: terminal_case_after_repeats to the entry of the loop; Select: Which route? to Case: Advance on the left.; Select: Which route? to Case: Advance on the right.; Select: Which route? to Case: Finish after the repeating cases.; Case: Advance on the left. to Action: Advance through the left case.; Case: Advance on the right. to Action: Advance through the right case.; Case: Finish after the repeating cases. to Action: Finish from the final case.; Action: Finish from the final case. to End: u8; Action: Advance through the left case. to the iteration tail of the loop; Action: Advance through the right case. to the iteration tail of the loop; the entry of the loop to Select: Which route?; Repeat from the iteration tail of the loop to the entry of the loop.</desc>
