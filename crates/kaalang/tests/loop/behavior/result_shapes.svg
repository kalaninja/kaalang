    <path class="connection" d="
      M 200 90 L 200 162
      M 200 730 L 200 802
      M 200 938 L 200 1010
      M 200 1290 L 200 1362
      M 200 162 L 200 234
      M 200 234 L 200 306
      M 200 306 L 200 378
      M 200 378 L 200 450
      M 200 450 L 200 522
      M 200 594 L 200 666
      M 200 802 L 200 874
      M 200 1082 L 200 1154
      M 200 1154 L 200 1226
      M 200 1434 L 200 1506
      M 200 522 L 200 594
      M 200 1010 L 200 1082
      M 200 1362 L 200 1434
    "/>
    <text class="connection-label" x="213" y="108" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="213" y="956" xml:space="preserve"><tspan x="213" dy="0">tuple</tspan></text>
    <text class="connection-label" x="213" y="1308" xml:space="preserve"><tspan x="213" dy="0">pair</tspan></text>
    <text class="connection-label" x="213" y="655" xml:space="preserve"><tspan x="213" dy="0">ready, &amp;mut adjusted</tspan></text>
    <text class="connection-label" x="213" y="863" xml:space="preserve"><tspan x="213" dy="0">value</tspan></text>
    <text class="connection-label" x="213" y="1215" xml:space="preserve"><tspan x="213" dy="0">single</tspan></text>
    <text class="connection-label" x="213" y="1495" xml:space="preserve"><tspan x="213" dy="0">adjusted, single, left, right</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">value: usize</tspan></text>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">result_shapes</tspan></text>
    </g>
    <g class="node action" transform="translate(200 698)">
      <title xml:space="preserve">Adjust the mutable cycle result.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Adjust the mutable cycle result.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 906)">
      <title xml:space="preserve">Build the singleton tuple.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build the singleton tuple.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 1258)">
      <title xml:space="preserve">Build two results.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Build two results.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 1535)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">(usize, usize, usize, usize)</tspan></text>
    </g>
  </g>
</svg>
