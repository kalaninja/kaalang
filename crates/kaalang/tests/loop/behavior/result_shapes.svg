<svg xmlns="http://www.w3.org/2000/svg" width="708" height="1596" viewBox="0 0 708 1596" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for result_shapes</title>
  <desc id="kaalang-description">Cycles: Complete without outputs. with inputs () and outputs (); Produce a named unit result. with inputs () and outputs ready; Produce a mutable scalar result. with inputs value and outputs mut adjusted; Destructure a singleton tuple result. with inputs value and outputs single; Destructure two result wires. with inputs single and outputs left, right. Nodes: Start: result_shapes with parameters value: usize handing over value; Action: Adjust the mutable cycle result. capturing ready, &amp;mut adjusted; Action: Build the singleton tuple. capturing value handing over tuple; Action: Build two results. capturing single handing over pair; End: (usize, usize, usize, usize) capturing adjusted, single, left, right. Connections: Start: result_shapes to the cycle entry; Action: Adjust the mutable cycle result. to the cycle entry; Action: Build the singleton tuple. to a cycle break; Action: Build two results. to a cycle break; the cycle entry to the cycle result; the cycle result to the cycle entry; the cycle entry to the cycle result; the cycle result to the cycle entry; the cycle entry to a cycle break; the cycle result to Action: Adjust the mutable cycle result.; the cycle entry to Action: Build the singleton tuple.; the cycle result to the cycle entry; the cycle entry to Action: Build two results.; the cycle result to End: (usize, usize, usize, usize); a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Complete without outputs.</title>
    <rect class="cycle-boundary" x="172" y="127" width="56" height="142" rx="12"/>
    </g>
    <g>
      <title xml:space="preserve">Produce a named unit result.</title>
    <rect class="cycle-boundary" x="172" y="271" width="56" height="142" rx="12"/>
    </g>
    <g>
      <title xml:space="preserve">Produce a mutable scalar result.</title>
    <rect class="cycle-boundary" x="172" y="415" width="56" height="214" rx="12"/>
    </g>
    <g>
      <title xml:space="preserve">Destructure a singleton tuple result.</title>
    <rect class="cycle-boundary" x="32" y="767" width="336" height="350" rx="12"/>
    <text class="cycle-caption" x="356" y="781" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Destructure a </tspan><tspan x="356" dy="14">singleton tuple result.</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Destructure two result wires.</title>
    <rect class="cycle-boundary" x="32" y="1119" width="336" height="350" rx="12"/>
    <text class="cycle-caption" x="356" y="1133" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Destructure two </tspan><tspan x="356" dy="14">result wires.</tspan></text>
    </g>
  </g>
