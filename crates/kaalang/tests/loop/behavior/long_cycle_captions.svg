<svg xmlns="http://www.w3.org/2000/svg" width="760" height="612" viewBox="0 0 760 612" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for long_cycle_captions</title>
  <desc id="kaalang-description">Cycles: Collect the available results from the source until there are enough items to complete the current request. with inputs left and outputs done; Read the next item and prepare it for processing. with inputs right and outputs done. Nodes: Start: long_cycle_captions with parameters flag: bool handing over flag; Question: Choose a cycle. capturing flag handing over left / right; Action: Collect the results. capturing left handing over ready; Action: Read the item. capturing right handing over ready; End: () capturing nothing; Merge: done. Connections: Start: long_cycle_captions to Question: Choose a cycle.; Question: Choose a cycle. branch 1 to Action: Collect the results.; Question: Choose a cycle. branch 2 to Action: Read the item.; Action: Collect the results. to the done merge; Action: Read the item. to the done merge; the done merge to End: ().</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape, .call .node-shape { fill: #f8fafc; }
      .call-bars { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .call .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="cycle-regions">
    <g>
      <title xml:space="preserve">Collect the available results from the source until there are enough items to complete the current request.</title>
    <rect class="cycle-boundary" x="32" y="271" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="356" y="285" text-anchor="end" xml:space="preserve"><tspan x="356" dy="0">Collect the </tspan><tspan x="356" dy="14">available …</tspan></text>
    </g>
    <g>
      <title xml:space="preserve">Read the next item and prepare it for processing.</title>
    <rect class="cycle-boundary" x="392" y="271" width="336" height="134" rx="12"/>
    <text class="cycle-caption" x="716" y="285" text-anchor="end" xml:space="preserve"><tspan x="716" dy="0">Read the next </tspan><tspan x="716" dy="14">item and …</tspan></text>
    </g>
  </g>
  <g class="connections">
    <path class="connection" d="
      M 200 90 L 200 162
      M 200 234 L 200 306
      M 340 198 L 560 198 L 560 306
      M 200 370 L 200 446
      M 560 370 L 560 446 L 200 446
      M 200 446 L 200 522
    "/>
    <text class="connection-label" x="213" y="151" xml:space="preserve"><tspan x="213" dy="0">flag</tspan></text>
    <text class="connection-label" x="213" y="295" xml:space="preserve"><tspan x="213" dy="0">left</tspan></text>
    <text class="connection-label" x="573" y="295" xml:space="preserve"><tspan x="573" dy="0">right</tspan></text>
    <text class="connection-label" x="213" y="388" xml:space="preserve"><tspan x="213" dy="0">ready</tspan></text>
    <text class="connection-label" x="573" y="388" xml:space="preserve"><tspan x="573" dy="0">ready</tspan></text>
    <text class="connection-label" x="213" y="511" xml:space="preserve"><tspan x="213" dy="0">()</tspan></text>
  </g>
  <g class="nodes">
    <path class="parameter-link" d="M 340 61 L 436 61"/>
    <g class="parameter-panel" transform="translate(556 61)">
      <rect class="node-shape" x="-120" y="-24" width="240" height="48"/>
      <text class="label" x="-104" y="6" xml:space="preserve"><tspan x="-104" dy="0">flag: bool</tspan></text>
    </g>
    <g class="node merge" transform="translate(200 446)">
      <title xml:space="preserve">the done merge</title>
      <circle class="node-shape" r="4" style="fill: currentColor"/>
    </g>
    <g class="node start" transform="translate(200 61)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">long_cycle_captions</tspan></text>
    </g>
    <g class="node question" transform="translate(200 198)">
      <title xml:space="preserve">Choose a cycle.</title>
      <polygon class="node-shape" points="-112,-36 112,-36 140,0 112,36 -112,36 -140,0"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Choose a cycle.</tspan></text>
    </g>
    <g class="node action" transform="translate(200 338)">
      <title xml:space="preserve">Collect the results.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Collect the results.</tspan></text>
    </g>
    <g class="node action" transform="translate(560 338)">
      <title xml:space="preserve">Read the item.</title>
      <rect class="node-shape" x="-140" y="-32" width="280" height="64"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="-124" dy="0">Read the item.</tspan></text>
    </g>
    <g class="node end" transform="translate(200 551)">
      <rect class="node-shape" x="-140" y="-29" width="280" height="58" rx="29"/>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">()</tspan></text>
    </g>
  </g>
</svg>
