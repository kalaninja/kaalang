    <text class="connection-label" x="993" y="1045" xml:space="preserve"><tspan x="993" dy="0">eleven</tspan></text>
    <text class="connection-label" x="273" y="108" xml:space="preserve"><tspan x="273" dy="0">mode</tspan></text>
