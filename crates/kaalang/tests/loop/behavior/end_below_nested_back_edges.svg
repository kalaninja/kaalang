    <text class="connection-label" x="993" y="1168" xml:space="preserve"><tspan x="993" dy="0">eleven_result</tspan></text>
    <text class="connection-label" x="633" y="1384" xml:space="preserve"><tspan x="633" dy="0">_repeat_outer</tspan></text>
    <text class="connection-label" x="773" y="1348" xml:space="preserve"><tspan x="773" dy="0">finish_inner</tspan></text>
    <text class="connection-label" x="993" y="1520" xml:space="preserve"><tspan x="993" dy="0">extracted</tspan></text>
    <text class="connection-label" x="1353" y="674" xml:space="preserve"><tspan x="1353" dy="0">seven_result</tspan></text>
    <text class="connection-label" x="1713" y="674" xml:space="preserve"><tspan x="1713" dy="0">nine_result</tspan></text>
    <text class="connection-label" x="273" y="223" xml:space="preserve"><tspan x="273" dy="0">mode</tspan></text>
    <text class="connection-label" x="273" y="717" xml:space="preserve"><tspan x="273" dy="0">&amp;mode</tspan></text>
    <text class="connection-label" x="273" y="1075" xml:space="preserve"><tspan x="273" dy="0">repeat, &amp;mut mode</tspan></text>
    <text class="connection-label" x="633" y="1283" xml:space="preserve"><tspan x="633" dy="0">&amp;inner_result</tspan></text>
    <text class="connection-label" x="993" y="1427" xml:space="preserve"><tspan x="993" dy="0">finish_inner, inner_result</tspan></text>
    <text class="connection-label" x="993" y="1707" xml:space="preserve"><tspan x="993" dy="0">result</tspan></text>
  </g>
  <g class="nodes">
