<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1808" viewBox="0 0 1900 1808" role="img" aria-labelledby="kaalang-title" aria-describedby="kaalang-description">
  <title id="kaalang-title">kaalang diagram for end_below_nested_back_edges</title>
  <desc id="kaalang-description">Cycles: Choose an outer route until one produces a result. with inputs mut mode and outputs result; Choose an inner route until one completes. with inputs enter, &amp;mut mode and outputs inner_result. Nodes: Start: end_below_nested_back_edges with parameters mode: u8 handing over mode; Select: Which outer route? capturing mode; Case: Enter the inner loop. handing over enter; Case: Finish with seven. handing over seven; Case: Finish with nine. handing over nine; Select: Which inner route? capturing &amp;mode; Case: Repeat the inner loop. handing over repeat; Case: Repeat the outer loop. handing over leave; Case: Finish with eleven. handing over eleven; Action: Advance to the next route. capturing repeat, &amp;mut mode; Action: Continue with the outer cycle. capturing leave handing over continue_outer; Action: Produce eleven. capturing eleven handing over eleven_result; Question: Did the inner cycle produce a result? capturing &amp;inner_result handing over _repeat_outer / finish_inner; Action: Extract the inner result. capturing finish_inner, inner_result handing over extracted; Action: Produce seven. capturing seven handing over seven_result; Action: Produce nine. capturing nine handing over nine_result; End: u8 capturing result. Connections: Start: end_below_nested_back_edges to the entry of the cycle; Select: Which outer route? to Case: Enter the inner loop.; Select: Which outer route? to Case: Finish with seven.; Select: Which outer route? to Case: Finish with nine.; Case: Enter the inner loop. to the entry of the cycle; Case: Finish with seven. to Action: Produce seven.; Case: Finish with nine. to Action: Produce nine.; Select: Which inner route? to Case: Repeat the inner loop.; Select: Which inner route? to Case: Repeat the outer loop.; Select: Which inner route? to Case: Finish with eleven.; Case: Repeat the inner loop. to Action: Advance to the next route.; Case: Repeat the outer loop. to Action: Continue with the outer cycle.; Case: Finish with eleven. to Action: Produce eleven.; Action: Advance to the next route. to the iteration tail of the cycle; Action: Continue with the outer cycle. to a cycle break; Action: Produce eleven. to a cycle break; Question: Did the inner cycle produce a result? branch 1 to the iteration tail of the cycle; Question: Did the inner cycle produce a result? branch 2 to Action: Extract the inner result.; Action: Extract the inner result. to a cycle break; Action: Produce seven. to a cycle break; Action: Produce nine. to a cycle break; the entry of the cycle to Select: Which outer route?; the cycle result to End: u8; the entry of the cycle to Select: Which inner route?; the cycle result to Question: Did the inner cycle produce a result?; a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result; a cycle break to the cycle result; Repeat from the iteration tail of the cycle to the entry of the cycle; Repeat from the iteration tail of the cycle to the entry of the cycle.</desc>
  <defs>
    <style>
      svg { color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: optimizeLegibility; }
      .connection { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: round; }
      .connection-label { fill: #64748b; font-size: 12px; font-weight: 400; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: start; }
      .branch-label { fill: currentColor; font-weight: 500; }
      .parameter-link { fill: none; stroke: currentColor; stroke-width: 1.75; }
      .node-shape { fill: #ffffff; stroke: currentColor; stroke-width: 1.75; }
      .start .node-shape, .end .node-shape, .parameter-panel .node-shape { fill: #f0f9ff; }
      .action .node-shape { fill: #f8fafc; }
      .loop .node-shape { fill: #f0fdf4; stroke-width: 2; }
      .loop-marker { fill: #15803d; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .question .node-shape { fill: #fffbeb; }
      .select .node-shape, .case .node-shape { fill: #f5f3ff; }
      .label { fill: currentColor; font-size: 14px; text-anchor: middle; }
      .start .label, .question .label, .select .label, .case .label, .end .label { font-weight: 600; }
      .action .label, .loop .label { font-weight: 500; text-anchor: start; }
      .parameter-panel .label { font-weight: 400; text-anchor: start; }
      .cycle-boundary { fill: #f0fdf433; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .cycle-caption { fill: #166534; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>
