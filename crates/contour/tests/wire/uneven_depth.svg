  <desc id="contour-description">Nodes: Start: uneven_depth(condition); Question: Choose a path depth.; Action: Build the short value.; Action: Prepare the long value.; Action: Build the long value.; Action: Use the selected value.; End. Connections: Start: uneven_depth(condition) to Question: Choose a path depth.; Question: Choose a path depth. to Action: Build the short value. via short; Question: Choose a path depth. to Action: Prepare the long value. via long; Action: Prepare the long value. to Action: Build the long value.; Action: Build the short value. to Action: Use the selected value. via selected; Action: Build the long value. to Action: Use the selected value. via selected; Action: Use the selected value. to End via result.</desc>
