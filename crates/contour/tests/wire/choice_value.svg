  <title id="contour-title">Contour diagram for choice_value</title>
  <desc id="contour-description">Nodes: Start: choice_value(case); Choice: Choose one of three values.; Case: First; Case: Second; Case: Third; Action: Build the first value.; Action: Build the second value.; Action: Build the third value.; Action: Use the selected value.; End. Connections: Start: choice_value(case) to Choice: Choose one of three values.; Choice: Choose one of three values. to Case: First; Choice: Choose one of three values. to Case: Second; Choice: Choose one of three values. to Case: Third; Case: First to Action: Build the first value. via first; Case: Second to Action: Build the second value. via second; Case: Third to Action: Build the third value. via third; Action: Build the first value. to Action: Use the selected value. via selected; Action: Build the second value. to Action: Use the selected value. via selected; Action: Build the third value. to Action: Use the selected value. via selected; Action: Use the selected value. to End via result.</desc>
