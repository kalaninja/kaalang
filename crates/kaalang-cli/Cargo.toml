[package]
name = "kaalang-cli"
description = "The cargo kaalang subcommand"
readme = "../../README.md"
keywords = ["code-visualization", "flowchart", "drakon", "cargo", "cli"]
categories = ["command-line-utilities", "development-tools::cargo-plugins", "visualization"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["derive"] }
kaalang-compiler = { workspace = true, features = ["workspace"] }
kaalang-svg = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["std", "NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }

[target.'cfg(not(unix))'.dependencies]
same-file = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-namespace-request-sys = { workspace = true }

[[bin]]
name = "cargo-kaalang"
path = "src/main.rs"

[lints]
workspace = true
