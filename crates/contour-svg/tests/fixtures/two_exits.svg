<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="812" viewBox="0 0 1424 812" role="img" aria-labelledby="contour-title" aria-describedby="contour-description">
  <title id="contour-title">Contour diagram for route</title>
  <desc id="contour-description">Nodes: Start: route(input); Choice: Which path does the input take?; Case: Take the left path.; Case: Take the right path.; Case: Finish at the first exit.; Case: Finish at the second exit.; Action: Build the left value.; Action: Build the right value.; Action: Finish immediately at the first exit.; Action: Finish immediately at the second exit.; Action: Finish after convergence.; return. Connections: Start: route(input) to Choice: Which path does the input take?; Choice: Which path does the input take? to Case: Take the left path.; Choice: Which path does the input take? to Case: Take the right path.; Choice: Which path does the input take? to Case: Finish at the first exit.; Choice: Which path does the input take? to Case: Finish at the second exit.; Case: Take the left path. to Action: Build the left value. via left; Case: Take the right path. to Action: Build the right value. via right; Case: Finish at the first exit. to Action: Finish immediately at the first exit. via first_exit; Case: Finish at the second exit. to Action: Finish immediately at the second exit. via second_exit; Action: Build the left value. to Action: Finish after convergence. via selected; Action: Build the right value. to Action: Finish after convergence. via selected; Action: Finish immediately at the first exit. to return via result; Action: Finish immediately at the second exit. to return via result; Action: Finish after convergence. to return via result.</desc>
