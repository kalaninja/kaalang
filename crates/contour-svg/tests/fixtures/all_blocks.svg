<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1256" viewBox="0 0 816 1256" role="img" aria-labelledby="contour-title" aria-describedby="contour-description">
  <title id="contour-title">Contour diagram for route</title>
  <desc id="contour-description">Nodes: Start: route(request); Question: Есть &lt;заявка&gt; &amp; она подходит?; Choice: Какой путь выбрать для этой заявки?; Action: Подготовить короткий результат.; Merge 1; Action: Подготовить длинный результат, сохранив все важные детали заявки.; Action: Вернуть выбранный результат.; End; Action: Отклонить заявку.. Connections: Start: route(request) to Question: Есть &lt;заявка&gt; &amp; она подходит?; Question: Есть &lt;заявка&gt; &amp; она подходит? to Choice: Какой путь выбрать для этой заявки? via accepted / yes; Choice: Какой путь выбрать для этой заявки? to Action: Подготовить короткий результат. via short / Короткий путь; Action: Подготовить короткий результат. to Merge 1 via short_value; Choice: Какой путь выбрать для этой заявки? to Action: Подготовить длинный результат, сохранив все важные детали заявки. via long / Длинный путь с дополнительной проверкой; Action: Подготовить длинный результат, сохранив все важные детали заявки. to Merge 1 via long_value; Merge 1 to Action: Вернуть выбранный результат. via selected; Action: Вернуть выбранный результат. to End via result; Question: Есть &lt;заявка&gt; &amp; она подходит? to Action: Отклонить заявку. via rejected / no; Action: Отклонить заявку. to End via declined.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#334155"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #334155; stroke-width: 2; }
      .edge-label { fill: #334155; font: 12px ui-sans-serif, system-ui, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .node-shape { stroke: #334155; stroke-width: 2; }
      .start .node-shape, .end .node-shape { fill: #dbeafe; }
      .action .node-shape { fill: #f8fafc; }
      .question .node-shape { fill: #fef3c7; }
      .choice .node-shape { fill: #ede9fe; }
      .merge .node-shape { fill: #cbd5e1; }
      .kind { fill: #64748b; font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; text-anchor: middle; }
      .label { fill: #0f172a; font: 14px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      .merge .label { font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <g class="edges">
    <path class="edge" d="M 408 108 V 158 H 408 V 208" marker-end="url(#arrow)"/>
    <path class="edge" d="M 361 301 V 360 H 228 V 420" marker-end="url(#arrow)"/>
    <text class="edge-label" x="294" y="355" xml:space="preserve"><tspan x="294" dy="0">accepted / yes</tspan></text>
    <path class="edge" d="M 190 532 V 588 H 228 V 644" marker-end="url(#arrow)"/>
    <text class="edge-label" x="209" y="583" xml:space="preserve"><tspan x="209" dy="0">short / Короткий путь</tspan></text>
    <path class="edge" d="M 228 722 V 778 H 408 V 834" marker-end="url(#arrow)"/>
    <text class="edge-label" x="318" y="773" xml:space="preserve"><tspan x="318" dy="0">short_value</tspan></text>
    <path class="edge" d="M 265 532 V 582 H 588 V 632" marker-end="url(#arrow)"/>
    <text class="edge-label" x="426" y="570" xml:space="preserve"><tspan x="426" dy="0">long / Длинный путь с дополнительной </tspan><tspan x="426" dy="14">проверкой</tspan></text>
    <path class="edge" d="M 588 734 V 784 H 408 V 834" marker-end="url(#arrow)"/>
    <text class="edge-label" x="498" y="779" xml:space="preserve"><tspan x="498" dy="0">long_value</tspan></text>
    <path class="edge" d="M 408 872 V 922 H 408 V 972" marker-end="url(#arrow)"/>
    <text class="edge-label" x="408" y="917" xml:space="preserve"><tspan x="408" dy="0">selected</tspan></text>
    <path class="edge" d="M 408 1050 V 1100 H 387 V 1150" marker-end="url(#arrow)"/>
    <text class="edge-label" x="397" y="1095" xml:space="preserve"><tspan x="397" dy="0">result</tspan></text>
    <path class="edge" d="M 454 301 V 369 H 588 V 437" marker-end="url(#arrow)"/>
    <text class="edge-label" x="521" y="364" xml:space="preserve"><tspan x="521" dy="0">rejected / no</tspan></text>
    <path class="edge" d="M 588 515 V 545 H 768 V 1120 H 428 V 1150" marker-end="url(#arrow)"/>
    <text class="edge-label" x="678" y="540" xml:space="preserve"><tspan x="678" dy="0">declined</tspan></text>
  </g>
  <g class="nodes">
    <g class="node start" transform="translate(408 78)">
      <rect class="node-shape" x="-140" y="-30" width="280" height="60" rx="30"/>
      <text class="kind" y="-12">START</text>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">route(request)</tspan></text>
    </g>
    <g class="node question" transform="translate(408 264)">
      <title xml:space="preserve">Есть &lt;заявка&gt; &amp; она подходит?</title>
      <polygon class="node-shape" points="0,-56 140,0 0,56 -140,0"/>
      <text class="kind" y="-21">QUESTION</text>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Есть &lt;заявка&gt; &amp; она </tspan><tspan x="0" dy="18">подходит?</tspan></text>
    </g>
    <g class="node choice" transform="translate(228 476)">
      <title xml:space="preserve">Какой путь выбрать для этой заявки?</title>
      <polygon class="node-shape" points="-112,-56 112,-56 140,0 112,56 -112,56 -140,0"/>
      <text class="kind" y="-21">CHOICE</text>
      <text class="label" y="-3" xml:space="preserve"><tspan x="0" dy="0">Какой путь выбрать для </tspan><tspan x="0" dy="18">этой заявки?</tspan></text>
    </g>
    <g class="node action" transform="translate(228 683)">
      <title xml:space="preserve">Подготовить короткий результат.</title>
      <rect class="node-shape" x="-140" y="-39" width="280" height="78" rx="8"/>
      <text class="kind" y="-12">ACTION</text>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Подготовить короткий результат.</tspan></text>
    </g>
    <g class="node merge" transform="translate(408 853)">
      <circle class="node-shape" r="19"/>
      <text class="label" y="5">M</text>
    </g>
    <g class="node action" transform="translate(588 683)">
      <title xml:space="preserve">Подготовить длинный результат, сохранив все важные детали заявки.</title>
      <rect class="node-shape" x="-140" y="-51" width="280" height="102" rx="8"/>
      <text class="kind" y="-30">ACTION</text>
      <text class="label" y="-12" xml:space="preserve"><tspan x="0" dy="0">Подготовить длинный результат, </tspan><tspan x="0" dy="18">сохранив все важные детали </tspan><tspan x="0" dy="18">заявки.</tspan></text>
    </g>
    <g class="node action" transform="translate(408 1011)">
      <title xml:space="preserve">Вернуть выбранный результат.</title>
      <rect class="node-shape" x="-140" y="-39" width="280" height="78" rx="8"/>
      <text class="kind" y="-12">ACTION</text>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Вернуть выбранный результат.</tspan></text>
    </g>
    <g class="node end" transform="translate(408 1179)">
      <rect class="node-shape" x="-90" y="-29" width="180" height="58" rx="29"/>
      <text class="label" y="5">End</text>
    </g>
    <g class="node action" transform="translate(588 476)">
      <title xml:space="preserve">Отклонить заявку.</title>
      <rect class="node-shape" x="-140" y="-39" width="280" height="78" rx="8"/>
      <text class="kind" y="-12">ACTION</text>
      <text class="label" y="6" xml:space="preserve"><tspan x="0" dy="0">Отклонить заявку.</tspan></text>
    </g>
  </g>
</svg>
